- id: identifiers-as-matching-evidence--s1
  verb: SHALL
  actor: IIS
  text: IIS SHALL evaluate demographic information before associating a new primary exchange identifier with an existing patient record.
- id: identifiers-as-matching-evidence--s2
  verb: SHALL NOT
  actor: IIS
  text: IIS SHALL NOT rely solely on a primary exchange identifier when demographics materially conflict with the associated patient record.
