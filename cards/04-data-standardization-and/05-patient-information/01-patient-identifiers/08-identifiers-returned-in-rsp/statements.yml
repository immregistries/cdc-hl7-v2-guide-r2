- id: identifiers-returned-in-rsp-messages--s1
  verb: SHALL
  actor: IIS
  text: When returning a patient record or match candidate, the IIS SHALL return that submitter's associated primary exchange identifier using the preserved identifier value, identifier type, and assigning authority, if available for this patient.
- id: identifiers-returned-in-rsp-messages--s2
  verb: SHOULD NOT
  actor: IIS
  text: IIS SHOULD NOT return external patient identifiers associated exclusively with other submitting systems.
