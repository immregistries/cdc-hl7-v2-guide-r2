submitting-organization-msh-4-sending-facility:
  next: 6
  statements:
    - id: submitting-organization-msh-4-sending-facility--s1
      text: Systems SHALL populate MSH-4 in all VXU and QBP messages to identify the submitting organization.
    - id: submitting-organization-msh-4-sending-facility--s2
      text: IIS SHALL authenticate connections and confirm that transport credentials correspond to the organization identified in MSH-4.
    - id: submitting-organization-msh-4-sending-facility--s3
      text: IIS and submitters SHALL establish and maintain the submitting-organization identifier during onboarding.
    - id: submitting-organization-msh-4-sending-facility--s4
      text: A single submitting organization identifier MAY be authorized to submit on behalf of multiple responsible organizations.
    - id: submitting-organization-msh-4-sending-facility--s5
      text: IIS SHALL NOT rely solely on transport-layer information to infer other organizational roles.
responsible-organization-msh-22:
  next: 1
  statements: []
entering-recording-organization-orc-17:
  next: 1
  statements: []
administering-organization-rxa-11:
  next: 6
  statements:
    - id: administering-organization-rxa-11--s1
      text: For administered vaccinations, systems SHALL populate RXA-11 with the administering organization.
    - id: administering-organization-rxa-11--s2
      text: Implementations SHOULD use PL.4 (Facility = HD) to carry the organization identifier.
    - id: administering-organization-rxa-11--s3
      text: For historical vaccinations, RXA-11 SHOULD be empty.
    - id: administering-organization-rxa-11--s4
      text: IIS SHALL NOT reject historical vaccination records that omit RXA-11.
    - id: administering-organization-rxa-11--s5
      text: IIS SHOULD NOT interpret RXA-11 as a physical address or geographic location.
parent-and-child-organizations:
  next: 5
  statements:
    - id: parent-and-child-organizations--s1
      text: IIS SHALL assign and manage unique organization identifiers for onboarded entities.
    - id: parent-and-child-organizations--s2
      text: IIS SHALL recognize that a single submitting or responsible organization may encompass multiple child organizations.
    - id: parent-and-child-organizations--s3
      text: Child organizations MAY be distinguished using ORC-17 or RXA-11 when operationally necessary.
    - id: parent-and-child-organizations--s4
      text: IIS SHOULD capture only the level of hierarchy needed for accountability and program operations.
use-in-query-transactions-qbp-rsp:
  next: 4
  statements:
    - id: use-in-query-transactions-qbp-rsp--s1
      text: Query messages SHALL include MSH-4 to identify the querying organization.
    - id: use-in-query-transactions-qbp-rsp--s2
      text: MSH-22 SHALL be included when the querying organization is acting on behalf of another responsible organization.
    - id: use-in-query-transactions-qbp-rsp--s3
      text: When returning administered vaccination records in an RSP message, IIS SHOULD include the administering organization identifier RXA-11.4 and, when available, the entering organization identifier ORC-17, provided the IIS has clear, coded values that can be meaningfully interpreted by the requesting system.
implementation-and-maintenance-considerations:
  next: 5
  statements:
    - id: implementation-and-maintenance-considerations--s1
      text: IIS and submitters SHALL maintain a shared record of organization identifiers used in immunization messages.
    - id: implementation-and-maintenance-considerations--s2
      text: IIS SHOULD provide documented processes for requesting, updating, or retiring identifiers.
    - id: implementation-and-maintenance-considerations--s3
      text: IIS MAY simplify complex local structures to maintain stable and manageable identifiers.
    - id: implementation-and-maintenance-considerations--s4
      text: Submitters SHOULD notify IIS of organizational changes that affect ownership or structure.
dates-and-times:
  next: 1
  statements: []
message-header-date-time-msh-7:
  next: 4
  statements:
    - id: message-header-date-time-msh-7--s1
      text: Submitting systems MAY use any valid time zone offset and are not required to convert timestamps to the IIS local time zone.
    - id: message-header-date-time-msh-7--s2
      text: Receiving systems SHALL accept functionally equivalent timestamps expressed with different time zone offsets.
    - id: message-header-date-time-msh-7--s3
      text: MSH-7 SHALL NOT be used for clinical interpretation, immunization evaluation, or forecasting.
date-of-birth-pid-7:
  next: 6
  statements:
    - id: date-of-birth-pid-7--s1
      text: PID-7 SHALL represent the patient's official date of birth as recorded at the place and time of birth.
    - id: date-of-birth-pid-7--s2
      text: Submitting systems SHALL use the date of birth recorded on official documentation when available.
    - id: date-of-birth-pid-7--s3
      text: Time component is not expected in typical operations but if it is included, PID-7 SHALL be encoded using the time zone where the birth occurred.
    - id: date-of-birth-pid-7--s4
      text: When time or time-zone components are present in PID-7, receiving IIS SHALL ignore the time and offset components and SHALL preserve the submitted calendar date exactly as provided, without applying time-zone normalization.
    - id: date-of-birth-pid-7--s5
      text: PID-7 SHALL represent a single, consistent date of birth for the patient across submissions.
date-of-vaccination-rxa-3:
  next: 6
  statements:
    - id: date-of-vaccination-rxa-3--s1
      text: RXA-3 SHALL represent the calendar date on which the vaccination was administered.
    - id: date-of-vaccination-rxa-3--s2
      text: RXA-3 SHALL reflect the local date of administration in the time zone where the vaccination occurred.
    - id: date-of-vaccination-rxa-3--s3
      text: Time component is not expected in typical operations but if it is included, RXA-3 SHALL use the local time zone of administration.
    - id: date-of-vaccination-rxa-3--s4
      text: Submitting systems SHALL NOT report billing dates or processing dates in RXA-3.
    - id: date-of-vaccination-rxa-3--s5
      text: RXA-3 SHALL be accurate enough to support deduplication and patient-facing immunization records, even when time-of-day is not known.
submission-timing-and-update-frequency:
  next: 6
  statements:
    - id: submission-timing-and-update-frequency--s1
      text: Submitting systems SHOULD transmit administered vaccination records on the same day or within 24 hours of administration.
    - id: submission-timing-and-update-frequency--s2
      text: Submitting systems SHALL transmit only vaccination events after the event has been finalized in the source system.
    - id: submission-timing-and-update-frequency--s3
      text: Submitting systems SHALL NOT send partial, in-progress, or repeatedly updated vaccination records for the same event.
    - id: submission-timing-and-update-frequency--s4
      text: Submitting systems SHALL support IIS-defined submission timing requirements when such requirements are published.
    - id: submission-timing-and-update-frequency--s5
      text: IIS SHOULD tolerate reasonable short processing delays while encouraging timely, stable submission of finalized vaccination events.
