general-requirements:
  next: 5
  statements:
    - id: general-requirements--s1
      text: IIS SHALL implement and maintain conformance with the CDC WSDL Specification (2015).
    - id: general-requirements--s2
      text: IIS SHALL expose a single SOAP endpoint supporting both update (VXU) and query (QBP) messages.
    - id: general-requirements--s3
      text: IIS SHALL determine message type from the HL7 v2 content, not from SOAP endpoint selection.
    - id: general-requirements--s4
      text: IIS MAY offer additional SOAP endpoints for specialized or high-volume use but the primary endpoint SHALL support both operations.
supported-operations:
  next: 5
  statements:
    - id: supported-operations--s1
      text: IIS SHALL support connectivityTest to verify endpoint availability without authentication.
    - id: supported-operations--s2
      text: IIS SHALL support submitSingleMessage for both VXU and QBP transactions.
    - id: supported-operations--s3
      text: Sending systems SHALL implement submitSingleMessage and SHOULD implement connectivityTest.
    - id: supported-operations--s4
      text: IIS SHALL respond to each request within 5 seconds under controlled or normal operating conditions, such as interoperability testing environments.
fault-handling-and-error-responses:
  next: 5
  statements:
    - id: fault-handling-and-error-responses--s1
      text: IIS SHALL return a SOAP Security Fault when authentication fails.
    - id: fault-handling-and-error-responses--s2
      text: IIS SHALL use other defined SOAP Faults (Unsupported Operation, Message Too Large, Unknown Fault) as appropriate.
    - id: fault-handling-and-error-responses--s3
      text: Sending systems SHALL be able to receive and handle all defined SOAP Faults.
    - id: fault-handling-and-error-responses--s4
      text: Transport-level faults SHALL indicate the message was not transmitted and require resubmission after correction.
message-formatting-and-line-terminators:
  next: 3
  statements:
    - id: message-formatting-and-line-terminators--s1
      text: IIS SHALL accept CR (\r), LF (\n), and CRLF (\r\n) as valid HL7 segment terminators.
    - id: message-formatting-and-line-terminators--s2
      text: IIS SHALL NOT reject messages solely because of line-ending differences.
connection-parameters-and-authentication:
  next: 4
  statements:
    - id: connection-parameters-and-authentication--s1
      text: Sending systems SHALL support configuration of the endpoint URL and related connection parameters assigned by the IIS.
    - id: connection-parameters-and-authentication--s2
      text: IIS SHALL manage credentials through secure processes consistent with jurisdiction policy.
    - id: connection-parameters-and-authentication--s3
      text: IIS MAY require additional controls such as registered IP addresses or trusted certificate negotiation.
other-transport-standards-and-intermediaries:
  next: 5
  statements:
    - id: other-transport-standards-and-intermediaries--s1
      text: IIS MAY implement additional transport standards at their discretion.
    - id: other-transport-standards-and-intermediaries--s2
      text: IIS SHALL permit any submitter to use the CDC WSDL for message exchange.
    - id: other-transport-standards-and-intermediaries--s3
      text: IIS MAY continue to support existing transport methods indefinitely, provided they do not exclude CDC WSDL access.
    - id: other-transport-standards-and-intermediaries--s4
      text: When an intermediary such as an HIE is the sole access point to the IIS, that intermediary SHALL meet all CDC WSDL transport requirements defined for IIS.
