vxu-use-case-overview:
  next: 1
  statements: []
types-of-information-carried-in-a-vxu:
  next: 4
  statements:
    - id: types-of-information-carried-in-a-vxu--s1
      text: 'A VXU message MAY include one or more of the following immunization-related updates:'
    - id: types-of-information-carried-in-a-vxu--s2
      text: IIS SHALL accept VXU messages that contain no immunization events when used for permitted demographic-only scenarios defined in this section.
    - id: types-of-information-carried-in-a-vxu--s3
      text: Submitting systems SHALL NOT use VXU messages as a general-purpose transport for auxiliary public health or social data unrelated to immunization events.
reporting-immunizations-single-vs-multiple-administered-vaccinations-per-vxu:
  next: 4
  statements:
    - id: reporting-immunizations-single-vs-multiple-administered-vaccinations-per-vxu--s1
      text: 'A submitting system SHALL support at least one of the following approaches:'
    - id: reporting-immunizations-single-vs-multiple-administered-vaccinations-per-vxu--s2
      text: A submitting system MAY support both approaches if operationally required.
    - id: reporting-immunizations-single-vs-multiple-administered-vaccinations-per-vxu--s3
      text: IIS SHALL accept both single-vaccination and multi-vaccination VXU messages.
identifying-vs-non-identifying-vaccination-fields:
  next: 3
  statements:
    - id: identifying-vs-non-identifying-vaccination-fields--s1
      text: 'When an identifying vaccination field is changed, the submitting system SHALL:'
    - id: identifying-vs-non-identifying-vaccination-fields--s2
      text: IIS SHALL support VXU delete and update messages for vaccination records originally submitted by the sending system.
identifying-vaccination-fields:
  next: 1
  statements: []
non-identifying-vaccination-fields:
  next: 1
  statements: []
vxu-submission-scenarios:
  next: 1
  statements: []
new-vaccination-administered-during-an-encounter:
  next: 5
  statements:
    - id: new-vaccination-administered-during-an-encounter--s1
      text: The submitting system SHALL trigger a VXU when an administered vaccination is recorded.
    - id: new-vaccination-administered-during-an-encounter--s2
      text: The submitting system SHALL NOT trigger a VXU when a vaccination is only anticipated or ordered.
    - id: new-vaccination-administered-during-an-encounter--s3
      text: The submitting system SHALL follow one of the supported reporting approaches defined in Section 3.2.4.
    - id: new-vaccination-administered-during-an-encounter--s4
      text: IIS SHALL process or otherwise adjudicate and incorporate the vaccination event(s), which may result in incorporation into the patient's immunization history, qualified acceptance, or rejection depending on the IIS's HL7 v2 conformance and business rules.
historical-vaccination-recorded:
  next: 3
  statements:
    - id: historical-vaccination-recorded--s1
      text: The submitting system SHOULD trigger a VXU when a historical vaccination is recorded.
    - id: historical-vaccination-recorded--s2
      text: The vaccination event SHALL be clearly identified as historical using the vaccination event record type (RXA-9) indicator.
modifying-non-identifying-vaccination-fields:
  next: 4
  statements:
    - id: modifying-non-identifying-vaccination-fields--s1
      text: When only non-identifying vaccination fields are changed, the submitting system SHALL trigger a VXU update containing the modified information.
    - id: modifying-non-identifying-vaccination-fields--s2
      text: Submitting systems SHALL NOT trigger a VXU when a vaccination record is viewed or accessed without changes to any identifying or non-identifying vaccination record fields.
    - id: modifying-non-identifying-vaccination-fields--s3
      text: IIS SHALL support VXU update messages for vaccination records originally submitted by the sending system
deletion-of-a-vaccination-record-submitted-by-the-same-organization:
  next: 2
  statements:
    - id: deletion-of-a-vaccination-record-submitted-by-the-same-organization--s1
      text: The submitting system SHALL trigger a VXU delete containing the same information previously submitted, with RXA-21 indicating deletion.
deletion-of-a-vaccination-record-submitted-by-another-organization:
  next: 4
  statements:
    - id: deletion-of-a-vaccination-record-submitted-by-another-organization--s1
      text: The submitting system SHALL NOT trigger a VXU when deleting a vaccination originally submitted by another organization.
    - id: deletion-of-a-vaccination-record-submitted-by-another-organization--s2
      text: The submitting system SHALL coordinate directly with the IIS to request record cleanup.
    - id: deletion-of-a-vaccination-record-submitted-by-another-organization--s3
      text: IIS MAY refuse delete requests for vaccinations submitted by other organizations.
patient-demographic-records-and-vxus-without-immunizations:
  next: 4
  statements:
    - id: patient-demographic-records-and-vxus-without-immunizations--s1
      text: Submitting systems MAY submit VXU messages containing patient demographic information with or without immunization events.
    - id: patient-demographic-records-and-vxus-without-immunizations--s2
      text: Submitting systems SHALL coordinate with the IIS prior to sending demographic-only VXUs on an ongoing or routine basis.
    - id: patient-demographic-records-and-vxus-without-immunizations--s3
      text: IIS SHALL accept VXU messages that contain patient demographic information, including VXUs with no immunization events.
official-registry-name-recorded-for-a-newborn:
  next: 2
  statements:
    - id: official-registry-name-recorded-for-a-newborn--s1
      text: When an official registry name is recorded for a newborn for the first time, the submitting system SHALL trigger a VXU containing the patient's complete immunization history.
qualifying-event-first-submission-for-a-patient:
  next: 3
  statements:
    - id: qualifying-event-first-submission-for-a-patient--s1
      text: A submitting system MAY trigger a VXU containing the patient's complete immunization history upon first submission.
    - id: qualifying-event-first-submission-for-a-patient--s2
      text: The submitting system SHALL coordinate with the IIS prior to such submissions.
acknowledgement-ack-message-profile:
  next: 1
  statements: []
iis-core-intent-and-message-disposition:
  next: 6
  statements:
    - id: iis-core-intent-and-message-disposition--s1
      text: A VXU SHALL be considered accepted when core intent is fulfilled, that is, when the submitted patient is associated or created and all submitted Critical Data is processed and stored.
    - id: iis-core-intent-and-message-disposition--s2
      text: A VXU SHALL be considered rejected when core intent is not fulfilled, that is, when the patient cannot be associated or created, or when any submitted Critical Data cannot be processed or stored.
    - id: iis-core-intent-and-message-disposition--s3
      text: Acceptance SHALL NOT imply that all non-Critical Data was stored.
    - id: iis-core-intent-and-message-disposition--s4
      text: Rejection SHALL NOT imply that no data was stored.
    - id: iis-core-intent-and-message-disposition--s5
      text: IIS MAY expand the definition of Critical Data through jurisdictional policy, provided that such expansion is documented in local messaging specifications.
application-level-scope-of-ack-messages:
  next: 5
  statements:
    - id: application-level-scope-of-ack-messages--s1
      text: ACK messages SHALL represent application-level processing outcomes only.
    - id: application-level-scope-of-ack-messages--s2
      text: 'ACK messages SHALL NOT be used to report the following types of faults:'
    - id: application-level-scope-of-ack-messages--s3
      text: An IIS SHALL generate exactly one application-level ACK in response to each successfully received VXU message.
    - id: application-level-scope-of-ack-messages--s4
      text: ACK messages SHALL summarize the processing outcome of the submitted message, not intermediate workflow states.
issue-level-reporting-using-err-segments:
  next: 5
  statements:
    - id: issue-level-reporting-using-err-segments--s1
      text: Each discrete issue identified during VXU processing SHALL be represented by a separate ERR segment.
    - id: issue-level-reporting-using-err-segments--s2
      text: Each ERR segment SHALL convey a severity that indicates the required follow-up action.
    - id: issue-level-reporting-using-err-segments--s3
      text: ERR segments MAY be used to convey informational feedback when no corrective action is required.
    - id: issue-level-reporting-using-err-segments--s4
      text: The absence of ERR segments with Warning or Error severity SHALL indicate that no corrective action is required.
err-2-error-location:
  next: 1
  statements: []
err-4-severity-code:
  next: 11
  statements:
    - id: err-4-severity-code--s1
      text: IIS SHOULD implement different validation rules based on the submitter or submitter class to align with operational priorities; for example, an issue treated as a Warning for general providers may be escalated to an Error for submitters subject to stricter program requirements (such as VFC participants).
    - id: err-4-severity-code--s2
      text: IIS SHALL return severity 'E' to convey that core intent was not fulfilled and correction and resubmission are required.
    - id: err-4-severity-code--s3
      text: IIS SHALL NOT return severity 'E' for conformance violations alone (e.g., segment mis-ordering, missing required delimiters), unless the issue prevents the IIS from fulfilling core intent.
    - id: err-4-severity-code--s4
      text: IIS SHALL NOT return severity 'E' for a requested update or delete action from a conformant VXU that was not applied (e.g., a deletion not honored due to policy).
    - id: err-4-severity-code--s5
      text: Systems SHALL NOT automatically block the transmission or processing of subsequent messages for other patients or immunizations due to a severity 'E' error on one message.
    - id: err-4-severity-code--s6
      text: IIS SHALL return severity 'W' to convey an issue requiring correction that does not prevent core intent from being fulfilled.
    - id: err-4-severity-code--s7
      text: IIS SHALL return severity 'I' to convey an issue that does not require correction (e.g., a submitted precaution or VIS information that was not stored).
    - id: err-4-severity-code--s8
      text: IIS SHOULD return severity 'I' to convey that a requested update or delete action from a conformant VXU was not applied.
    - id: err-4-severity-code--s9
      text: IIS MAY return severity 'I' to convey a positive or neutral statement where no follow-up is required.
    - id: err-4-severity-code--s10
      text: Systems SHALL NOT use informational-severity ERR segments to determine what data may need to be resubmitted.
required-follow-up-actions:
  next: 1
  statements: []
err-5-application-error-code:
  next: 4
  statements:
    - id: err-5-application-error-code--s1
      text: IIS SHALL implement High priority ERR-5 codes.
    - id: err-5-application-error-code--s2
      text: IIS SHOULD implement Medium priority ERR-5 codes.
    - id: err-5-application-error-code--s3
      text: IIS MAY implement Low priority ERR-5 codes.
optional-use-of-code-5044-patient-identifier-returned:
  next: 5
  statements:
    - id: optional-use-of-code-5044-patient-identifier-returned--s1
      text: 'IIS MAY support ERR-5 code 5044 ("Patient identifying information saved, IIS identifier for patient is {1}") to communicate the internal IIS patient identifier assigned to a record that was newly created or successfully matched and updated. If implemented:'
    - id: optional-use-of-code-5044-patient-identifier-returned--s2
      text: This code MAY be used only when the patient record was newly created in the IIS, or matched to an existing patient and successfully updated.
    - id: optional-use-of-code-5044-patient-identifier-returned--s3
      text: When used, the IIS SHALL include the corresponding internal patient identifier in ERR-6 (Application Error Parameter).
    - id: optional-use-of-code-5044-patient-identifier-returned--s4
      text: The identifier returned in ERR-6 SHALL be suitable for use in a future QBP^Q11 query as a State Registry ID (SR) or Local Registry ID (LR); that is, it must be a valid, query-able identifier recognized by the IIS for record retrieval, and it may be combined with other identifiers in QPD-3.
err-8-user-message:
  next: 4
  statements:
    - id: err-8-user-message--s1
      text: ERR-8 SHALL provide a locally specified, clear, non-technical message that describes the issue in plain language, understandable without HL7 v2 expertise.
    - id: err-8-user-message--s2
      text: ERR-8 SHOULD NOT reference an HL7 segment, field, or component (e.g., "PID-5").
    - id: err-8-user-message--s3
      text: ERR-8 SHOULD NOT include information about the overall message processing outcome (e.g., "message rejected").
msa-1-derivation-of-message-level-disposition:
  next: 3
  statements:
    - id: msa-1-derivation-of-message-level-disposition--s1
      text: SHALL be returned to indicate VXU acceptance with no issues requiring correction/resubmission.
    - id: msa-1-derivation-of-message-level-disposition--s2
      text: SHALL be returned when the ERR-4 severity is 'W' and there are no severity 'E' error(s).
msa-1-guidance:
  next: 1
  statements: []
use-of-acks-in-interface-monitoring:
  next: 4
  statements:
    - id: use-of-acks-in-interface-monitoring--s1
      text: IIS SHALL ensure that severities assigned in ACK messages accurately reflect expected follow-up actions.
    - id: use-of-acks-in-interface-monitoring--s2
      text: IIS SHALL NOT use rejection solely as a mechanism to enforce minor conformance preferences that do not result in loss of Critical Data or failure to fulfill core intent.
    - id: use-of-acks-in-interface-monitoring--s3
      text: Submitting systems SHALL analyze ACK feedback in aggregate to identify recurring data quality patterns.
query-by-parameter-qbp-message-profiles:
  next: 1
  statements: []
purpose-and-scope-of-query-by-parameter-qbp-profiles:
  next: 1
  statements: []
unified-z34-and-z44-profile-model:
  next: 4
  statements:
    - id: unified-z34-and-z44-profile-model--s1
      text: IIS MAY omit computationally expensive evaluation when Z34 is used.
    - id: unified-z34-and-z44-profile-model--s2
      text: IIS SHALL include both the complete immunization history and the associated evaluation and recommendations when Z44 is used.
    - id: unified-z34-and-z44-profile-model--s3
      text: Implementers SHOULD validate local behavior and perform interoperability testing before relying on the unified model in production.
qbp-message-structure:
  next: 1
  statements: []
scenarios-that-trigger-qbp-messages:
  next: 1
  statements: []
user-initiated-query-scenarios:
  next: 5
  statements:
    - id: user-initiated-query-scenarios--s1
      text: When a clinical user requests a patient's immunization record, or when a patient or guardian requests immunization information via a portal, the system SHALL initiate a user-initiated QBP for that patient.
    - id: user-initiated-query-scenarios--s2
      text: Systems SHALL allow repeated user-initiated queries for a single selected patient.
    - id: user-initiated-query-scenarios--s3
      text: Jurisdictions and implementers SHOULD agree on reasonable daily limits and controls to prevent over-querying.
    - id: user-initiated-query-scenarios--s4
      text: Systems SHOULD allow re-query after no matches or too many matches are returned, to support interactive resolution of matching issues.
system-initiated-query-scenarios:
  next: 5
  statements:
    - id: system-initiated-query-scenarios--s1
      text: Systems SHALL enforce coordinated daily limits for automated per-patient or bulk queries.
    - id: system-initiated-query-scenarios--s2
      text: Appointment scheduling, imminent appointments, encounter start, and encounter completion MAY trigger a QBP.
    - id: system-initiated-query-scenarios--s3
      text: After reporting vaccinations to the IIS, systems MAY trigger a QBP.
    - id: system-initiated-query-scenarios--s4
      text: Bulk or cohort queries MAY be implemented as a series of single-patient QBPs and SHALL be coordinated with the IIS in advance.
patient-matching-responsibilities:
  next: 10
  statements:
    - id: patient-matching-responsibilities--s1
      text: Querying systems SHALL send all known patient demographic and identifying information available at the time of query.
    - id: patient-matching-responsibilities--s2
      text: Querying systems SHOULD send the most current patient information, even if it differs from previously submitted data.
    - id: patient-matching-responsibilities--s3
      text: When querying systems both submit VXU messages and send QBP queries, the same patient identifiers SHOULD be used consistently across both interactions.
    - id: patient-matching-responsibilities--s4
      text: State immunization registry identifiers (SR) SHALL be included when known, such as when obtained from prior candidate match responses.
    - id: patient-matching-responsibilities--s5
      text: IIS SHALL use all patient data submitted in the query to identify the most likely matching record or records.
    - id: patient-matching-responsibilities--s6
      text: IIS SHOULD use probabilistic, weighted, machine learning, or other advanced matching techniques rather than relying solely on exact field matches.
    - id: patient-matching-responsibilities--s7
      text: IIS SHOULD retain and reuse patient identifiers received through prior VXU submissions when those identifiers are consistent with other key patient attributes.
    - id: patient-matching-responsibilities--s8
      text: IIS SHOULD treat strong patient identifiers (such as MRNs) as high-confidence match indicators while validating consistency with other demographic data.
    - id: patient-matching-responsibilities--s9
      text: IIS SHOULD document how patient identifiers are used operationally to support matching and performance.
selecting-a-candidate-match:
  next: 4
  statements:
    - id: selecting-a-candidate-match--s1
      text: When a candidate is selected, querying systems SHALL re-initiate a Z34 or Z44 query using all the patient identifying information returned by the IIS for the selected record.
    - id: selecting-a-candidate-match--s2
      text: Querying systems SHOULD treat candidate selection as transitory and SHALL NOT permanently associate the IIS identifier with the local patient record without explicit user awareness and control.
    - id: selecting-a-candidate-match--s3
      text: If an IIS identifier is retained for future querying, querying systems SHALL provide a mechanism to remove or disregard that identifier.
security-and-rate-limiting-considerations:
  next: 5
  statements:
    - id: security-and-rate-limiting-considerations--s1
      text: IIS SHOULD implement rate-limiting controls to manage query volume and protect system availability. These limits should be configurable and proportional to expected usage patterns, allowing IIS to balance responsiveness for clinical queries with protection against excessive or inefficient access.
    - id: security-and-rate-limiting-considerations--s2
      text: IIS SHALL log all query activity in sufficient detail to support investigation, monitoring, and compliance. Logs should enable detection of unusual query volume, repeated access patterns, or other indicators of inappropriate use.
    - id: security-and-rate-limiting-considerations--s3
      text: IIS SHOULD implement active monitoring and alerting to identify anomalous query behavior, including sustained high-frequency querying or access patterns inconsistent with normal clinical workflows.
    - id: security-and-rate-limiting-considerations--s4
      text: IIS SHOULD carefully consider the security properties of externally exposed patient identifiers. Sequential or otherwise predictable identifiers increase the risk of enumeration and misuse. IIS SHOULD use randomly generated, non-guessable identifiers for state registry IDs exposed through query responses or other external interfaces.
response-rsp-profiles:
  next: 1
  statements: []
purpose-and-scope-of-rsp-profiles:
  next: 2
  statements:
    - id: purpose-and-scope-of-rsp-profiles--s1
      text: IIS SHALL respond to each valid QBP with exactly one RSP message.
rsp-response-profiles:
  next: 1
  statements: []
z23-return-an-acknowledgement:
  next: 1
  statements: []
z32-return-complete-immunization-history:
  next: 1
  statements: []
z31-return-a-list-of-candidates:
  next: 2
  statements:
    - id: z31-return-a-list-of-candidates--s1
      text: A Z31 (candidate-list) response MAY be returned in response to either a Z34 (Request a Complete Immunization History) or a Z44 (Request Evaluated Immunization History and Forecast) query when the IIS cannot identify a single high-confidence match.
z33-return-a-response-with-no-person-records:
  next: 1
  statements: []
z42-return-evaluated-immunization-history-and-forecast:
  next: 1
  statements: []
information-disclosure-constraints:
  next: 1
  statements: []
data-standardization-and-integration:
  next: 1
  statements: []
data-types-and-value-sets:
  next: 1
  statements: []
overview-of-data-types:
  next: 1
  statements: []
data-types-and-value-sets-data-types-and-value-sets:
  next: 1
  statements: []
data-type-flavors:
  next: 1
  statements: []
data-standardization-and-integra-cdc-core-data-elements-for-functional-standards:
  next: 1
  statements: []
dynamic-and-fixed-code-sets:
  next: 1
  statements: []
dynamic-code-sets-evolving-code-sets-requiring-active-maintenance:
  next: 5
  statements:
    - id: dynamic-code-sets-evolving-code-sets-requiring-active-maintenance--s1
      text: Systems (including IIS and submitting systems) SHALL maintain a process to monitor and incorporate updates to dynamic code sets relevant to immunization messaging.
    - id: dynamic-code-sets-evolving-code-sets-requiring-active-maintenance--s2
      text: Systems SHALL NOT hard-code dynamic code values into application logic without a defined update mechanism.
    - id: dynamic-code-sets-evolving-code-sets-requiring-active-maintenance--s3
      text: Systems SHALL validate received values for dynamic code sets against their current authoritative versions.
    - id: dynamic-code-sets-evolving-code-sets-requiring-active-maintenance--s4
      text: When a value from a dynamic and closed code set (e.g., CVX or NDC) is not recognized, the IIS SHALL generate an error or warning indicating that an unexpected or unknown value was received.
fixed-code-sets-stable-code-sets-anchored-to-messaging-semantics:
  next: 3
  statements:
    - id: fixed-code-sets-stable-code-sets-anchored-to-messaging-semantics--s1
      text: Systems (including submitting systems and IIS) SHALL use only the values explicitly defined for fixed code sets and SHALL NOT introduce local extensions.
    - id: fixed-code-sets-stable-code-sets-anchored-to-messaging-semantics--s2
      text: Systems SHALL NOT assume that future values may appear in fixed code sets unless explicitly updated through a new guide release.
open-value-sets-extensible-sets-supporting-local-variation:
  next: 1
  statements: []
closed-value-sets-constrained-sets-requiring-strict-conformance:
  next: 1
  statements: []
handling-unrecognized-values:
  next: 4
  statements:
    - id: handling-unrecognized-values--s1
      text: Systems (including submitting systems and IIS) SHALL vary response severity based on the classification of the value set and the usage of the field.
    - id: handling-unrecognized-values--s2
      text: IIS SHOULD be tolerant of unrecognized values in open and dynamic valuesets when the field usage is RE or O and SHALL avoid excessive, non-actionable notifications.
    - id: handling-unrecognized-values--s3
      text: Querying systems SHALL be capable of handling locally extended values in responses and SHALL not assume that only nationally defined codes will be returned.
local-extensions-and-coordination:
  next: 6
  statements:
    - id: local-extensions-and-coordination--s1
      text: Systems (including submitting systems and IIS) SHALL document and publish any supported local extensions to open value sets.
    - id: local-extensions-and-coordination--s2
      text: Systems SHOULD provide advance notice to trading partners when introducing new locally defined values.
    - id: local-extensions-and-coordination--s3
      text: Local extensions SHALL NOT override or redefine nationally defined values.
    - id: local-extensions-and-coordination--s4
      text: Submitting systems SHOULD coordinate with IIS before using locally extended codes in production exchange.
    - id: local-extensions-and-coordination--s5
      text: Querying systems SHALL be capable of handling locally extended values in responses and SHALL not assume that only nationally defined codes will be returned.
loinc-in-observation-segments:
  next: 1
  statements: []
overview-of-loinc-and-obx-usage-in-immunization-messaging:
  next: 1
  statements: []
obx-segment-mechanics-and-field-usage:
  next: 1
  statements: []
obx-1-set-id-obx:
  next: 1
  statements: []
obx-3-observation-identifier:
  next: 1
  statements: []
obx-2-value-type:
  next: 1
  statements: []
obx-4-observation-sub-id:
  next: 1
  statements: []
obx-5-observation-value:
  next: 1
  statements: []
obx-14-date-time-of-the-observation:
  next: 1
  statements: []
obx-17-observation-method:
  next: 1
  statements: []
order-segment-groups-and-loinc-obx-grouping:
  next: 1
  statements: []
order-segment-group-flavors:
  next: 1
  statements: []
immunization-event:
  next: 1
  statements: []
immunization-event-contraindicated:
  next: 1
  statements: []
immunization-event-refused:
  next: 1
  statements: []
patient-observations:
  next: 1
  statements: []
immunization-event-with-evaluation:
  next: 1
  statements: []
forecast:
  next: 1
  statements: []
patient-information:
  next: 1
  statements: []
patient-identifiers:
  next: 1
  statements: []
primary-patient-identifier-for-exchange:
  next: 3
  statements:
    - id: primary-patient-identifier-for-exchange--s1
      text: Sending systems SHALL submit a primary exchange identifier for each patient and SHALL use the current identifier consistently in update and query transactions.
    - id: primary-patient-identifier-for-exchange--s2
      text: IIS SHOULD support MR and PI as identifier types for the primary exchange identifier.
assigning-authority-and-identifier-namespace:
  next: 3
  statements:
    - id: assigning-authority-and-identifier-namespace--s1
      text: IIS SHALL document the assigning-authority convention accepted for the primary exchange identifier.
    - id: assigning-authority-and-identifier-namespace--s2
      text: Sending systems SHALL use the assigning-authority representation established by the receiving IIS for that interface.
processing-multiple-pid-3-repetitions:
  next: 2
  statements:
    - id: processing-multiple-pid-3-repetitions--s1
      text: IIS SHALL locate by identifier type without regard to their PID-3 repetition position.
preserving-the-submitter-s-primary-exchange-identifier:
  next: 2
  statements:
    - id: preserving-the-submitter-s-primary-exchange-identifier--s1
      text: IIS SHALL retain the identifier value, identifier type, and assigning authority of the current primary exchange identifier associated with the patient record.
identifier-changes-merges-and-retirement:
  next: 3
  statements:
    - id: identifier-changes-merges-and-retirement--s1
      text: Sending systems SHALL NOT reassign a previously used primary exchange identifier to a different patient.
    - id: identifier-changes-merges-and-retirement--s2
      text: IIS SHALL support receiving a new primary exchange identifier for a patient previously reported by the same submitting system.
identifiers-as-matching-evidence:
  next: 3
  statements:
    - id: identifiers-as-matching-evidence--s1
      text: IIS SHALL evaluate demographic information before associating a new primary exchange identifier with an existing patient record.
    - id: identifiers-as-matching-evidence--s2
      text: IIS SHALL NOT rely solely on a primary exchange identifier when demographics materially conflict with the associated patient record.
iis-registry-identifier:
  next: 2
  statements:
    - id: iis-registry-identifier--s1
      text: When an RSP includes a patient record or match candidate, the IIS SHALL include the current SR or LR assigned to that IIS patient record.
identifiers-returned-in-rsp-messages:
  next: 3
  statements:
    - id: identifiers-returned-in-rsp-messages--s1
      text: When returning a patient record or match candidate, the IIS SHALL return that submitter's associated primary exchange identifier using the preserved identifier value, identifier type, and assigning authority, if available for this patient.
    - id: identifiers-returned-in-rsp-messages--s2
      text: IIS SHOULD NOT return external patient identifiers associated exclusively with other submitting systems.
security-considerations-for-iis-registry-identifiers:
  next: 3
  statements:
    - id: security-considerations-for-iis-registry-identifiers--s1
      text: IIS SHOULD design externally shared SR and LR values to minimize predictability and enumeration risk.
    - id: security-considerations-for-iis-registry-identifiers--s2
      text: IIS SHALL NOT return patient information based solely on the presence of a valid SR or LR.
other-patient-identifiers:
  next: 1
  statements: []
patient-and-other-names:
  next: 1
  statements: []
patient-names:
  next: 1
  statements: []
official-registry-name:
  next: 6
  statements:
    - id: official-registry-name--s1
      text: Systems SHALL send the closest representation of the patient's legal/official registry name using name type code 'L' when that name is available.
    - id: official-registry-name--s2
      text: Systems SHALL NOT use the 'L' name type for names that are not intended to represent the legal or official registry name.
    - id: official-registry-name--s3
      text: If an 'L' name is provided, systems SHOULD place it in the first repetition of PID-5 to simplify processing. Systems SHOULD NOT send an empty first PID-5 repetition to reserve space for an 'L' name; the repetition should be omitted if no 'L' name is available, and alternate name types (e.g., alias or newborn placeholder) should be included as subsequent repetitions.
    - id: official-registry-name--s4
      text: Receiving systems SHALL accept the 'L' name in any repetition.
    - id: official-registry-name--s5
      text: IIS SHOULD preferentially use the 'L' (legal/official) name for record matching when it is available, but other name types (e.g., alias or placeholder names) remain acceptable inputs for matching in the absence of an 'L' name.
important-names:
  next: 6
  statements:
    - id: important-names--s1
      text: Systems SHOULD support these name types.
    - id: important-names--s2
      text: If reported, these names SHALL be coded using the correct name type code.
    - id: important-names--s3
      text: Systems SHALL NOT send these names as type 'L'.
    - id: important-names--s4
      text: Receiving systems SHALL recognize and process these codes without error.
    - id: important-names--s5
      text: IIS SHOULD store or evaluate them as supplemental identifiers for patient matching.
optional-name-types:
  next: 5
  statements:
    - id: optional-name-types--s1
      text: Systems MAY support optional name types when used for legitimate patient identification.
    - id: optional-name-types--s2
      text: IIS MAY accept these additional name types for local matching needs.
    - id: optional-name-types--s3
      text: Systems SHOULD NOT send names with ambiguous or administrative meaning such as Business, Partner/Spouse, or Licensing names.
    - id: optional-name-types--s4
      text: IIS SHALL NOT process unsupported name types if received.
data-type-and-structure:
  next: 1
  statements: []
alignment-with-broader-health-standards:
  next: 5
  statements:
    - id: alignment-with-broader-health-standards--s1
      text: Submitting systems SHALL flag all placeholder newborn names with the name type code 'NB' when sending to an IIS.
    - id: alignment-with-broader-health-standards--s2
      text: IIS SHALL recognize and process 'NB' as a valid name type without error.
    - id: alignment-with-broader-health-standards--s3
      text: IIS SHALL NOT rely on textual pattern detection (e.g., "Baby Boy") to infer that a record represents a newborn.
    - id: alignment-with-broader-health-standards--s4
      text: Submitting systems SHOULD align internal placeholder naming conventions with established national frameworks to reduce mapping and conversion errors during transmission.
unnamed-newborns:
  next: 7
  statements:
    - id: unnamed-newborns--s1
      text: Systems MAY generate a placeholder given name when the newborn's permanent name is not yet known.
    - id: unnamed-newborns--s2
      text: If a placeholder name is used, systems SHALL mark it with the name type code 'NB' in PID-5.
    - id: unnamed-newborns--s3
      text: Systems SHALL NOT use the 'L' name type for placeholder newborn names.
    - id: unnamed-newborns--s4
      text: Systems SHOULD follow established newborn naming conventions (e.g., those recommended by the Joint Commission or AHIMA) to improve operational consistency when converting internal records for submission.
    - id: unnamed-newborns--s5
      text: Systems SHALL update the record as soon as the permanent name is known and SHALL resubmit with both the permanent name ('L') and the placeholder name ('NB') in the same PID-5 field.
    - id: unnamed-newborns--s6
      text: Systems MAY continue sending both names temporarily to assist reconciliation.
special-characters:
  next: 6
  statements:
    - id: special-characters--s1
      text: 'Systems SHALL support the following 18 commonly used Latin-based characters (in both upper and lowercase): á, â, à, é, ê, ë, è, í, î, ï, ó, ô, ú, û, ü, ù, ç, ñ.'
    - id: special-characters--s2
      text: Systems SHALL either preserve these characters as submitted or transliterate them using the conversion table provided in this guide.
    - id: special-characters--s3
      text: Systems MAY support additional special characters beyond this list.
    - id: special-characters--s4
      text: IIS SHALL NOT reject a message solely because one of these characters appears in a patient or person name.
    - id: special-characters--s5
      text: IIS SHALL apply transliteration rules consistently when storage systems cannot represent these characters.
formatting-and-case-preservation:
  next: 6
  statements:
    - id: formatting-and-case-preservation--s1
      text: Systems SHALL preserve spaces, hyphens, and multiple given names as submitted.
    - id: formatting-and-case-preservation--s2
      text: Systems SHOULD preserve original capitalization when storing names.
    - id: formatting-and-case-preservation--s3
      text: IIS MAY standardize capitalization for internal comparison or display purposes but SHALL NOT alter the capitalization in transmitted data.
    - id: formatting-and-case-preservation--s4
      text: Each name component SHOULD support up to 64 characters.
    - id: formatting-and-case-preservation--s5
      text: IIS MAY define local policies for reconciling capitalization differences across submissions but must retain a version of the name as originally submitted.
name-consistency-and-matching-expectations:
  next: 5
  statements:
    - id: name-consistency-and-matching-expectations--s1
      text: Systems SHALL send the closest available representation of the patient's official registry name ('L'), even if other systems use slightly different forms.
    - id: name-consistency-and-matching-expectations--s2
      text: IIS SHALL accept minor variations in name spelling, case, or special characters when evaluating matches.
    - id: name-consistency-and-matching-expectations--s3
      text: IIS SHALL NOT require submitting systems to alter or "correct" names to match the registry's stored spelling or format.
    - id: name-consistency-and-matching-expectations--s4
      text: IIS MAY return transliterated or modified versions of names (e.g., "Pena" instead of "Peña") when system limitations prevent preserving certain characters, while maintaining the same record linkage.
non-patient-person-names:
  next: 5
  statements:
    - id: non-patient-person-names--s1
      text: Systems SHALL preserve spaces and hyphens.
    - id: non-patient-person-names--s2
      text: Systems SHALL support commonly used diacritics or transliterations.
    - id: non-patient-person-names--s3
      text: Systems SHOULD preserve case and support up to 64 characters per component.
    - id: non-patient-person-names--s4
      text: For NK1-2, submitting systems SHALL populate the name type code (NK1-2.7) and SHOULD use the official registry ('L') name when known.
ongoing-data-quality-and-monitoring:
  next: 3
  statements:
    - id: ongoing-data-quality-and-monitoring--s1
      text: IIS SHOULD implement data quality checks that identify improbable name-type combinations or patterns.
    - id: ongoing-data-quality-and-monitoring--s2
      text: Submitting systems SHALL strive to correctly classify names by type.
address-handling:
  next: 1
  statements: []
address-representation-in-hl7-v2:
  next: 7
  statements:
    - id: address-representation-in-hl7-v2--s1
      text: Systems SHALL send patient address information in PID-11.
    - id: address-representation-in-hl7-v2--s2
      text: Systems SHALL use PID-11.7 (Address Type) to identify the type of address.
    - id: address-representation-in-hl7-v2--s3
      text: IIS SHALL correctly interpret repeated PID-11 segments.
    - id: address-representation-in-hl7-v2--s4
      text: IIS MAY choose whether to retain one or multiple patient addresses.
    - id: address-representation-in-hl7-v2--s5
      text: IIS SHALL NOT require "self" NK1 entries duplicating PID-11 content.
    - id: address-representation-in-hl7-v2--s6
      text: IIS SHALL accept valid non-U.S. addresses when submitted.
congregate-and-institutional-addresses:
  next: 4
  statements:
    - id: congregate-and-institutional-addresses--s1
      text: IIS SHOULD recognize that identical addresses may legitimately correspond to multiple patients.
    - id: congregate-and-institutional-addresses--s2
      text: IIS SHOULD use cleansing services to standardize institutional addresses.
    - id: congregate-and-institutional-addresses--s3
      text: IIS MAY maintain reference tables of known institutions to improve matching and analysis.
persons-without-a-fixed-address:
  next: 4
  statements:
    - id: persons-without-a-fixed-address--s1
      text: IIS SHALL NOT reject messages based solely on placeholder or surrogate address values.
    - id: persons-without-a-fixed-address--s2
      text: IIS SHOULD use cleansing services to detect known placeholder patterns.
    - id: persons-without-a-fixed-address--s3
      text: IIS SHOULD establish local policies for managing repeated use of clinic or landmark addresses.
address-types:
  next: 4
  statements:
    - id: address-types--s1
      text: IIS SHALL determine address type using PID-11.7.
    - id: address-types--s2
      text: IIS SHALL NOT reject messages solely due to uncommon or additional address types.
    - id: address-types--s3
      text: IIS MAY disregard address types with no operational relevance (e.g., birth location) unless explicitly negotiated.
county-information:
  next: 5
  statements:
    - id: county-information--s1
      text: IIS SHALL NOT require submitters to include county codes.
    - id: county-information--s2
      text: IIS SHALL NOT reject addresses with missing or invalid county values.
    - id: county-information--s3
      text: If county information is submitted, it SHOULD use the five-digit FIPS county code.
    - id: county-information--s4
      text: IIS SHOULD generate or validate county information internally using a third-party address cleansing service, since submitters are not required to provide it.
address-cleansing-and-normalization:
  next: 6
  statements:
    - id: address-cleansing-and-normalization--s1
      text: IIS SHOULD use a third-party address cleansing service to normalize and validate address data.
    - id: address-cleansing-and-normalization--s2
      text: IIS SHALL NOT require strictly coded state, country, or county values at submission.
    - id: address-cleansing-and-normalization--s3
      text: IIS MAY retain both the original submitted address and the cleansed address.
    - id: address-cleansing-and-normalization--s4
      text: IIS SHOULD use the cleansed address for matching, de-duplication, and geocoding.
    - id: address-cleansing-and-normalization--s5
      text: IIS SHOULD return the standard two-letter USPS state abbreviation (for example, 'AK' for Alaska) for U.S. addresses in outbound responses to improve automated interoperability.
phone-and-email:
  next: 1
  statements: []
general-principles:
  next: 6
  statements:
    - id: general-principles--s1
      text: Systems SHALL send patient contact information in PID-13 and guardian or next-of-kin contact information in NK1-5.
    - id: general-principles--s2
      text: The first repetition of PID-13 SHALL represent the primary contact number.
    - id: general-principles--s3
      text: Each contact method (phone or email) SHALL be sent in its own repetition.
    - id: general-principles--s4
      text: If no primary phone number is available, systems SHALL include an empty first repetition before the email repetition.
    - id: general-principles--s5
      text: IIS SHALL accept and store contact information for either the patient or guardian, as appropriate.
telecommunication-use-codes-hl70201:
  next: 6
  statements:
    - id: telecommunication-use-codes-hl70201--s1
      text: Systems SHALL use PRN for the primary phone number.
    - id: telecommunication-use-codes-hl70201--s2
      text: Systems SHALL use NET for an email address.
    - id: telecommunication-use-codes-hl70201--s3
      text: Systems MAY send other use codes (ORN, PRS, WPN, VHN, ASN, EMR, BPN).
    - id: telecommunication-use-codes-hl70201--s4
      text: IIS SHALL accept optional use codes and MAY ignore them if not operationally needed.
    - id: telecommunication-use-codes-hl70201--s5
      text: IIS SHALL NOT reject messages containing unused or unrecognized use codes.
telecommunication-equipment-type-codes-hl70202:
  next: 4
  statements:
    - id: telecommunication-equipment-type-codes-hl70202--s1
      text: Systems SHALL use PH for phone numbers of unknown type and CP when the number is known to be cellular.
    - id: telecommunication-equipment-type-codes-hl70202--s2
      text: IIS SHALL accept either PH or CP without inferring additional meaning.
    - id: telecommunication-equipment-type-codes-hl70202--s3
      text: IIS SHALL ignore other equipment types if present.
interpretation-and-operational-guidance:
  next: 4
  statements:
    - id: interpretation-and-operational-guidance--s1
      text: IIS SHOULD treat submitted phone numbers as cellular by default, regardless of equipment type.
    - id: interpretation-and-operational-guidance--s2
      text: IIS SHOULD NOT rely on XTN content to distinguish landline from cellular numbers.
    - id: interpretation-and-operational-guidance--s3
      text: IIS SHOULD use third-party validation services when confirmation of SMS eligibility is required.
race-and-ethnicity:
  next: 1
  statements: []
value-sets-and-field-usage:
  next: 4
  statements:
    - id: value-sets-and-field-usage--s1
      text: Race (PID-10) SHALL use the CDCREC value set.
    - id: value-sets-and-field-usage--s2
      text: Ethnicity (PID-22) SHALL use the CDCREC value set.
    - id: value-sets-and-field-usage--s3
      text: Systems SHALL NOT use HL70005 for race or ethnicity coding.
unknown-and-refused-values:
  next: 8
  statements:
    - id: unknown-and-refused-values--s1
      text: Sending systems MAY use UNK, ASKU, or PHC1175 when race or ethnicity is unknown or not provided.
    - id: unknown-and-refused-values--s2
      text: Sending systems SHOULD select and consistently implement either ASKU or PHC1175 as their preferred "unknown" code, but not both.
    - id: unknown-and-refused-values--s3
      text: Sending systems MAY use UNK where a general unknown designation is appropriate.
    - id: unknown-and-refused-values--s4
      text: IIS SHALL accept UNK, ASKU, and PHC1175.
    - id: unknown-and-refused-values--s5
      text: IIS MAY translate ASKU or PHC1175 to UNK or to an empty value according to local policy.
    - id: unknown-and-refused-values--s6
      text: IIS SHALL NOT reject messages because these codes are present.
    - id: unknown-and-refused-values--s7
      text: IIS SHALL NOT define additional local "unknown" codes.
multiple-race-reporting:
  next: 5
  statements:
    - id: multiple-race-reporting--s1
      text: If a patient reports multiple races, each SHALL be sent as a separate repetition of PID-10.
    - id: multiple-race-reporting--s2
      text: IIS SHALL support and process multiple PID-10 repetitions.
    - id: multiple-race-reporting--s3
      text: '"Other race" (2131-1) SHALL only be sent if explicitly selected by the patient.'
    - id: multiple-race-reporting--s4
      text: If no race information is provided, PID-10 MAY be omitted or populated with UNK, ASKU, or PHC1175.
ethnicity-reporting:
  next: 4
  statements:
    - id: ethnicity-reporting--s1
      text: Ethnicity SHALL be reported in PID-22.
    - id: ethnicity-reporting--s2
      text: Multiple repetitions of PID-22 SHALL NOT be used.
    - id: ethnicity-reporting--s3
      text: If ethnicity is unknown or not provided, PID-22 MAY be omitted or populated with UNK, ASKU, or PHC1175.
omb-2024-directive-and-forward-compatibility:
  next: 8
  statements:
    - id: omb-2024-directive-and-forward-compatibility--s1
      text: IIS SHALL continue to transmit race and ethnicity as separate fields.
    - id: omb-2024-directive-and-forward-compatibility--s2
      text: IIS SHOULD support the MENA race code as a top-level category.
    - id: omb-2024-directive-and-forward-compatibility--s3
      text: IIS SHALL NOT collapse race and ethnicity into a single coded field until national implementation guidance is published.
    - id: omb-2024-directive-and-forward-compatibility--s4
      text: IIS SHALL support the minimum top-level CDCREC race and ethnicity categories.
    - id: omb-2024-directive-and-forward-compatibility--s5
      text: IIS SHALL accept additional valid CDCREC codes.
    - id: omb-2024-directive-and-forward-compatibility--s6
      text: IIS SHOULD tolerate valid CDCREC codes even if not stored at full granularity.
    - id: omb-2024-directive-and-forward-compatibility--s7
      text: IIS SHOULD roll up granular codes to top-level categories for reporting and analytics when needed.
consent-and-privacy:
  next: 1
  statements: []
protection-indicator-pd1-12-usage:
  next: 8
  statements:
    - id: protection-indicator-pd1-12-usage--s1
      text: Systems SHALL use PD1-12 (Protection Indicator) only to communicate explicit patient or guardian consent preferences.
    - id: protection-indicator-pd1-12-usage--s2
      text: '''Y'' SHALL indicate that the patient/guardian has not consented to data sharing (protect data).'
    - id: protection-indicator-pd1-12-usage--s3
      text: '''N'' SHALL indicate that the patient/guardian has consented to data sharing.'
    - id: protection-indicator-pd1-12-usage--s4
      text: An empty PD1-12 SHALL indicate that no determination of patient/guardian preference is available.
    - id: protection-indicator-pd1-12-usage--s5
      text: Sending systems SHALL NOT populate PD1-12 by default unless the patient/guardian has made an explicit determination.
    - id: protection-indicator-pd1-12-usage--s6
      text: IIS SHALL NOT require sending systems to populate PD1-12 with a default
    - id: protection-indicator-pd1-12-usage--s7
      text: IIS SHOULD apply jurisdiction-specific defaults or restrictions after message receipt.
jurisdictional-consent-models:
  next: 5
  statements:
    - id: jurisdictional-consent-models--s1
      text: In opt-out jurisdictions, submitters SHALL send all immunization records regardless of PD1-12, unless directed otherwise by the IIS.
    - id: jurisdictional-consent-models--s2
      text: In opt-in jurisdictions, submitters SHALL follow IIS-specific guidance for collecting and transmitting PD1-12 values.
    - id: jurisdictional-consent-models--s3
      text: Where consent has not been determined, PD1-12 SHALL be left empty.
    - id: jurisdictional-consent-models--s4
      text: IIS SHALL define and publish their consent policy for participating systems.
cross-border-and-multi-jurisdictional-messaging:
  next: 3
  statements:
    - id: cross-border-and-multi-jurisdictional-messaging--s1
      text: Consent indicators in PD1-12 SHALL NOT have any meaning outside the receiving jurisdiction.
    - id: cross-border-and-multi-jurisdictional-messaging--s2
      text: Submitters SHALL comply independently with the consent and privacy policies of each IIS to which they send data.
historical-note-on-pd1-12-interpretation:
  next: 1
  statements: []
patient-active-status-in-clinical-and-iis-contexts:
  next: 1
  statements: []
provider-reported-status:
  next: 2
  statements:
    - id: provider-reported-status--s1
      text: Absence of a patient status SHALL NOT be interpreted as evidence that the patient is active or inactive.
active-and-inactive-status:
  next: 3
  statements:
    - id: active-and-inactive-status--s1
      text: IIS SHALL NOT rely on active or inactive status as a prerequisite for accepting immunization events.
    - id: active-and-inactive-status--s2
      text: IIS SHOULD treat active and inactive values as advisory rather than authoritative.
deceased-status:
  next: 6
  statements:
    - id: deceased-status--s1
      text: Deceased status SHALL take precedence over active or inactive designations.
    - id: deceased-status--s2
      text: IIS SHOULD preserve deceased status consistently across provider-level and jurisdictional views of the patient.
    - id: deceased-status--s3
      text: IIS SHALL continue to accept historical immunization data for deceased patients when submitted.
    - id: deceased-status--s4
      text: Receipt of a new immunization event MAY be interpreted by IIS as evidence of current engagement, but SHOULD NOT override an explicitly reported deceased status.
    - id: deceased-status--s5
      text: Such cases SHOULD be flagged for review to resolve possible matching or data-quality issues, and to determine whether the event represents historical data reported after the date of death.
iis-derived-status-and-jurisdictional-views:
  next: 2
  statements:
    - id: iis-derived-status-and-jurisdictional-views--s1
      text: Jurisdictional or IIS-derived patient statuses SHALL NOT be transmitted in HL7 v2 messages.
immunization-information:
  next: 1
  statements: []
administered-versus-historical-vaccinations:
  next: 1
  statements: []
administered-vaccinations:
  next: 4
  statements:
    - id: administered-vaccinations--s1
      text: Administered vaccinations SHALL represent doses given directly by the reporting organization.
    - id: administered-vaccinations--s2
      text: Administered records SHOULD include more complete product information when available (e.g., specific CVX, manufacturer, lot number, NDC).
    - id: administered-vaccinations--s3
      text: IIS MAY apply additional data quality or inventory rules to administered vaccinations.
historical-vaccinations:
  next: 6
  statements:
    - id: historical-vaccinations--s1
      text: Historical vaccinations SHALL represent doses not administered by the reporting organization.
    - id: historical-vaccinations--s2
      text: Historical records MAY omit product-level details that cannot reasonably be determined.
    - id: historical-vaccinations--s3
      text: IIS SHALL NOT decrement inventory for historical vaccinations.
    - id: historical-vaccinations--s4
      text: IIS SHOULD expect duplicate reporting of historical doses from multiple sources.
    - id: historical-vaccinations--s5
      text: Historical vaccinations MAY include any of the data elements typically used for administered vaccinations when available (e.g., vaccine code (CVX/NDC), administration date, administering provider, lot number, manufacturer, route/site of administration, funding/eligibility indicators, etc.).
global-and-non-u-s-vaccinations:
  next: 1
  statements: []
representation-of-foreign-and-non-standard-products:
  next: 4
  statements:
    - id: representation-of-foreign-and-non-standard-products--s1
      text: Foreign or non-U.S. vaccination products MAY be represented using component-based CVX reporting.
    - id: representation-of-foreign-and-non-standard-products--s2
      text: Unspecified Formulation CVX codes MAY be used when exact product identification is not possible.
    - id: representation-of-foreign-and-non-standard-products--s3
      text: IIS SHALL store these vaccinations as reported and include them in the consolidated immunization history.
use-of-administered-vs-historical-on-output:
  next: 4
  statements:
    - id: use-of-administered-vs-historical-on-output--s1
      text: IIS SHOULD NOT differentiate between administered and historical vaccinations when returning consolidated immunization histories.
    - id: use-of-administered-vs-historical-on-output--s2
      text: Querying systems SHOULD ignore administered/historical indicators if present.
    - id: use-of-administered-vs-historical-on-output--s3
      text: IIS SHOULD focus outbound histories on vaccine type, date of administration, and relevant clinical attributes rather than submission context.
iis-processing-and-reconciliation:
  next: 1
  statements: []
ehr-workflow-considerations:
  next: 1
  statements: []
coding-considerations:
  next: 1
  statements: []
cvx-codes:
  next: 4
  statements:
    - id: cvx-codes--s1
      text: Administered vaccinations SHOULD use CVX codes that were active at the time the dose was administered.
    - id: cvx-codes--s2
      text: Historical vaccinations MAY use either active or inactive CVX codes.
    - id: cvx-codes--s3
      text: Inactive CVX codes SHALL continue to be treated as valid for historical vaccinations and older administered records.
ndc-codes:
  next: 4
  statements:
    - id: ndc-codes--s1
      text: NDC codes SHOULD be reported for administered vaccinations when available.
    - id: ndc-codes--s2
      text: Historical vaccinations SHOULD NOT be expected to include NDC codes.
    - id: ndc-codes--s3
      text: IIS SHALL NOT reject historical records due to missing NDC information.
vaccine-product-and-administration-codes:
  next: 1
  statements: []
vaccine-code-systems-overview:
  next: 1
  statements: []
cvx-vaccines-administered-code:
  next: 7
  statements:
    - id: cvx-vaccines-administered-code--s1
      text: IIS and submitting systems SHALL use CVX as the canonical representation of administered and historical vaccinations for IIS operations, evaluation, and forecasting.
    - id: cvx-vaccines-administered-code--s2
      text: IIS SHALL be able to receive CVX codes in VXU messages and SHALL be able to return CVX codes in RSP messages for all vaccinations maintained in the registry.
    - id: cvx-vaccines-administered-code--s3
      text: IIS SHALL internally maintain or derive a CVX value for each vaccination that participates in evaluation, forecasting, or query/response, regardless of which code system was originally submitted.
    - id: cvx-vaccines-administered-code--s4
      text: Submitting systems SHALL send the most specific CVX code available that accurately reflects the vaccine administered or historically received.
    - id: cvx-vaccines-administered-code--s5
      text: Submitting systems SHOULD send a CVX code for every administered and historical vaccination, even when other code systems (e.g., NDC) are also sent.
    - id: cvx-vaccines-administered-code--s6
      text: IIS SHALL accept CVX codes for historical vaccinations that represent valid doses administered at any time or location, including those administered outside the United States.
cvx-code-status-and-operational-meaning:
  next: 11
  statements:
    - id: cvx-code-status-and-operational-meaning--s1
      text: IIS SHALL support receipt, storage, and use of Active CVX codes for administered and historical vaccinations.
    - id: cvx-code-status-and-operational-meaning--s2
      text: Submitting systems SHALL use Active CVX codes for administered vaccinations when an appropriate Active code exists.
    - id: cvx-code-status-and-operational-meaning--s3
      text: IIS SHALL support receipt, storage, and use of Inactive CVX codes for historical vaccinations.
    - id: cvx-code-status-and-operational-meaning--s4
      text: IIS SHALL support receipt and storage of Non-US CVX codes for historical vaccinations to represent doses administered outside the United States.
    - id: cvx-code-status-and-operational-meaning--s5
      text: IIS SHALL NOT reject a vaccination record solely because the associated CVX code is Inactive or Non-US.
    - id: cvx-code-status-and-operational-meaning--s6
      text: Submitting systems SHOULD use Inactive or Non-US CVX codes for historical vaccinations when they accurately represent the vaccine administered.
    - id: cvx-code-status-and-operational-meaning--s7
      text: IIS MAY defer support for Pending CVX codes until they become Active.
    - id: cvx-code-status-and-operational-meaning--s8
      text: IIS SHOULD plan for timely adoption of Pending CVX codes once they are activated by CDC.
    - id: cvx-code-status-and-operational-meaning--s9
      text: IIS SHALL NOT accept CVX codes with a status of Never Active in VXU messages.
    - id: cvx-code-status-and-operational-meaning--s10
      text: IIS SHALL treat the use of Never Active CVX codes as an error condition.
unspecified-formulation-and-category-level-cvx-codes:
  next: 1
  statements: []
appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes:
  next: 7
  statements:
    - id: appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes--s1
      text: Submitting systems SHALL use the most specific CVX code they know to be accurate for an administered vaccination.
    - id: appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes--s2
      text: Submitting systems SHOULD NOT use Unspecified Formulation or broad category-level CVX codes for newly administered vaccinations when a more specific CVX code is known at the time of documentation.
    - id: appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes--s3
      text: IIS SHALL accept Unspecified Formulation and category-level CVX codes when they represent the best available information.
    - id: appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes--s4
      text: IIS SHALL NOT reject vaccination records solely because an Unspecified Formulation or category-level CVX code is used.
    - id: appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes--s5
      text: IIS SHOULD monitor use of Unspecified Formulation and category-level CVX codes, particularly for administered vaccinations, as part of ongoing data-quality review.
    - id: appropriate-use-of-unspecified-formulation-and-category-level-cvx-codes--s6
      text: IIS SHOULD work with submitting systems when routine use of broader CVX codes indicates loss of available specificity or workflow issues.
non-vaccine-cvx-codes-including-998-and-999:
  next: 7
  statements:
    - id: non-vaccine-cvx-codes-including-998-and-999--s1
      text: IIS MAY support other non-vaccine CVX codes according to local policy.
    - id: non-vaccine-cvx-codes-including-998-and-999--s2
      text: IIS SHALL support CVX 998 only for the structural HL7 use cases defined in this guide.
    - id: non-vaccine-cvx-codes-including-998-and-999--s3
      text: IIS SHALL NOT treat CVX 998 as an administered, historical, or refused vaccination in the patient's immunization history.
    - id: non-vaccine-cvx-codes-including-998-and-999--s4
      text: Submitting systems SHALL NOT use CVX 998 to report administered, historical, or refused vaccinations.
    - id: non-vaccine-cvx-codes-including-998-and-999--s5
      text: IIS and submitting systems SHALL NOT use CVX 999 for immunization reporting.
    - id: non-vaccine-cvx-codes-including-998-and-999--s6
      text: IIS SHALL treat the presence of CVX 999 in RXA-5 as an error condition.
timeliness-and-maintenance-of-cvx-support:
  next: 12
  statements:
    - id: timeliness-and-maintenance-of-cvx-support--s1
      text: IIS SHALL support newly published Active CVX codes within 30 days of CDC publication, provided the corresponding CDSi supporting data required to evaluate and forecast the CVX code are available.
    - id: timeliness-and-maintenance-of-cvx-support--s2
      text: IIS SHALL support newly published Inactive CVX codes within 30 days of CDC publication so that historical and category-level records can be recorded accurately.
    - id: timeliness-and-maintenance-of-cvx-support--s3
      text: Submitting systems SHOULD plan for timely adoption of newly published CVX codes in alignment with CDC publication schedules.
    - id: timeliness-and-maintenance-of-cvx-support--s4
      text: IIS SHALL preserve CVX codes recorded in patient immunization histories indefinitely, even after those codes become inactive.
    - id: timeliness-and-maintenance-of-cvx-support--s5
      text: IIS SHALL NOT modify historical CVX values solely due to status changes in the CVX code set.
    - id: timeliness-and-maintenance-of-cvx-support--s6
      text: IIS SHALL ensure that historical vaccination records remain interpretable over time.
    - id: timeliness-and-maintenance-of-cvx-support--s7
      text: IIS SHALL maintain CVX status information (e.g., Active, Inactive, Non-US, Pending, Never Active) consistent with the CDC-published code set.
    - id: timeliness-and-maintenance-of-cvx-support--s8
      text: IIS SHOULD track effective dates and status changes for CVX codes to support accurate interpretation of historical records.
    - id: timeliness-and-maintenance-of-cvx-support--s9
      text: IIS SHOULD ensure that internal mappings and decision support configuration remain aligned with current CVX status information.
    - id: timeliness-and-maintenance-of-cvx-support--s10
      text: IIS and submitting systems SHOULD monitor CDC CVX publications and update mechanisms to remain current with code set changes.
    - id: timeliness-and-maintenance-of-cvx-support--s11
      text: IIS SHOULD encourage submitting systems to align code usage with current CDC-published CVX values to minimize data quality issues and rejected submissions.
ndc-national-drug-code:
  next: 1
  statements: []
unit-of-use-and-unit-of-sale-ndcs:
  next: 1
  statements: []
ndc-formatting-expectations:
  next: 3
  statements:
    - id: ndc-formatting-expectations--s1
      text: Ten-digit NDCs (NDC10) MAY appear in legacy data and require normalization for consistent processing.
    - id: ndc-formatting-expectations--s2
      text: IIS and submitting systems SHALL be prepared to recognize common formatting variations to ensure reliable interpretation.
relationship-between-ndc-and-cvx:
  next: 1
  statements: []
storage-and-traceability-expectations:
  next: 3
  statements:
    - id: storage-and-traceability-expectations--s1
      text: IIS SHOULD store submitted NDC values alongside the associated CVX representation when NDC is provided.
    - id: storage-and-traceability-expectations--s2
      text: IIS SHOULD preserve NDC information to support traceability, auditability, and reconciliation with external systems.
reporting-administered-vaccinations-vxu:
  next: 1
  statements: []
accepted-code-systems-for-administered-vaccinations:
  next: 7
  statements:
    - id: accepted-code-systems-for-administered-vaccinations--s1
      text: IIS SHALL accept CVX codes to represent administered vaccinations.
    - id: accepted-code-systems-for-administered-vaccinations--s2
      text: IIS SHALL accept NDC codes to represent administered vaccinations.
    - id: accepted-code-systems-for-administered-vaccinations--s3
      text: IIS MAY accept CPT codes for administered vaccinations to support legacy interfaces.
    - id: accepted-code-systems-for-administered-vaccinations--s4
      text: IIS SHALL be capable of accepting an administered vaccination reported with only a valid CVX code and no NDC.
    - id: accepted-code-systems-for-administered-vaccinations--s5
      text: IIS SHALL be capable of accepting an administered vaccination reported with only a valid NDC and no CVX.
    - id: accepted-code-systems-for-administered-vaccinations--s6
      text: When both CVX and NDC are submitted for an administered vaccination, IIS SHALL inspect the submitted values to ensure they correlate to the same vaccine concept.
cvx-requirements-for-administered-vaccinations:
  next: 5
  statements:
    - id: cvx-requirements-for-administered-vaccinations--s1
      text: Submitting systems SHALL support Active U.S. vaccine CVX codes for administered vaccinations.
    - id: cvx-requirements-for-administered-vaccinations--s2
      text: Submitting systems SHALL NOT use Never Active CVX codes to report administered vaccinations.
    - id: cvx-requirements-for-administered-vaccinations--s3
      text: Submitting systems SHALL support the non-vaccine CVX code 998 only for HL7 structural purposes and SHALL NOT use it to represent an administered vaccination.
    - id: cvx-requirements-for-administered-vaccinations--s4
      text: IIS SHALL accept administered vaccination records reported with valid Active CVX codes.
ndc-requirements-for-administered-vaccinations:
  next: 12
  statements:
    - id: ndc-requirements-for-administered-vaccinations--s1
      text: Submitting systems SHALL support Unit-of-Use NDCs for administered vaccinations.
    - id: ndc-requirements-for-administered-vaccinations--s2
      text: Submitting systems SHOULD support Unit-of-Sale NDCs for administered vaccinations.
    - id: ndc-requirements-for-administered-vaccinations--s3
      text: IIS SHALL accept both Unit-of-Use and Unit-of-Sale NDCs when reported.
    - id: ndc-requirements-for-administered-vaccinations--s4
      text: Submitting systems SHALL support NDC11 formatted with dashes using the 5-4-2 format (xxxxx-xxxx-xx).
    - id: ndc-requirements-for-administered-vaccinations--s5
      text: Submitting systems SHOULD NOT use NDC10 without dashes.
    - id: ndc-requirements-for-administered-vaccinations--s6
      text: Submitting systems MAY support NDC11 without dashes.
    - id: ndc-requirements-for-administered-vaccinations--s7
      text: Submitting systems MAY support NDC10 with dashes using the 4-4-2 format.
    - id: ndc-requirements-for-administered-vaccinations--s8
      text: IIS SHALL be capable of accepting and interpreting commonly used NDC formats.
    - id: ndc-requirements-for-administered-vaccinations--s9
      text: For vaccines requiring reconstitution, submitting systems SHALL report the NDC for the lyophilized powder (the active product) rather than the diluent.
    - id: ndc-requirements-for-administered-vaccinations--s10
      text: For vaccines with multiple active components, submitting systems SHALL report any NDC associated with the vaccine (Unit-of-Use or Unit-of-Sale), consistent with clinical workflow.
    - id: ndc-requirements-for-administered-vaccinations--s11
      text: IIS SHALL accept administered vaccination reports for multi-component products without requiring a specific NDC selection.
reporting-historical-vaccinations:
  next: 5
  statements:
    - id: reporting-historical-vaccinations--s1
      text: IIS SHALL accept Inactive CVX codes for historical vaccinations.
    - id: reporting-historical-vaccinations--s2
      text: IIS SHALL accept Non-US CVX codes for historical vaccinations.
    - id: reporting-historical-vaccinations--s3
      text: Submitting systems SHOULD use the most specific CVX code available that accurately represents the historical vaccination.
    - id: reporting-historical-vaccinations--s4
      text: Submitting systems MAY use category-level or unspecified formulation CVX codes when the exact formulation cannot be determined.
vaccinations-returned-in-query-responses-rsp:
  next: 1
  statements: []
cvx-requirements-for-rsp-messages:
  next: 5
  statements:
    - id: cvx-requirements-for-rsp-messages--s1
      text: IIS SHALL return a CVX code for every vaccination included in an RSP immunization history.
    - id: cvx-requirements-for-rsp-messages--s2
      text: IIS SHALL be capable of returning Active, Inactive, and Non-US CVX codes in RSP messages.
    - id: cvx-requirements-for-rsp-messages--s3
      text: Querying systems SHOULD expect to receive Active, Inactive, and Non-US CVX codes in immunization history responses.
    - id: cvx-requirements-for-rsp-messages--s4
      text: IIS SHALL NOT return Never Active CVX codes in RSP messages.
optional-return-of-other-code-systems:
  next: 4
  statements:
    - id: optional-return-of-other-code-systems--s1
      text: IIS MAY return NDC values associated with a vaccination in an RSP message.
    - id: optional-return-of-other-code-systems--s2
      text: IIS SHOULD NOT return CPT codes in RSP messages, even if CPT was used in the original submission.
    - id: optional-return-of-other-code-systems--s3
      text: IIS SHOULD NOT return non-vaccine CVX codes in RSP messages without prior coordination and agreement with the querying system.
code-retirement-and-long-term-data-fidelity:
  next: 8
  statements:
    - id: code-retirement-and-long-term-data-fidelity--s1
      text: IIS SHALL preserve CVX codes recorded in patient immunization histories, even after those codes are retired or become inactive.
    - id: code-retirement-and-long-term-data-fidelity--s2
      text: IIS SHALL treat vaccinations reported with retired CVX codes as valid historical records when they accurately represent doses administered.
    - id: code-retirement-and-long-term-data-fidelity--s3
      text: IIS SHALL continue to return retired CVX codes in RSP messages when they are part of a patient's immunization history.
    - id: code-retirement-and-long-term-data-fidelity--s4
      text: IIS SHALL accept vaccination records reported with retired CVX codes when the vaccination was administered prior to retirement.
    - id: code-retirement-and-long-term-data-fidelity--s5
      text: IIS SHOULD be prepared to accept administered vaccination reports using retired CVX codes during transition periods when products remain in circulation.
    - id: code-retirement-and-long-term-data-fidelity--s6
      text: IIS SHOULD monitor use of retired CVX codes for administered vaccinations and coordinate with submitting systems to transition to appropriate replacement codes.
    - id: code-retirement-and-long-term-data-fidelity--s7
      text: IIS SHOULD distinguish between historical use of retired codes and inappropriate continued use for new administrations as part of data quality monitoring.
other-uses-of-cvx-codes:
  next: 1
  statements: []
vaccination-record-identity-and-orc-3:
  next: 4
  statements:
    - id: vaccination-record-identity-and-orc-3--s1
      text: IIS SHOULD retain a durable association between the submitting source, the source-assigned ORC-3, and the consolidated vaccination event.
    - id: vaccination-record-identity-and-orc-3--s2
      text: When responding to the same source, IIS SHOULD return the source-assigned ORC-3 when the association is reliably available.
    - id: vaccination-record-identity-and-orc-3--s3
      text: When a source-assigned ORC-3 is not reliably available, IIS MAY return an IIS-assigned identifier for the consolidated vaccination event.
updates-and-deletes:
  next: 1
  statements: []
identifying-field-changes:
  next: 1
  statements: []
submitter-correction-behavior:
  next: 6
  statements:
    - id: submitter-correction-behavior--s1
      text: Submitting systems SHALL support sending adds (A), updates (U), and deletes (D) for vaccination records.
    - id: submitter-correction-behavior--s2
      text: When any identifying field changes, submitting systems SHALL send a delete followed by an add containing the corrected vaccination information.
    - id: submitter-correction-behavior--s3
      text: When only non-identifying field data changes, submitting systems SHALL send an update.
    - id: submitter-correction-behavior--s4
      text: Submitting systems SHALL reuse the source record’s ORC-3 in every update or delete that refers to that record.
    - id: submitter-correction-behavior--s5
      text: A delete SHALL carry the identifying field values previously submitted for the source record being deleted.
iis-matching-and-correction-processing:
  next: 3
  statements:
    - id: iis-matching-and-correction-processing--s1
      text: IIS SHOULD use the combination of submitting source and ORC-3 as a high-confidence input when matching updates and deletes to previously submitted source records.
    - id: iis-matching-and-correction-processing--s2
      text: IIS SHALL perform vaccination-level matching for records sent as A or U and SHALL NOT create a duplicate vaccination event solely because a correction was sent as A rather than U.
handling-delete-requests:
  next: 4
  statements:
    - id: handling-delete-requests--s1
      text: IIS SHALL support processing delete requests for vaccination records previously reported by the submitting source.
    - id: handling-delete-requests--s2
      text: Submitting systems SHOULD NOT send a delete for a vaccination record originally reported by another source.
    - id: handling-delete-requests--s3
      text: When an update or delete cannot be applied, IIS SHOULD return an acknowledgment that explains the outcome and indicates when manual follow-up is required.
inventory-and-accountability-considerations:
  next: 1
  statements: []
unnecessary-corrections:
  next: 2
  statements:
    - id: unnecessary-corrections--s1
      text: Submitting systems SHALL NOT send an update or delete unless vaccination information has changed or the source record has been retracted.
funding-source-and-eligibility:
  next: 1
  statements: []
patient-funding-eligibility-per-dose:
  next: 5
  statements:
    - id: patient-funding-eligibility-per-dose--s1
      text: Submitting systems SHALL support capture and messaging of funding eligibility at the vaccination (per-dose) level.
    - id: patient-funding-eligibility-per-dose--s2
      text: If a submitting system only captures eligibility at the visit-level, it SHALL associate that eligibility with each administered vaccination from that visit when constructing the message.
    - id: patient-funding-eligibility-per-dose--s3
      text: For each administered vaccination, at most one funding eligibility value SHALL be sent.
    - id: patient-funding-eligibility-per-dose--s4
      text: IIS MAY use OBX-17 to diagnose legacy or misconfigured interfaces but are not required to use OBX-17 to drive program logic.
vaccine-funding-source-and-stock-models:
  next: 5
  statements:
    - id: vaccine-funding-source-and-stock-models--s1
      text: Each IIS SHALL select either a two-stock or three-stock model and SHALL apply that model consistently for all reporting organizations in its jurisdiction.
    - id: vaccine-funding-source-and-stock-models--s2
      text: IIS SHALL accept funding source and funding eligibility combinations that are possible in practice, even when they do not conform to program policy (for example, a public VFC-funded vaccine administered to an ineligible patient), unless the jurisdiction has explicitly chosen to enforce stricter rules as part of its program operations.
    - id: vaccine-funding-source-and-stock-models--s3
      text: IIS SHOULD prefer accepting administered vaccination data with incorrect or unexpected funding source values and resolving issues through data quality and program follow-up activities, rather than rejecting the entire vaccination record.
    - id: vaccine-funding-source-and-stock-models--s4
      text: IIS MAY enforce stricter completeness or correctness requirements on funding source for participants in publicly funded vaccine programs when the jurisdiction has a plan in place to ensure corrections and resubmissions.
jurisdiction-specific-eligibility-codes:
  next: 4
  statements:
    - id: jurisdiction-specific-eligibility-codes--s1
      text: Jurisdictions that define local eligibility codes SHALL publish those codes, their meanings, their assigning authorities, and any effective dates or mappings in their local implementation guide.
    - id: jurisdiction-specific-eligibility-codes--s2
      text: Locally defined eligibility codes SHALL NOT duplicate the semantic meaning of existing national eligibility codes.
    - id: jurisdiction-specific-eligibility-codes--s3
      text: Locally defined eligibility codes SHALL use a consistent pattern that clearly associates the code with the jurisdiction (for example, a state abbreviation followed by a sequence number, such as AK01, AK02) and SHALL include an assigning authority to distinguish jurisdictional values from national or other authorities.
validation-enforcement-and-borrowing-scenarios:
  next: 5
  statements:
    - id: validation-enforcement-and-borrowing-scenarios--s1
      text: IIS SHOULD avoid using HL7 v2 conformance rules to enforce all aspects of funding program policy and SHOULD instead rely on data quality processes and program operations to address unexpected or noncompliant combinations.
    - id: validation-enforcement-and-borrowing-scenarios--s2
      text: Jurisdictions MAY impose stricter funding eligibility and funding source requirements on organizations participating in publicly funded vaccine programs when necessary to support inventory decrementing and program oversight, provided they have processes to ensure that rejected records can be corrected and resubmitted.
    - id: validation-enforcement-and-borrowing-scenarios--s3
      text: In all cases, submitting systems SHALL report the funding eligibility and funding source that actually applied at the time of vaccination, including in borrowing/payback scenarios, regardless of whether the underlying practice fully complied with program policy.
    - id: validation-enforcement-and-borrowing-scenarios--s4
      text: When a funding source or eligibility code is unrecognized or inconsistent with the jurisdiction's selected stock model, IIS MAY accept the administered vaccination while flagging the issue for data quality review rather than rejecting the record.
universal-purchase-and-default-eligibility:
  next: 4
  statements:
    - id: universal-purchase-and-default-eligibility--s1
      text: In jurisdictions where patients are not individually assessed for funding eligibility for vaccines covered by a universal purchase program, submitting systems SHOULD NOT send funding eligibility or funding source OBX segments for those covered vaccines, unless the jurisdiction has specified explicit values to send.
    - id: universal-purchase-and-default-eligibility--s2
      text: If a jurisdiction specifies a default eligibility or funding source to be applied to vaccinations covered by the program, for example, a single public program covering all routine childhood vaccines, submitting systems SHALL follow that jurisdictional guidance when constructing messages.
    - id: universal-purchase-and-default-eligibility--s3
      text: IIS MAY treat jurisdiction-specified default eligibility or funding source values as equivalent to explicit per-dose determinations for purposes of inventory management and program reporting.
historical-vaccinations-and-internal-use:
  next: 4
  statements:
    - id: historical-vaccinations-and-internal-use--s1
      text: These values MAY be sent on historical vaccinations, and IIS use them, when relevant, for inventory and program operations; IIS are not required to store these values for historical doses, though they MAY retain them for audit or reconciliation purposes.
    - id: historical-vaccinations-and-internal-use--s2
      text: IIS SHOULD NOT use funding eligibility or funding source on historical doses to decrement inventory or drive program operations, and MAY ignore them when not needed.
    - id: historical-vaccinations-and-internal-use--s3
      text: IIS MAY normalize, correct, or update funding eligibility and funding source values internally over time to align with program operations, without attempting to preserve those changes as part of the clinical patient history returned to external systems.
vaccine-information-statements:
  next: 1
  statements: []
clinical-and-operational-context:
  next: 3
  statements:
    - id: clinical-and-operational-context--s1
      text: IIS SHALL NOT reject an administered vaccination solely because VIS information is missing, incomplete, or inconsistent.
    - id: clinical-and-operational-context--s2
      text: IIS SHOULD accept and MAY store VIS information when required by jurisdictional policy, and SHOULD interpret VIS data as part of the submitted vaccination record rather than as confirmation of clinical compliance with VICP requirements.
use-and-limitations-of-vis-information-in-iis:
  next: 5
  statements:
    - id: use-and-limitations-of-vis-information-in-iis--s1
      text: IIS SHOULD NOT return VIS information in RSP messages.
    - id: use-and-limitations-of-vis-information-in-iis--s2
      text: IIS SHOULD accept and store VIS information even when identifiers, publication dates, or dates-given differ from expected values.
    - id: use-and-limitations-of-vis-information-in-iis--s3
      text: IIS SHOULD address VIS inconsistencies through data-quality processes rather than message-level rejection.
    - id: use-and-limitations-of-vis-information-in-iis--s4
      text: IIS SHOULD avoid treating VIS completeness as a proxy for VICP compliance.
reporting-vis-information-in-hl7-v2-messages:
  next: 10
  statements:
    - id: reporting-vis-information-in-hl7-v2-messages--s1
      text: IIS SHALL support both VIS reporting methods.
    - id: reporting-vis-information-in-hl7-v2-messages--s2
      text: Submitting systems SHALL support at least one VIS reporting method.
    - id: reporting-vis-information-in-hl7-v2-messages--s3
      text: IIS SHALL accept VIS barcode identifiers even when the identifier is not recognized.
    - id: reporting-vis-information-in-hl7-v2-messages--s4
      text: IIS SHALL accept publication dates and dates-given even when they differ from expected values.
    - id: reporting-vis-information-in-hl7-v2-messages--s5
      text: The VIS date-given SHALL NOT be later than the vaccine administration date.
    - id: reporting-vis-information-in-hl7-v2-messages--s6
      text: IIS SHOULD follow up on unexpected VIS data through data-quality processes when programmatically needed.
    - id: reporting-vis-information-in-hl7-v2-messages--s7
      text: IIS SHALL NOT reject an administered vaccination due to problems with VIS identifiers, publication dates, or dates-given.
    - id: reporting-vis-information-in-hl7-v2-messages--s8
      text: Submitting systems and IIS SHALL support multiple VIS entries per administered vaccine.
    - id: reporting-vis-information-in-hl7-v2-messages--s9
      text: Submitting systems SHOULD populate OBX-4 to group related VIS OBX segments for each VIS instance, and IIS SHOULD use OBX-4 when present to associate the VIS identifier, publication date, and date-given fields.
program-considerations:
  next: 5
  statements:
    - id: program-considerations--s1
      text: IIS SHOULD align VIS-related policies with specific program needs, not general data-quality expectations.
    - id: program-considerations--s2
      text: IIS SHOULD avoid making VIS data a structural requirement for vaccination reporting.
    - id: program-considerations--s3
      text: IIS SHOULD treat VIS data discrepancies as quality-improvement opportunities, not message-level errors.
    - id: program-considerations--s4
      text: IIS SHALL continue to accept and store administered vaccinations regardless of VIS completeness or accuracy.
clinical-decision-support:
  next: 1
  statements: []
role-of-acip-and-cdsi:
  next: 1
  statements: []
jurisdictional-clinical-policy:
  next: 2
  statements:
    - id: jurisdictional-clinical-policy--s1
      text: When an RSP message includes evaluations and recommendations they SHALL cover all age-based recommendations used by the registry’s CDS logic.
risk-based-recommendations:
  next: 3
  statements:
    - id: risk-based-recommendations--s1
      text: Jurisdictions MAY include recommendations for risk-based antigens, for example, HPV in adults where the routine recommendation primarily targets younger populations, or rabies vaccination for documented exposure or travel risk.
    - id: risk-based-recommendations--s2
      text: Jurisdictions MAY include SCDM recommendations, for example, meningococcal B vaccination for adolescents and young adults, which is not universally recommended for everyone in the age group and is instead based on clinical discussion of individual risk and preferences.
overall-structure-of-cds-in-the-rsp:
  next: 4
  statements:
    - id: overall-structure-of-cds-in-the-rsp--s1
      text: RSP messages SHALL include evaluation information within each vaccination history order group when evaluation is supported for that vaccination.
    - id: overall-structure-of-cds-in-the-rsp--s2
      text: RSP messages that include CDS information SHALL include exactly one Forecast order group, and the Forecast order group SHALL appear after all vaccination history order groups and after all other non-administration order groups.
    - id: overall-structure-of-cds-in-the-rsp--s3
      text: Vaccination history order groups SHALL be complete and unfiltered in the RSP, regardless of whether each vaccination influences a forecast.
standard-recommendations-and-series-coverage:
  next: 4
  statements:
    - id: standard-recommendations-and-series-coverage--s1
      text: For every applicable standard routine (age-based) recommendation, the RSP SHALL include evaluation information for all administered doses that may count toward that recommendation.
    - id: standard-recommendations-and-series-coverage--s2
      text: The RSP SHALL also include a recommendation entry in the forecast for every such recommendation, even if the recommendation is complete, age-inappropriate, or no further doses are required (for example, because the patient is too old or too young).
    - id: standard-recommendations-and-series-coverage--s3
      text: Forecast entries SHALL cover all standard routine recommendations; limiting the forecast to only those recommendations requiring another dose is not permitted.
intended-use-and-implementation-expectations:
  next: 2
  statements:
    - id: intended-use-and-implementation-expectations--s1
      text: This section's SHOULD requirements indicate capabilities that are expected to become mandatory in future versions of this guide; implementing them now provides forward compatibility.
evaluation:
  next: 1
  statements: []
future-work:
  next: 3
  statements:
    - id: future-work--s1
      text: Implementers SHOULD document CVX support and local mappings when Unspecified Formulation values are used.
    - id: future-work--s2
      text: If dose validity cannot be determined or is unavailable at query time, the dose-validity OBX for that evaluation instance SHALL be omitted.
vaccine-type-and-component-identification:
  next: 1
  statements: []
evaluation-future-work:
  next: 5
  statements:
    - id: evaluation-future-work--s1
      text: The vaccine type SHALL be reported using the designated LOINC code specified in Chapter 7 (OBX table).
    - id: evaluation-future-work--s2
      text: The vaccine-type observation SHALL be placed first within each evaluated group.
    - id: evaluation-future-work--s3
      text: CVX SHALL be used in OBX-5; the CVX selected SHOULD represent the most appropriate antigen-level CVX. When an exact product formulation is not known, implementers MAY use an unspecified formulation CVX.
    - id: evaluation-future-work--s4
      text: The deprecated component-level vaccine-type LOINC code SHOULD NOT be returned (see Chapter 7 for additional detail).
dose-validity-and-reason-for-validity:
  next: 6
  statements:
    - id: dose-validity-and-reason-for-validity--s1
      text: Dose validity SHALL be reported using the designated LOINC observation identifier specified in Chapter 7 (OBX table). See Chapter 7 for the exact LOINC code(s) and value-set binding.
    - id: dose-validity-and-reason-for-validity--s2
      text: '"Y" or "N" SHALL be used in OBX-5 as the only allowable values when dose validity is reported (Y = counts toward the evaluated series; N = does not count toward the evaluated series).'
    - id: dose-validity-and-reason-for-validity--s3
      text: If dose validity cannot be determined or is unavailable at query time, the dose-validity OBX for that evaluation instance SHALL be omitted.
    - id: dose-validity-and-reason-for-validity--s4
      text: Reason-for-validity SHOULD be reported when validity is "N."
    - id: dose-validity-and-reason-for-validity--s5
      text: When multiple reasons apply, additional OBX segments SHALL be used to repeat the reason.
additional-optional-evaluation-information:
  next: 5
  statements:
    - id: additional-optional-evaluation-information--s1
      text: The IIS MAY report the series name.
    - id: additional-optional-evaluation-information--s2
      text: The IIS MAY report the total number of doses in series.
    - id: additional-optional-evaluation-information--s3
      text: The IIS MAY report the dose number of the evaluated event.
    - id: additional-optional-evaluation-information--s4
      text: The IIS MAY report the schedule used, with the understanding that this information is not consistently standardized
recommendation:
  next: 1
  statements: []
forecast-group-structure:
  next: 4
  statements:
    - id: forecast-group-structure--s1
      text: All forecast information SHALL be returned under a single ORC/RXA order group.
    - id: forecast-group-structure--s2
      text: Each antigen's forecast SHALL be distinguished using OBX-4 sub-ID values.
    - id: forecast-group-structure--s3
      text: A forecast SHALL be included for every standard age-based series, including recommended series (for example, on-schedule or not yet due to start) and not-recommended series (for example, complete, immune, or contraindicated).
vaccine-type-and-forecast-initiation:
  next: 6
  statements:
    - id: vaccine-type-and-forecast-initiation--s1
      text: The forecast SHALL begin with LOINC 30956-7 (Vaccine Type).
    - id: vaccine-type-and-forecast-initiation--s2
      text: LOINC 38890-0 (Component Vaccine Type) SHALL NOT be used to initiate a forecast.
    - id: vaccine-type-and-forecast-initiation--s3
      text: If needed to support legacy systems, IIS SHOULD include the legacy LOINC 30979-9 (Vaccines Due Next) after LOINC 30956-7 (Vaccine Type).
    - id: vaccine-type-and-forecast-initiation--s4
      text: For LOINC 30956-7, CVX SHALL be used in OBX-5, selecting the CVX most appropriate for the antigen indicated by the CDS engine (commonly an Unspecified Formulation CVX).
    - id: vaccine-type-and-forecast-initiation--s5
      text: The CVX chosen SHOULD align with the CDS engine's forecasting logic.
status-in-immunization-series:
  next: 6
  statements:
    - id: status-in-immunization-series--s1
      text: Status SHALL be returned for every forecasted series.
    - id: status-in-immunization-series--s2
      text: Enough information SHALL be encoded to distinguish at least "complete" from "another dose due."
    - id: status-in-immunization-series--s3
      text: LOINC Answer codes SHOULD be returned for interoperable interpretation. See Chapter 7 (Section 7.1.7, co-constraint table) for the authoritative LOINC Answer codes.
    - id: status-in-immunization-series--s4
      text: One or more local codes MAY be returned in addition to the LOINC code.
    - id: status-in-immunization-series--s5
      text: When both are returned, the LOINC concept SHOULD be returned first, followed by the local concept.
reasons-for-recommendation:
  next: 3
  statements:
    - id: reasons-for-recommendation--s1
      text: One or more reasons for recommendation MAY be returned.
    - id: reasons-for-recommendation--s2
      text: When multiple reasons exist, each SHALL be sent in a separate OBX.
dose-timing-earliest-recommended-overdue-latest:
  next: 5
  statements:
    - id: dose-timing-earliest-recommended-overdue-latest--s1
      text: An earliest date SHALL be returned when another dose is indicated.
    - id: dose-timing-earliest-recommended-overdue-latest--s2
      text: A recommended date SHALL be returned when another dose is indicated.
    - id: dose-timing-earliest-recommended-overdue-latest--s3
      text: An overdue date MAY be returned; interpretation depends on local CDS/jurisdictional definitions and should be discussed with the registry when interpretation matters.
    - id: dose-timing-earliest-recommended-overdue-latest--s4
      text: A latest date MAY be returned; for vaccines that define a maximum age (for example, rotavirus), the latest date may be authoritative, while for others it may have limited applicability.
additional-optional-forecast-details:
  next: 5
  statements:
    - id: additional-optional-forecast-details--s1
      text: The IIS MAY return series name.
    - id: additional-optional-forecast-details--s2
      text: The IIS MAY return total number of doses in series.
    - id: additional-optional-forecast-details--s3
      text: The IIS MAY return dose number for the next event.
    - id: additional-optional-forecast-details--s4
      text: The IIS MAY return the schedule used, with the understanding that it has limited reliability.
preferred-and-contraindicated-vaccine-types:
  next: 5
  statements:
    - id: preferred-and-contraindicated-vaccine-types--s1
      text: MAY return preferred vaccine type using LOINC 93123-8. This OBX MAY be repeated if multiple preferred products exist. Preferred vaccine type SHOULD NOT be used to indicate a specific vaccination when any vaccine in the group would be equally appropriate.
    - id: preferred-and-contraindicated-vaccine-types--s2
      text: MAY return contraindicated vaccine type using LOINC 93122-0. This OBX MAY be repeated to list multiple contraindicated products.
    - id: preferred-and-contraindicated-vaccine-types--s3
      text: SHALL populate OBX-5 with the appropriate CVX (antigen or product) when returning preferred or contraindicated vaccine types.
    - id: preferred-and-contraindicated-vaccine-types--s4
      text: SHOULD ensure any product-specific guidance is consistent with the registry's CDS forecasting logic and documented in the Local IG.
non-administration-concepts:
  next: 1
  statements: []
conceptual-model:
  next: 1
  statements: []
patient-level-observations:
  next: 1
  statements: []
dose-level-non-administration:
  next: 1
  statements: []
scope-of-support-in-this-guide:
  next: 3
  statements:
    - id: scope-of-support-in-this-guide--s1
      text: Submitting systems MAY report that a vaccine was not administered; a VXU may contain zero administered vaccinations and may consist solely of non-administration concepts.
    - id: scope-of-support-in-this-guide--s2
      text: IIS SHOULD extract and store patient-level observations whenever they appear in the message, regardless of whether they are transmitted inside an administered RXA or a non-administration RXA.
terminology-clarification:
  next: 1
  statements: []
storage-and-processing-expectations:
  next: 4
  statements:
    - id: storage-and-processing-expectations--s1
      text: IIS MAY store conditions, refusals, immunity, or adverse events according to local policy.
    - id: storage-and-processing-expectations--s2
      text: IIS MAY ignore any or all non-administration concepts without error.
    - id: storage-and-processing-expectations--s3
      text: IIS SHOULD continue processing supported vaccination data in the same message even when unsupported non-administration data is present.
representation-overview:
  next: 4
  statements:
    - id: representation-overview--s1
      text: Submitting systems MAY report dose-level non-administration, but IIS are not required to store or interpret the non-administration event.
    - id: representation-overview--s2
      text: IIS SHALL NOT reject a message solely because non-administration concepts are unsupported.
    - id: representation-overview--s3
      text: IIS SHALL continue processing valid vaccination data in the same message even when non-administration data is ignored.
conditions-contraindications-precautions-and-indications:
  next: 1
  statements: []
patient-level-conditions:
  next: 1
  statements: []
hl7-v2-representation:
  next: 3
  statements:
    - id: hl7-v2-representation--s1
      text: OBX-5 SHALL contain a SNOMED CT code from the PHVS_VaccinationContraindication_IIS value set
    - id: hl7-v2-representation--s2
      text: Multiple conditions SHALL be sent as separate OBX segments within the same ORC/RXA group.
date-semantics:
  next: 7
  statements:
    - id: date-semantics--s1
      text: Submitting systems SHALL report patient-level conditions using OBX segments within an ORC/RXA group indicating no vaccination was administered.
    - id: date-semantics--s2
      text: Submitting systems SHALL include LOINC 30945-0 with a valid SNOMED CT value to convey a condition.
    - id: date-semantics--s3
      text: Submitting systems MAY include effective and expiration date observations when applicable.
    - id: date-semantics--s4
      text: IIS SHALL treat reported conditions as patient-level observations, not as vaccination events.
    - id: date-semantics--s5
      text: IIS SHALL NOT infer dose-level non-administration semantics from the presence of a condition.
    - id: date-semantics--s6
      text: IIS SHALL NOT reject a message solely because condition data is unsupported or not stored.
scope-and-limitations:
  next: 1
  statements: []
refusal:
  next: 1
  statements: []
defining-a-refusal:
  next: 3
  statements:
    - id: defining-a-refusal--s1
      text: Systems SHALL record a refusal only when the vaccine was due and the patient or guardian declined administration.
    - id: defining-a-refusal--s2
      text: Systems SHALL NOT record refusals for cases of missed appointments, vaccine shortage, contraindications, or shared decision-making not to vaccinate.
required-data-elements:
  next: 1
  statements: []
storage-and-use-in-iis:
  next: 5
  statements:
    - id: storage-and-use-in-iis--s1
      text: IIS MAY store refusal data only for internal tracking and reporting of declination rates.
    - id: storage-and-use-in-iis--s2
      text: IIS SHALL NOT use refusal data to alter forecast logic or CDS outcomes.
    - id: storage-and-use-in-iis--s3
      text: IIS SHOULD NOT include refusals in the displayed or transmitted immunization history.
    - id: storage-and-use-in-iis--s4
      text: IIS SHOULD treat refusals as immutable; no mechanism is defined to allow for updates or deletes.
query-and-response-behavior:
  next: 3
  statements:
    - id: query-and-response-behavior--s1
      text: IIS SHOULD NOT return refusal records in query (RSP) responses.
    - id: query-and-response-behavior--s2
      text: Querying systems SHALL NOT expect refusals to be returned.
documented-immunity:
  next: 1
  statements: []
types-of-immunity-evidence:
  next: 5
  statements:
    - id: types-of-immunity-evidence--s1
      text: Submitting systems MAY send history of disease or serological immunity evidence.
    - id: types-of-immunity-evidence--s2
      text: IIS MAY store history of disease or serological immunity evidence.
    - id: types-of-immunity-evidence--s3
      text: IIS SHALL NOT reject a message solely because immunity information is included.
    - id: types-of-immunity-evidence--s4
      text: If an IIS cannot store immunity information, it MAY issue an informational message but SHALL continue normal processing.
use-of-immunity-information-in-forecasting:
  next: 5
  statements:
    - id: use-of-immunity-information-in-forecasting--s1
      text: IIS MAY use immunity information when generating recommendations.
    - id: use-of-immunity-information-in-forecasting--s2
      text: Submitting systems SHALL NOT assume immunity information will affect recommendations.
    - id: use-of-immunity-information-in-forecasting--s3
      text: IIS that use immunity information for recommendations SHOULD return the relevant observations in the response to maintain transparency.
    - id: use-of-immunity-information-in-forecasting--s4
      text: IIS SHALL accept immunity information even if they do not currently use it for recommendations.
coding-and-terminology:
  next: 4
  statements:
    - id: coding-and-terminology--s1
      text: Submitting systems MAY use locally extended codes when permitted by the IIS.
    - id: coding-and-terminology--s2
      text: IIS MAY accept locally extended codes beyond those listed in this guide.
    - id: coding-and-terminology--s3
      text: IIS and submitting systems SHALL coordinate the use of any locally extended codes.
clinical-interpretation-and-validation:
  next: 1
  statements: []
storage-multiplicity-and-lifecycle-management:
  next: 4
  statements:
    - id: storage-multiplicity-and-lifecycle-management--s1
      text: IIS MAY store or ignore immunity observations.
    - id: storage-multiplicity-and-lifecycle-management--s2
      text: IIS SHALL process messages normally even if they ignore immunity observations.
    - id: storage-multiplicity-and-lifecycle-management--s3
      text: IIS MAY store multiple immunity observations for the same disease.
relationship-to-administered-vaccinations:
  next: 1
  statements: []
submission-across-jurisdictions:
  next: 1
  statements: []
adverse-event:
  next: 1
  statements: []
adverse-events-associated-with-a-specific-vaccination:
  next: 11
  statements:
    - id: adverse-events-associated-with-a-specific-vaccination--s1
      text: Submitting systems MAY submit adverse events with any immunization.
    - id: adverse-events-associated-with-a-specific-vaccination--s2
      text: IIS MAY accept and store adverse events with any immunizations
    - id: adverse-events-associated-with-a-specific-vaccination--s3
      text: Submitting systems SHALL represent each reported reaction as a separate observation.
    - id: adverse-events-associated-with-a-specific-vaccination--s4
      text: If IIS do not store associated adverse events the IIS SHOULD return an informational message indicating they are not stored.
    - id: adverse-events-associated-with-a-specific-vaccination--s5
      text: If IIS store adverse event information associated with an immunization, IIS SHOULD return that information in query responses for patient-safety purposes.
    - id: adverse-events-associated-with-a-specific-vaccination--s6
      text: Submitting systems MAY report reactions not associated with a specific vaccination.
    - id: adverse-events-associated-with-a-specific-vaccination--s7
      text: Submitting systems SHALL represent each reported reaction as a separate observation.
    - id: adverse-events-associated-with-a-specific-vaccination--s8
      text: IIS MAY store patient-level reactions.
    - id: adverse-events-associated-with-a-specific-vaccination--s9
      text: If IIS do not store adverse events, the IIS SHOULD return an informational message indicating they are not stored.
    - id: adverse-events-associated-with-a-specific-vaccination--s10
      text: IIS SHOULD return patient-level reactions in query responses for patient-safety purposes, if known.
interpretation-and-use-of-reported-reactions:
  next: 2
  statements:
    - id: interpretation-and-use-of-reported-reactions--s1
      text: IIS MAY use reported reactions in evaluation or recommendation logic according to local policy.
