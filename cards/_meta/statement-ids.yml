  next: 1
  statements: []
role-of-certification-in-immunization-messaging:
  next: 3
  statements:
    - id: role-of-certification-in-immunization-messaging--s1
      text: Certification of functions or capabilities SHALL NOT be interpreted as evidence that all production messages fully conform to this guide.
    - id: role-of-certification-in-immunization-messaging--s2
      text: IIS and submitting systems SHOULD implement post-certification monitoring and conformance assessment processes to evaluate ongoing data quality and to detect production-level nonconformance.
relationship-to-onc-certification-regulations:
  next: 1
  statements: []
conformance-tooling-and-standards-and-interoperability-testing-tools:
  next: 4
  statements:
    - id: conformance-tooling-and-standards-and-interoperability-testing-tools--s1
      text: Systems claiming conformance SHALL be capable of producing messages that meet context-based test scenarios defined for certification, including population of RE fields when data is known.
    - id: conformance-tooling-and-standards-and-interoperability-testing-tools--s2
      text: IIS and submitting systems SHOULD use SITT or equivalent validation mechanisms during onboarding and regression testing.
    - id: conformance-tooling-and-standards-and-interoperability-testing-tools--s3
      text: Context-free validation results SHALL NOT be treated as the sole measure of conformance to this guide.
operational-enforcement-and-ongoing-compliance:
  next: 3
  statements:
    - id: operational-enforcement-and-ongoing-compliance--s1
      text: IIS SHALL be capable of monitoring submission data to assess compliance with required and required but may be empty elements over time.
    - id: operational-enforcement-and-ongoing-compliance--s2
      text: IIS SHOULD establish thresholds or metrics to identify systematic non-conformance by submitting systems.
handling-imperfect-and-incomplete-data:
  next: 4
  statements:
    - id: handling-imperfect-and-incomplete-data--s1
      text: Receiving systems SHOULD accept and store data that is incomplete but operationally useful, unless prohibited by local policy.
    - id: handling-imperfect-and-incomplete-data--s2
      text: Receiving systems SHALL NOT use this guide as the sole basis for rejecting data when doing so would result in unnecessary data loss.
    - id: handling-imperfect-and-incomplete-data--s3
      text: Receiving systems SHOULD distinguish between message structure compliance, system capability, and data correctness when assessing conformance.
certification-as-a-baseline-not-an-endpoint:
  next: 1
  statements: []
