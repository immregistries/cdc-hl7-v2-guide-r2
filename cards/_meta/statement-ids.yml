local-implementation-guide-creation-and-conformance:
  next: 1
  statements: []
relationship-between-the-national-ig-and-local-igs:
  next: 5
  statements:
    - id: relationship-between-the-national-ig-and-local-igs--s1
      text: Local IGs SHALL be derived from the National IG and identify all jurisdiction-specific constraints.
    - id: relationship-between-the-national-ig-and-local-igs--s2
      text: Local IGs MAY introduce local requirements that differ from the National IG for policy, legal, or operational reasons.
    - id: relationship-between-the-national-ig-and-local-igs--s3
      text: Local IGs SHALL NOT represent themselves as conformant with the National IG if they introduce requirements that contradict National IG behavior.
    - id: relationship-between-the-national-ig-and-local-igs--s4
      text: When a local IG contradicts the National IG, the jurisdiction SHALL clearly state that the local specification does not conform to the National IG and identify the areas of divergence.
contradiction-vs-constraint:
  next: 4
  statements:
    - id: contradiction-vs-constraint--s1
      text: Local constraints SHOULD be designed to remain compliant with National IG behavior whenever possible.
    - id: contradiction-vs-constraint--s2
      text: Requirements that prohibit, redefine, or invert National IG behavior SHALL be treated as contradictions, not extensions.
    - id: contradiction-vs-constraint--s3
      text: Jurisdictions SHALL avoid introducing contradictory requirements unless compelled by law or policy, and SHALL document that justification explicitly.
claiming-conformance-to-the-national-ig:
  next: 5
  statements:
    - id: claiming-conformance-to-the-national-ig--s1
      text: A jurisdiction SHALL claim conformance to the National IG only if its Local IG does not contradict National IG requirements.
    - id: claiming-conformance-to-the-national-ig--s2
      text: 'Jurisdictions SHOULD distinguish clearly between these statements when publishing local guidance:'
    - id: claiming-conformance-to-the-national-ig--s3
      text: '"Based on the National IG with jurisdiction-specific differences": used when the Local IG includes documented differences, whether constraints or contradictions. When using this label, the jurisdiction SHALL indicate for each difference whether it is a compliant constraint or a contradiction that affects interoperability.'
    - id: claiming-conformance-to-the-national-ig--s4
      text: Jurisdictions SHALL NOT imply national endorsement or standard compliance when local requirements require non-standard behavior from submitting systems.
transparency-as-a-community-obligation:
  next: 4
  statements:
    - id: transparency-as-a-community-obligation--s1
      text: Local IGs SHALL clearly document all changes from the National IG.
    - id: transparency-as-a-community-obligation--s2
      text: Jurisdictions SHOULD coordinate with AIRA and CDC when local requirements create widespread interoperability impact.
    - id: transparency-as-a-community-obligation--s3
      text: Local IGs SHALL reflect current, enforceable behavior rather than aspirational or future-state requirements.
