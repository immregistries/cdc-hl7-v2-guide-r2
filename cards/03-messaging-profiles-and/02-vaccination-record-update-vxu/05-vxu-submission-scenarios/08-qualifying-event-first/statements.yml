- id: qualifying-event-first-submission-for-a-patient--s1
  verb: MAY
  actor: Submitting system
  text: A submitting system MAY trigger a VXU containing the patient's complete immunization history upon first submission.
- id: qualifying-event-first-submission-for-a-patient--s2
