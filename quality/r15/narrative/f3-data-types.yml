items:
  - id: r15-f-dt-01
    section: ST - String; FT - Formatted Text
    page: 50, 57
    r15: >-
      String data is printable ASCII (decimal 32 to 126), with no leading blanks. The only escape sequences allowed are
      those for the message delimiters.
    result: changed
    guide: [special-characters--s1, special-characters--s2, special-characters--s4]
    note: >-
      The new guide requires support for 18 accented Latin characters in names (preserved or transliterated), and an IIS
      SHALL NOT reject a message because of them. That goes beyond printable ASCII. The escape-sequence limit is not
      repeated.
    recommendation: >-
      Say which character encoding carries the accented characters (MSH-18 is not discussed), and whether the
      delimiter-only escape rule still holds.

  - id: r15-f-dt-02
    section: HD - Hierarchic Designator
    page: 50-51
    r15: >-
      The use of OIDs in HD fields is encouraged; either the namespace ID (HD.1) or the universal ID (HD.2, an OID) is
      required.
    result: changed
    guide: [organization-identifier-data-types, assigning-authority-and-identifier-namespace]
    note: >-
      For organization fields (MSH-4, MSH-22, RXA-11.4) the new guide standardizes on an IIS-defined identifier in HD.1;
      OIDs and other national identifiers are left for the future, not encouraged.

  - id: r15-f-dt-03
    section: CE - Coded Element
    page: 37-38
    verb: should
    r15: >-
      The alternate identifier should be the closest match to the first. The order of the two triplets is not specified;
      the first triplet is no longer reserved for CVX in RXA-5.
    result: dropped
    guide: [accepted-code-systems-for-administered-vaccinations--s6]
    note: >-
      The new guide requires IIS to accept CVX or NDC alone and to check that the two agree when both are sent, but does
      not say that either code may be in either triplet.
    recommendation: State in 4.6.2.4 that CVX and NDC may appear in either CE triplet of RXA-5 and receivers check both.
