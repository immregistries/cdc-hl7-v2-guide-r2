# Field notes, pass 2: the usage notes and component definitions in the 2018 data type chapter (chapter 4). Same rules
# and `read` counts as f1-z22-segments.yml, counted per data type.

chapter: "4 (fields)"
title: "Field notes: data types"
pages: 35-74
reviewed: 2026-11-17
against: narrative draft of 4 Nov 2026
summary: >-
  The data type notes are almost all format, now carried by the profiles' data types and flavors. Three add guidance:
  string fields were limited to printable ASCII, which the new guide's accented-character requirement reverses; OIDs
  were encouraged in HD, where the new guide puts an IIS-defined identifier in HD.1; and the order of CE triplets was
  explicitly unspecified (CVX no longer had to come first in RXA-5), which the new guide does not repeat.
