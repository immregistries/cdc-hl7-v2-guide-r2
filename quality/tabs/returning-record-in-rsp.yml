# Comparison: TAB "Returning IIS Patient Immunization Record Information in a Z32 and Z42 RSP" (January 2024) and this
# guide. Fields: see ack-messaging.yml.

tab: returning-record-in-rsp
reviewed: 2026-11-16
against: narrative draft of 4 Nov 2026 and IGAMT export of 6 Nov 2026
summary: >-
  This TAB says what an IIS returns in a Z32 or Z42 for a single match (Table 1) and updates the Z32 and Z42 usage of PD1,
  NK1, and several PID, RXA, and ORC fields (Tables 2 and 3). The guide covers the general principles (complete,
  unfiltered history; return only what supports confirmation; protected patients get a Z33), but not the TAB's list. It
  contradicts the TAB on refusals (SHOULD NOT return, where the TAB says SHOULD), and leaves out the SHALL NOT for deleted
  immunizations, RXA-20 and RXA-21 'A' as required, and the CP/PA rule for the vaccination event fields. In IGAMT, the
  Z32 and Z42 profiles still have the usages the TAB replaced.

items:
  # ---------------------------------------------------------------- Table 1: what to return
  - id: tab-rr-01
    section: "Table 1: Patient types"
    page: 3
    verb: SHALL, MAY
    tab: >-
      A patient who is not protected (PD1-12 not 'Y') SHALL be returned; a protected patient is returned as a Z33. A
      deceased patient MAY be returned.
    result: partial
    guide: [z33-return-a-response-with-no-person-records, consent-and-privacy, z32-return-complete-immunization-history]
    note: >-
      The guide says a Z33 is returned when a record "cannot be disclosed due to consent or sharing restrictions", and that
      PD1-12 affects responses, but does not tie the Z33 to PD1-12 = 'Y' or say whether a deceased patient is returned.
    severity: note
    owner: narrative
    recommendation: State in 3.5.2.4 that a patient with PD1-12 'Y' is returned as a Z33, and that a deceased patient MAY be returned.

  - id: tab-rr-02
    section: "Table 1: Immunization types (completed, partially administered)"
    page: 3
    verb: SHALL, SHOULD
    tab: Completed immunizations ('CP') SHALL be returned; partially administered immunizations ('PA') SHOULD be returned.
    result: partial
    guide: [overall-structure-of-cds-in-the-rsp--s3, z32-return-complete-immunization-history]
    note: >-
      Covered in substance by "Vaccination history order groups SHALL be complete and unfiltered" and the Z32 description,
      but partially administered doses are not mentioned.
    severity: note
    owner: narrative
    recommendation: Add the TAB's two statements to 3.5.2.2 (Z32) and 3.5.2.5 (Z42).

  - id: tab-rr-03
    section: "Table 1: Immunization types (refused)"
    page: 3
    verb: SHOULD
    tab: Refused immunizations ('RE') SHOULD be returned.
    result: conflict
    guide: [query-and-response-behavior--s1, query-and-response-behavior--s2]
    note: >-
      The guide says "IIS SHOULD NOT return refusal records in query (RSP) responses" and "Querying systems SHALL NOT expect
      refusals to be returned", because refusals "have no role in clinical query/response exchanges". The TAB says the
      opposite. (The CDS in RSP Alignment TAB also lists refusals among the non-CDS order groups that follow the history.)
    severity: issue
    owner: decision
    recommendation: >-
      CDC and SISC decide. If the guide's position stands, it changes a published TAB and should say so; otherwise change
      4.8.7.4 to the TAB's SHOULD.

  - id: tab-rr-04
    section: "Table 1: Immunization types (deleted)"
    page: 3
    verb: SHALL NOT
    tab: Deleted immunizations (processed with action code 'D') SHALL NOT be returned.
    result: missing
    guide: [vaccinations-returned-in-query-responses-rsp, vaccination-record-identity-and-orc-3]
    note: The guide does not say that deleted immunizations are excluded from a response.
    severity: warning
    owner: narrative
    recommendation: Add "IIS SHALL NOT return deleted immunizations" to 4.6.2.6 or 3.5.2.

  - id: tab-rr-05
    section: "Table 1: Observations associated with an immunization"
    page: 3-4
    verb: MAY
    tab: >-
      Funding program eligibility and funding source, VIS information, and an adverse reaction tied to a specific
      administration MAY be returned.
    result: reworded
    guide: [adverse-events-associated-with-a-specific-vaccination--s5]
    note: >-
      The guide says IIS that store an adverse event tied to an immunization SHOULD return it, stronger than the TAB's MAY.
      It does not address returning eligibility, funding, or VIS (4.4.2.6 only mentions that they can appear in an RSP).
    severity: note
    owner: decision
    recommendation: Confirm the SHOULD for adverse events, and add MAY statements for eligibility, funding, and VIS in responses.

  - id: tab-rr-06
    section: "Table 1: Observations associated with a patient"
    page: 4
    verb: SHOULD, MAY
    tab: >-
      Contraindications (vaccine-specific, and not vaccine-specific with product '998'), disease with serological evidence
      of immunity (75505-8), and disease with presumed immunity (59784-9) SHOULD be returned. An adverse reaction not tied
      to an administration MAY be returned.
    result: partial
    guide:
      - use-of-immunity-information-in-forecasting--s3
      - adverse-events-associated-with-a-specific-vaccination--s10
      - overall-structure-of-cds-in-the-rsp
    note: >-
      The guide says IIS that use immunity information for recommendations SHOULD return it, which is narrower than the
      TAB, and has no statement about returning contraindications. It makes returning patient-level reactions a SHOULD
      where the TAB says MAY.
    severity: warning
    owner: narrative
    recommendation: Add the TAB's SHOULD for contraindications and both immunity observations to 3.5.2 or 4.8.

  - id: tab-rr-07
    section: "Table 1: Clinical decision support"
    page: 4
    verb: MAY, SHALL
    tab: Evaluated history and forecast MAY be returned in a Z32 and SHALL be returned in a Z42.
    result: partial
    guide: [z42-return-evaluated-immunization-history-and-forecast, z32-return-complete-immunization-history]
    note: The same gap as the CDS in RSP Alignment comparison (tab-cds-01), which carries the finding.
    severity: note
    owner: narrative

  # ---------------------------------------------------------------- Tables 2 and 3: usage in Z32 and Z42
  - id: tab-rr-08
    section: "Table 3: PID fields"
    page: 5
    verb: SHOULD NOT, MAY
    tab: >-
      In Z32 and Z42: mother's maiden name (PID-6) SHOULD NOT be returned; race (PID-10), address (PID-11), phone
      (PID-13), and ethnic group (PID-22) MAY be returned. PD1 and NK1 MAY be returned (Table 2).
    result: prose
    guide: [information-disclosure-constraints, omb-2024-directive-and-forward-compatibility]
    note: >-
      The guide's disclosure section makes the same point (return only what supports confirmation; mother's maiden name may
      be used for matching but withheld), with no statements. It does not mention PD1 or NK1 in responses.
    owner: narrative
    recommendation: Add the TAB's field list to 3.5.3 as statements.

  - id: tab-rr-09
    section: "Table 3: RXA-9, RXA-20, RXA-21"
    page: 5
    verb: MAY, SHALL
    tab: >-
      RXA-9 (immunization information source) MAY be returned. RXA-20 (completion status) SHALL be returned. RXA-21 (action
      code) SHALL be returned, as 'A'.
    result: partial
    guide: [use-of-administered-vs-historical-on-output]
    note: >-
      RXA-9 is covered (the guide prefers it empty in responses, which the TAB allows). Nothing says RXA-20 and RXA-21 are
      required in responses, or that RXA-21 is 'A'.
    severity: warning
    owner: narrative
    recommendation: >-
      Add to 4.6.2.6: "In an RSP, RXA-20 SHALL be populated, and RXA-21 SHALL be 'A'."

  - id: tab-rr-10
    section: "Table 3: vaccination event fields"
    page: 5-6
    verb: SHALL, SHALL NOT
    tab: >-
      Administering provider (RXA-10), administered-at location (RXA-11), lot number (RXA-15), expiration date (RXA-16),
      manufacturer (RXA-17), and ordering provider (ORC-12): when RXA-20 is 'CP' or 'PA', SHALL be returned if known; when
      it is not, SHALL NOT be returned.
    result: missing
    guide: [vaccinations-returned-in-query-responses-rsp]
    note: The guide does not say which vaccination event details are returned, or that they are left out for other completion statuses.
    severity: warning
    owner: narrative
    recommendation: Add the TAB's rule to 4.6.2.6.

  - id: tab-rr-11
    section: Tables 2 and 3 compared with IGAMT
    page: 4-6
    tab: The updated Z32 and Z42 usages in Tables 2 and 3.
    result: conflict
    guide: [response-rsp-profiles]
    note: >-
      The IGAMT Z32 and Z42 profiles still have the usages the TAB replaced (its "National IG Usage" columns). Z32: PD1 and
      NK1 RE (TAB O); PID-6, PID-10, PID-13, PID-22 RE (TAB O, PID-6 SHOULD NOT); PID-11 RE in both (TAB O); RXA-9 R for
      CP/PA (TAB O; see also qf-igamt-rxa9-rsp); RXA-20 RE (TAB R); RXA-21 O (TAB R, 'A'); RXA-10 and RXA-15 to RXA-17 and
      ORC-12 conditional on RXA-9 = '00' (TAB RE for CP/PA, X otherwise). Z42 has no PD1 or NK1 at all, and the same RXA
      differences.
    severity: issue
    owner: igamt
    recommendation: Apply Tables 2 and 3 to PID_IZ01/IZ02, RXA_IZ02/IZ03, ORC_IZ01/IZ02, and the Z32 and Z42 message structures.

  # ---------------------------------------------------------------- implications
  - id: tab-rr-12
    section: Implications; Table 4
    page: 6-7
    tab: >-
      IIS are not repositories of current identifying information, so jurisdictions choose which demographics to return.
      Immunization history is expected to be returned. Table 4: what each conformance verb means for the IIS (SHALL means
      the IIS must have the information to return) and for the querying system (it may depend only on SHALL items).
    result: partial
    guide: [information-disclosure-constraints]
    note: The first point is covered well. Table 4's reading of the verbs for responses (what a querying system can depend on) is not in the guide.
    severity: note
    owner: narrative
    recommendation: Add Table 4, or a sentence on what querying systems can rely on, to 3.5.3.
