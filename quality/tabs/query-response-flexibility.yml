# Comparison: TAB "Query Response Flexibility: Z31 Response for Z34 and Z44 Queries" (January 2024) and this guide.
# Fields: see ack-messaging.yml.

tab: query-response-flexibility
reviewed: 2026-11-17
against: narrative draft of 4 Nov 2026 and IGAMT export of 6 Nov 2026
summary: >-
  The guide adopts this TAB: section 3.5.2.3 says a Z31 MAY be returned for either a Z34 or a Z44 query, and leaves
  whether to return candidates to IIS policy. Two gaps: the TAB's one SHALL, that querying systems be prepared to receive a
  Z31 for either query, is not stated; and the IGAMT Z31 profile still requires QPD-1 to be Z34, so a Z31 answering a Z44
  query fails validation.

items:
  - id: tab-qrf-01
    section: Executive Summary; MAY requirements
    page: 1
    verb: MAY
    tab: A Z31 RSP MAY be returned in response to a Z44 QBP, as well as to a Z34 QBP.
    result: covered
    guide: [z31-return-a-list-of-candidates--s1, selecting-a-candidate-match--s1]

  - id: tab-qrf-02
    section: SHALL requirements
    page: 1
    verb: SHALL
    tab: The querying system SHALL be prepared to receive a Z31 response to either a Z34 or a Z44 query.
    result: missing
    guide: [z31-return-a-list-of-candidates, selecting-a-candidate-match, unified-z34-and-z44-profile-model]
    note: >-
      The guide tells querying systems how to re-query after a user selects a candidate, but does not require them to
      accept a Z31 for a Z44 query. A system built to the earlier guide, where a Z44 could not get a Z31, may not.
    severity: warning
    owner: narrative
    recommendation: >-
      Add to 3.5.2.3: "Querying systems SHALL be prepared to receive a Z31 response to either a Z34 or a Z44 query."

  - id: tab-qrf-03
    section: MAY requirements; Out of scope
    page: 1
    verb: MAY
    tab: >-
      IIS that already return a Z31 for both queries MAY continue; IIS that return one only for a Z34 MAY also return one
      for a Z44; IIS that do not return a Z31 for a Z34 MAY also not return one for a Z44. Whether an IIS returns a Z31, and
      what it contains, is IIS policy.
    result: covered
    guide: [z31-return-a-list-of-candidates--s1, z31-return-a-list-of-candidates]
    note: The guide says a Z31 is returned when "IIS policy allows limited identifying information for those candidates to be returned".

  - id: tab-qrf-04
    section: Z31 compared with IGAMT
    page: 1
    tab: A Z31 MAY answer a Z44 query.
    result: conflict
    guide: [z31-return-a-list-of-candidates--s1, response-rsp-profiles]
    note: >-
      The IGAMT Z31 profile has IZ-67a ("QPD-1.1 shall contain the value 'Z34'") and IZ-67b (QPD-1.2 "Request Immunization
      History"). The RSP echoes the query's QPD, so a Z31 answering a Z44 fails validation. The Z33 profile already allows
      either query (IZ-71a and IZ-71b).
    severity: issue
    owner: igamt
    recommendation: Replace IZ-67a and IZ-67b in the Z31 profile with the Z34-or-Z44 constraints used in Z33 (IZ-71a, IZ-71b).

  - id: tab-qrf-05
    section: Background
    page: 1
    tab: The earlier guide named the Z31 only as a response to a Z34.
    result: partial
    guide: [purpose-and-scope-of-rsp-profiles, rsp-response-profiles]
    note: >-
      Section 3.5.1 says RSP content "SHALL be consistent with the profile requested (Z34 or Z44)" and names only Z32 and
      Z42 as defaults, without saying which responses each query can receive.
    severity: note
    owner: narrative
    recommendation: Add a short table to 3.5.1 or 3.5.2 of the responses each query can receive (Z34 → Z31, Z32, Z33; Z44 → Z31, Z33, Z42).
