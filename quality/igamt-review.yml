# Reviewed narrative ↔ IGAMT findings (tools/compare_structure.py).
#
# Each entry is a judgement made by a reviewer with the evidence in hand. The
# automated checks find mechanical problems; these entries cover what needs
# reading: a requirement in the text that the profiles contradict, a rule the
# profiles enforce that the text never states, or a confirmation that the two agree.
#
# Fields:
#   id            stable finding ID (qf-igamt-...); never reuse
#   kind          conflict | gap | xml-defect | narrative-defect | question | confirmed
#   severity      issue | warning | note   (confirmed entries are not shown as findings)
#   owner         narrative | igamt | both | decision  (who acts; decision = CDC chooses)
#   comment       number of the Word review comment this answers, if any
#   card          card the finding attaches to; location: statement or figure ID
#   title         one line
#   summary       what is wrong, in plain language
#   narrative     what the text says (quoted or paraphrased)
#   xml           what the IGAMT export says (list)
#   recommendation
#
# Reviewed against: narrative draft 2026-11-04; IGAMT export 2026-11-06.

# ------------------------------------------------------------------ answers to the Word review comments

- id: qf-igamt-c36-name-flavors
  kind: conflict
  severity: issue
  owner: igamt
  comment: 36
  card: data-type-and-structure
  title: "Newborn ('NB') names are not held to the family-and-given rule, and other names are over-constrained when an 'L' name is present"
  summary: >-
    The profiles implement the two XPN flavors by slicing the whole PID segment on PID-5.7, not by name
    repetition. If any repetition is 'L', every repetition (nickname, maiden, and so on) must use XPN_IZ01 and
    have both family and given name. If no repetition is 'L', every repetition uses XPN_IZ02, where only one of
    family or given is needed, so an 'NB' placeholder name with one part passes. The two slice conditions also
    overlap: a patient with an 'L' and an 'N' name matches both. Slicing exists only in Z22; the response
    profiles (Z31, Z32) always use PID_IZ01 and Z42 uses PID_IZ02.
  narrative: >-
    "Official registry and newborn names must contain both a family and given name, while other types (e.g.,
    nickname, maiden) may have only one component." Word comment 36 asks to confirm three statements: (1)
    XPN.1 and XPN.2 populated for 'L' and 'NB' names; (2) XPN.7 populated for all repetitions; (3)
    cardinalities and flavors as defined in the data type section.
  xml:
    - "Slicing (Z22, PID): PID_IZ01 if at least one PID-5.7 = 'L'; PID_IZ03 if at least one PID-5.7 is not 'L'."
    - "PID_IZ01.PID-5 uses XPN_IZ01: XPN.1 R, XPN.2 R, XPN.7 R."
    - "PID_IZ03.PID-5 uses XPN_IZ02: XPN.1 C(R/RE) if XPN.2 not valued, XPN.2 RE, XPN.7 R."
    - "Z31/Z32 PID_IZ01 (XPN_IZ01) and Z42 PID_IZ02 are not sliced."
  recommendation: >-
    Statement (2) exists: XPN.7 is R in every PID-5 flavor. Statement (1) holds for 'L' only. Ask IGAMT whether
    a slice or co-constraint can apply per repetition (by XPN.7). If not, use a conformance statement such as
    "each PID-5 repetition with XPN.7 in ('L','NB') SHALL value XPN.1 and XPN.2". Make the two slice conditions
    mutually exclusive. Decide whether responses should follow the same rule. Statement (3) has no counterpart in
    the narrative yet; the card should state it once the data type pages exist.

