- id: qf-igamt-rxa9-rsp
  kind: conflict
  severity: issue
  owner: decision
  card: use-of-administered-vs-historical-on-output
  title: "Text says RSP should leave RXA-9 empty; Z32 and Z42 require RXA-9 for completed doses"
  summary: >-
    The narrative prefers an empty RXA-9 in responses. In Z32 and Z42, RXA-9 is conditional and becomes
    Required whenever RXA-20 is CP or PA, which is every administered or historical dose returned. An IIS that
    follows the preferred approach fails validation.
  narrative: "\"Leaving RXA-9 empty on outbound RSP messages SHOULD be the preferred approach.\""
  xml:
    - "Z32 RXA_IZ02 and Z42 RXA_IZ03, RXA-9: C(R/O), predicate: RXA-20 in ('CP','PA')."
  recommendation: >-
    CDC decides. Either change the response flavors to make RXA-9 O (or RE) in Z32/Z42, or replace the
    narrative's preference with what to send (for example, always '00' or '01').

- id: qf-igamt-rxa11-administered
  kind: conflict
  severity: warning
  owner: decision
  card: administering-organization-rxa-11
  location: administering-organization-rxa-11--s1
  title: "\"SHALL populate RXA-11\" for administered doses, but the administered flavor has RXA-11 as RE"
  summary: >-
    The narrative makes RXA-11 mandatory for administered vaccinations. In the administered flavor
    (RXA_IZ01_Adm) RXA-11 is RE, so a message without it passes validation. RXA-11.4 (Facility) is R within
    LA2_IZ01, which only applies when RXA-11 is sent.
  narrative: "\"For administered vaccinations, systems SHALL populate RXA-11 with the administering organization.\""
  xml:
    - "RXA_IZ01_Adm RXA-11: RE [0..1] LA2_IZ01; RXA_IZ01: C(RE/O) when RXA-20 in ('CP','PA') and RXA-9.1 = '00'."
    - "RXA_IZ01_His RXA-11: O (consistent with \"RXA-11 SHOULD be empty\" for historical doses)."
  recommendation: >-
    Make RXA-11 R in the administered flavor (and the RE side of the RXA_IZ01 predicate R), or soften the
    statement to SHOULD. With usage "R" now defined as "IIS reports an ERR if missing", R matches the intent.

- id: qf-igamt-pid7-time-zone
  kind: conflict
  severity: warning
  owner: both
  card: date-of-birth-pid-7
  location: date-of-birth-pid-7--s3
  title: "The text allows a time-zone offset in PID-7; the profiles reject one"
  summary: >-
    PID-7 uses TS_NZ, whose time pattern (DTM_NZ) has no offset, so a birth date/time with an offset fails
    format validation. The narrative tells senders to use the birth time zone and tells IIS to ignore any offset
    present. RXA-3 and OBX-14 also use TS_NZ. Their wording ("use the local time zone") is consistent if it
    means local time without an offset.
  narrative: >-
    "if it is included, PID-7 SHALL be encoded using the time zone where the birth occurred." "When time or
    time-zone components are present in PID-7, receiving IIS SHALL ignore the time and offset components …"
  xml:
    - "PID_IZ01/PID_IZ03 PID-7: R [1..1] TS_NZ; DTM_NZ pattern YYYYMMDD[HH[MM[SS[.S[S[S[S]]]]]]] (no offset)."
    - "Z42 PID_IZ02 PID-7 uses TS_IZ01 instead."
  recommendation: >-
    Say "local time of birth, without a time-zone offset" in the narrative. If offsets must be tolerated,
    loosen the flavor. Align Z42 with the other profiles.

