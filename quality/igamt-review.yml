  xml:
    - "Z22 no-vaccination table (RXA-20 NA, CVX 998, RXA-6 999): 31044-1, 75505-8, 59784-9, group 75323-6/85585-8/88878-4."
    - "Z22 contraindicated table (RXA-20 NA, CVX ≠ 998): group 30945-0/30946-8/30944-3/48767-8."
  recommendation: >-
    CDC decides which representation is current, then aligns sections 4.4.4.4 and 4.8.6, Figure 20, and the
    co-constraint tables.

- id: qf-igamt-contraindication-snomed
  kind: conflict
  severity: warning
  owner: both
  card: hl7-v2-representation
  location: hl7-v2-representation--s1
  title: "\"A SNOMED CT code from PHVS_VaccinationContraindication_IIS\", but 12 of the value set's 23 codes are not SNOMED CT"
  summary: >-
    The value set mixes 11 SNOMED CT codes with 12 CDC PHIN VS (CDCPHINVS) codes. A sender can use a
    CDCPHINVS code and pass validation while breaking the narrative's SHALL; or follow the narrative and be
    unable to express the concepts that only have CDCPHINVS codes.
  narrative: "\"OBX-5 SHALL contain a SNOMED CT code from the PHVS_VaccinationContraindication_IIS value set\""
  xml:
    - "PHVS_VaccinationContraindication_IIS: 23 codes; systems SCT (11), CDCPHINVS (12)."
  recommendation: "Say \"a code from the PHVS_VaccinationContraindication_IIS value set\", or update the value set to SNOMED CT only."

- id: qf-igamt-race-cdcrec
  kind: gap
  severity: warning
  owner: both
  card: value-sets-and-field-usage
  location: value-sets-and-field-usage--s1
  title: "\"Use the CDCREC value set\": the profiles bind category-only value sets, without MENA or the detailed codes"
  summary: >-
    The narrative talks about "the CDCREC value set", including detailed subcategories and Middle Eastern or
    North African (MENA) as a top-level race category. The profiles bind PID-10 to
    PHVS_RaceCategory_CDC_NullFlavor (6 OMB categories, Other Race, and three unknown codes) and PID-22 to
    PHVS_EthnicityGroup_CDC_Unk. Neither contains MENA or any detailed code. Both are Static/Open, so a validator
    would likely only warn, but readers cannot see what is allowed.
  narrative: >-
    "Race (PID-10) SHALL use the CDCREC value set." "IIS SHOULD support the MENA race code as a top-level
    category." "IIS SHALL accept additional valid CDCREC codes."
  xml:
    - "PID-10: PHVS_RaceCategory_CDC_NullFlavor (9 codes: 1002-5, 2028-9, 2054-5, 2076-8, 2106-3, 2131-1, ASKU, PHC1175, UNK); Static, Open."
    - "PID-22: PHVS_EthnicityGroup_CDC_Unk (5 codes); Static, Open."
  recommendation: >-
    Name the bound value sets in the narrative (or rename them in IGAMT). Decide whether MENA and the
    detailed CDCREC codes belong in the binding (Dynamic), and whether 2131-1 Other Race remains.

- id: qf-igamt-z42-unconditional
  kind: xml-defect
  severity: issue
  owner: igamt
  card: z42-return-evaluated-immunization-history-and-forecast
  title: "Z42's co-constraint table has no conditions, so every history dose needs a forecast group"
  summary: >-
    Z22 and Z32 select a co-constraint table by the kind of Order Segment Group (administered, refused, …). Z42
    has one unconditional table. Its "Immunization Forecast Results" group is R [1..*], so it applies to every
    ORC/RXA group in the response: each returned dose would need a forecast, and evaluation results are allowed
    in the forecast group. Z42 also has no rows for eligibility, funding, VIS, comments, or contraindications,
    which Z32 returns.
  narrative: >-
    4.7.8.1: "All forecast information SHALL be returned under a single ORC/RXA order group." 4.4.4.5 and
    4.4.4.6 separate "Immunization Event with Evaluation" from "Forecast".
  xml:
    - "Z42 OBX at HISTORY_FORECAST.HISTORY_FORECAST_OBSERVATION: one simple table; groups Immunization Evaluation Results S [0..*], Immunization Forecast Results R [1..*], Conditions: Patient Observations O [0..*]."
  recommendation: >-
    Make the Z42 tables conditional like Z32: evaluation for administered or historical doses (RXA-20 CP or
    PA), and forecast for the CVX 998 group. Add the event-level observations that Z32 allows.

