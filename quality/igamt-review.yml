- id: qf-igamt-c27-c28-ce-cwe
  kind: conflict
  severity: issue
  owner: both
  comment: 27
  card: obx-2-value-type
  title: "Co-constraints fix OBX-2 to one exact value, which contradicts \"accept both CE and CWE\" and \"responses SHOULD use CE\""
  summary: >-
    Every co-constraint row tests OBX-2 for an exact value (for example 'CE'). A submitter that sends CWE for a
    coded observation fails validation, although the narrative says systems SHALL accept both. Patient
    Condition (75323-6) is fixed to 'CWE' in Z22, Z32, and Z42, while every other coded observation is 'CE'. An
    IIS that follows the narrative's SHOULD (use CE in responses) fails Z32/Z42 validation for that observation.
    Free-text Comment (48767-8) is 'CE' in Z22 but 'ST' in Z32.
  narrative: >-
    "IIS responding to QBP SHOULD use CE when returning coded observations … Systems … SHALL accept both CE and
    CWE where a coded value is expected and SHALL process them equivalently." Comment 27: "Double-check that
    right data type is used in co-constraint tables"; comment 28: "Does this need to be reflected in the
    co-constraint tables?"
  xml:
    - "Co-constraint OBX-2 checks are PlainText equality (one value)."
    - "75323-6: OBX-2 = CWE in Z22 (three tables), Z32, Z42."
    - "48767-8: OBX-2 = CE in Z22 tables 1, 3, 4; ST in Z32 tables 2, 3, 4."
  recommendation: >-
    Yes, it needs to be reflected (comment 28). Allow both CE and CWE where the narrative says both are
    accepted (a value-set check on OBX-2 instead of exact text), or narrow the narrative. Set 48767-8 to a text
    type (ST or TX) in every profile. Decide whether 75323-6 should be CE like the rest.

- id: qf-igamt-c30-c31-figure-20
  kind: conflict
  severity: warning
  owner: both
  comment: 31
  card: order-segment-group-flavors
  title: "The Order Segment Group flavors (text and Figure 20) and the co-constraint tables do not match"
  summary: >-
    The flavor sections and Figure 20 list which observations belong in each Order Segment Group. The
    co-constraint tables allow more in some places and less in others. Main differences: serological immunity,
    history of disease, and patient condition are allowed in the administered and historical event groups (the
    text puts them only in Patient Observations). In Z32 they are allowed in every group. The contraindication
    set is required in Figure 20 but optional in the tables. Indication observations are missing from the
    historical-event table. Z32, the history-only response, has evaluation and forecast groups. Z42 has a single
    table with no conditions (see the Z42 finding). The cell-by-cell comparison is on the comparison page.
  narrative: >-
    Sections 4.4.4.1–4.4.4.6 and Figure 20. Comments 30 and 31: "Confirm that the co-constraint tables address
    this section"; "Make sure these are in alignment with the Co-constraint tables".
  xml:
    - "Z22 administered table: also allows 75505-8, 59784-9, 75323-6 group; 31044-1 appears twice."
    - "Z22 contraindicated table: contraindication group usage S [0..*]."
    - "Z32 table 5 (no condition) allows 31044-1, 75505-8, 59784-9, 75323-6 in every group."
    - "Z32 tables 1 and 2 contain Immunization Forecast Results and Immunization Evaluation Results groups."
  recommendation: >-
    Agree with CDC which is intended, then align both. The text and Figure 20 are the more restrictive and
    readable statement, so the tables probably need to change. Once aligned, generate the figure from the
    co-constraint tables so they cannot drift apart again.

- id: qf-igamt-c57-refusal-slice
  kind: gap
  severity: warning
  owner: narrative
  comment: 57
  card: required-data-elements
  title: "The refusal slice also requires RXA-6 = 999, which the refusal section does not list"
  summary: >-
    The Z22 slicing selects the refusal flavor (RXA_IZ01_Ref) only when RXA-20 = 'RE' and RXA-6 = '999', and
    constraint IZ-48 requires RXA-6 = 999 whenever RXA-20 = 'RE'. The refusal section's list of minimum elements
    leaves out RXA-6. A refusal sent with any other amount is not validated against the refusal flavor (so
    RXA-18 is not checked as required) and fails IZ-48. The same applies to contraindicated (NA, CVX ≠ 998) and
    no-vaccination (NA, CVX 998) groups, which both also select on RXA-6 = 999.
  narrative: >-
    "The minimum required elements are: ORC-3=9999 – Filler Order Number; RXA-3 …; RXA-5 …; RXA-18 – Reason
    for refusal; RXA-20 = 'RE'." Comment 57: "Double-check this is how the slicing logic is set up."
  xml:
    - "Slice RXA_IZ01_Ref: RXA-20 = 'RE' AND RXA-6 = '999'; RXA-18 R [1..*] in this flavor."
    - "IZ-48 (RXA_IZ01): if RXA-20 = 'RE' then RXA-6 SHALL be '999'."
    - "IZ-45 (Z22 message): if RXA-20 in ('NA','RE') then ORC-3.1 SHALL be '9999'."
  recommendation: >-
    The slicing is set up consistently with IZ-45 and IZ-48. Add "RXA-6 = 999 – Administered amount" to the
    refusal list, and state the RXA-6/ORC-3 values in the non-administration sections too. Consider whether
    the slice should key on RXA-20 alone, so that a wrong RXA-6 is reported by IZ-48 rather than silently
    changing which flavor applies.

- id: qf-igamt-c49-chapter-7
  kind: narrative-defect
  severity: note
  owner: narrative
  comment: 49
  card: funding-source-and-eligibility
  title: "References to Chapter 7 point to content that now comes from IGAMT, and use different section numbers"
  summary: >-
    Cards point to "HL7 field references", "Chapter 7 (OBX table)", "Section 7.1.4, Z32", "Section 7.1.7,
    co-constraint table", "Section 7.2.18", and "Section 7.4, Value Sets". Chapter 7 is not in the narrative
    draft; on the website it is generated from the IGAMT export, so these become links to specific profile,
    co-constraint, and value-set pages. The section numbers are also inconsistent with each other (7.1.4,
    7.1.7, and 7.2.18 are all given as the co-constraint tables).
  narrative: >-
    "(see HL7 field references)"; "See Chapter 7, Message Infrastructure, and the OBX co-constraint tables,
    Section 7.2.18"; "co-constraints table in Chapter 7.1.4, Z32"; "Section 7.1.7, co-constraint table".
    Comment 49: "Is this referring to Section 7?"
  recommendation: >-
    Yes. Replace section numbers with managed links (by ID) to the generated pages: the Z22 OBX co-constraint
    table for funding, the Z42 table for evaluation and forecast, and value-set pages for race and ethnicity.

