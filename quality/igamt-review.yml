- id: qf-igamt-usage-s
  kind: gap
  severity: warning
  owner: both
  card: usage-designations-and-expectations
  title: "Co-constraint tables use usage 'S', which the guide does not define"
  summary: >-
    Eighteen co-constraint rows and groups have usage 'S' (for example, VIS groups, the contraindication group,
    and the forecast dates). The guide defines R, RE, O, C, X, and IX. A reader cannot tell whether 'S' means
    "should", "situational", or something else, and Figure 20 shows these items as Required.
  xml:
    - "Usage 'S' in Z22 (VIS groups, historical eligibility, contraindication group and rows), Z32 (eligibility, VIS, evaluation, forecast dates), Z42 (evaluation group, forecast dates)."
  recommendation: "Define 'S' in this section (as IGAMT uses it), or replace it in the tables with a defined usage."

- id: qf-igamt-contact-address-re
  kind: question
  severity: note
  owner: narrative
  card: general-principles
  location: general-principles--s1
  title: "\"SHALL send\" patient address, phone, and guardian contact, which the profiles have as RE"
  summary: >-
    PID-11, PID-13, and NK1-5 are RE (send when known). The statements read as unconditional. Adding "when
    known" matches the profiles and the guide's definition of RE.
  narrative: >-
    "Systems SHALL send patient contact information in PID-13 and guardian or next-of-kin contact
    information in NK1-5." "Systems SHALL send patient address information in PID-11."
  xml:
    - "PID-11 RE [0..*] XAD_IZ02; PID-13 RE [0..*] XTN_IZ01; NK1-5 RE [0..*] XTN_IZ01 (Z22)."
  recommendation: "Add \"when known\" to these statements."

- id: qf-igamt-ordering-provider
  kind: xml-defect
  severity: warning
  owner: igamt
  card: non-patient-person-names
  title: "ORC-12 (Ordering Provider) has usage C with no predicate"
  summary: >-
    In ORC_IZ01 (Z22, Z32), ORC-12 is conditional, but there is no predicate, so neither readers nor validators
    know when it is required. Z42's ORC_IZ02 has it as O.
  xml:
    - "ORC_IZ01 ORC-12: C [0..1] XCN_IZ01, no predicate."
  recommendation: "Add the intended predicate, or set a fixed usage."

- id: qf-igamt-msh-ack-constraints
  kind: xml-defect
  severity: issue
  owner: igamt
  card: acknowledgement-ack-message-profile
  title: "IZ-41 and IZ-42 on the shared MSH flavor apply to every message, and no message can pass both"
  summary: >-
    All eight profiles use one MSH flavor, MSH_#ConsolidatedIG_IZ01. It carries IZ-41 (MSH-16 SHALL be 'AL')
    and IZ-42 (MSH-15 SHALL be 'NE') as segment-level constraints, so both apply to VXU, QBP, ACK, and RSP alike.
    The drafted examples follow the usual pattern (VXU and QBP with MSH-15 'ER' and MSH-16 'AL'; ACK and RSP
    with 'NE'/'NE'), and every one fails one of the two. Z22 also has its own message-level IZ-41 with slightly
    different wording.
  xml:
    - "MSH_#ConsolidatedIG_IZ01: IZ-41 \"MSH-16 (Application Acknowledgment Type) shall contain the value 'AL'\"; IZ-42 \"MSH-15 (Accept Acknowledgment Type) shall contain the value 'NE'\"."
    - "Z22 (message level): IZ-41 \"MSH-16 shall contain the value 'AL'\"."
  recommendation: >-
    Move the acknowledgment-type constraints to the message profiles that need them (for example, VXU and QBP:
    MSH-16 'AL'; ACK and RSP: MSH-15 and MSH-16 'NE'), and say in the narrative which values each message uses.
    The example checks skip IZ-41 and IZ-42 until this is fixed (quality/config.yml).

