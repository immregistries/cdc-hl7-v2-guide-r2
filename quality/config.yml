# Settings for tools/check_cards.py.

# Narrative size beyond which a card is reported as long (card target: 1–3 paragraphs).
# A card is reported when it exceeds max_words, or when it has more than
# warn_paragraphs blocks and more than min_words_for_blocks words. It is a
# warning above warn_words, otherwise a note.
max_paragraphs: 3
max_words: 350
warn_paragraphs: 6
min_words_for_blocks: 200
warn_words: 500

# Statements longer than this many words are reported.
max_statement_words: 60

# Cards where uppercase conformance verbs in the narrative are expected
# (for example, where the verbs themselves are defined).
prose_verbs_exempt:
  - conformance-verbs

# Narrative ↔ IGAMT comparison (tools/compare_structure.py).
# Tokens that look like field references but are not HL7 segments.
not_segments: [HTI, SPD]
# HL7 v2.5.1 segment names: a reference to one of these that is missing from
# every profile is a warning; other unknown three-letter prefixes are notes.
hl7_segments: [ACC, ADD, AL1, BHS, BTS, DSC, ERR, EVN, FHS, FTS, GT1, IN1, IN2, IN3, MSA, MSH, NK1, NTE, OBR, OBX, ORC, PD1, PID, PV1, PV2, QAK, QPD, QRD, RCP, RDF, RDT, RXA, RXR, SFT, TQ1, TQ2]
