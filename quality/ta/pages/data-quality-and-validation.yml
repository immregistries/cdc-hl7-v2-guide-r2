  - id: ta-q29-014
    group: Acceptance and Rejection Rules
    question: Is there a list of the core data elements whose absence makes an IIS reject an HL7 VXU (and of those that produce AE warnings while still loading)? Or must each element be tested individually and the ACK recorded?
    answer: |-
      AIRA did not point to an existing list. As a starting point, it shared a minimal VXU that the IIS had accepted during prior testing. That message contained:
      - MSH with sending/receiving facility.
      - PID with only an ID, legal name, birth date and sex.
      - A basic ORC.
      - RXA with administration date, CVX, amount and units, administered information source, lot number and manufacturer.
      - OBX segments for VFC eligibility and VIS document type/date presented.

      AIRA suggested trimming elements from this message, starting with the VIS information, to find what the IIS still accepts.
    status: partial
