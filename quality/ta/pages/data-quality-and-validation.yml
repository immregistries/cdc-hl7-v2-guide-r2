  - id: ta-q09-021
    group: Character Encoding
    question: A provider's system fails to parse a QBP response because the response contains a non-ASCII character (a UTF-8 en dash, hex E2 80 93) in a provider name, and MSH-18 does not declare a character set. Is there guidance on handling non-ASCII characters in outbound messages? Should the IIS strip or replace them?
    answer: The IZ guide specifies that string values must use ASCII characters 32 through 126. Before sending, characters outside this range should be replaced with the ASCII character that best represents them, replaced with some other value, or removed. If the occurrence is rare and the data is not critical, the IIS may choose to handle it as a one-off data quality fix.
