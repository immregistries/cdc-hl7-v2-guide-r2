      - 2024
  - id: ta-q33-005
    group: Consistency and Accuracy of Vaccination Data
    question: Can a site document a single nirsevimab (Beyfortus) administration of 200 mg with injection site "both thighs IM" when it was actually given as two separate doses, or will the IIS reject it?
    answer: |-
      IIS strive for records that accurately reflect the vaccination event that actually occurred (AIRA Data Quality Assurance in IIS guide). That guide divides data quality issues into two kinds:
      - **Impossible errors** physically could not have occurred. They should not enter the IIS, or they should be flagged and rectified.
      - **Possible errors** could have clinically occurred. They should not be rejected, but should be flagged for review or surfaced by trend reports.

      Given the available product formulations, a report of a single 200 mg nirsevimab administration is closer to an impossible error. At a minimum, IIS would likely flag it for follow-up, to understand what was administered and make the record reflect reality. Report the two injections as they were given.
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-6
      - RXR-2
    years:
      - 2024
