  - id: ta-q33-004
    group: Consistency and Accuracy of Vaccination Data
    question: Is there a document IIS follow for nirsevimab documentation? Will an IIS reject a nirsevimab immunization if it is documented incorrectly?
    answer: IIS process reported nirsevimab administrations the same way as other reported immunizations. If nirsevimab is reported as administered, the IIS expects the fields associated with an administered dose to be accurately populated in the VXU. As with any VXU, the IIS will return errors in the ACK if it encounters issues, such as expected fields not populated or invalid data. Treat nirsevimab like any other immunization for data capture and reporting.
    status: answered
