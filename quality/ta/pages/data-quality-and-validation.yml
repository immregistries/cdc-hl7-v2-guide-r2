id: data-quality-and-validation
kind: topic
title: Data Quality & Validation
overview: |-
  This section gathers questions about how IIS validate, accept, reject or clean incoming data, and about related format issues. Format issues include timestamp syntax, time zones and non-ASCII characters. Validation issues include inconsistent vaccine codes (CVX/MVX/NDC/lot) and product-specific documentation such as nirsevimab. Recurring themes:
  - Distinguishing "impossible" errors (reject or flag) from "possible" errors (accept and review). - Many acceptance and cleaning decisions are IIS business rules that should be documented in local guides. - Timestamp formatting edge cases (fractional seconds, offsets) cause avoidable rejections.
