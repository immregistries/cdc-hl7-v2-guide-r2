  - id: ta-q41-006
    group: Immunization History Content in the RSP
    question: How could an IIS return school exemption data in an RSP? Should exemptions be included in existing Z32/Z42 profiles or in a dedicated query/response profile, and what should it contain?
    answer: This was still an open design question. In a working session AIRA reviewed the IIS's early RSP design, including the semantics of the segments and fields used, and made improvements in real time. Whether exemptions fit into existing Z32 or Z42 responses or require a new response profile (e.g., a Z52) was discussed; a new profile might also require a new QBP query profile (e.g., a Z54 "request exemptions"). AIRA then created a working document (open questions, proposals, decisions, HL7 examples). The key decision depends on better understanding what a school needs when it queries (evaluated history, exemptions, forecast, immunities, etc.) and how school systems handle receiving more than they want. One option proposed was to include exemptions in the Z42 (or Z32) based on organization profile settings, e.g., return exemptions only when the querying system is a school and a "return exemptions" flag is set, which would likely require new development. No final decision was recorded.
