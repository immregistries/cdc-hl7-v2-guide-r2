  - id: ta-q14-011
    group: EHR Query Workflow and Use of Query Results
    question: How can an IIS communicate to nurses and clinical staff, without overwhelming them, that queries are complex and may not return expected results for technical reasons?
    answer: 'The IIS Functional Guide, Vol 1: Query and Response has relevant information, though it was written for EHR and IIS implementers rather than end users. AIRA''s work on multiple/inexact match guidance (including "Query Response Aggregate Measures for Multiple Matches", describing how an IIS can measure how well multiple-match handling works for a provider) includes introductory language that could be adapted. The Immunization Integration Program (IIP) developed query-response guidance (near-final draft) that began with multiple matches and expanded to inexact matches and all query responses. One recommended approach is regular creation and review of aggregate query-response outcome metrics by IIS and provider organizations, which helps clinicians understand what happens with the queries they initiate. SAS code from another IIS for pulling similar metrics from its vendor platform was available, and IIP offered tailored TA to IIS and EHRs. It was also suggested the IIS look closely at actual queries to see exactly what problems users encounter, including vendor product idiosyncrasies affecting matching, and then create a jurisdiction-specific statement.'
    status: partial
