  - id: ta-q02-002
    group: Immunization History Content in the RSP
    question: Should an IIS return all immunizations in an RSP, or filter out immunization data originally sent by the querying system?
    answer: The IIS should return the full history and not filter it. AIRA's recommendation (also given to another IIS and presented in SISC Recent Support Activity presentations) is that IIS should not filter the patient history. The role of an IIS is to create a consolidated view of the patient's record and provide an evaluation and recommendation. An IIS that does not report back the entire history is not giving the whole picture, and its forecast will appear inconsistent with the record returned. Filtering also requires the IIS to make assumptions about what the external system knows or doesn't know about the patient. While filtering may be a challenge for the external system, having the IIS do it would negatively affect the IIS's core mission, so IIS should not filter data as a general course of action. (The 2019 asking has no separate recorded answer.)
    status: answered
