  - id: ta-q07-025
    group: Other Query Partners and Uses
    question: Should insurance companies query the IIS the same way providers do (QBP/RSP), or should there be a separate specification?
    answer: 'Technically nothing prevents using the same QBP/RSP profiles. The questions are mostly about policy, such as whether there''s demographic or other data returned to providers that can''t be returned to insurers. If so, there are two main options: (1) Create a new local query profile (a "Zxx" profile instead of Z34/Z44). This has advantages, but it can be a problem if insurers'' software is IG-aware and natively speaks Z34/Z44. (2) Filter the response based on the type of organization querying, removing restricted elements before returning the RSP. Also consider whether insurers can handle receiving the full consolidated history on every query (for example, nearly the same history six months apart plus one new flu shot) and deduplicating vaccinations on their side.'
    status: answered
    asked: 1
    messages: QBP/RSP
    related:
      - Local Profiles & Jurisdictional Constraints
    years:
      - 2021
