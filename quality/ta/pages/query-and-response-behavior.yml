  - id: ta-q02-037
    group: Supported Query and Response Profiles (Z34/Z44, Z32/Z42)
    question: What can an IIS return in response to a Z44 query?
    answer: 1) The only required query/response profile for MU Stage 3 is Z44, with Z42 as the response when a patient is found; the EHR may not be able to send a Z34. 2) If the EHR sends a Z44, the IIS cannot return a Z32; it must return a Z42 when a patient is found. 3) The Z42 can include funding details, VIS data, eligibility data, client comments and refusals per the IG; nothing prohibits this. 4) The Z42 cannot include PD1 or NK1, and it also cannot return PV1 data.
