  - id: ta-q11-001
    group: Multiple Matches and Candidate Lists (Z31, Z33, NF, TM)
    question: When an IIS finds an exact match but other potentially matching records cannot be returned (data-sharing/consent No or Unknown, or possible duplicates), how can the RSP indicate more records exist? Can multiple patients' histories be returned?
    answer: There is no RSP profile that returns shot history for multiple patients. Only the Z32 and Z42 profiles return immunization history, and both are limited to one PID. The Z31 can return multiple patients but only demographics (PID, PD1, NK1) for each; the Z33 returns no patients. The recommended approach within the current standard is to return the good match with all the consented records and add an ERR segment with Informational severity (ERR-4 = I) indicating that there may be more records associated with the patient if consent or merging could be resolved. (If returning demographics for multiple candidates, the best option is a Z31 with an ERR segment.) The caveat is that this informational ERR is likely to be invisible to end users, since EHR systems are not built to expect or display it; the scenario was not anticipated in the standard. SISC has published guidance on query responses and patient protection for the single-patient case, which describes a similar ERR-based approach and also a forward-looking option using an expanded QAK-2 value set to be more explicit.
    status: answered
