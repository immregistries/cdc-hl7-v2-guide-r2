  - id: ta-q18-002
    group: Query Volume, Capacity and Batch Queries
    question: How common is it for IIS to support batch HL7 2.5.1 QBP queries for many individuals? Should a batch query interface be built, and what are best practices given concerns about being swamped?
    answer: 'Too many queries is a big concern for IIS. Some IIS may support some type of bulk query, but this has not been standardized. EHR systems can and do send large numbers of queries in "batches" by simply calling the submit-single-message operation over and over. This is surprisingly efficient and, if well supported, can be faster than a classic batch operation; the challenge is that it can overwhelm IIS capacity. The general recommendation is to build a robust, resilient single-query function: (1) the IIS can process a high number of concurrent queries, at least 10x the rate at which it receives updates; (2) the IIS has automated safeguards preventing partners from initiating too many queries in a given time frame, ideally customizable so high-volume providers can have a different threshold; (3) the IIS has an automated system limiting total queries to a level the system has been tested to support. The IIS can then advise partners on its capacity and leave it to them to manage large query volumes. (The 2023 asking has no separate recorded answer.)'
    status: answered
    asked: 2
