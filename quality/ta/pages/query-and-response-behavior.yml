  - id: ta-q18-019
    group: Multiple Matches and Candidate Lists (Z31, Z33, NF, TM)
    question: What are the use cases for returning a Z33 when a query results in more matches than the quantity requested in RCP-2?
    answer: 'The AIRA IIS Functional Guide for query (https://repository.immregistries.org/resource/iis-functional-guide/, page 43) covers this. The responding system must be prepared to handle a situation where too many patients are found and returning even limited patient data is not valuable. This happens when the responding system finds more patients than the maximum requested in the query (RCP-2) or the maximum allowed by its own policies. General requirement: the responding system SHALL HAVE THE ABILITY TO properly respond based on patient matching results and patient consent wishes. Functional requirement: per jurisdictional policy, the responding system SHALL return either a response indicating too many patients were found (Z33) or a response indicating no patients were found (Section 7.3).'
