  - id: ta-q10-012
    group: EHR Query Workflow and Use of Query Results
    question: A hospital updates its legal patient record from IIS query results and turned off queries after IIS patient mismatches (records merged on first/last name and DOB). Are there restrictions on how query results may be used?
    answer: There is no national guidance restricting how an entity uses information received from the IIS or what can go in a legal medical record; IIS information can be saved with the patient record. Some IIS have tried to restrict use based on local policy, but the purpose of QBP/RSP is to make the patient's vaccine history available for clinician use and records, and restrictions make the interface problematic for EHRs. The core issue here is patient matching (e.g., matching on name/DOB alone), an area AIRA planned to examine.
