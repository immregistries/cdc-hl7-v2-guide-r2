    group: Query Volume, Capacity and Batch Queries
    question: Large provider organizations want to send thousands of single-patient QBPs (2-3 per second for hours) to find out which patients have had COVID-19 vaccines. Is this typical, and do other states allow it?
    answer: 'AIRA had heard of this even before the pandemic: senders repeatedly call the single-message operation. Where it works, it''s usually set up as a partnership, with the EHR scheduling the volume at a time that suits the IIS. AIRA planned to raise it with EHRA so EHRs work with IIS to find a solution that works for both.'
