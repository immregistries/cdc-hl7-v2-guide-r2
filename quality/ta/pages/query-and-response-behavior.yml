  - id: ta-q19-021
    group: EHR Query Workflow and Use of Query Results
    question: An EHR only queries the IIS when a patient has a scheduled appointment and is checked in; practices want to query at any time (e.g., to document COVID vaccines for school forms). Is there a requirement or guidance on how/when EHRs trigger queries, and can an IIS require on-demand queries?
    answer: 'Neither the ONC certified EHR requirements nor AIRA''s Immunization Integration Program specify whether queries must be triggered manually or automatically; the only expectation is that the EHR can query for and consume an immunization history and forecast (IIP: query and reconcile records). Out-of-the-box EHR configurations meet most customers'' needs, and locally required changes are customary but may add cost. Automatic queries streamline workflow but may not support resolving inexact or multiple matches and may miss vaccinations given between the query and the visit. Manual queries let providers see the most current record while the patient is present but take staff time. Some EHRs support both. The practice should check with the IIS whether there is a requirement to look up patients before administering, and whether they may use the IIS web portal for manual lookups in the meantime. AIRA planned to contact the vendor about options. (Two other askings, 2022-07 and 2022-09, have no separate recorded answers; whether an IIS can require on-demand queries was not directly answered.)'
    status: answered
