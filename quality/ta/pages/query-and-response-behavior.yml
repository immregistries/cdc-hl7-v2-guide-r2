  - id: ta-q40-003
    group: Multiple Matches and Candidate Lists (Z31, Z33, NF, TM)
    question: Is there a standard for how much demographic data an IIS should return for possible matches (Z31)? An IIS returns limited demographics on the candidate list and full demographics on re-query by IIS ID, which an EHR has trouble reconciling.
    answer: There is no current AIRA or HL7 guidance that explicitly defines how much demographic information must be returned at each step, and AIRA had not heard of other IIS limiting demographics on the first query and expanding them on re-query. The 2017 Security Guidance Considerations for IIS says an IIS should return only what is minimally necessary, but does not prescribe a specific pattern; limiting demographics on potential matches to reduce exposure aligns with that principle. From a standards and practical standpoint there is no problem with this practice; reconciliation difficulties are likely a data-mapping or assumption issue on the EHR side (in this case the limitation was confirmed to be on the EHR side, with a fix dependent on EHR version).
