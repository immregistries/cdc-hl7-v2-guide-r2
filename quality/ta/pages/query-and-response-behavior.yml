  - id: ta-q41-009
    group: Forecast and Evaluation Content in the RSP
    question: For a 7-year-old with no DTaP, an IIS's Z42 returns both a DTaP forecast (CVX 107) with status COMPLETE (LA13421-5) and a Td forecast (CVX 139) with correct due dates; testing tools pick the DTaP forecast and fail. How should forecasts for DTaP vs Tdap/Td be returned?
    answer: |-
      General guidance is not to return multiple forecasts for the same vaccine-preventable disease in the HL7 response, since it causes confusion (for testing tools, EHRs, and providers alike); similarly, forecasting all remaining doses in a series is discouraged. Only one forecast should be returned for the DTaP/Tdap/Td group: under age 7, forecast DTaP; at 7 years and older, forecast Tdap or Td (not both) and drop the DTaP forecast. Reporting DTaP as COMPLETE for a patient who aged out without completing it is misleading; hiding or filtering the DTaP forecast once the patient turns 7 resolves the HL7 issue. The age-7 cutoff has been stable for decades based on licensure and ACIP recommendations. A better CVX for this patient would be Tdap since the patient needs Tdap first.

      This applies to forecasting only; for evaluation, doses given before age 7 should still be evaluated against DTaP even if the patient is now older. On the internal split of the CDSi series, AIRA suggested splitting at target dose 7 rather than 6, noting that among doses 7-11 at least one should be Tdap (preferably the first), and that Tdap can be used for any of them.
    status: answered
    asked: 1
    messages: RSP
    related:
      - OBX-3
      - OBX-5
      - RXA-5
    years:
      - 2025
  - id: ta-q34-012
    group: Forecast and Evaluation Content in the RSP
    question: The AART CDS assessment shows a DTaP (CVX 107) forecast expected at age 11 for a child over 7 who completed five DTaP doses, which looks like it should be Tdap. Why is the IIS failing these cases?
    answer: 'CDSi has one vaccine group for DTaP/Tdap/Td, and since there is no CVX for that group, AART displays one generic code (DTaP, 107). That display is a red herring: AART looks through the RSP forecast for anything that looks like a DTaP, Tdap or Td forecast and compares the dates, allowing a Tdap forecast to count when the expectation is DTaP. The actual failure was that the IIS did not return the age-11 Tdap forecast in the HL7 RSP at all; it appeared in the IIS user interface but was not in the RSP forecast OBX segments.'
