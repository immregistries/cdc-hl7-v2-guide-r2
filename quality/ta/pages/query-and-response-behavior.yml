    group: Query Volume, Capacity and Batch Queries
    question: What is the typical query volume an IIS interface receives in a smaller state?
    answer: 'A 2018 joint presentation by a large city IIS and a major EHR vendor ("Electronic Health Record Query/Response: Building on Our Success", in the AIRA repository) shows query traffic volumes and how they are distributed throughout the day. Although that jurisdiction is much larger (and the vendor''s numbers are national), dividing its numbers by about 25 gives a rough upper bound on the traffic a small state might eventually expect.'
