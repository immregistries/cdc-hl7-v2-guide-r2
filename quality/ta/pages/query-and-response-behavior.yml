    question: An EHR added a patient-portal feature letting patients request their immunization record, which initiates an IIS query on behalf of the provider organization. The IIS is concerned about query volume, patient matching, and auto-reconciliation of returned data without normal provider workflow. How should this be handled?
    answer: After meetings among AIRA, the IIS and the EHR vendor, the IIS asked the vendor to hold the feature until further policy/legal review could take place and additional safeguards could be implemented. In the meantime the vendor can encourage providers to use the traditional provider-initiated query and bulk query.
