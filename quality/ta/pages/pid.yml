    question: What PID-3 identifier type code should be used to indicate that an identifier is a Master Patient Index (MPI) ID?
    answer: There is no specific 'MPI' identifier type. MPI is a generic concept implemented differently by organizations; IDs it produces are usually labeled by their specific type (e.g., a hospital MPI that assigns MRNs). Patient identification is not nationally defined (the federal government was long prohibited from standardizing patient IDs), so the standard leaves ID types to local systems. The IZ community has settled meanings for MR and SR; beyond that you must learn the other system's needs and negotiate a solution.
