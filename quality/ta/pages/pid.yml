    question: Should apartment/unit information be included in the street address line (PID-11.1, e.g., '999 E 99TH ST, UNIT 4M') or sent in PID-11.2 Other Designation?
    answer: Follow USPS Publication 28, the foundational standard used by both address validation services (e.g., Smarty) and Project US@, as best practice when the apartment or unit can be determined. In a test, an address with an apartment submitted to a validation service either as a single street line or as street1 plus street2 was returned as a single validated delivery line (delivery line 1), i.e., with the unit included in the street address line.
