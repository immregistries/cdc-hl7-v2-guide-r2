    question: If PID-13.3 (telecommunication equipment type) is missing or invalid, must the IIS return an ERR, and can it still store the number?
    answer: PID-13.3 is RE, so it is required if known but can be empty. The TAB does not specify handling for a missing or invalid PID-13.3. Accepting and storing the number when it meets the IIS's data quality standards is fine, and an ERR is not mandated. More generally, PID-13.2 and PID-13.3 are hints about the type of number and should not overly restrict how the IIS stores or uses phone numbers.
