    question: What is the short-term recommendation for multi-jurisdictional submitters regarding unknown race/ethnicity codes, given that some IIS accept the TAB codes but many return warnings?
    answer: Multi-jurisdictional submitters should support the TAB unknown codes (UNK, ASKU, PHC1175) so they can use them for jurisdictions that require an explicit unknown; continue sending the field unvalued (blank) when race/ethnicity is not collected, as the IG allows; and not convert blanks to UNK unless a specific jurisdiction requires it. Ideally the unknown codes are only sent to jurisdictions that require them. If that is hard to operationalize, in most cases the data will still be accepted without errors, though warnings are likely. The hope is that errors and warnings decline as the TAB is adopted. (The submitter noted that warnings fill provider logs and suggested coordination with the IZ Gateway team.)
