  - id: ta-q32-003
    group: PID-13 Phone Number - Home
    fields:
      - PID-13
    question: Patient email is not a required field, so an IIS cannot really warn on its absence. How can the IIS improve email completeness?
    answer: 'Options: (1) during onboarding, verify the provider can send the data and set an expectation (e.g., email on 20% of records); if they cannot collect it, onboard anyway and document the limitation; (2) the IIS may return a warning when missing, but this is likely low value because so many records lack email that the warning gets lost; (3) report email completeness in data quality reports and follow up with low-performing providers. ACK errors and warnings are the last line of defense for major data quality problems; real improvement requires comprehensive monitoring and follow-up with submitters.'
