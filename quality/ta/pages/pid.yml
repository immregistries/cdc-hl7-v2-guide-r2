    question: Are there national best practices for reporting address, phone and email for homeless patients and prisoners?
    answer: 'Homeless clients present unique challenges: an address may be received that indicates a non-address or identifies an institution associated with the person''s location. AIRA is working on more guidance; meanwhile the IIS should coordinate with the organizations that collect this data on how it is recorded and its impact on matching. For prisoners there is little guidance; some states have ensured that vaccinations given in congregate settings such as juvenile detention or prisons are not represented on the record in a way that reveals incarceration. Matching may be affected by address changes or lack of phone numbers.'
