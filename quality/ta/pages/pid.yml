    question: For pediatric patients, should the parent's phone number and email be reported as the patient's contact information? What about when parents separate?
    answer: Yes. PID-13 is intended to support contact with the patient and may represent contact information for the patient or the patient's guardian; for a minor, the guardian's contact information should be provided there and may also be shared in NK1-5. (A newborn is not expected to answer the PID phone; the same applies to email.) See the Email and Phone TAB. PID should carry the most up-to-date information, which changes over time, which is why the latest information is requested in every message. The IIS should consider how the email is used (matching only vs outbound communications) when assessing the impact of changes.
