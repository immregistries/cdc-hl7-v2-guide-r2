    question: 'What coding system should be sent in PID-10.3 (race) and PID-22.3 (ethnicity): HL70005/HL70189 or CDCREC?'
    answer: 'Send ''CDCREC''. HL7 table 0005 is the base standard''s default, but the CDC IZ guide specifies the CDC Race & Ethnicity code set; the NIST ''Load Example'' message shows this (CDCREC_R_IZ is the name of the value set used in the NIST profile, not the coding system name). An IIS expecting HL70005 for race and HL70189 for ethnicity appears to reflect the difference between Release 1.5 as originally published and the correction in the Addendum, which uses CDCREC. The optimal solution is for the IIS to support both: accept the current code system without complaint while still processing older code tables; an interface should not be shut down because a site sends older but understandable race/ethnicity codes.'
