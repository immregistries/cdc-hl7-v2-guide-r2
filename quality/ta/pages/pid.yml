    question: When a submitted record has two names in the first name field (e.g., 'Megan Gabrielle') and another record for the same patient splits them into first and middle name, should the IIS assume the second word is a middle name? What should drive consolidation?
    answer: 'Draft Patient Names TAB guidance says systems SHALL strive to accurately record and transmit patient names and SHALL preserve spaces and hyphens. So the IIS should start by assuming that a submitted first name ''Megan Gabrielle'' is the patient''s first name, unless other information indicates otherwise, e.g., vital records or other providers show first name ''Megan'' and middle name ''Gabrielle'', or that provider submits an unusually large proportion of records with two first names and no middle names. Consolidation decisions should weigh multiple factors: data source type (vital records vs provider submission), the specific source, most recent submission date, and confidence level. See the MIROW Consolidating Demographic Records guide, particularly BR201 (information needed to make consolidation decisions) and BR901 (use information with the highest confidence level).'
