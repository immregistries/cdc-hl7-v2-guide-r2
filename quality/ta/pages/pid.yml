  - id: ta-q26-006
    group: PID-10 Race
    fields:
      - PID-10
    question: How should IIS handle the revised OMB SPD 15 race/ethnicity standard (new categories such as MENA, a combined race/ethnicity question, detailed sub-categories)? Should a combined code be sent in PID-10?
    answer: |-
      2023: No news on expansion; it is on the roadmap for the next IG, but competing CDC and OMB efforts were expected to delay CDC direction. OMB was exploring a combined category in some situations; AIRA did not believe OMB proposed eliminating the two categories, and nothing from CDC suggested combining race and ethnicity in IIS messaging.

      2024: No coordinated national strategy for transitioning HL7 immunization messaging to SPD 15 had been announced, and AIRA is waiting for one rather than proposing a competing approach. Meanwhile IIS may implement new race codes as permitted values (e.g., the new MENA top-level category, and the OMB-suggested detailed sub-level codes CDC already has). Combining race and ethnicity is a directive at the point of collection; they may continue to be messaged separately (PID-10 and PID-22), and IIS should not combine them at the message level until there is a coordinated strategy.

      2025: HL7 participants in SPD-15 work reported no activity to change the v2 immunization standard. Continue sending race (PID-10) and ethnicity (PID-22) separately using their code sets; there is no combined option in the national IG, and a vendor and IIS can push back on a provider that wants to send a combined code in PID-10.
