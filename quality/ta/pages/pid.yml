    question: What does a NIST validation error '(Usage = X)' on PID-13.1 mean (e.g., 'PID-13.1 (Telephone Number) is present whereas it is an unsupported element')?
    answer: Usage X means the element is not supported in the current standard. The RSP sent the number in PID-13.1 as well as in the components (e.g., `nnnnnnnnnn^PRN^PH^^^nnn^nnnnnnn`). The value in PID-13.1 is no longer required in the current standard (page 64 of the HL7 2.5.1 Implementation Guide for Immunization Messaging). It can be retained for backward compatibility with HL7 v2.3 systems, but its presence is what the NIST validator flags as an X-usage error.
