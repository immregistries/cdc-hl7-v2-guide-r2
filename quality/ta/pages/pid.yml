  - id: ta-q42-015
    group: PID-8 Administrative Sex
    fields:
      - PID-8
    question: Are PID-8 codes other than M, F, U supported nationally? Should stored and incoming 'O' (other) values be converted to 'U'?
    answer: 'PID-8 is administrative sex and was never designed to capture full sex or gender identity, so values have generally been limited to M, F, and U. The HL70001 value set is extensible, so IIS may choose to support additional values (broader HL7 work has added values such as A for ambiguous and N for not applicable), which is distinct from messaging gender identity; SISC guidance (2022) indicates gender identity can be messaged in an OBX. The v2.5.1 immunization IG references M, F, and U, and there is no expectation that IIS support more. ''U'' broadly means no assertion is made about the patient''s sex. Whether to keep ''O'' depends on programmatic need: whether M/F/U suffice for analyses, whether O and U are distinguished in analysis, whether granularity would be lost, whether senders mean ''other'' or are just populating the field, and the proportions of O vs U. If the distinction is not used, retaining it may not be necessary. Sex is mainly used for reporting and occasionally patient matching (e.g., fraternal twins); it is no longer used for HPV forecasting.'
