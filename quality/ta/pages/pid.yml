  - id: ta-q03-030
    group: PID-8 Administrative Sex
    fields:
      - PID-8
    question: How should non-binary sex/gender (e.g., a new 'X' option added by EHRs) be sent in PID-8 when the IG value set (HL70001) only lists M, F, U?
    answer: |-
      Earlier questions (2018-2019) on new gender codes and non-binary gender were answered with SISC meeting minutes and expectations (details not recorded) or not answered.

      2020: Non-binary gender has been discussed at SISC and in HL7 (Gender Harmony Project). HL7 added X to table 0001 (Administrative Sex), but that does not retroactively apply to the immunization IG. The loose SISC agreement is that two local trading partners may agree to extend HL70001 to include X. With multiple trading partners this creates operational problems: what to return in a query or send to another IIS when others don't support X. Mapping to U, or breaking the standard by leaving the field empty, would likely be the only options, and the IIS may need to track which partners support X.

      2024: X will be added to the next IG as an optional value for IIS; an IIS can start accepting it now. For more detail than X, the community has published guidance on messaging Sexual Orientation and Gender Identity (SOGI) in OBX segments, which IIS can implement now and which will be added to the next IG as optional functionality ('Guidance on Messaging Sexual Orientation and Gender Identity (SOGI)' in the AIRA repository).
    status: answered
