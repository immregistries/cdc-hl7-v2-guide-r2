  - id: ta-q34-015
    group: PID-6 Mother's Maiden Name
    fields:
      - PID-6
    question: When PID-6 (mother's maiden name) is populated, is the last name required? Should a first-name-only value be rejected, and what should be done with existing first-name-only data?
    answer: 'Yes, when PID-6 is populated HL7 requires the family name component, but not the other components (first, middle, etc.), and the name type code in PID-6.7 is required and restricted to ''M''. If the last name is missing, the IIS should raise an error, but the severity (ERR-4) is the IIS''s choice: W asks the sender to correct it, while E is appropriate only if the IIS specifically needs the maiden last name and wants the whole message resubmitted. AIRA is not aware of any IIS treating this as E. Keeping or purging existing first-name-only data is the IIS''s decision; if it is useful (e.g., for deduplication) there is no reason to purge it. If kept, consider how to construct valid HL7 in RSP messages; the AIRA TAB on returning patient and vaccination record information in an RSP says this field should not be returned. HL7 standards govern the interface between systems, not storage within the IIS.'
