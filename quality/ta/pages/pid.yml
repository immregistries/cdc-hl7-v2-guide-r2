  - id: ta-q43-007
    group: PID-11 Patient Address
    fields:
      - PID-11
    question: An EHR will send multi-line street addresses with the escape sequence `\X0D0A\` (CR/LF) in PID-11.2, e.g. `123 Anywhere St^Voyager Hall\X0D0A\Suite 2520^Verona^WI^99999^US^L^^DANE`. Is this valid, and should IIS accept or ignore it?
    answer: 'It is technically valid HL7 v2. Per Chapter 2 (Control), MSH-2 encoding characters `^~\&` define backslash as the escape character; `\X` introduces hexadecimal data, 0D and 0A are carriage return and line feed, and the closing backslash ends the sequence. However, it is not good practice. The Project US@ address specification for healthcare does not allow a carriage return there: each component of the street address line must be separated by a single space. AIRA also generally recommends against embedding formatting in fields (e.g., parentheses or dashes in phone numbers, new lines in addresses). Receivers do need to correctly decode escape sequences rather than storing them literally.'
    status: answered
