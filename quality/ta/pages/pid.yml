  - id: ta-q25-011
    group: PID-13 Phone Number - Home
    fields:
      - PID-13
    question: How should telecommunication use codes (HL70201, PID-13.2) and equipment types (HL70202, PID-13.3) be used and interpreted for patient phone numbers? Is PRN with CP (cell phone as primary number) valid, and which should drive mapping logic?
    answer: |-
      Current HL7 guidance is dated; AIRA drafted updated guidance for SISC/CDC for the next IG (2023-2024). Main points:

      - **Use codes (HL70201):** PRN should be interpreted as the primary contact number for the patient or guardian, which may be a landline or a cell phone; ORN may be used for additional/alternative numbers, landline or cell; NET is used for email addresses, which submitters should send when known and IIS should process; VHN, ASN, EMR and BPN are optional (not expected to be sent or processed).
      - **Equipment types (HL70202):** PH and CP are both acceptable for primary and secondary numbers. PH can represent both landlines and cell phones; CP may designate a cell phone if known. Internet, MD, BP, X.400, TDD and TTY are optional.
      - **PRN + CP is valid.** The IG only requires that the first repetition be the primary number (for backward compatibility), so PID-13.2 must be PRN if valued there. There is no restriction on PID-13.3 and no defined relationship between PID-13.2 and PID-13.3. About 96% of households have a cell phone, more than 60% have no landline, and probably more than 70% of primary numbers submitted are actually cell phones even when coded PH. An IIS that maps PH->PRN and CP->ORN and drops PRN+CP numbers should revisit that logic.
      - **Don't rely on equipment type.** IIS should not assume these values are correct, because they depend on EHR data entry. An IIS that must know mobile vs landline for certain should use a third-party verification service. Patient matching and consumer access verification work with either type. For two-factor authentication on a consumer portal, consider showing the user all known numbers masked (e.g., (608) ***-**35) and letting them pick the cell phone.
    status: answered
    asked: 3
    messages: VXU/RSP
    related:
      - Code Sets & Vocabulary
    years:
      - 2023
      - 2024
  - id: ta-q46-004
    group: PID-13 Phone Number - Home
    fields:
      - PID-13
    question: How are field-level requirements such as phone number type (mobile vs landline vs emergency contact) established, and can an IIS require phone type?
    answer: |-
      The HL7 standard is clear: the phone type (telephone, cell phone, fax, beeper, etc.) must be sent if known; if not known, the number should still be sent with an empty type. AIRA is not aware of, and has not seen in testing, any IIS policy that requires, excludes or restricts phone type. In practice phone type is very error-prone because of EHR intake workflows (e.g., patients put their cell number on the 'primary phone' line, recorded as a telephone). An AIRA small-group project concluded this is likely not a winnable data quality battle, and most IIS either assume a number is a cell phone or use a service to determine its type.

      Emergency contacts are captured differently: the patient's phone numbers (for infants, the parent/guardian's) are on the patient record (PID-13), while responsible persons (NK1) are separate associated records with their own contact information and phone types (NK1-5). There is no 'emergency' phone type. Responsible person phone numbers should not be used as patient numbers.
    status: answered
