    question: Some vendors send PID-8 as a CE-style value (e.g., `|M^Male^HL70001|`) instead of just the code. PID-8 is an IS data type. Is it worth pushing vendors to fix, given that in v2.7 the data type becomes CWE?
    answer: PID-8 is an IS data type, defined to contain only the code, for historical reasons (original authors aimed to keep messages compact and supported only administrative sex). Processing the usable data and returning a warning (ERR-4 = W) indicating a message violation is appropriate; the IIS is not required to issue the warning but may. What the vendors send does not follow the standard, and they would not pass ONC certification producing such messages. Nothing needs to change in how the IIS handles it.
