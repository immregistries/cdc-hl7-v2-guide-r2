    question: IIS vary from requiring EHRs to store the IIS patient ID to disallowing storage even though they return it. What is the right approach?
    answer: An IIS should not require an EHR to store anything. If an IIS considers an ID sensitive and has concerns about storage, it shouldn't return it, since there is no way to control storage through policy. An IIS should ignore IDs that aren't useful to it, like any other data in a VXU or QBP; there is nothing unique about this field. If an IIS is uneasy about using its own (SR) ID for patient lookup, it should ignore the SR ID and use the submitter's patient ID instead.
