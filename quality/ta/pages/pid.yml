    question: Which MRN should an IIS return in RSP PID-3? If an EHR queries with an MRN (QPD-3) that the IIS has not linked to the matched patient, should the IIS echo the queried MRN back?
    answer: 'Only return identifiers in PID-3 that the IIS actually associates with this patient. Returning an MRN asserts the IIS has determined the record matches that MRN, and that should only be done if the IIS believes it is true; finding the patient via other query parameters (e.g., after a merge, or a patient new to that provider) does not mean the IIS has decided to link them, so the MRN should not be echoed. The IIS is only required to return at least one identifier, which for an IIS should include the state registry (SR) ID. Do not send an empty MRN repetition if the MRN is unknown; e.g., instead of `PID|1||^^^99993^MR~<IIS ID>^^^<IIS>^SR|`, send only the SR identifier: `PID|1||<IIS ID>^^^<IIS>^SR|`. In the reported case the EHR rejected the response because PID-3 did not match its stored identifier; this is a common situation for all IIS. (The earlier 2020 question, Q04-043, had no answer recorded.)'
