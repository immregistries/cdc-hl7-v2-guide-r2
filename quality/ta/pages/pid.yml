    question: For an at-home vaccination program, PID-11 carries the ship-to address. If a patient ships to their workplace, this could overwrite the patient's physical address in the IIS. How should IIS handle this?
    answer: IIS will need to develop or leverage business rules for deciding which address to keep when a matching patient is found. Some IIS use provider profiles that prioritize sources (e.g., primary vs secondary) when deciding whether to update a record; the MIROW Consolidating Demographic Records guide has relevant decision points. The program's TAB uses address type 'P' and does not distinguish home vs business; the program does not collect that detail and few IIS read the address type field. However, the address type component (PID-11.7, HL70190) is the standards-based way to explicitly indicate a business/shipping address, and could be explored if IIS want that detail.
