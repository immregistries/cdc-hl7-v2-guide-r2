  - id: ta-q46-001
    group: PID-24 Multiple Birth Indicator
    fields:
      - PID-24
    question: Twins are being merged because many EHRs do not make multiple birth indicator and birth order available at charting, requiring site-specific custom work. Are EHRs expected to support these fields?
    answer: |-
      This is principally an implementation and conformance issue. The IG specifies PID-24 as RE and PID-25 as conditionally RE when PID-24 is 'Y'; any system claiming conformance must support them. Supporting and messaging these fields is also part of ONC f(1) immunization certification and a test scenario. Certification does not dictate UI design or require every option be enabled by default, but needing customer-specific customization plus separate interface work raises a legitimate question about the practical availability of the certified capability.

      ONC noted possible gaps: the fields are not in a(5) required demographics or USCDI, so they may not be treated as required in interfaces; they may not be documented at the point of care and are sent as null; and f(1) is not part of base EHR certification, so some products are not certified to it (CHPL can be searched). One EHR vendor confirmed the field is not standard in its registration; customers must add a custom field and reconfigure the interface. ONC could not say clearly whether this per-customer approach is acceptable.
    status: partial
