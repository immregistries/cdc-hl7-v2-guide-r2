      - PID-15
    question: What code should be used for Mandarin in PID-15? The PHIN VADS language table does not appear to have one.
    answer: The IG's language codes come from ISO 639-2, which has a single code for all Chinese languages ('zho' or 'chi'). ISO 639-3 includes codes for specific Chinese languages (Mandarin 'cmn'; Cantonese has its own code). Written Chinese is largely shared, which is probably why ISO 639-2 does not distinguish them, though spoken forms differ greatly. A local IIS may extend its code set to some or all ISO 639-3 codes, which do not conflict with ISO 639-2, so it could add 'cmn'. AIRA could consider adding these codes in guide updates if needed.
    status: answered
    asked: 1
    messages: VXU
