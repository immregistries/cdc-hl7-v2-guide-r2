    question: PID-1 (Set ID) is a required field. If it is empty, should the IIS return ERR-4 = W or E?
    answer: Because PID-1 is R for HL7 conformance, the IIS must raise an error when it is missing, but that does not mean the severity must be E. Severity is left to the IIS, and for this field it is very unlikely any IIS would use E; W, or I if the IIS does not care at all, is most likely appropriate.
