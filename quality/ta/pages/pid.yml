  - id: ta-q23-019
    group: PID-25 Birth Order
    fields:
      - PID-25
    question: A sender always populates PID-24 (usually 'N') and sends PID-25 = '1' for single births, copying the same values to QPD-10/QPD-11. One IIS treats any QPD-11 value as a multiple birth and returns no match. What does the standard require?
    answer: |-
      The sender's reading is essentially correct:
      - PID-24 Multiple Birth Indicator is RE: the sender must send it if known, and the receiver must process it if sent.
      - PID-25 Birth Order, when PID-24 is not 'Y', is effectively O: the sender may send it if known, and the receiver may process it.

      So when PID-24 = 'N' the sender is not required to send PID-25 and the IIS is not required to read it, but the IIS must read PID-24 and act on it. QPD-10/QPD-11 mirror PID-24/PID-25, so the same values can be copied. Sending '1' for a single birth is correct; there is no meaningful '0'. The IG appendix has these fields backwards, which should be fixed in the next release. Recommendation: the IIS should fix its logic. The sender could stop sending PID-25 when PID-24 = 'N' (not required), or a middleware transform could remove PID-25/QPD-11 when the indicator is 'N' for that IIS only.
    flags:
      - The answer states the IG appendix has PID-24/PID-25 descriptions backwards; verify against the published appendix and correct in the new IG.
    status: answered
    asked: 1
    messages: VXU/QBP/RSP
    related:
