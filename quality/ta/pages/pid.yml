  - id: ta-q15-006
    group: PID-14 Phone Number - Business
    fields:
      - PID-14
    question: Should the patient's work/business phone be sent in PID-14 or as a repetition of PID-13 (use code WPN)? Why does PID-14 exist?
    answer: 'Sending the work phone as a PID-13 repetition (WPN) is fine; the current community guide does not prohibit it, so changing is not critical. The patient''s business phone is not a CDC-endorsed IIS core data element and PID-14 is Optional in the IG, so there are no national expectations to accept or send work numbers; it is unclear whether receiving systems read it, and EHRs probably don''t expect IIS to track work numbers. The duplication is historical, inherited from ADT: originally PID-13 and PID-14 each held just a number (home and business); the data type was later enlarged to carry use codes, so a work number can be expressed anywhere the type is used. If a trading partner requests PID-14, ask why and what they use it for; if there is an important impact others would also see, the change may be worthwhile.'
