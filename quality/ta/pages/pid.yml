    question: What code should be used to send Middle Eastern or North African (MENA) race?
    answer: 'CDC guidance under the new OMB standard is pending. Meanwhile, IIS may support additional race codes from CDCREC (full code system in PHIN VADS). MENA is CDCREC 2118-8 and can be implemented as a top-level category; in PID-10: `2118-8^Middle Eastern or North African^CDCREC`. Notes: the NIST Immunization Test Suite validator will flag it as an error even though IIS may accept it; EHRs may not support it, so it may rarely be seen; and EHRs may still roll it up to White for IIS reporting to align with certification (MENA was previously, and still is in CDCREC, under White).'
