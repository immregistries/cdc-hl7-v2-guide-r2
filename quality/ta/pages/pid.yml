    question: An IIS accepts only PRN numbers, accepts PRN in every repetition, and stores only the last one. Is that acceptable? Can an ORN number be stored as primary when it is the only one sent?
    answer: Storing only the last occurrence is acceptable, but AIRA recommends storing all phone numbers provided, since multiple numbers improve flexibility and data quality; overwrite vs keep is IIS policy. The PRN vs ORN distinction does not need to be preserved in the IIS (the phone/email TAB does not differentiate them for storage), so treating an ORN as primary when it is the only one sent is acceptable.
