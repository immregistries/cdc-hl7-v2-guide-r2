    question: Some providers put religious prefixes such as 'SR', 'BR', or 'FR' in the first name field, and some EHRs have no prefix field. How should IIS accept, store, and handle religious name prefixes?
    answer: HL7 provides PID-5.5 (XPN.5, prefix) for name prefixes. It is optional with no value restrictions, so any string can be used, e.g. `|Smith^John^Henry^Jr^BR^^L|`. The HL7 base standard gives no further guidance. Prefixes should not be recorded in the first name field; doing so causes serious problems for patient matching. Run data quality checks to find these cases, clean the IIS data, and ask providers not to send prefixes in the name fields. Submitters may keep them locally but should strip them, or move them to PID-5.5, before sending.
