  - id: ta-q15-001
    group: PID-10 Race
    fields:
      - PID-10
    question: What codes should be used for unknown, declined ('asked but not provided'), or refused race and ethnicity in PID-10/PID-22, given that CDCREC has no 'unknown' value?
    answer: |-
      **2021 (cautious view):** Per the IG, an empty field is interpreted as unknown, so adding UNK creates two values meaning the same thing, and EHRs will likely just map empty to UNK to meet a requirement. POL was created ad hoc for pandemic IIS-to-CDC reporting as a masking operation, a different use case than provider-to-IIS, though perhaps unavoidable for IIS-to-IIS. There is precedent: several CDC PHIN VADS value sets extend race/ethnicity with UNK, 'Refused to answer', or other null flavors, and a multi-jurisdictional provider specification (e.g., for IZ Gateway) could reasonably adopt UNK, or UNK and POL. Open issues: what code system goes in CE.3 and whether all trading partners must support it. Primitive testing showed a few IIS reject UNK and/or POL, and others warn or ignore them. AIRA recommended discussing with SISC first.

      **2023:** AIRA was presenting proposed codes to SISC; the community had not decided, and AIRA asked IIS what they planned to implement. (A 2022 question, Q21-007, had no answer recorded.)

      **2024:** UNK can be used; published guidance was pending. Forthcoming guidance would state that UNK is semantically equivalent to leaving race/ethnicity blank: unknown for any reason (never asked, no answer, not recorded). Two more specific codes indicate the patient was asked but did not answer: ASKU (Asked but Unknown; could be refusal or not knowing) and PHC1175 (Refused to Answer / Preferred not to say). Sending systems may support ASKU or PHC1175 but should not support both, as their definitions are close and confusing.

      **2025 (TAB published):** The CDCREC value set itself has not changed. The TAB defines a documented local extension (UNK, ASKU, PHC1175) that the community agreed to send under CDCREC (e.g., `ASKU^asked but unknown^CDCREC`), to be carried into the next IG. This was a deliberate tradeoff: changing the code system/table would be more disruptive (several IIS would reject a different table, while almost all tolerated unknown codes under CDCREC), and these codes were already in de-facto use without conflicting with real values. The extension standardizes behavior but does not require IIS to store values exactly as sent. Processing rules matter more: race and ethnicity are RE, so if an IIS does not recognize a code it must treat the field as empty and still process the message; a VXU must never be rejected for an unrecognized race/ethnicity code. In AIRA testing most IIS accepted the codes (UNK 55/2, ASKU 53/4, PHC1175 54/3 accepted/unrecognized), and the same few IIS also rejected a made-up code, indicating a conformance issue on their side. The TAB does not require submitters to send unknown codes; leaving the field blank when genuinely unknown remains correct. IIS that have changed race/ethnicity from RE to R are responsible for accepting the TAB-defined unknown codes.
    status: answered
    asked: 6
    messages: VXU
    related:
