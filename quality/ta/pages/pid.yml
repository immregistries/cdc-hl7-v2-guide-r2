  - id: ta-q18-024
    group: PID-11 Patient Address
    fields:
      - PID-11
    question: Some patients have no primary address, and many IIS fail a VXU if the address is missing. Should a 'no address' placeholder be sent?
    answer: 'From an HL7 perspective, do not send an address if it is unknown or the patient has none. There is no standard for putting ''no address'' or similar text in the field, although it happens, and doing so risks the data being used incorrectly (reminder/recall, matching, deduplication). The correct way to indicate no address is to send no address. AIRA has been explaining to IIS the ramifications of making address a hard requirement, since it encourages bad data practices; IIS should instead use data quality checks monitoring how often RE fields are populated rather than rejecting on import. EHRs should send what they know and leave blank what they do not. In practice the impact is small: most IIS accept records without an address, some that return errors still import the data, and truly missing addresses should be rare except at clinics serving vulnerable populations. Guidance may be warranted since address requirements could exclude records for vulnerable populations.'
    status: answered
