    question: Which code set(s) should be used and accepted for patient primary language (PID-15)? Should an IIS accept both ISO 639-1 and ISO 639-2, and warn when a value is not on its list?
    answer: Primary language is optional. The guide lists a subset of ISO 639-2 values, but an IIS may accept all, none, or other values from other code sets including ISO 639-1; it should not feel constrained by the list in the guide, and an IIS serving a diverse population will likely benefit from accepting as wide a range as possible. A warning signals data loss, but technically should be used only when asking the submitter to correct bad data; if the code is correct but the IIS cannot store it, the better severity is I (informational) or no error at all. (The 2016 question, Q02-004, had no answer recorded.)
