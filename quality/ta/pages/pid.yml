  - id: ta-q14-010
    group: PID-6 Mother's Maiden Name
    fields:
      - PID-6
    question: Mother's maiden name (PID-6) is RE in the CDC IG. Can an IIS require it (e.g., before moving a provider to production), and what completeness expectations are reasonable?
    answer: |-
      PID-6 is RE: certified EHRs must be able to send it when it is known. IIS must have data quality processes and may set minimum standards for RE fields in aggregate; for example, an IIS may allow individual messages without an address but require that most (e.g., >95%) records submitted in a timeframe include one. An IIS may go further and require the field on every message, but should do so only understanding the data it may lose by enforcing it; IIS do have the right to set minimum standards. In one case (2023) the IIS was not requiring it on every message but expected a minimum proportion, and ACK warnings for missing mother's maiden name were likely misinterpreted by providers as blocking go-live.

      In another case (2021), the IIS needed the provider to make an honest effort to improve capture for children (less push for adults, though welcome). The field adds significant value for patient matching, increasingly critical as IIS expand consumer access. Supporting points: published measures show it is highly populated (75%+ as of 2016); many IIS receive it from vital records, so provider-submitted values increase the odds of a confident match; USCDI lists it as a Level 2 element expected to progress; IIS best practice documents suggest at least 90% capture. That IIS could go live below 90%, but not at the provider's rate of under 5%. AIRA also asked the vendor for aggregate capture data and whether something about the provider's workflow or patients prevents capture.
    status: answered
    asked: 2
