    question: What value belongs in PID-3.4 (assigning authority) for a medical record number? One IIS asks submitters to use their IIS-assigned facility code, while another asks for a fixed state code (e.g., 'NYA'). Which is correct?
    answer: PID-3.4 identifies the organization that assigned the ID. For example, if PID-3 carried a driver's license number (identifier type DL in PID-3.5), the number is useless without knowing the issuing state, so the state would go in PID-3.4. For an MRN (type MR), the assigning authority would not be the state unless the state assigned the ID; it would normally identify the hospital, clinic or pharmacy that assigned the MRN. The national standard does not define the specific value, but requiring in a local guide that it be the ID the IIS assigned to the facility makes sense and is consistent with other IIS. A fixed state code might make sense for a state registry ID (SR) but not for an MRN.
    status: answered
