  - id: ta-q13-006
    group: PID-22 Ethnic Group
    fields:
      - PID-22
    question: An IIS wants an 'Other' ethnicity value not in CDCREC, at least in query responses. Can a local code be used in PID-22, and how is it messaged?
    answer: CDCREC (PHIN VADS 2.16.840.1.113883.6.238) has no 'Other Ethnicity' concept. The IG does not define a robust mechanism for local codes, but the HL7 base standard allows it because the field is bound to a user-defined table. A normal value looks like `|2186-5^non Hispanic or Latino^CDCREC|`. A local value must use coding system 'L' or a 99zzz-format name (User-defined Table 0396, IG Appendix A p. 45), e.g. `|OTH^Other Ethnicity^L|`. However, NIST expects the first triplet of PID-22 to contain only CDCREC values, so this is valid HL7 v2 generally but differs from the national standard, and NIST correctly flags it. Certified EHRs will not necessarily support the local concept, so the IIS should require it only for an overriding business need.
    status: answered
    asked: 1
