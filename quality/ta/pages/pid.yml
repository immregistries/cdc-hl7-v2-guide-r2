  - id: ta-q43-015
    group: PID-11 Patient Address
    fields:
      - PID-11
    question: 'The IG''s core data elements place Birth State in PID-11 (with a birth address type) and VXU Example #10 shows this, but some EHRs send birth state in PID-23. Do IIS care, and should a vendor change?'
    answer: 'Neither Birth State nor Birth Location is currently a high-priority VXU element, and there is no broad, consistent support for how they are sent. Recommendation: continue sending birth state in PID-23 unless specific IIS partners request otherwise. Technically the HL7 guidance points to PID-11 with an appropriate address type (BR = residence at birth, BDL = birth delivery location). In practice many IIS do not consistently interpret PID-11 address types (some process the first address as the primary address), so a birth-related address risks being misinterpreted as the current address. Receiving birth state in PID-23 (optional) is likely not problematic, as IIS may simply ignore it. IIS often derive birth state from vital records, and there is little broad use of this data. The draft new IG also notes IIS MAY disregard address types with no operational relevance unless negotiated.'
