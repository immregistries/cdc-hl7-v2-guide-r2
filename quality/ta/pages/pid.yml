    question: Are there national standards or code sets for sexual orientation and gender identity (SOGI) beyond F/M/U, and what are other IIS doing to incorporate other gender identities?
    answer: The best resource (2022) was the HL7 Orders and Observations workgroup Confluence page on Sexual Orientation, Gender Identity, Administrative Sex, Birth Sex, etc. (https://confluence.hl7.org/display/OO/Sexual+Orientation%2C+Gender+Identity%2C+Administrative+Sex%2C+Birth+Sex+etc), which collects Gender Harmony / HL7 Public Health Workgroup work, technical recommendations, and a data-gathering table where jurisdictions describe how they message SOGI. (HL7 v2 administrative sex values map to the four FHIR administrative gender values; FHIR's separate gender identity code system does not map to v2.) More work was needed, and AIRA planned a workgroup with IIS, vendors and national partners to apply this to immunization registries. AIRA also connected requesters with other industry contacts.
