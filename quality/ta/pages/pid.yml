  - id: ta-q02-024
    group: PID-3 Patient Identifier List
    fields:
      - PID-3
    question: Who sets the assigning authority (PID-3.4) for patient identifiers? Does the IIS assign these values even when the EHR creates and owns the ID, and how does this work across state lines?
    answer: |-
      The assigning authority is set by the organization responsible for (that creates and manages) the ID being messaged. The IIS does not assign it for IDs the EHR owns: an EHR sending an MRN sets the assigning authority because it owns and manages the MRN. For an IIS ID, the IIS is the assigning authority because it owns and manages that ID.

      The cross-jurisdiction part of the question (Q02-057) has no answer recorded.
