    question: Senders populate PID-15 with both upper- and lower-case codes, and the IG lists these in lower case. Why, and should IIS treat them case-insensitively?
    answer: HL7 took this code set from ISO 639-2, which defines codes in lower case; HL7 mostly uses upper case and ISO chose lower case. The codes are case sensitive and should be sent exactly as documented. NIST does not currently check PID-15, but if it did it would require the case to match. Even so, accepting values case-insensitively on the receiving side is good practice. AIRA will make sure the next guide addresses this.
