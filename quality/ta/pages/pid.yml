    question: How should a non-U.S. address (and international phone number) be represented, e.g., for patients visiting from other countries? What if the IIS cannot store international addresses?
    answer: |-
      2019: HL7 is not very clear on this; some options were offered (not recorded).

      2026: The patient's non-US address should be communicated from the EHR to the IIS; if source systems accept foreign addresses they should send them in HL7 v2. To indicate a non-US address, populate the country component of the patient address with a value from HL7 table 0399 (country codes). In AIRA testing, most IIS accepted a non-US address (country 'FRA') through their HL7 interface, while four complained when the state was missing. IIS not set up to accept non-US addresses should still record the dose, although IIS policy may restrict entries from outside their jurisdiction. (No specific guidance on international phone numbers was recorded.)
