  - id: ta-q15-007
    group: PID-10 Race
    fields:
      - PID-10
    question: Will IIS be expected to use the expanded/detailed CDC race code list (race subcategories such as Caribbean, Chinese, Other Asian)? Are standards in development to support them?
    answer: |-
      The bigger list is required in some places in EHR certification, but AIRA and others commented that it was larger than necessary for IIS, and the list in the immunization IG should be the list used for IIS interactions; community discussion (2021) about expanding the IG list focused on better flavors of 'unknown' and 'asked but declined', not the full list.

      In 2023 AIRA knew of no CDC or HL7 effort to extend the v2 immunization standard beyond the 6 race and 4 ethnicity categories; OMB was considering government-wide revisions. CDC already publishes a hierarchical list of about 1,600 detailed race and ethnicity codes in PHIN VADS (CDC Race Category and Ethnicity Group, https://phinvads.cdc.gov/vads/SearchVocab.action). These detailed codes can be sent today under current standards and IIS could receive them, but certified EHRs probably are not set up to collect or send them and most IIS cannot receive them yet.
    status: answered
