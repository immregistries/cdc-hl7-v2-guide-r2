  - id: ta-q43-017
    group: PID-22 Ethnic Group
    fields:
      - PID-22
    question: A jurisdiction's local IG changes PID-22 from RE to X and expects ethnicity codes (e.g., `2135-2^Hispanic or Latino^CDCREC`) in PID-10 along with expanded race codes. Is this appropriate, and how should expanded race/ethnicity be collected via HL7 v2?
    answer: 'Not appropriate per the national IG and base standard. The change is likely tied to OMB SPD-15, but HL7/CDCREC coordination on that has stalled. How an IIS displays or collects data in its UI is its discretion, but messaging should align with the national IG. Recommended correction: (1) undo the sunsetting of PID-22 and stop expecting ethnicity in PID-10; (2) send race codes in PID-10 and ethnicity codes in PID-22; extending race codes is fine, but ethnicity codes in the local race table should be messaged in PID-22. Also: PID-22 is not repeatable in the national IG; expanding to multiple ethnicities is acceptable but should not be required of EHRs. Dominican code 2069-3 is a race code; ethnicity code 2184-0 may fit the intent. Support for ''Not Hispanic or Latino'' must be restored. Expect limited uptake: EHRs collect granular codes but certification leads them to roll up to top-level concepts (e.g., German submitted as White). Consider how granular codes will be returned in RSPs and through IZ Gateway, and whether to roll them up. Testing showed the IIS still accepted standard PID-10/PID-22 without warnings and returned both in the RSP; the jurisdiction was amenable to correcting.'
