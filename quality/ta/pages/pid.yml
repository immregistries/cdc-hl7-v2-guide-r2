  - id: ta-q08-013
    group: PID-8 Administrative Sex
    fields:
      - PID-8
    question: The IG intermingles 'sex' and 'gender' (Table 0001 says it reflects self-reported gender, while PID-8 is Administrative Sex). What should PID-8 carry, and where should gender identity be sent if an IIS wants to collect it separately from sex at birth (new PID/PD1 field vs OBX)?
    answer: |-
      PID-8 'Administrative Sex' was originally meant for hospital administration (e.g., room assignments). The PID segment is roughly the electronic equivalent of a patient wristband and wasn't designed to convey clinical information, so it doesn't capture the full biological and social complexity of sex or gender. The CDC IG's only guidance is in the appendix code definitions, which say the code reflects self-reported gender; in 2021 AIRA said that roughly matches the original intent and works for IIS, while in 2026 AIRA said the Table 0001 description dates from decades ago and does not reflect current definitions. IIS use sex mainly for reporting, with a minor role in forecasting and some help in patient matching.

      HL7's Gender Harmony Project defines Gender Identity, Sex for Clinical Use, and Recorded Gender as separate concepts. Adding a new field to PID or PD1 would take more than a year in HL7 and wouldn't necessarily be adopted in the v2.5.1 immunization IG. In the short term (2021) an OBX segment is the best way to send gender identity; Release 1.5 already has patient-level observations, so this isn't a new concept even though the data is about the patient rather than the vaccination. X (non-binary) was added to HL7 table 0001 and can be used in PID-8, though system support is uncertain; how value sets evolve isn't well defined in Release 1.5.

      2026: The next IG makes no change to how sex, gender or gender identity are messaged. AIRA previously published a TAB on sending SOGI information in HL7 v2 (available on request, not hosted on the website), but federal work in this area has stopped. More specific concepts must be carried in other segments and fields with tighter definitions. At least one state appears to accept LOINC 76690-7 in OBX-3 with the orientation/identity code in OBX-5, possibly multiple per message, driven by state SOGI legislation.
    status: answered
    asked: 3
    messages: VXU
