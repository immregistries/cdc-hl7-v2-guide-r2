    question: If PID-13.2 (telecommunication use code) is missing or invalid, must the IIS return an ERR and refuse to store the number? Would storing it fail AART, and should ERR-4 be E or W?
    answer: Although PID-13.2 is R in HL7, it is acceptable to store the phone number even if PID-13.2 is missing or invalid. Technically the IIS should return an ERR segment, but this scenario is not tested by AART; the only related test sends a clearly invalid phone number and expects an ERR. There is no requirement for ERR-4 to be E or W; because PID-13 is RE, W is generally best (correct the data, but no need to resend).
