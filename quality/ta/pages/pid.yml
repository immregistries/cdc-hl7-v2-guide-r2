    question: Should PID-15.3 use coding system name HL70296 or ISO6392?
    answer: 'Expecting HL70296 is probably an error on the IIS''s part. The IG states the code system to use in messages is ''ISO6392''. The IG setup is quirky: it points to table 0296 for the list of values, and table 0296 links to PHIN VADS for the values and instructs to use ''ISO6392'' in transactions. Accepting both old and new representations is still the most practical approach.'
