  - id: ta-q08-009
    group: PID-10 Race
    fields:
      - PID-10
    question: How should a patient with more than one race be messaged and stored? Is 'multi-racial' an acceptable race code, and do IIS store and return multiple races?
    answer: PID-10 is a repeating field, so each additional race is sent after a tilde (~). Ideally an IIS should accept all races sent. At least one jurisdiction stores only the first race, and found that EHRs often send 'Other Race' when more than one race was selected. There is no HL7/CDCREC code representing 'multi-racial'; in VXU messaging, multiple races may be conveyed by sending more than one race code or, as some do, as 'Other race' (2131-1). For RSPs, AIRA's TAB on returning IIS patient immunization record information makes returning race optional; whether and how to include it is a jurisdictional decision. (A 2024 question about how many race options IIS offer in their user interfaces, Q30-005, had no answer recorded.)
