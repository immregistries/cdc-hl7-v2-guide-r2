  - id: ta-q24-005
    group: PID-8 Administrative Sex
    fields:
      - PID-8
    question: An IIS maps unsupported PID-8 codes to a locally added 'O' (Other) and returns 'O' in query responses, but an AART DQI test ('Query for invalid patient gender') expects U or blank. How should this be handled?
    answer: |-
      There are two ways to pass most Data Quality Incoming/Ongoing checks. The easiest is to notice the problem in the incoming update and return an ERR segment pointing to where the problem is: for PID-8, return an ERR pointing to PID-8 when the code is missing or unrecognized, and the whole measure passes. The ERR severity does not have to be 'E'; it can be 'W' or 'I', and the IIS can still process and map the data however it chooses.

      AART checks the query response only when the ACK did not flag the problem; then it looks for evidence the data was handled properly, expecting the value to come back corrected. (The answer also notes, for a refusal date test: returning a refusal RXA without RXA-3 would violate HL7, but if the IIS accepted the data without complaint, AART assumes the refusal was stored without a date and should be returned that way.)

      Recommendation: flag the issue in the ACK (a warning or informational ERR pointing to the field). Change query behavior only if desired. These problems are probably rare, so the extra warnings should have little effect on live interfaces.
    flags:
      - The refusal-date (RXA-3) passage appears to belong to a different test/question; confirm whether it should be moved to an RXA section.
    status: answered
    asked: 1
    messages: VXU/ACK/RSP
    related:
      - ERR-2
      - Data Quality & Validation
