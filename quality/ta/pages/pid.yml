    question: Can an IIS return ERR-4 = E for missing race/ethnicity while still accepting the record (to get submitters' attention without losing vaccination data)?
    answer: 'AIRA told the IIS this goes against the standard: ERR-4 = E signals that the submitter must correct and resubmit, so it should not be used for a record the IIS accepts. The IIS chose to proceed anyway, using granular per-provider controls and possibly excluding IZ Gateway traffic.'
