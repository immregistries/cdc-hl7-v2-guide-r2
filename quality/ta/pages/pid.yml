    question: Many IIS expect name type code 'L' (legal) in the patient name of a QBP, but an EHR cannot guarantee that the name it holds is the legal name. Should IIS permit 'C' (current) in queries rather than rejecting anything other than 'L'?
    answer: 'The current IG requires that the legal name be sent first because some IIS read only the first repetition and the legal name gives the IIS the best chance of finding a match. In practice there is a lot of variation in how names are typed, and IIS are expected to have matching systems that can cope with this. AIRA is drafting new PID-5 requirements guided by these principles: the name should be properly designated as to what it is (e.g., a newborn placeholder name such as ''Baby Boy Smith'' should not be typed ''L''), and if a legal name is known it should be sent first, with additional names allowed that the IIS may store and use to improve matching. More guidance is needed on name type definitions, particularly legal name. AIRA did not yet have a position on the ''C'' type and asked for information on how it is used.'
