  - id: ta-q15-018
    group: PD1-12 Protection Indicator
    fields:
      - PD1-12
    question: The IG says PD1-12 is not required and empty implies consent, but an IIS returns MSA-1 = AE with ERR-4 = E when PD1-12 is missing, while ERR-8 says it is "informational" and the patient is actually stored. Can the severity be lowered to W or I?
    answer: 'The IIS agreed and updated the error severity (ERR-4) and descriptions (ERR-8) across its acknowledgements for an upcoming release. The underlying principle is that ACK severity should match what actually happened: a condition that does not prevent the record from being stored should be reported as a warning or informational, not as an error.'
