  - id: ta-q34-011
    group: PD1-12 Protection Indicator
    fields:
      - PD1-12
    question: An IIS rejects messages with PD1-12 populated (ERR-4 = E, "patient consent is unwanted - Segment Rejected"), effectively making an RE field X. Would changing it back to RE but limiting allowed values meet the standard?
    answer: 'AIRA prefers that the usage of PD1-12 not be changed and that the national value set (Y, N) be honored, because it is an uphill battle to keep providers from sending values in a national value set. However, the IIS does not have to save or act on the data if policy prohibits it. A suggested approach is to change the ERR-4 severity for this condition from E to I (informational): the patient data continues to be saved, and the ACK tells the sender the PD1-12 value is not being stored.'
