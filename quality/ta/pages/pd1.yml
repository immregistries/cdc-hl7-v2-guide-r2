id: pd1
kind: segment
title: PD1 Patient Additional Demographic
overview: 'Questions about PD1 cluster around three fields: PD1-11 (publicity code / reminder-recall contact preference), PD1-12 (protection indicator) and PD1-16 (immunization registry status). PD1-12 dominates: what it means, whether it is tied to consent, how strict an IIS may be about it (requiring, forbidding, repeating it) and what ACK severity is appropriate. PD1-11 questions concern the outdated HL7 Table 0215 values and NIST/AART value-set validation; PD1-16 questions concern mapping registry status codes to IIS patient statuses (MIROW) and their relationship to the PID-30 death indicator.'
suggested:
  - Update Table 0215 (publicity code) with modern contact methods such as text and email, via a community code-set exercise.
  - Clarify the semantics of PD1-16 code P (permanently inactive) and whether it implies death in the absence of PID-29/PID-30; document the mapping to MIROW statuses.
  - Clarify PD1-12 meaning (stated preference, local policy, no default) and guidance for jurisdictions that need multiple consent types (with PD1-13 alignment).
