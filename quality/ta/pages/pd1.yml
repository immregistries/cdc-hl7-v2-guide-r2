    question: In HL7 Table 0441, what is the intended use of code P "Inactive-Permanently inactive"? Is it meant only for deceased patients, and should an IIS map it to "Inactive-Deceased" only when a date of death is sent in PID?
    answer: 'There is no definitive answer. The AIRA/MIROW document *Patient Status in Immunization Information Systems* (page 28, Functionality Challenge 2) indicates IIS should consider "permanently inactive" to be mappable to "deceased", as long as local terminology can be mapped to the minimum recommended statuses (active, inactive-outside jurisdiction, deceased). However, that document does not describe how submitting systems define the field, and there is little national information on how EHRs have implemented it. Recommendation: investigate a random sample of affected records to determine their actual status, and consider following up with providers on how they use the code.'
