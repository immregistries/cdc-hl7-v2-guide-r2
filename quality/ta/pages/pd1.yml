  - id: ta-q33-014
    group: PD1-12 Protection Indicator
    fields:
      - PD1-12
    question: Because PD1-12 is an HL7 field, does an IIS need to collect patient consent in order to populate it?
    answer: No. The IIS does not need to collect consent just because the field exists in the HL7 message; whether to collect and use the protection indicator is a jurisdictional policy decision, and the field only needs to be handled properly if the jurisdiction uses it.
