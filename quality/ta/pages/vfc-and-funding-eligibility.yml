  - id: ta-q24-001
    group: 'Funding Source vs Eligibility: Concepts and Codes'
    question: Is there a standard practice for consuming, storing and using funding source and eligibility from HL7? For example, one IIS ignores funding source, bases inventory deduction only on the financial class (VFC eligibility) code and provider type, and rejects some CDC eligibility codes (e.g., wrong for age or clinic type). How do jurisdictions distinguish the Public, Public VFC and Public non-VFC funding codes?
    answer: |-
      Much of how funding source and eligibility are captured is set by each jurisdiction's policy. Helpful resources:
      - "IIS and EHR Common Areas of Variability Based on Jurisdictional Law/Policy": explains national-level reasons for variability and describes different funding source models (from p. 3), which help decide which codes map to which funding categories. It links to the MIROW guides "Decrementing Inventory Via Electronic Data Exchange" and "IIS Collaboration with VFC and Grantee Immunization Programs".
      - IIS Functional Guide, Volume 2: eligibility and funding source recommendations start on p. 66.
      - "Recording Dose Level Eligibility in Immunization Information Systems (IIS)": the national view of challenges and opportunities in capturing dose-level eligibility.

      Whether to use a single Public funding source or to split Public VFC and Public non-VFC is a jurisdictional choice. The main recommendation is that what is sent over HL7 should record what actually happened, so that the IIS captures complete data. Do not reject at the interface. Instead, find and fix illogical eligibility/funding combinations afterward through data quality checks such as provider report cards. AIRA's Data At Rest assessment also measures how often these illogical combinations occur among 0-2 year olds.
    status: answered
    asked: 1
    messages: VXU
    related:
      - OBX-5
      - OBX-3
      - RXA-9
    years:
      - 2023
