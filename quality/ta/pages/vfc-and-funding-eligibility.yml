id: vfc-and-funding-eligibility
kind: topic
title: VFC & Funding Eligibility
overview: |-
  Questions in this section cover how vaccine funding source and dose-level funding program eligibility (VFC, CHIP, state programs) are messaged in VXU OBX segments, and how IIS use these values for inventory decrementing. Recurring themes:
  - The relationship between funding source and eligibility, and which one an IIS should rely on. - Recommended COVID-19 funding/eligibility codes. - Whether eligibility is required for adults and for historical doses. - Jurisdiction-specific models such as replacement (borrow/replenish) inventory.
