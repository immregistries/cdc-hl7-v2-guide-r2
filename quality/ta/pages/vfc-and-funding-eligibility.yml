  - id: ta-q05-012
    group: COVID-19 Funding and Eligibility
    question: Which funding source and eligibility codes should providers send for COVID-19 vaccine doses so that the IIS will decrement inventory correctly, given that private and VFC are not appropriate? Is there a standard HL7 code?
    answer: |-
      At the October 2020 SISC call, most participants agreed that the proposed solution is workable: code the funding source as Public (VXC50) and eligibility as Not VFC Eligible (V01). This applies during the first phase, while the vaccines are federally funded and freely available. Once they are no longer federally funded, COVID vaccines should be coded as appropriate.

      SISC discussed various options (creating new codes, various combinations) and settled on this recommended combination, recognizing that no combination was perfect, and followed up with a poll. It is a best practice or recommendation rather than a hard rule, for several reasons:
      - Some providers may not be trained to select these values correctly.
      - All COVID vaccine is federally funded.
      - Provider systems, end users and IIS inventory decrementing rules are complex.

      VAMS, being COVID-specific, hard-codes these values in its HL7 instead of asking end users to populate them.
    status: answered
    asked: 3
    messages: VXU
    related:
      - OBX-5
    years:
      - 2020
  - id: ta-q05-013
    group: COVID-19 Funding and Eligibility
    question: Are the recommended COVID funding type and eligibility codes important only for HL7 messaging, for systems using the IZ Gateway, and for IIS internal processing? Would this information need to go back to CDC?
    answer: Yes, they are important for HL7 messaging and for systems using the IZ Gateway, most specifically VAMS, a short-term COVID-specific application, to meet HL7 requirements. The biggest concern was how each IIS uses the codes for internal processing. At that time the information was not in the CDC data lake (CVRS) file, and there had been no discussion of reporting it to CDC.
