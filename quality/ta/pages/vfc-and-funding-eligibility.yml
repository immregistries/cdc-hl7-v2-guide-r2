    group: Eligibility by Age and for Historical Doses
    question: Per the core data elements list, are funding eligibility and funding source required for patients older than 19?
    answer: The core data elements documentation does not specify that they must be sent for all patients of all ages. Links to the updated CDC list and the new Functional Guide were provided. Programs sometimes add their own requirements (e.g., the state VFC program may need it). Requiring it may also require EHR screen changes if the VFC questions are currently age-based.
