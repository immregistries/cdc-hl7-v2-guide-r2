questions:
  - id: ta-q04-036
    group: 'Funding Source vs Eligibility: Concepts and Codes'
    question: How should vaccine funding source and vaccine funding program eligibility be messaged, and how are the two concepts related? Why are some IIS requests for these values hard for providers to implement?
    answer: EHR systems should be able to message both concepts. Each IIS decides which one (if not both) it wants to read and use in its vaccine program. (The 2021 request about why IIS requests are hard for providers to implement had no answer recorded.)
