  - id: ta-q29-027
    group: ORC Segment / ORC-RXA Order Group Structure
    question: A local IG changes ORC usage from R to RE (and MSH-15, MSH-16 and MSH-21 from R to RE). How should these deviations from the national IG be viewed?
    answer: For ORC, this probably reflects reality. ORC carries no truly mission-critical information, and the IIS would probably rather keep a good vaccination event than reject it for a missing ORC. The vendor may also have many legacy partners that do not send it. Many IIS may be in the same position while still documenting ORC as R. MSH-15, MSH-16 and MSH-21 are probably the same case of documenting how processing really works. These fields have explicit defaults in the national IG, so if a sender does not populate them the receiver can assume the proper value.
    status: answered
