  - id: ta-q03-074
    group: ORC-3 Filler Order Number
    fields:
      - ORC-3
    question: How should an IIS use ORC-3? Should it use ORC-3 to match incoming immunizations to existing ones and update the existing record (even if vaccine or date differs), or is the delete/add approach preferred?
    answer: |-
      The jury is still out on how trustworthy ORC-3 is for matching. Matching across disparate systems solely on IDs is risky; a "trust with verification" approach is preferred. The 2.5.1 IG introduced and requires the field but without data on its reliability; the MIROW vaccination event matching guide does not reference it, and there are no guidance documents on using it for matching. AART ad hoc testing around 2015-2016 sent a record with action code A, then an update with the same ORC-3 changing the vaccine group (HepA to HepB) with action code U, and found no (maybe one) IIS used the value.

      Recommendation: start collecting ORC-3.1, the namespace ID (ORC-3.2) and the RXA-21 action code without changing processes, then analyze a month or two of data to assess trustworthiness overall, by submitting system (e.g., major EHR platforms, pharmacy stacks) and by organization/facility, before deciding next steps. The intent is that ORC-3 supports updates/deletes, and many EHRs likely implement it properly, but EHRs have not been tested on it and IIS were not built to use it, so it must be verified before relying on it.

      An earlier general question (2019) "how does ORC-3 work and how should IIS use it?" had no answer recorded; the guidance above covers it.
    status: answered
    asked: 2
    messages: VXU
    related:
      - RXA-21; Patient Matching & Deduplication
    years:
      - 2019
      - 2021
  - id: ta-q27-009
    group: ORC-3 Filler Order Number
    fields:
      - ORC-3
    question: A provider being onboarded is not sending ORC-3. The local IG lists it as required, but the IIS has never really used it. Should the IIS still require it?
    answer: 'ORC-3 Filler Order Number is a required field, so certified EHR systems must always send it with both administered and historical vaccinations. If a site does not send it, the IIS must decide how critical the field is to its operations; it may choose to accept the data without it but follow up and strongly recommend that the site send it. Also look closely at how the site implements other fields: problems constructing one field may indicate more serious issues elsewhere. The priority should be the highest data quality starting with the most critical fields. ORC-3''s criticality is unclear, since many IIS ignore the field and there is limited information about what EHRs put in it.'
    status: answered
    asked: 1
    messages: VXU
    related:
      - Data Quality & Validation; Onboarding & Interface Testing
    years:
      - 2023
