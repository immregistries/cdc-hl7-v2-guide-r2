  - id: ta-q08-021
    group: ORC-12 Ordering Provider
    fields:
      - ORC-12
    question: Can an IIS require an ordering provider NPI in ORC-12 for every administered dose (rejecting with MSA-1 = AE, ERR `ORC^1^12`, 101 Required field missing, "NPI number is missing")? Why would an IIS do this, and how should EHRs handle standing orders where there is no specific ordering provider?
    answer: |-
      The IIS effectively requires ORC-12.1 (ordering provider ID) to contain an NPI, with ORC-12.9 = NPI, for administered doses (RXA-9 = 00). From a pure HL7 standpoint this follows the v2 constrainable model: the IIS constrained a C(R/RE)/RE element to R for administered doses, which is a valid constraint, so the EHR has to meet it.

      In practice it causes problems. Standing orders (which cover nearly all childhood vaccines) are an organizational workflow, not an order by a specific person, so picking an arbitrary provider's NPI isn't factual, and standing orders don't have NPIs. It's like making middle name required: valid HL7, but not everyone can meet it.

      AIRA's view: requiring a field makes it as important as the vaccination event itself (date and vaccine code). Work with HIMSS on the Immunization Integration Program found that EHRs and providers rarely look at ACKs or correct rejected submissions. So if the IIS doesn't heavily use a data element, or could still function receiving it less than 100% of the time, it should be RE, not R, to avoid losing vaccination events. Is it better to know about the vaccination without an ordering provider, or never know about it because the missing field caused a rejection? AIRA's role is to help remove local requirements that are unnecessary or arbitrary, and vendors are encouraged to keep raising such cases, since other IIS have dropped outdated local requirements after discussion.

      The IIS's position: it cannot relax the requirement because its Medicaid office requires the IIS to report this information; it has required the NPI of the medical authority since 2015 for data completeness and accountability, validates submitted NPIs against the NPI registry and rejects incorrect ones, and is unwilling to accept the data only part of the time because it believes that would increase erroneous submissions. Its solution for standing orders is for the physician who issued the standing orders to provide their NPI for the site to send.
    status: answered
    asked: 3
    messages: VXU/ACK
    related:
      - ERR
      - MSA-1
      - RXA-9; Local Profiles & Jurisdictional Constraints; Acknowledgement & Error Handling
