  - id: ta-q01-076
    group: ORC-3 Filler Order Number
    fields:
      - ORC-3
    question: What should an IIS put in ORC-3 when returning vaccinations in an RSP (Z32/Z42)? Should it use its own identifier and assigning authority, what if the provider's immunization ID is not known, and why does AART flag a missing ORC-3.2/ORC-3.3?
    answer: |-
      ORC-3 must be valued with the IIS's own stable, unique identifier for the vaccination record, along with an assigning authority; using the IIS's own namespace (e.g., a short IIS code) is acceptable. The Z22 rule that for historical immunizations the sending system SHALL assign an identifier as if it were administered by its own organization applies in the same spirit. An example that passed NIST validation:

      `ORC|RE||197023^VTA||||||||||||||NISTEHRFAC^NISTEHRFacility^HL70362`

      The definition does not really differ for a Z32, mainly because there are no business rules tied to this field for the receiver; EHRs are unlikely to look at it and match IIS vaccinations to their own using vaccine code and dates instead. Future guides may define it better, but a stable unique ID will work for current and likely future guidance.

      On the AART errors: ORC-3 is an EI data type, so one of ORC-3.2 (namespace ID) or ORC-3.3 (universal ID) must accompany the identifier. An earlier (2019) response referred the IIS to the HL7 FAQ on populating ORC-3 in RSP messages along with these EI requirements.

      Earlier questions (2016, 2020) asking how to implement ORC-3 in query responses, and what to return when the provider's immunization ID is not known, had no answer recorded; the guidance above (send the IIS's own ID) covers them.
    status: answered
    asked: 5
    messages: RSP
    related:
      - Query & Response Behavior
    years:
      - 2016
      - 2019
      - 2020
      - 2021
  - id: ta-q04-003
    group: ORC-3 Filler Order Number
    fields:
      - ORC-3
    question: Are ORC-3.2 (namespace ID) and ORC-3.3 (universal ID) required?
    answer: |-
      ORC-3 (Filler Order Number) is an EI data type. Under the EI definition, component 2 (namespace ID) is required unless OIDs are used, so ORC-3.2 is required if not using OIDs (in which case ORC-3.3 carries the universal ID). Local implementation guides may also specify use of order numbers.

      A separate question about ORC-3.3 (2019) had no answer recorded.
    status: answered
