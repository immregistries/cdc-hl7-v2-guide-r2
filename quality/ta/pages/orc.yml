    question: Which ORC field carries the provider NPI (ORC-17?), and should it be the parent organization NPI or each individual provider's NPI?
    answer: The fields for the ordering provider (the person, ORC-12) and the entering organization (the site, ORC-17) could carry an NPI. Using NPI is not a requirement to exchange data through the IZ Gateway for any use case (provider-to-IIS or IIS-to-IIS); if both endpoints want to use NPI that is possible but not required.
