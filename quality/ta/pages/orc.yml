  - id: ta-q25-024
    group: ORC Segment / ORC-RXA Order Group Structure
    question: In a Z42 response, may an IIS send a separate ORC/RXA group for each recommended (forecast) vaccine, or must all forecasts be grouped under one ORC/RXA? A vendor/EHR says separate groups are out of spec, citing the CDC IG example.
    answer: |-
      The current HL7 2.5.1 specification allows recommendations to be grouped under one ORC/RXA or split across several, so the IIS is on standard and the EHR should accept it. Many IIS return RSPs this way, NIST does not flag it, and the national IG has no conformance rule on it. The specification is too loose for CDS recommendations, though. This is on the gap list for the next IG, and new standards will specify a single ORC/RXA for forecasts (historical and administered doses still each get their own ORC/RXA), which matches most IIS today. Best practice is therefore to group all forecasts under one ORC/RXA; the IIS should adopt this as a scheduled improvement, not an urgent bug fix.

      When consolidating forecasts, use OBX-4 (sub-ID) carefully to group the OBXs for each vaccine group (e.g., all HepA forecast OBXs together, then all HepB). Tell EHRs and providers before making the change, since some may expect one forecast per ORC/RXA. Vendors may assume a single ORC/RXA because the NIST test examples use it, but NIST certification does not cover every valid layout.

      IG examples are non-binding and have known issues (the cited example has only forecasts and no history). The NIST IZ tool is the authoritative measure, and an IIS whose responses pass it completely can pass AART Query/Response validation. In one case AIRA also noted unrelated NIST errors in the IIS's RSPs that should be fixed for full alignment. See AIRA's *Guidance on Detailed Message Structure and the Use of Specific LOINC Codes* (message structure guidance v1.1), which sets one ORC/RXA for all forecasted vaccines as the best practice.
    status: answered
    asked: 3
    messages: RSP
    related:
      - RXA
      - OBX-4; Message Structure & Cardinality
    years:
      - 2023
  - id: ta-q21-023
    group: ORC Segment / ORC-RXA Order Group Structure
    question: In a VXU, may multiple serological evidence of immunity observations (e.g., LOINC 75505-8 with rubella and mumps SNOMED codes, plus effective dates) be grouped under a single ORC/RXA with CVX 998 using OBX-4 sub-IDs? The receiving IIS expects each event in its own ORC/RXA and is rejecting these messages.
    answer: The *Guidance on Detailed Message Structure and Use of Specific LOINC Codes* indicates that the Patient Observation Order segment group (the CVX 998 ORC/RXA carrying patient-level observations) is expected to appear only once in a message (cardinality 0..1, see the summary table on page 12). Grouping multiple patient observations as OBX segments under that single ORC/RXA is therefore the expected structure, and IIS should accept it rather than reject it. AIRA asked whether there is a business or programmatic reason for expecting separate ORC/RXA groups for each event.
    status: answered
    asked: 2
    messages: VXU
    related:
      - RXA-5
      - OBX-3
    years:
      - 2022
  - id: ta-q46-007
    group: ORC Segment / ORC-RXA Order Group Structure
    question: In a Z32/Z42 response, when a patient has multiple patient-level comments sent as OBX (e.g., OBX-3 30945-0 Vaccination contraindication), is a separate ORC/RXA required for each, or can all be listed under one ORC/RXA?
    answer: The best guidance is AIRA's recent TAB on CDS in RSP, which covers "non-CDS order groups" on pages 4-5. The graphic on page 4 places these order groups after the vaccination history and before the forecast and shows multiple order groups; page 5 uses the plural, indicating they should not all be in a single ORC/RXA group. Some comments could perhaps be co-located under one ORC/RXA, but this is not explicitly addressed, so one ORC/RXA order group per comment is the best approach.
    flags:
      - This RSP guidance (one order group per patient-level observation, 2026) differs from the VXU guidance in the serology entry above (single CVX 998 Patient Observation Order group, cardinality 0..1, 2022). Confirm whether the difference between VXU and RSP structure is intended and reconcile in the IG.
