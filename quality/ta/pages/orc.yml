  - id: ta-q22-002
    group: ORC-28 Confidentiality Code
    fields:
      - ORC-28
    question: Is there a field or code to flag a vaccine-specific (not patient-level) sharing restriction, e.g., a vaccination a minor received without parental consent that should not be disclosed except to authorized users? Could ORC-28 Confidentiality Code be used?
    answer: |-
      This came up years ago (e.g., for HPV) but was never resolved into a recommended method. AIRA suggested modeling it as "vaccine sharing protection" rather than "vaccine consent": consent speaks to who consented to vaccination, whereas the need is to protect a specific dose from being shared, which could apply more broadly (e.g., adults wanting certain vaccines protected). The patient and other vaccinations would still be shared; the IIS stores and uses the protected dose for public health but does not share it except with select authorized users.

      If a confidential dose needs to be communicated, ORC-28 Confidentiality Code is the appropriate field, though its use has not been defined for immunization messaging. The associated table is user-defined; the values in base HL7 are only an example set, so it can be extended with values that make sense for the jurisdiction and community.
    status: partial
    asked: 1
    messages: VXU/RSP
