  - id: ta-q16-016
    group: ORC-12 Ordering Provider
    fields:
      - ORC-12
    question: When returning immunization history in an RSP, is it acceptable not to send ORC-10 (Entered By) and ORC-12 (Ordering Provider)?
    answer: 'It depends on the profile. RSP^Z32: ORC-10 is RE (send if known, otherwise leave blank); ORC-12 is RE for administered vaccinations and O for historical. Latest guidance is that an IIS should probably represent all vaccinations it did not give directly as historical, even if reported to the IIS as administered, so leave ORC-12 blank if unknown; it is only required when the vaccination is represented as administered and the value is known. RSP^Z42: ORC-10 and ORC-12 are optional and need not be sent even if known.'
    status: answered
