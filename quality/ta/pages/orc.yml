id: orc
kind: segment
title: ORC Common Order
overview: 'Questions about ORC fall into three groups: message structure (how ORC/RXA order groups pair, how forecasts and patient-level observations are grouped in VXU and RSP), ORC-3 Filler Order Number (what to put in it, especially in RSP, its EI components, and whether it is reliable for matching updates), and ORC-12 Ordering Provider (local requirements for an NPI, standing orders, pharmacy prescribers, and what to return in RSP). Recurring themes are the looseness of the 2.5.1 IG on grouping, the gap between ORC-3''s intent and actual EHR/IIS use, and the cost of making fields like ORC-12 required.'
suggested:
  - Add a conformance statement that all forecasts in Z42 are grouped under a single ORC/RXA; fix examples that mix history with forecasts.
  - State whether multiple patient-level observations may share one ORC/RXA order group, and reconcile VXU (single CVX 998 group) and RSP (one group per observation) guidance.
  - Clarify ORC-3 semantics in RSP (IIS-assigned ID) versus VXU, and define/verify its use for updates and deletes.
  - Address how ORC-12 is populated (or left empty) for standing orders; advise reserving R usage for elements essential to IIS business functions.
  - Consider whether the national IG should reflect real-world tolerance for a missing ORC and for MSH-15/16/21 (which have defaults).
  - Define use of ORC-28 for dose-level confidentiality/sharing protection.
questions:
  - id: ta-q25-025
    group: ORC Segment / ORC-RXA Order Group Structure
    question: The IG says "each RXA must be associated with one ORC". Does "one" mean a single ORC per message, or that each RXA has its own ORC?
    answer: It means every RXA must be preceded by its own ORC. In HL7 2.3.1 the ORC was optional and often not sent, but in 2.5.1 it is required. A message with five vaccinations needs five ORC/RXA pairs, even if the vaccinations are historical.
    status: answered
