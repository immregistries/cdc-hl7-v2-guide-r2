questions:
  - id: ta-q42-013
    group: NTE Segment (general)
    question: What is the national thinking on accepting patient notes (free text) via the NTE segment in VXU messages?
    answer: 'IIS generally have not implemented the NTE segment, for two reasons. First, there is no control over what is put in free text; confidential information may be sent, raising questions of whether the IIS can legally collect it, how to parse and understand it, and how to protect it. Second, NTE is awkwardly placed in the VXU structure: it can only appear under RXA -> OBX -> NTE (not directly under RXA), so sending a patient note requires an RXA with no dose administered, an OBX with no discrete observation, and then the NTE with the free text.'
    status: answered
    asked: 1
    messages: VXU
    related:
      - OBX
      - RXA
    years:
      - 2026
  - id: ta-q16-001
    group: NTE Segment (general)
    question: A pharmacist reporting COVID vaccines wants to add NTE notes indicating whether a dose is 1st/2nd/booster, because the patient's IIS record may be incomplete. Can NTE be used for this, and how should it be formatted?
    answer: 'Vaccination notes can be transmitted in HL7 v2 using the NTE segment, but notes are not among the data elements IIS are expected to collect, and some IIS have policies prohibiting collection of free-text notes. EHRs may send them, but they may not be accepted or stored. A better approach for the underlying problem: IIS accept historical vaccinations when the date and vaccine type are known, so if the patient has documentation of earlier doses, the pharmacy can report them as historical (RXA-9 = 01). It is also likely the IIS already has the other doses and a merge issue is the cause; reporting the dose given still helps once records are merged.'
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-9
      - RXA-5
    years:
      - 2022
