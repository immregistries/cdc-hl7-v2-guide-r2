  - id: ta-q29-026
    group: IN1 / Insurance Group (general)
    question: A local IG changes IN1 segment usage from R to IX. Is this a conformance concern?
    answer: IN1 belongs to the Insurance group, which is Optional (O) in the national IG. IN1 is required only when insurance information is collected. The local IG probably marked the Insurance group and the IN1, IN2, and IN3 segments as IX because the IIS does not collect that optional group. This is about as good as possible when an optional group is not supported, and it sets clear expectations.
