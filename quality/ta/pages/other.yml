  - id: ta-q27-003
    group: Data Elements Not Supported by the IG
    question: An IIS is trying to capture patients' Medicaid IDs, but getting providers to report the Medicaid ID in submissions has been difficult. What approaches are other IIS using to exchange Medicaid ID data?
    answer: Jurisdictions that are most successful at getting Medicaid IDs or identifying Medicaid patients get the information directly from the Medicaid agency, not from providers. Getting Medicaid ID entered and messaged consistently by providers is a significant lift and likely to be spotty at best, a continuous uphill battle. Historically, IIS-Medicaid exchanges have usually used SFTP with a custom, jurisdiction-specific flat file rather than HL7. Having the Medicaid ID helped somewhat with patient matching, though only Medicaid was sending it. Vaccination data received from Medicaid is secondary-source billing data of lower quality, and vaccination dates can be off by a few days, which complicates matching and deduplication. Such data did help fill gaps where providers were not connected. One state has a longstanding interagency agreement with its Medicaid program that supports data exchange and funding match, and its language could serve as a model.
