  - id: ta-q24-011
    group: Other Message Types (ADT, ORU) and Non-Vaccination Data
    question: An IIS wants to receive lead screening test results through HL7 (ORU messages), alongside manual entry and file uploads. What standards and guidance exist for messaging lead results to the IIS?
    answer: 'Lead results fall under laboratory reporting to public health, which has its own HL7 v2 implementation guide (HL7 product brief: https://www.hl7.org/implement/standards/product_brief.cfm?product_id=185). It has one lead test example but no other lead-specific guidance. It is still the format to expect from laboratory systems. NIST has an ELR test suite at https://hl7v2-elr-testing.nist.gov/mu-elr/ for validating messages, and its Documentation tab ("User Documentation") lists the supporting documents used to build it. The topic was then moved to an emerging-standards effort with other interested IIS.'
