  - id: ta-q27-001
    group: Other Message Types (ADT, ORU) and Non-Vaccination Data
    question: Is there guidance on how to express vaccine inventory "wastage" in an HL7 v2 message?
    answer: 'There is no guidance because HL7 v2 immunization messaging does not support this. It is a fundamental limitation of v2: the messages are about the person (patient and their vaccinations), not about anything else, so there is no way to submit inventory-management style messages (e.g., order, decrement, waste). Inventory use cases such as wastage are being considered for FHIR instead.'
    status: answered
