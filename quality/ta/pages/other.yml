  - id: ta-q12-023
    group: Batch Header/Trailer Segments (FHS, BHS, FTS, BTS)
    question: If a message arrives with FHS and BHS segments containing invalid data (e.g., `FHS|^~\&|MTAB||EXT|1|20210903102906|||20210903102906||P|2.3`), should it be hard rejected, or should the optional segments be ignored?
    answer: An IIS is not required to hard reject a message for violating national or local standards; severe errors should be reserved for issues that impact data quality or critical business needs. Unless there is a compelling reason, ignore these segments completely. Never require them for any transaction, and if they are present, ignore them as much as possible.
