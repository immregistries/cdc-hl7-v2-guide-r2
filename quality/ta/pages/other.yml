id: other
kind: topic
title: Other
overview: 'This section collects questions that do not fit a single core VXU/QBP field: batch header segments, message types other than VXU (ADT, ORU), data elements that the immunization IG does not support (disability status, occupation, SOGI, Medicaid ID, school/grade, geolocation, home self-administration, adjuvants, free text), booster/series designation, provider identifiers, and HL7 tools and training. The dominant theme is requests to carry new data elements in the VXU; the usual answer is that the current IG has no mechanism, that the data may be better collected outside HL7 immunization messaging, or that a new requirement would need to go through the SISC/IG process. Where an item clearly belongs to a specific field or topic, a "Suggested home" is given.'
suggested:
  - No guidance for occupation data; the OH2 segment or a priority-group style observation could be considered.
  - No field for geographic coordinates of the administration location (e.g., mobile clinics).
  - No guidance for self-administered or home-administered vaccines (e.g., FluMist at home via a third-party pharmacy).
  - No standard way to convey school enrollment/grade in VXU.
  - No guidance on SOGI; alignment with HL7 O&O cross-program guidance (OBX with LOINC) would be needed.
  - Clarify the use of free text (NTE/OBX-5) and the handling/optionality of batch header segments.
questions:
  - id: ta-q12-022
    group: Batch Header/Trailer Segments (FHS, BHS, FTS, BTS)
    question: Are batch header/trailer segments (FHS/FTS, BHS/BTS) needed in HL7 2.5.1 batch files, and should they ever be used in web service messages?
    answer: 'FHS, BHS, FTS and BTS are part of HL7 2.5.1 and are defined in the CDC IG Release 1.5. FHS/FTS would normally be expected when saving messages to a file (e.g., for FTP), not in web service calls where no file is created, so IIS should not require FHS/FTS via the CDC WSDL. BHS/BTS may wrap multiple messages but are not required; a batch can simply be a series of messages one after another. IIS could accept data through submitSingleMessage with or without these segments. IIS should not take a hard position: where possible simply ignore these segments since they contain no relevant clinical data.'
    status: answered
