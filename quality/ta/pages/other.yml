  - id: ta-q27-005
    group: Other Message Types (ADT, ORU) and Non-Vaccination Data
    question: A state law requires providers to report TB test results to the IIS. Are any IIS accepting TB screening tests via data exchange, and if so, in a VXU or another message type? Which coding system is used, CVX or CPT?
    answer: AIRA does not know of any IIS today that is receiving TB screening tests. CVX codes exist for TB indurations (skin tests), but these only record that the test was done, not the result, and they have been deprecated. Historically IIS may have received them as part of care workflows to ensure people were screened; results were not sent because they were usually negative and positives were tracked in other systems. The VXU message is intended for submitting vaccinations; its structure does allow reporting administration of other pharmaceuticals, but using it to report lab results is a stretch beyond its purpose. Lab test results are more properly communicated in an ORU message as defined by lab reporting standards. CPT codes are generally used for procedures performed and are not used for reporting lab results; LOINC is the more appropriate direction.
    status: answered
