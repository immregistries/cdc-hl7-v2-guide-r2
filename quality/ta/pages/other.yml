  - id: ta-q23-017
    group: HL7 Tools, Libraries & Training
    question: What third-party HL7 v2 messaging engines (stand-alone routing applications or software integrated into the local stack for parsing) are other IIS using?
    answer: AIRA put the question in its Weekly Update to gather community input. A generic HL7 engine can fix some technical problems with reading and parsing messages correctly. These tools are limited, though, in helping the incoming data get correctly absorbed into, and later retrieved from, the IIS database, which is usually the harder part. AIRA offered a call to review the specific problems the IIS wants an engine to solve.
