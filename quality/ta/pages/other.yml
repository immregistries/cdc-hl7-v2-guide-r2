  - id: ta-q40-002
    group: HL7 Tools, Libraries & Training
    question: Are there resources to help new IIS staff learn HL7 v2 message structure, what each segment means, and how ACK messages work?
    answer: 'AIRA published two free eLearning courses: "HL7 v2.5.1 Immunization Update (VXU) Messages" and "HL7 v2.5.1 Acknowledgment (ACK) Messages and their Role in Ensuring Immunization Interoperability", which cover VXU and ACK use, structure and contents in depth; they are part of AIRA''s Interoperability Course Series. For staff new to interoperability, first take the Public Health Informatics Institute introductory courses from the Fundamentals of IIS series: "Interoperability for IIS" (interoperability and data flow), "HL7 Basics for IIS" (HL7 standard, National IG, message types, structure, and relation to data quality), and "Advanced HL7 for IIS" (conformance, constraints and testing tools).'
    status: answered
