  - id: ta-q23-012
    group: Data Elements Not Supported by the IG
    question: Can locational data (latitude/longitude) for where a vaccine was administered, such as by a mobile vaccination unit that moves daily, be submitted in an HL7 VXU message?
    answer: |-
      The VXU currently has no way to give the latitude and longitude of where a vaccination took place. Before deciding on an approach, clarify whether the lat/long is the facility's or the patient's location at administration, and what the data will be used for.

      For mobile units, options include:
      - Use the address the HL7 message already supports and convert it to lat/long in post-processing. Addresses may be better for data quality, since people can verify an address but not easily verify coordinates.
      - Collect the bus's location separately and correlate it with the vaccination records afterward. This works if units move daily, but not if they move several times a day unless the time of administration is also received and stored.
      - Find out what system records the doses and whether it can be changed to report location (as an address or lat/long), and whether this is already being captured somewhere.
    status: answered
    asked: 1
    messages: VXU
    related:
