  - id: ta-q23-015
    group: Booster vs. Primary Series Designation
    question: The current IG doesn't cover sending or receiving whether a dose (e.g., COVID-19) is part of the primary series or a booster. Should HL7 messages carry a booster designation, or is that left to IIS logic?
    answer: |-
      Correct: the current guide does not say how to message this, and a "booster" designation is not a CDC core data element. It appeared only in CDC's requirements for IIS reporting of COVID-19 vaccinations to CDC. AIRA's current view:
      - CDS logic does not consider the intended purpose of a dose. Whether a dose is a booster or a series dose is something a CDS engine works out from the full immunization history. The standards therefore treat it as a CDS output, not something reported to the IIS.
      - If EHRs did send it, the IIS would need to decide how to use it: show it to users, let it affect CDS, and handle conflicts when CDS disagrees (for example, the clinician says booster but the history makes it a second dose).

      For now the booster designation is assumed to stay a concept assigned by CDS. AIRA wants to hear about any real need to collect it from providers and how the data would be used. It can be raised for future guide discussion.
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA; Version & IG Interpretation
    years:
      - 2023
  - id: ta-q14-022
    group: Booster vs. Primary Series Designation
    question: 'Providers ask how COVID-19 booster doses are recorded: the IIS records a booster as another dose (e.g., dose 3) rather than labeling it a booster, and a booster of a different brand appears as its own dose. Is there a better way to explain how boosters are recorded?'
    answer: IIS do not track the provider's intention for a specific dose (for example, that a DTaP was intended as dose 3); a clinician may intend a dose as a booster, but that is not stored and is not a factor in determining whether the patient received the right vaccines at the right time. The IIS collects the entire vaccination history and runs it through a clinical decision support engine that evaluates each dose against the schedules (combination vaccines against multiple schedules, COVID against a single schedule). The IIS can then annotate which dose each was, e.g., two primary doses and a booster, based on dates and vaccine types. ACIP is continually revising the COVID schedule, so what is a booster today could later be considered part of the primary series, and intentions at administration are temporary. When earlier doses are unknown, a full history cannot be established by asserting the first recorded dose is a booster; each dose with vaccine type and date must be recorded, as for all other vaccines.
    status: answered
    asked: 1
    messages: VXU
    related:
