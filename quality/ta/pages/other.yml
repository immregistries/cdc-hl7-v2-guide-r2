  - id: ta-q09-004
    group: Data Elements Not Supported by the IG
    question: Is there guidance for EHRs submitting immunizations per the federal specification on disability status, and will the national HL7 message specification be modified (e.g., to add a DB1 segment) to communicate it?
    answer: CDC has explained that disability status is not a data element an IIS captures or could send, and it is not part of a vaccination message. Submitters were directed to follow the COVID-19 Vaccination Reporting Specification (CVRS) requirements, and CDC is not expected to alter the CVRS to require it, since it poses challenges similar to comorbidity (which was included but is poorly populated). Other means outside the IIS/HL7 immunization message should be used to gather disability information, while recognizing it is important to understand how well people of all abilities are being vaccinated.
