  - id: ta-q02-033
    group: Error Severity and When to Reject
    question: What do R and RE usage mean for a receiving system? Must an IIS reject all messages with R (required) violations?
    answer: No. The IIS must raise an error, but it can declare how severe the error is through ERR-4 (and need not reject the message).
