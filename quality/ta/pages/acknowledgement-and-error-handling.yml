  - id: ta-q07-004
    group: Error Severity and When to Reject
    question: Vendors ask an IIS to return ACK errors when COVID-19 data elements that CDC requires (e.g., sex, race) are missing, even though the IIS doesn't normally require them. Is an IIS expected to return ACK errors for these elements?
    answer: No. IIS shouldn't change their ACK behavior for COVID vaccination events compared with non-COVID events. Every element the IIS reports to CDC has an option for Unknown (or blank), so the IIS can still report to CDC when a submitter leaves those elements empty.
