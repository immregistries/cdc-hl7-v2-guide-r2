  - id: ta-q08-018
    group: Warnings and Informational Messages
    question: An IIS silently ignores data sent in fields it has constrained to X (not supported) rather than returning a warning in the ACK. Are there scenarios where a warning would be helpful?
    answer: In general it would be rare to warn about this. A site should only nag when it matters for data quality and the IIS's business functions. Too much nagging about unimportant things trains people to ignore warnings, and that applies to HL7 ACKs too. HL7 doesn't require an ACK to document every difference in expectations.
