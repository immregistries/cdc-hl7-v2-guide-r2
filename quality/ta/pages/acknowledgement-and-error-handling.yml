  - id: ta-q11-016
    group: AART Assessment Findings on ACKs
    question: Why does an IIS fail AART Submission Assessment Measure 13 when the test message was not accepted, and how does its ACK differ from one that passed?
    answer: 'Measure 13 has two components: (1) the ACK must indicate there is a problem with the message and must conform to the implementation guide (validated with NIST), and (2) the ACK must have MSA-1 = AE and at least one ERR segment with ERR-4 (severity) = E. In this case both test case ACKs did not conform to the standard according to NIST. The test details screen in AART shows, at the bottom, why the ACK did not meet standards, which can be used to improve the acknowledgement.'
    status: answered
