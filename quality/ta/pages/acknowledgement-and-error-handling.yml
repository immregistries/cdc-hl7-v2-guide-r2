  - id: ta-q02-068
    group: Malformed Messages, Authentication and Transport-Level Errors
    question: How should authentication errors be returned?
    answer: If the error is in a parameter of the CDC WSDL (e.g., credentials), the CDC WSDL's SecurityFault should be returned. If the error is in the HL7 content, it should be returned as an HL7 error (e.g., MSH-4 is invalid).
