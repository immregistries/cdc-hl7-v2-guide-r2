  - id: ta-q19-022
    group: Warnings and Informational Messages
    question: Should an IIS return informational warnings in the ACK telling submitters which fields of a demographic-only update (ADT or VXU) were or were not applied, given that most submitters ignore informational warnings?
    answer: 'Informational ERR segments are indeed likely not to be read, though that doesn''t mean you shouldn''t send them. Current best practices for both patient and vaccination data require the IIS to decide how received data is integrated into the official patient record, so a submitter cannot be assured that any accepted update will change the official record (e.g., historical vaccinations may be ignored, or the IIS may prefer a name spelling from vital records over the EHR''s). Furthermore, ADT is a "broadcast all, take what you need" exchange: the default expectation is that receivers take what is useful and silently ignore everything else. AIRA asked for a concrete example of a field the IIS would not update to give more specific direction.'
    status: partial
