  - id: ta-q30-009
    group: Error Severity and When to Reject
    question: The IIS accepts serology observations but not a particular (valid) serology code it received. How should it respond? Is it valid to acknowledge the message was understood but not store the data?
    answer: Do not tell a site that sent a valid code to correct and resend its message. To stay conformant, the most the IIS should do is return an informational result (severity I) saying the serology is good information but will not be saved. It is valid for the IIS to acknowledge it understood the message and not store that data.
