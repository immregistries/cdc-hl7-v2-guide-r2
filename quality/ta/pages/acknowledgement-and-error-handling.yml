  - id: ta-q09-001
    group: Error Severity and When to Reject
    question: An IIS returns MSA-1 = AE with ERR-3 = 207^Application internal error^HL70357 ("Internal error prevented the completion of this request - Message Rejected") for a fully populated administered-vaccine VXU. What causes it and how should it be handled?
    answer: Through trial and error AIRA found that removing the OBX segment that reports the dose-level vaccine funding source caused the message to be accepted, so that OBX appeared to trigger the internal error. An IIS should be able to accept a message with this OBX present even if it does not use that data; unwanted data should simply be ignored rather than causing the message to be rejected. Because the same OBX is used in many test cases, this defect affected results across several assessment content areas (Submission and Data Quality Incoming). The IIS forwarded the finding to its vendor, but a fix had not been confirmed at the time of the record.
