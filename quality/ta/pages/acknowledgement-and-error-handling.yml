id: acknowledgement-and-error-handling
kind: topic
title: Acknowledgement & Error Handling
overview: 'Questions in this section concern how an IIS should build and populate ACK (Z23) messages: overall ACK formatting, how MSA-1 and ERR-4 severity should signal rejection versus acceptance, and how to handle partially valid messages. Recurring themes are the meaning of ERR-4 = E (the submitter must correct and resubmit), not rejecting valid-but-unused data, how much to "nag" with warnings, AART assessment findings about ACKs, and which response (ACK vs RSP) to use for problem queries. Several questions were logged without answers.'
suggested:
  - State explicitly that receivers must not reject or raise errors on optional/unsupported OBX observations (e.g., dose-level funding source) and should ignore data they do not use.
  - Clarify when a Z23 ACK versus a Z33 RSP is expected for query parsing and validation failures.
  - Document expected IIS response time for synchronous VXU/QBP exchanges.
  - Consider documenting partial-acceptance semantics (keep good data vs. all-or-none) and ACK retention expectations, which were asked about but not covered.
