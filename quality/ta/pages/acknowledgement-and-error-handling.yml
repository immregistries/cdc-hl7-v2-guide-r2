  - id: ta-q33-008
    group: Error Severity and When to Reject
    question: When RXA-5 is an NDC the IIS does not recognize, the IIS returns only warning-level ERRs (e.g., "vaccination cvx code is missing", "ndc code is unrecognized"; no ERR-4 = E), so the message appears accepted, but a later query shows the vaccination was not stored (only a CVX 999 unknown dose). Is this correct?
    answer: No. If vaccination events are being lost while the EHR is told the message was accepted, the ACK is misleading; an IIS that cannot store a vaccination event should indicate that with an error-level (ERR-4 = E) response so the sender corrects and resubmits. AIRA found this behavior came from a configuration of the vendor's test endpoint that did not match how any of its IIS clients are configured, and asked the vendor to reconfigure the endpoint to behave like an IIS would. After reconfiguration, the false-positive test results were resolved.
