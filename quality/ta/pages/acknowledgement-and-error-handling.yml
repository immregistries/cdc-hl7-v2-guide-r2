  - id: ta-q17-005
    group: Errors for Query Messages
    question: 'When an IIS receives a QBP with problems, should it return a Z23 ACK or a Z33 RSP? (Options: (1) Z23 for parsing/validation issues, Z33 for IIS-side errors and no results; (2) Z23 only when the query cannot be parsed, Z33 for everything else; (3) Z33 for everything.)'
    answer: 'Figure 40 of the CDC IG (query response decision flow) corresponds to option 1. Option 3 is not correct per that diagram. However the decision is not very critical: either option 1 or 2 should work, as long as the ERR segment clearly explains why a matching result cannot be returned. EHRs generally do not distinguish much between a Z23 and a Z33; they treat both as a negative match indication.'
