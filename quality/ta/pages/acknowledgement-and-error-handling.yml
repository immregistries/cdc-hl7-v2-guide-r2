  - id: ta-q09-030
    group: ACK Timing, Batching and Retention
    question: An IIS improving response time is considering skipping address validation, which adds about 200 ms per VXU. Is that tradeoff worthwhile?
    answer: Once response time is around 1-2 seconds, optimization should shift from reducing response time to (1) maximizing total throughput (e.g., multiple servers), even if individual responses are slightly slower, and (2) returning as much information as possible in the ACK. It is better to return the final disposition and any problems found after 2 seconds than to respond in 0.5 seconds saying the message was received but not fully processed. For this IIS, a 200 ms wait was worth it if address quality issues can be reported back in the ACK. (AIRA testing checks that IIS respond in under 5 seconds; formal documented guidance was not identified.)
    status: answered
