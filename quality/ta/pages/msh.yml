    question: VXU doesn't support patient management workflows such as merging, linking and unlinking patients. Is there an HL7 v2 standard for these events?
    answer: Yes, ADT (Admit Discharge Transfer) messages, widely used in health systems for patient management. ADT is a fairly basic message with patient segments (PID, PD1, etc.), and the trigger event in MSH-9 tells sender and receiver which workflow is intended (e.g., register new patient (A04), merge patients). There is no immunization-specific IG for ADT, but HL7 v2.5.1 references for ADT_A04 and the full list of ADT trigger events are available online. For internal use (UI to HL7 processing) the system can decide which segments, fields and trigger events to support. A couple of IIS accept ADTs today to establish a relationship between a provider organization and a patient.
