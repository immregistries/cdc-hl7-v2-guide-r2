  - id: ta-q19-008
    group: MSH-23 Receiving Responsible Organization
    fields:
      - MSH-23
    question: An IIS plans to populate response MSH-23 with MSH-23.6 = a local assigning authority, MSH-23.7 = a local identifier type code (e.g., `VACMANPIN`), and MSH-23.10 = an ID echoed from query MSH-22.10. NIST reports the MSH-23.7 value is not a member of value set HL70203_IZ. Since base HL7 table 0203 has "suggested values", is a local value acceptable?
    answer: 'The NIST tool is working correctly. The identifier type code (component 7) must come from HL7 table 0203 to pass the national guide and NIST validation. Possible table 0203 values that could fit such a provider PIN include FI (Facility ID), PRN (Provider Number), RI (Resource identifier), and XX (Organization identifier). However, be cautious about requiring submitters to use components 6-10 of MSH-22: although supported in the guide, few IIS implement them and NIST has not certified EHR systems to support these components, so requiring them would likely cause some systems to struggle to connect. More typically IIS expect a value in MSH-22.1 (Organization Name); while it is a string not tied to a table, it is where IIS commonly ask submitters to put an IIS-assigned value. Accepting the PIN in MSH-22.1 would work with certified systems today.'
    status: answered
