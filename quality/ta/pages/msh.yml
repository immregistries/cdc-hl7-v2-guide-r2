    question: Should practices send MSH-4 on QBP messages?
    answer: 'MSH-4 works similarly on QBP and VXU. ONC guidance: the IIS must track the onboarding process for each provider organization from registration of intent through production, including communications. Once in production, however, there is no requirement that the IIS track submissions or queries by provider organization. So if the IIS can manage onboarding for each provider organization by some other mechanism (e.g., non-HL7 methods) and it doesn''t need MSH-4 to operate, there is no reason to require the field. If MSH-4 isn''t required for submission, it likely isn''t needed for queries either, unless the IIS has different business rules or policy for record access during queries.'
