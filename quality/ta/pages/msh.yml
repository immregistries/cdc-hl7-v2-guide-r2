    question: A submitter sends `MSH|^~\%26|` (URL-encoded `&`) instead of `MSH|^~\&|`. Is MSH-2 valued `^~\%26` acceptable?
    answer: 'No. The IG (and the NIST validator) requires conformance statement IZ-13: MSH-2 (Encoding Characters) SHALL be valued `^~\&`. There is no reason to URL-encode HL7 content when it is not being delivered via a URL (for example, when sent via the CDC WSDL SOAP transport), and the submitter is inconsistent anyway since it did not URL-encode the `\` (%5C) or `^` (%5E). The IIS should push back on the submitter to send the correct encoding characters rather than taking responsibility for correcting an unnecessary encoding.'
