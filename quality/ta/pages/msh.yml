  - id: ta-q44-014
    group: MSH-3 Sending Application
    fields:
      - MSH-3
    question: Is there a maximum length for MSH-3 (Sending Application)? A local IG lists 20 characters but the CDC IG does not; where did the limit come from, and what maximum is recommended?
    answer: The current CDC IG does not specify a maximum length for MSH-3; it has generally moved away from specifying field lengths unless there is a clear interoperability need. The 20-character limit likely came from older HL7 versions, where base-standard lengths were commonly copied into IGs. HL7 conformance has since clarified that those lengths are not normative; explicit mechanisms exist when min/max lengths must be specified, and otherwise historical lengths are general guidance. IIS are not required to enforce a 20-character maximum and should not validate it solely for conformance. Validate lengths only when needed for the IIS's own storage or processing; unnecessary length checks create avoidable interoperability problems.
    status: answered
    asked: 1
    messages: VXU
    related:
