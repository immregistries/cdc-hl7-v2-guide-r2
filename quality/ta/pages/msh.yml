  - id: ta-q20-004
    group: MSH-10 Message Control ID
    fields:
      - MSH-10
    question: How commonly do EHRs populate the query tag (QPD-2) and message control ID (MSH-10) with unique IDs versus static values, and how should a receiving IIS treat them?
    answer: MSH-10 is required to be unique at least for the date of the message and for the sender in MSH-4, so it should not be hard-coded and reused, although a sender could reuse an ID on a different day. In practice some systems rely on the message ID heavily, even refusing to process the same ID twice, and it is commonly used to look up failed messages, so most mature systems are expected to use strongly unique IDs. Similar strategies are expected for the query tag; using the same value for both is fine. The query tag is only critical for deferred queries (request now, check progress later), and the national guide supports only immediate queries, so it is not really needed. As a receiver, it is easiest to simply echo back what was sent and not tie any other critical business rules to these values.
