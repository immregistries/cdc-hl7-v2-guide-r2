    question: An IIS has a hard stop when MSH-5 or MSH-6 is blank or not the expected value, but neighboring IIS it will exchange with may not populate them. Is that the standard, and will the IZ Gateway populate them?
    answer: MSH-5 and MSH-6 are RE in the IG, meaning if there is a value it must be transmitted. The guide does not say whether sender or receiver defines the values; it leaves that to local negotiation. The IZ Gateway does not modify the message, so the sender must populate correct MSH-5/MSH-6 values. It is reasonable to expect sending systems to configure MSH-5 and MSH-6 according to the receiver's requirements, since they are addressing the message and want it routed properly.
