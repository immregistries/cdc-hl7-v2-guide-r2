id: msh
kind: segment
title: MSH Message Header
overview: Other recurring themes are timestamp handling in MSH-7 (time zones, precision), acknowledgement mode fields (MSH-15/MSH-16), message type and profile identifiers (MSH-9, MSH-21) for ACK and RSP messages, and the use of MSH-8 for security credentials versus moving credentials to the CDC WSDL transport.
suggested:
  - Provide national guidance on identifying the querying location in QBP headers.
  - Recommend that ACK MSH-5/MSH-6 echo the VXU MSH-3/MSH-4 values.
  - Clarify that AR applies to any unsupported MSH-9 value, including trigger event (MSH-9.2) and message structure (MSH-9.3).
  - Define the roles of and relationships among MSH-4, MSH-22, ORC-17 and RXA-11, whether IIS should validate MSH-22 against the authenticated sender, and the severity (E vs W) for mismatches.
  - State that historical base-standard field lengths (e.g., 20 characters for MSH-3) are not normative.
  - Clarify MSH-15/MSH-16 usage (Release 1.5 ambiguity resolved in the Addendum) and the status of enhanced acknowledgement mode.
