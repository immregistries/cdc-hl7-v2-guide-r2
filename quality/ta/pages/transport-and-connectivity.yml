    group: Segment Terminators in SOAP Payloads
    question: In CDC WSDL testing, CR LF (0d0a) segment separators in the hl7Message element are stripped on the way into the IIS, and in the ACK they are turned into spaces, so messages cannot be parsed without workarounds. What is the expected behavior?
    answer: From a testing perspective, the transport layer must not alter the HL7 content. Segment terminators in the hl7Message element should arrive intact, and responses should not have line terminators turned into spaces, so messages parse without manual work by the client. The IIS suggested that senders replace carriage returns with line feeds before placing content in hl7Message (matching IZ Gateway traffic and its reading of Appendix B). AIRA noted that this is a client workaround that does not fix the outbound stripping, and asked the IIS to review the logs of intermediate systems to confirm whether content was being altered. The issue remained under investigation.
