  - id: ta-q13-018
    group: Performance, Volume, and Retry Behavior
    question: Is the CDC WSDL web service timeout set by each jurisdiction, with no hard rule, so that some IIS allow longer timeouts and accept batch files over the WSDL? (The IIS has a 10-second timeout and is considering batch uploads/queries via the WSDL, including from the IZ Gateway.)
    answer: A timeout normally happens when one side gives up on a connection because of inactivity. When a large file is being loaded there is continuous activity, so the connection simply stays open longer. A 10-second limit may therefore be an IT network policy that ends any connection open longer than 10 seconds. The record does not say definitively whether the timeout is set by the jurisdiction.
