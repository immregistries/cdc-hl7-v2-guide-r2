  - id: ta-q36-012
    group: Performance, Volume, and Retry Behavior
    question: Is there a standard for how many HL7 messages per time period an IIS should be able to process without performance degradation? Should capacity be based on current volume or a set standard?
    answer: 'There is no official national standard for IIS message volume capacity. In the Measurement & Improvement initiative, the performance standard is that 95% of responses return within 5 seconds. This is a low bar meant to catch systemic underperformance, and it is tested in pre-production with controlled traffic. Production systems should aim to be faster; about 1 second is typical in normal use. Rather than basing targets strictly on current volume, build a baseline performance profile: monitor average and percentile response times for updates and queries, track performance over time and at peak hours, and watch for degradation as volume grows. Degradation usually means better provisioning is needed (compute, database, or interface engine changes). AIRA''s Security Guidance recommends capping query volumes per site, especially for low-security endpoints, so one provider cannot degrade performance. The TAB on Scenarios for Updates and Queries encourages coordination with high-volume partners (e.g., a hospital querying its whole population at once). Acceptable performance is ultimately up to each IIS, but most will want to exceed the national minimums.'
    status: answered
    asked: 1
    messages: VXU, QBP, general
    years:
      - 2025
  - id: ta-q07-022
    group: Performance, Volume, and Retry Behavior
    question: Mass vaccination sites may administer 50,000+ doses a day. Have IIS raised concerns about VXU and query volume, and how should submitters reduce the impact?
    answer: 'AIRA asked IIS vendors and a few states with standalone IIS. None raised specific concerns, though volume increases are always a concern and they appreciated the warning. Recommendations: (1) Keep communicating with IIS as usual. (2) 50,000 doses a day is not a show-stopper by itself, but queuing all 50,000 and sending them in one batch at the end of the day is a problem, so spread submissions across the day. (3) Control query patterns to avoid repeat queries for the same patient. Sending 50,000 queries at once the night before can cause problems, especially with multithreaded clients. (4) Tell the IIS program staff ahead of time when high-volume sites will start and what volumes to expect. (5) Impact is relative: a very large IIS may barely notice the increase, while smaller IIS will feel it more. IIS had been preparing for higher loads, but actual loads are hard to predict.'
    status: answered
    asked: 1
