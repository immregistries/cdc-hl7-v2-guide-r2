    question: For an interface risk assessment worksheet, how should an IIS describe the HL7 interface's message format, planned encryption, and source authentication?
    answer: 'Message format: HL7 v2 encoded as a parameter in an HTTPS POST, or HL7 v2 embedded in a SOAP transaction (the IIS likely supports both, possibly others). Encryption: depends on the production interface. State the TLS version used and whether specific certificates are required. Source authentication: username/password supplied in HTTPS POST parameters or in the SOAP message, plus any other requirements such as IP whitelisting or specific certificates. The endpoint is the URL given to submitters for the message-processing hub, not the main web application login URL.'
