  - id: ta-q20-005
    group: SOAP Faults and Transport-Level Errors
    question: If a backend API used by the IIS SOAP service fails (e.g., timeout, too many requests, HTTP 4XX-5XX), should the IIS return a Z23 ACK or a SOAP fault?
    answer: 'Rule of thumb: if the problem is in processing the HL7 message, return an HL7 response. If the problem is with transport, authentication, or the SOAP envelope, return a SOAP Fault. These errors mean the IIS cannot process the message for reasons unrelated to its content, so this is probably a Z23 ACK with MSA-1 = AR (one of the rare appropriate uses of AR), with as much detail as possible in ERR segments so the sender knows what to do. The IIS has a lot of discretion here, and AIRA cannot test these conditions. Either approach is acceptable as long as the message is clear and the receiver knows what to do.'
    status: answered
