  - id: ta-q03-081
    group: Troubleshooting Connectivity
    question: A submitter's CDC WSDL requests fail because of the HTTP Content-Type (e.g., "HTTP 415 Unsupported Media Type", or VXUs succeed but QBPs are rejected). How should the SOAP 1.1/1.2 content type be set?
    answer: 'The problem is most likely the Content-Type header. This is common: the submitter sends the SOAP 1.1 content type while the server expects SOAP 1.2, or the other way around. It cannot be troubleshot without seeing the HTTP headers on the request. In the 415 case (ConnectionTest and SubmitSingleMessage worked from SoapUI but not from the submitter''s system), capture and compare the headers the submitting system sends with the ones SoapUI sends. In an earlier case (2019), AIRA gave background on how the SOAP 1.2 content type should be populated (details not recorded) and referred the IIS to another IIS working with the same provider organization.'
