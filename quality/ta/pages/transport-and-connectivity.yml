    question: Is there a CDC-mandated date by which all IIS must accept submissions only over the CDC WSDL, with data at risk of not being accepted by CDC otherwise?
    answer: No CDC-mandated deadline is known that requires IIS to use only the CDC WSDL. The CDC WSDL was selected as the preferred transport and IIS were encouraged to support it. As of 2024, 59 of 61 IIS had a CDC WSDL available that met the Basic level of support, so most interfaces can be moved to it. The WSDL is a standardized transport and does not change the data, and CDC accepts data from IIS however the IIS received it. IIS were told they could keep legacy interfaces indefinitely, though some choose to retire older methods to reduce maintenance. Vendors may benefit from moving all their IIS partners to the CDC WSDL for consistency and less complexity.
