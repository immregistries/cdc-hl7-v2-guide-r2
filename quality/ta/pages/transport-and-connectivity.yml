  - id: ta-q31-005
    group: 'SOAP Payload: Encoding, Escaping, and Message Count'
    question: How should HL7 reserved characters be escaped when an IIS returns RSP/ACK messages inside the CDC WSDL submitSingleMessageResponse? (One IIS was double-escaping, e.g., `MSH|^~\&amp;amp;|` and O'Brien as `O&amp;#39;Brien`.)
    answer: Only a single XML escape is needed. The ampersand in MSH-2 should appear as `&amp;` in the XML, not `&amp;amp;`. The extra "amp;" causes some parsers to misread the HL7. Escaping the apostrophe as `&amp;#39;` also parsed poorly (AIRA's test tooling could not interpret it). A simpler, broad approach is to wrap the whole HL7 message in a CDATA section, e.g. `<return><![CDATA[MSH|^~\&|...rest of message...]]></return>`. CDATA removes the need for character-specific escaping, so values such as "&" and O'Brien can be returned as-is without complicated escaping logic for HL7 embedded in XML.
    status: answered
