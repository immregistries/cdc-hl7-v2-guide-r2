  - id: ta-q17-001
    group: Endpoints, Routing, and Intermediaries
    question: Is there summary information on active immunization HIEs, and what are the drawbacks of routing immunization HL7 messages through an HIE?
    answer: No definitive tracking of active immunization HIEs was found, and AIRA said it would look further. Anecdotally, most HIEs involved are pass-through intermediaries that do not store immunization data, similar to the IZ Gateway. The main problem seen is when the HIE does not return the IIS acknowledgement (ACK) to the provider. The provider may then believe the IIS is accepting all its data when the IIS is in fact rejecting some of it, and because the HIE does not relay the ACK showing the rejection, the provider never finds out. Some HIEs also had to work harder to build and support the CDC WSDL, though that is largely resolved. Otherwise, major issues are not commonly reported, and HIEs could help supplement IIS data, for example with better demographic data (race, ethnicity, name and address changes). A 2019 document listing other problems was shared, though some items may no longer be relevant.
