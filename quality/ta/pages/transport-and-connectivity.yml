  - id: ta-q04-067
    group: Implementing and Verifying a CDC WSDL Endpoint
    question: Must the operation names and parameters in an IIS's WSDL match the CDC WSDL exactly?
    answer: 'Yes. Operation names and parameters must be exactly as defined in the CDC WSDL. Otherwise EHRs must build special operations just for that IIS. For example, the connectivity test operation must be named connectivityTest (lowercase c) with a single parameter echoBack, and names must match exactly, including case. AIRA tests three things: connectivityTest, submitSingleMessage, and the SecurityFault. Publicly available, validated endpoints (e.g., some IIS test WSDLs) can be used as references.'
