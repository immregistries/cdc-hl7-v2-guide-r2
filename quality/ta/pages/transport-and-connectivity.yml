  - id: ta-q23-020
    group: Alternative Transports (REST, HTTP, FTP, Batch, Asynchronous)
    question: People talk about "SOAP" and "HTTP" connections when moving providers from an intermediary to point-to-point connections with the IIS. Are these two separate methods, or related?
    answer: They are related. SOAP sends its information over an HTTPS connection, so a SOAP connection uses both SOAP and HTTPS. An "HTTP" connection means HTTP is used directly, with no additional standard defining the request. SOAP adds a standard framework for formatting the request and data, which makes connections smoother for submitting systems. Middleware users (e.g., Rhapsody) use these terms as shorthand for connection types. For the IIS, they should use a SOAP connection (the CDC WSDL), not a plain HTTPS connection.
