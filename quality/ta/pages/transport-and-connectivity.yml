  - id: ta-q25-007
    group: Segment Terminators in SOAP Payloads
    question: An IIS returns ACK and RSP messages over the CDC WSDL without segment terminators, so all segments appear on one line. Is this acceptable?
    answer: No. Segments must be separated by the HL7 segment terminator (carriage return) so each segment is on its own line. Without terminators the ACK and RSP are off standard and hard to parse. AIRA sent examples comparing the IIS's ACK with a typical IIS response and pointed to the CDC WSDL appendix that covers this requirement. The IIS believed the problem happened after the message left its system, and the issue was left unresolved.
