  - id: ta-q29-019
    group: SOAP Faults and Transport-Level Errors
    question: CDC WSDL transport testing reported that the SecurityFault child elements are not in the SecurityFault namespace. How should the SecurityFault be structured?
    answer: 'AIRA checked the result in SoapUI and in the NIST tooling directly. Both showed the same returned structure: the soap: prefix was present, but the SecurityFault child elements were not in the SecurityFault namespace (urn:cdc:iisb:2011). Connectivity Test and Submit Single Message pass because they lack the nested structure that SecurityFault needs. The child elements (Code, Reason, Detail) must be qualified in the urn:cdc:iisb:2011 namespace, either by giving them the same prefix as SecurityFault (e.g., ns2:Code, ns2:Reason, ns2:Detail) or by using default namespace declarations instead of prefixes. For example, declare xmlns="urn:cdc:iisb:2011" on SecurityFault so unprefixed Code/Reason/Detail inherit it, inside a SOAP 1.2 Fault with Code/Value = Sender, Reason/Text, and Detail. Example: SecurityFault Code 10 with Detail "Invalid Username or Password". The NIST IZ tool (hl7v2-iz-r1-5-testing.nist.gov/iztool, SOAP connectivity tests) can test an endpoint directly against the CDC WSDL specification.'
    status: answered
