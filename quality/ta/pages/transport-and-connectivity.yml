  - id: ta-q33-009
    group: Segment Terminators in SOAP Payloads
    question: In CDC WSDL testing, HL7 segments were sometimes separated by line feeds instead of carriage returns, and the IIS returned a very generic error. Which end-of-line characters should separate HL7 segments in a SOAP payload, and how should an IIS handle the alternative?
    answer: 'The HL7 standard requires each segment to end with a carriage return (ASCII 13, \r, #xD). The XML standard that SOAP is built on normalizes end-of-line characters to a line feed (ASCII 10, \n, #xA). In practice the two get mixed up, and HL7 sometimes arrives separated by XML line feeds. An IIS that accepts only carriage returns is not off-standard, but it should either give clearer error messages when this happens or, as most IIS have done (based on AIRA testing), be more forgiving and accept the other line-ending characters. See Appendix B of the CDC WSDL transport specification. This is not required to pass AART tests. The IIS in this case later fixed it.'
    status: answered
    asked: 1
    messages: general
    related:
