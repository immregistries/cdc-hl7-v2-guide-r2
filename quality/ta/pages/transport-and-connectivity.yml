  - id: ta-q11-006
    group: Implementing and Verifying a CDC WSDL Endpoint
    question: How can an IIS add a new operation (e.g., submitMultipleMessages()) to the CDC WSDL as an extension, given compile problems caused by references to the CDC namespace?
    answer: Extensions are generally left to implementers, as long as the CDC-defined operations, faults, etc. are not changed and the WSDL stays backwards compatible. The simplest approach is to add the new operation to the IIS's copy of the CDC WSDL and present it to the tooling stack as if it were part of the CDC WSDL base. Anyone retrieving the WSDL would see an extra operation, but this does not affect the other operations. AART testing checks the operations, not the WSDL itself, and would not notice the extra operation. Alternatively, a second WSDL could be created that leaves the CDC WSDL as is, though this would mean two different endpoints.
