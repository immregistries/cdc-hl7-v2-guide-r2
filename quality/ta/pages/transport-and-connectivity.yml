  - id: ta-q03-101
    group: 'SOAP Payload: Encoding, Escaping, and Message Count'
    question: An IIS updating its CDC web service will drop Base64 encoding of the HL7 payload and wants to require senders to wrap the message in a CDATA section. Is that okay?
    answer: 'CDATA and XML escaping are part of the XML encoding standard that SOAP is built on, not part of the CDC WSDL or SOAP standards, which is why the CDC WSDL documentation does not detail them. It is fine to recommend CDATA for encoding the HL7 data, but the IIS should still support either method: CDATA, or escaping characters with XML entities (e.g., `&` as `&amp;`).'
