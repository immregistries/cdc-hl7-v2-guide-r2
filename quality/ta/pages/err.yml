    group: ERR-4 Severity
    fields:
      - ERR-4
    question: The ACK guidance says W means the sender must correct the issue but does not have to resend. How is it corrected if it is not resent?
    answer: W is used for systemic problems, placeholder data and similar issues, such as a phone number of 555-1212. These are usually best reviewed in aggregate over a week, month or quarter to find data quality improvement opportunities. A W on an individual message is not concerning, but if the same W shows up in every message the sender should fix its system or process going forward; the correction applies to future submissions rather than resending that message.
