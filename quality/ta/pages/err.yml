  - id: ta-q35-010
    group: ERR-5 Application Error Code
    fields:
      - ERR-5
    question: An IIS wants to return an informational ERR when it accepts an RXA update (RXA-21 = U), using ERR-3 = 0 (Message accepted). Is ERR-5 then mandatory? Table 0533 has no success code - can the IIS create its own, or will that fail AART testing?
    answer: New ACK formats should always be checked with the NIST IZ Tool; if the ACK passes, its structure will not cause problems in Measurement & Improvement (M&I) testing. ERR-3 is not a critical field and provides little value; M&I only verifies the code comes from the correct table. `0^Message Accepted` is appropriate and means the issue did not prevent the message from being accepted or the update action from being taken. ERR-5 is RE, so if there is no applicable application error code it can be left blank; NIST and M&I both accept this. Alternatively, a local internal application error code can be placed in ERR-5, which is what the field was originally defined for. The recommendation is to leave it blank for now and adopt the expanded, coordinated set of application error codes AIRA was preparing for release (around March 2025), along with forthcoming Advanced ACK guidance.
    status: answered
    asked: 1
    messages: ACK
