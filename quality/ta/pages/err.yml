  - id: ta-q34-005
    group: ERR-4 Severity
    fields:
      - ERR-4
    question: How can an IIS indicate that it rejected one vaccination in a VXU but accepted the others, if AE with W means accepted and AE with E means failed?
    answer: This is not possible in the base HL7 v2 standard, which has no concept of a partially accepted message. An ERR segment with ERR-4 = E is interpreted as a rejection, full or partial, telling the EHR that some data was not saved and the submission must be fixed and resubmitted. If the IIS is satisfied with the message and does not expect resubmission, the highest ERR-4 severity it should use is W. AIRA's short ACK guidance document describes the logic AART uses. The partial-acceptance concept was raised with the SISC ACK improvement group; it is out of scope for the current improvements but on the radar, and SISC is developing an "Advanced ACK".
    status: answered
    asked: 1
    messages: ACK
    related:
