  - id: ta-q45-007
    group: ERR-4 Severity
    fields:
      - ERR-4
    question: Does ERR-4 = E mean the entire message was rejected, or can E be returned when only one piece of data (e.g., a field-level validation failure such as code 207) was rejected?
    answer: ERR-4 = E does not indicate whether the IIS processed the message; it indicates whether the sending system needs to fix the issue and resubmit. If the IIS could not save the patient or vaccination because of the problem, it should send E in ERR-4. Even when ERR-4 = E is sent, the IIS may still choose to process and accept some of the data in the message; it may, but is not required to, reject the entire message. More detail is in AIRA's latest ACK TAB (https://repository.immregistries.org/resource/tab-resources/).
