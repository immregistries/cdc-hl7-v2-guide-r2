  - id: ta-q24-012
    group: ERR-2 Error Location
    fields:
      - ERR-2
    question: What is the correct format for ERR-2 (Error Location)? An IIS encoded locations as `PID^7` or `PID^^5.2`.
    answer: 'Each part of the location belongs in its own component rather than using dotted notation: segment ID ^ segment sequence ^ field position ^ field repetition ^ component number. For example, an error in PID-7 is written `PID^1^7` (segment ID, then segment sequence where 1 = first PID, then field position), and an error in PID-5.2 is `PID^1^5^1^2`. The sequence matters little for PID but is critical for segments that can repeat, such as RXA. Changing `PID^7` to `PID^1^7` passed the AART test, which checks that the error is reported in PID-7 (2023). For `PID^^5.2`, the extra ^ was not the real problem; the issue was the dotted notation (2025). The question of whether ERR-2 can repeat was not specifically addressed; the TA offered to review the original ACK to confirm all needed changes.'
    status: answered
