  - id: ta-q34-003
    group: ERR-4 Severity
    fields:
      - ERR-4
    question: Does an ERR-4 = E cause AART to treat a message as not accepted, and where is it stated that E means the message was not accepted (is it from NIST)?
    answer: 'Yes. Any ERR segment with ERR-4 = E causes AART to interpret the message as not accepted (rejected, fully or partially), so the test case fails (e.g., an ACK with AE, one W and one E "VIS Identifier submitted value is not a valid option. Data rejected."). The AART testing log shows how each test case is assessed. The interpretation comes from AIRA/SISC guidance documents rather than NIST: "Guidance for HL7 Acknowledgement Messages to Support Interoperability" and "Guidance for HL7 RSP Messages to Support Interoperability" explain ERR-4 = E and describe how AART evaluates test cases.'
