  - id: ta-q17-006
    group: RCP-2 Quantity Limited Request
    fields:
      - RCP-2
    question: What is a reasonable value for an EHR to send in RCP-2 as the maximum number of Z31 candidates, and is there IIS data to help choose it?
    answer: 'There is no consensus-based national recommendation, and the AIRA Functional Guidance for Query-Response does not specify a number. RCP-2 is set by the querying system to indicate the maximum number of potential matches the IIS should return; the IIS may also have its own internal limit, and the lower of the two should apply. Values of 10 and 30 have been seen in practice but are probably too high for busy clinic staff; several reviewers felt 10 is likely too many and 5 seems reasonable. One clinical perspective: if candidates are returned with equal likelihood, limit to a smaller number (around 5); if likelihood scores are returned, the cutoff could instead be based on match likelihood (e.g., 90% or greater). The right number depends heavily on how well each IIS matches records, both in consolidating histories and in responding to queries, which varies by IIS, so a universal recommendation is difficult. The question was taken to the May 2022 HL7 Immunization User Group for a poll of IIS on their maximum multiple-match return count and to a later community panel on query functionality.'
    status: partial
