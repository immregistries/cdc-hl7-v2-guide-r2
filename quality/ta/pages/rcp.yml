  - id: ta-q10-016
    group: RCP-2 Quantity Limited Request
    fields:
      - RCP-2
    question: When returning a Z31 list of candidates for a multiple-match query, is there a limit on how many patients (PIDs) should be returned?
    answer: 'The limit is two-fold: the querying system can (should) specify the maximum number of matches it wants in RCP-2, and the IIS can set its own maximum for policy reasons (not explicitly messaged). Return no more than the smaller of the two; if more matches exist, respond with "too many" candidates. E.g., IIS max 3 and requester asks 5: return up to 3; IIS max 3 and requester asks 2: return up to 2.'
