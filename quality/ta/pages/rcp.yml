title: RCP Response Control Parameter
overview: 'RCP questions all concern RCP-2 (Quantity Limited Request): how many candidate patients a querying system should request, how an IIS should combine RCP-2 with its own maximum, and how the limit interacts with Z31, Z32 and Z33 responses and the too-many (TM) status. A related question asks whether a Z44 query can receive a Z31 list given how the IG constrains RCP-2.'
