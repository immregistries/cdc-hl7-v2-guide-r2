id: qpd
kind: segment
title: QPD Query Parameter Definition
overview: QPD questions cover the query name in QPD-1 (Z34 vs Z44 and the correct coding system), how patient identifiers in QPD-3 should be used and matched (submitter MRNs, IIS IDs, re-querying after a Z31 selection), demographic matching on name and address (QPD-4, QPD-8), and how an IIS should echo the QPD in its RSP even when the query contained invalid or non-conformant values. A recurring theme is that query demographic fields are RE in the national IG and that IIS should not let unknown or missing values block a match unnecessarily.
suggested:
  - Consistently show CDCPHINVS as the QPD-1 coding system.
  - State that the RSP echoes the QPD exactly as received, even with invalid values, and validators should not fail it.
  - Describe how to populate QPD-3 when re-querying after a Z31 candidate selection, including the local MRN.
  - Explain that query demographic fields are RE and give guidance on IIS minimum-match requirements versus local R constraints.
