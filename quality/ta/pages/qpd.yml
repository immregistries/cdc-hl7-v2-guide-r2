  - id: ta-q01-036
    group: QPD-1 Message Query Name
    fields:
      - QPD-1
    question: What are the correct QPD-1 values? The 2.5.1 IG uses both HL70471 and CDCPHINVS as the coding system; for a history request, send `Z34^Request Immunization History^HL70471` or `Z34^Request Complete Immunization History^CDCPHINVS`?
    answer: Use CDCPHINVS. The NIST Immunization Test Suite, which follows the current CDC IG and is used for EHR certification, does not allow HL70471 in QPD-1 for QBP Z34 messages, so for certification always use CDCPHINVS. It works with all IIS. HL70471 may work with some IIS, but it has not been tested and is not seen in practice. The HL7-balloted version of the IG also uses CDCPHINVS (2022). An earlier (2016) question noting that the IG's QPD-1 values appear incorrect has no separate answer recorded.
