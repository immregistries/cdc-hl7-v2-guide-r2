  - id: ta-q07-023
    group: QPD (segment-level)
    question: When the IIS echoes the query's QPD in its RSP, NIST flags conformance errors in the echoed content (e.g., an invalid date, or "The required Component QPD-8.7 (Address Type) is missing"). Does this affect results, and should the IIS flag such values instead of, say, returning NF?
    answer: 'The IIS should echo the QPD back as received, even if it contains invalid values. AART shows QPD conformance errors but doesn''t score them, because the QPD in the RSP is an echo of what the tester sent; some test cases intentionally send poor HL7, so echoed errors sometimes can''t be avoided. In one case AIRA fixed the test case so the QPD-8.7 issue wouldn''t recur (2021). For a query containing an invalid date (2024): NIST will see the echoed date as a problem in the response, but AIRA does not consider it something the IIS should fix, and it should not cause a failure. The test case (probably Query measure 6) is most likely checking that the IIS recognizes the error and returns AE with an ERR segment instead of AA, so returning an error is preferable to only reporting not found.'
    status: answered
