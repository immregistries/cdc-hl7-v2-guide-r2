    question: In IIS-to-IIS query, one IIS may hold a different address for a patient than another. Would sending a different address cause many "not found" responses?
    answer: This has come up before and most IIS reported that address differences would not have a large impact on found vs. not-found results, since matching relies on other demographics as well. Allowing a user to send an address not saved in the IIS via a manual query was considered a good feature to add.
