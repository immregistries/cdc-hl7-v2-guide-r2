  - id: ta-q22-011
    group: QPD-3 Patient List
    fields:
      - QPD-3
    question: 'After a Z31 candidate list, when the clinician selects the correct patient, how should the follow-up query populate QPD-3: (a) echo the identifier list received in the selected PID, (b) send only the local MRN with the registry''s demographics, or (c) send both?'
    answer: The IG does not single out PID-3 identifiers as different from the other PID fields when re-querying from a Z31 selection, so the follow-up query should echo the identifier list (and demographics) returned for the selected candidate, i.e., option (a), which helps the IIS make a single exact match.
