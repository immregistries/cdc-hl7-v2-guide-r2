  - id: ta-q35-011
    group: QPD-3 Patient List
    fields:
      - QPD-3
    question: When a querying provider includes its own MRN in QPD-3 for a patient the IIS has never associated with that provider, the IIS returns no match, but removing the MRN returns the patient. Should an unknown provider MRN prevent a match?
    answer: No. Including the MRN with every query is a customary and encouraged practice, and it is common for a submitter to have no prior relationship with a patient in the IIS (e.g., a patient registers at a pharmacy that then queries the IIS for history). A known provider MRN can help the IIS find a match, but if the IIS does not know that provider's MRN this should not prevent the IIS from finding the patient using the other demographics; the IIS search logic should be reconsidered.
