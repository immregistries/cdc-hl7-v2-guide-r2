  - id: ta-q07-019
    group: QPD-3 Patient List
    fields:
      - QPD-3
    question: How can a submitter retrieve the complete immunization history for a patient it just reported, when QPD doesn't seem to have a unique identifier?
    answer: QPD-3 (PatientList) is the equivalent of PID-3 (Patient Identifier List). Put your MRN in QPD-3 just as you would in PID-3. Most IIS require this field and treat the submitter's MRN as a strong indicator of which patient to return.
