  - id: ta-q12-010
    group: QPD-4 Patient Name
    fields:
      - QPD-4
    question: A consumer portal queries with the identity-proofed legal name (e.g., David) while the IIS record has a nickname (Dave), causing no match. Should the IIS match nicknames, and if so from a pre-generated nickname table or aliases stored on the record, or require an exact name match?
    answer: Most patient matching algorithms handle this through a nickname lookup that links known names as common replacements, typically curated from name resources. If all other data elements agree, matching TIMOTHY to TIM using a pre-generated list (or another technique) is reasonable. Many algorithms compute a confidence score across all demographic elements that must meet a threshold; each IIS needs to decide where that threshold is, and it may be the same or different for VXU and QBP. String comparison techniques such as Soundex, Jaro-Winkler and edit distance also help with nicknames, spelling variants (Sara/Sarah) and city names. Requiring an exact name match from external systems, whose demographics may change without notifying the IIS, will lead to a low match rate. The CDC de-duplication best practices document also covers many matching nuances that remain applicable.
    status: answered
    asked: 1
    messages: QBP/RSP
    related:
      - Patient Matching & Deduplication
