  - id: ta-q25-001
    group: Query (QBP/RSP) Onboarding
    question: Does AIRA have a query-specific (QBP) onboarding form or questionnaire, similar to its VXU Onboarding Questionnaire?
    answer: AIRA has not developed query-specific onboarding documentation. Onboarding best practice is to onboard VXU and QBP messaging at the same time, and when that practice is followed, all of the questions a provider needs to answer are already contained in the AIRA Onboarding Questionnaire. The templated Onboarding Questionnaire does not include all of the query-related questions an IIS might ask on a separate query form, but it is designed to be customized by each IIS, so adding useful query-related questions to it is consistent with best practice. If the IIS onboards VXU and QBP interfaces separately, merging the questions may make less sense and the IIS can instead adapt questions from the questionnaire to its own query form.
