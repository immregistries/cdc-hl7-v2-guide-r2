  - id: ta-q26-012
    group: Interface Lifecycle & Security (Test Credentials, Inactive Interfaces)
    question: The AIRA onboarding SOP template says to disable test interface credentials after a provider goes live in production. Why, when keeping a dual test/production connection makes later upgrades, new vaccine testing, and retesting easier?
    answer: 'It is a general security practice: IIS should not keep open access points with no immediate use. Most providers stay live and do not use the test connection again, and interface accounts are often exempt from password expiration or inactivity deactivation policies, so test interfaces that are never disabled can be a security risk. The SOP is a template. Jurisdictions should follow their own security policies, and if those support keeping test connections (with monitoring and credentials separated by environment), the SOP should be customized.'
    status: answered
    asked: 1
    messages: general
