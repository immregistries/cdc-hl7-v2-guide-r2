  - id: ta-q06-030
    group: Non-HL7 and Non-Traditional Senders
    question: Organizations whose employee-health vaccinations are recorded in non-HL7 applications ask to send COVID-19 doses by spreadsheet. Should the IIS require HL7, and what are other states doing?
    answer: 'Other jurisdictions face the same issue. Prioritized options: (1) employee health enters data into the hospital EHR, which likely already feeds the IIS; (2) employee health enters doses in the IIS user interface; (3) employee health builds and tests an HL7 interface, though this is likely unreasonable given their time/expertise and IIS onboarding capacity; (4) explore a locally installed tool that converts an extracted tab-delimited file of identified data (using the CVRS identified specification for a uniform extract) into HL7.'
    status: answered
