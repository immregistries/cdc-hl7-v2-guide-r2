  - id: ta-q26-013
    group: Legacy (Historical) Data Loads
    question: Why does the onboarding SOP template include legacy (historical) data submission as a requirement, and how do IIS get legacy data from EHRs (e.g., beyond a 90-day retrigger window) without receiving full histories with every new VXU?
    answer: Legacy data loads improve IIS data saturation, and an IIS is most valuable when fully populated. Some jurisdictions (e.g., opt-in states) have policies that prevent legacy loads and should remove the step from their customized SOP. AIRA's guide "Importing Legacy Data to Improve IIS Saturation" (based on a survey of 35 jurisdictions and interviews with IIS and EHR vendors) recommends offering several submission methods to fit different EHR capabilities. Sending a full history with each new VXU is one form of the HL7 single-patient approach. Others include a batch HL7 flat file, which one large EHR vendor prefers for moving large volumes of patient and vaccination data. For the 90-day limitation, the IIS could submit a community information request.
    status: answered
    asked: 1
    messages: VXU
    related:
      - Transport/Connectivity
    years:
      - 2023
  - id: ta-q22-008
    group: Legacy (Historical) Data Loads
    question: 'During onboarding an IIS asks providers how they will send historical data: (a) HL7 real-time batch (single-patient protocol using the real-time interface), (b) HL7 batch file (2.5.1 batch specification), or (c) full immunization history with each new VXU. Is this terminology accurate/standard, and which option would a provider choose if sending real-time via the SOAP service?'
    answer: See AIRA's guide "Importing Legacy Data to Improve IIS Saturation", which covers all three methods. For (a), page 5 describes HL7 single-patient protocol and three approaches to it; if the intent is sending legacy data as individual messages through the interface, the word "batch" should be removed, whereas if it means loading an HL7 batch file of single-patient messages, clarify that. For (b), "HL7 batch" is accurate, but page 8 describes several working definitions of "batch", so describe exactly what the IIS supports. For (c), the phrasing is correct (see page 7). Transport (e.g., SOAP) is separate from these methods and varies by IIS; a provider sending via its existing live SOAP interface would be using HL7 single-patient protocol, most closely option (a).
    status: answered
    asked: 1
    messages: VXU
