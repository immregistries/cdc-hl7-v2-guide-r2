  - id: ta-q20-021
    group: Intermediaries & Multi-Jurisdiction Connections (HIE, IZ Gateway)
    question: When an HIE sits between EHRs and the IIS, what does AIRA validation test, and can the HIE continue to handle onboarding (validating messages, working with EHR vendors, distributing site IDs) as long as it does not modify messages?
    answer: AIRA validation is conducted on whatever endpoint/interface the IIS designates as the official location for submitting updates and queries. AIRA has no requirements on the IIS architecture or how an HIE integrates with the IIS; it only validates that the state (or an HIE on the state's behalf) offers an HL7 endpoint that follows national standards. In practice this usually means the HIE passes messages through to the IIS as-is, but other arrangements may be acceptable as long as submitting systems can connect using current standards and interact normally without modification. AIRA has best practice guidance on streamlining onboarding, but how onboarding tasks and staff are organized is for the HIE and state to negotiate.
    status: answered
    asked: 1
    messages: VXU/QBP
