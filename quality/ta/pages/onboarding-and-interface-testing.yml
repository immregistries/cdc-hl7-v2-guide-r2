id: onboarding-and-interface-testing
kind: topic
title: Onboarding & Interface Testing
overview: Questions in this section cover how IIS onboard submitting and querying partners, how they design and modernize their onboarding processes and documentation, and how interfaces are tested (including by AIRA's AART assessment tool and through intermediaries such as HIEs and the IZ Gateway). Recurring themes include onboarding VXU and QBP together versus separately, legacy (historical) data loads, security hygiene for test and inactive interfaces, the need for automated (not manual) processing during testing, and where to find sample test messages and training. Several questions come from non-HL7 senders (spreadsheets/CSV, employee health, school districts, NHSN) asking how to get data into an IIS.
suggested:
  - The IG does not address identification of individual querying sites in QBP (only MSH-level identifiers) or registration expectations for query-only facilities; site-level tracking is recommended by Security Guidance but not specified (raised for SISC/IGEG).
  - Consider clarifying standard terminology for historical/legacy data submission methods (single-patient protocol vs. HL7 batch file vs. full history per VXU).
  - Consider guidance on implementing delete/update messaging (MSH-10, ORC-3, RXA-21, RXA-22) for senders moving from flat files.
