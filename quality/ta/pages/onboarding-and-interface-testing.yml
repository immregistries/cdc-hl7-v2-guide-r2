  - id: ta-q23-014
    group: Intermediaries & Multi-Jurisdiction Connections (HIE, IZ Gateway)
    question: A national program (e.g., NHSN collecting nursing home data) may report immunizations to state IIS, ideally through a single connection routed by patient address. Where are the specifications for immunization reporting, and can IIS be reached through a single shared connection?
    answer: The HL7 v2.5.1 immunization IG is at https://www.cdc.gov/vaccines/programs/iis/technical-guidance/hl7.html. For a quicker introduction, the NIST IZ test suite (https://hl7v2-iz-r1-5-testing.nist.gov/iztool/#/cf) captures the guide's requirements and has good example messages. For one connection that routes to multiple IIS, the IZ Gateway is the relevant national infrastructure. In a follow-up call AIRA covered the technical side of connecting to IIS, and the program was pointed to the VA's IIS connection process as a model to replicate.
