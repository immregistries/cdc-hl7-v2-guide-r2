  - id: ta-q09-012
    group: Query (QBP/RSP) Onboarding
    question: When an IIS adds bidirectional query, is onboarding needed again for all senders who already submit VXUs? Is the middle of the COVID response a good time to implement?
    answer: 'Some IIS have an additional onboarding testing step for organizations using query, but it is very different from VXU onboarding: there is a large need to check data coming into the IIS and much less need to check data going out. AIRA can provide more detail as the IIS progresses. As for timing, query will be useful as soon as it is available; it may not be critical in a given month for people to get their vaccination history out, but it will be valuable going forward.'
