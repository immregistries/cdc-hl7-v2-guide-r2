  - id: ta-q31-001
    group: AIRA AART / Measurement & Improvement Testing
    question: During AART HL7 testing (including CDS testing), an IIS accepted a VXU with a historical HepA dose but the dose did not appear in the subsequent Z44 query response. Is manually adding the vaccination so the query response can be tested acceptable?
    answer: No. For all HL7 testing, including CDS testing, the IIS is expected to add records automatically from the submitted VXU messages; manual intervention to add or modify a record does not meet the testing requirements. Some flexibility is allowed for the IIS to run normal automated processes such as overnight jobs (e.g., deduplication) before the query is sent, but not manual entry. Practically, CDS testing involves around 900 test cases, so manual entry would not be feasible anyway. A small set of "sanity check" test cases can be run first to confirm the IIS is returning submitted doses before re-running the full CDS test set.
    status: answered
    asked: 1
    messages: VXU/QBP/RSP
    related:
