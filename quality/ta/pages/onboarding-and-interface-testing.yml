      - 2023
  - id: ta-q26-011
    group: Interface Lifecycle & Security (Test Credentials, Inactive Interfaces)
    question: Is there guidance on production HL7 interfaces that are not sending any data? Should there be a policy for checking that connected sites are sending data, and a timeline for disabling an interface when a provider stops sending?
    answer: No formal guidance exists, but there are several considerations. First, find the root cause. Is something blocking messages from reaching the IIS, has the facility closed or changed its practice, or does it only use the interface occasionally (e.g., yearly flu clinics)? Collecting expected volume and vaccine types at onboarding gives a baseline for these decisions. Second, check jurisdictional security policies (e.g., the state privacy/security office) that govern access, inactive accounts and credential expiration, and see whether they cover interface accounts or should be extended to them. Third, use available levers to get the provider sending again, such as state reporting requirements, and warn the provider that the connection may be disabled, which would leave direct data entry as the only way to meet reporting requirements.
    status: answered
    asked: 1
    messages: general
    years:
      - 2023
  - id: ta-q33-019
    group: AIRA AART / Measurement & Improvement Testing
    question: What does connecting (or reconnecting) an IIS test environment to AIRA's AART assessment tool involve, and what information and level of effort are required from the program and IT?
    answer: 'Step 1 is providing connection information for the IIS test environment: the web services endpoint URL; web services credentials (username, password and facility ID); and the HL7 identifier values the jurisdiction requires in test messages for MSH-4, MSH-6, MSH-11, MSH-22 and RXA-11.4. Typically the IIS creates a fake organization/provider in its test environment (e.g., "AIRA AART") and generates credentials for it, much like onboarding a new provider, except no real data is sent and the connection is used only for Measurement and Improvement testing. Step 2 is a connectivity test in which AIRA configures AART and attempts to connect; troubleshooting may require IIS, IT or vendor staff and can take minutes to a couple of hours. Note that AART assessment relies on the ACK: an interface that always returns a positive ACK (e.g., through an HIE) cannot be meaningfully assessed for submission, and when queries go to a separate interface, VXUs must be processed before the queries are run.'
    status: answered
