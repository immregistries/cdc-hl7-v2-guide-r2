  - id: ta-q33-011
    group: Intermediaries & Multi-Jurisdiction Connections (HIE, IZ Gateway)
    question: IZ Gateway began flagging messages in its onboarding (test) environment that appeared to contain PHI/PII, including a long-used obviously fake vendor test patient. Why is IZ Gateway inspecting test message content, and what can a vendor do when its test patient is flagged?
    answer: Policy documents IIS have signed prohibit PHI/PII from passing through the IZ Gateway onboarding environment, yet several IIS were pushing real data through it (for example, pre-production environments with live provider connections that trigger IIS-to-IIS exchange). That exposed both the IZ Gateway team and receiving IIS, whose test environments are not secured like production, to PHI. The onboarding environment, unlike production, allows staff to view messages to support testing and HL7 standardization during go-live. CDC therefore instituted detection and eventually rejection of apparent PHI/PII in onboarding. Determining test data versus real data is imperfect; vendors whose fabricated test patients are flagged can ask the IZ Gateway team to declare those patients known test patients, and should consider making test data look less like real PHI. AIRA would pass the feedback on communication and timing to the IZ Gateway team.
    status: answered
    asked: 1
    messages: general
