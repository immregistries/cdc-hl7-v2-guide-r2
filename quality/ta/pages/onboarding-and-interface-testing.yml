  - id: ta-q15-012
    group: AIRA AART / Measurement & Improvement Testing
    question: AART test VXUs sent different patients (different name, DOB, etc.) with the same PID-3 patient ID from the same organization, which sends them to the IIS's ambiguous-ID queue for manual resolution. Is this intentional, and should IIS staff resolve these records?
    answer: AART test messages are contrived and normally try not to reuse MRNs, but sometimes the same MRN is used for two different patients intentionally to see how the IIS reacts. AART is not trying to get its data accepted; it is probing system behavior, and some test messages contain problems that are not critical for passing the functional tests. IIS staff should not spend resources on these; it is fine if such records stay in the ambiguous-ID queue indefinitely.
    status: answered
