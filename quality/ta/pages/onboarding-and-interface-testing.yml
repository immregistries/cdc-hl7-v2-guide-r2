  - id: ta-q38-012
    group: Query (QBP/RSP) Onboarding
    question: Some IIS do not require facilities that only send QBP queries to register individually; large organizations register one facility ID and any number of sub-locations query under it without tracking. Is this common, should it be discouraged, and should onboarding track individual facilities even for QBP-only access?
    answer: There is no national requirement in the IG that QBP-only facilities be registered individually, but the Security Guidance recommends tracking queries to the site level for audit and breach response. HL7 v2 makes this difficult for QBP because identifiers are limited to MSH fields, and keeping them consistent with VXU practice is messy. In practice state policy and information sharing agreements govern this; some states require facility-level identification while others allow parent-level credentials if the parent assumes responsibility, which is beyond what the IG specifies. The practice creates a governance blind spot when no one knows who is querying under a shared ID, and should be addressed. AIRA planned to raise it at SISC and flag it to IGEG as a gap (as part of an open work item on identifying organizations).
    status: answered
    asked: 1
    messages: QBP
    related:
      - MSH-4; Query & Response Behavior
    years:
      - 2025
  - id: ta-q22-004
    group: Query (QBP/RSP) Onboarding
    question: An IIS tests VXU interfaces first in production (with data held/queued until validation), and only after go-live tests query using real data. Is it possible to test VXU and query together during the testing phase, and if so how is that set up?
    answer: |-
      The usual approach to testing simultaneously is for the provider to query for patients previously submitted via VXU. Whether that works depends on how the IIS's pre-production (queued) setting handles a QBP: will it error, or return an RSP, and if so from queued data or all stored data?

      If the pre-production setting returns an RSP, identify a set of patients for providers to query during testing: test patients (if test data can be stored in production and the provider is willing to query them), patients previously entered manually in the IIS, or, if the IIS answers queries from queued VXU data, the patients the provider just submitted.

      If the pre-production setting does not return a valid RSP, query cannot be tested alongside VXU, and testing query after VXU go-live is a good practice. It is common to add query to a live interface and test it in production, which also allows clinical staff to confirm the RSP returns accurate data. Consider collecting query setup information up front during onboarding/registration so query testing can begin right after VXU go-live.
    status: answered
    asked: 1
    messages: VXU/QBP/RSP
