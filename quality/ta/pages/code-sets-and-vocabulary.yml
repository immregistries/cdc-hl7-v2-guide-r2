  - id: ta-q33-001
    group: CVX Codes and Vaccine Groups
    question: The CDC CVX-to-vaccine-group mapping lists CVX 109 (pneumococcal, unspecified) under two vaccine groups (PPSV and PCV), and maps it to specific codes (33, 152) instead of back to itself as most unspecified codes do. Why would one CVX map to two groups, and is that allowed from an HL7 standpoint?
    answer: CVX 109 is mapped to both groups because the code is not specific enough to show whether the dose was a pneumococcal conjugate (PCV) or a pneumococcal polysaccharide (PPSV) vaccine. In effect, the listing represents that code 109 includes both PCV and PPSV. Because of this ambiguity, code 109 is one of the most problematic unspecified codes. For context, the CDSi project lumps PCV and PPSV into a single Pneumococcal vaccine group. Given recent PCV advances, PPSV is expected to see very limited use going forward (PPSV is not recommended at all after PCV20 or PCV21).
    status: answered
