  - id: ta-q19-004
    group: Code Set Sources, Governance and Maintenance
    question: ACIP publishes recommended abbreviations (short names) for vaccines. Are IIS expected to follow these abbreviations or create their own short names? Does any standard require them?
    answer: 'No published standard requires IIS (or EHRs) to adopt specific vaccine short names, such as those shown in drop-downs. CDC distributes the official codes and names for vaccines in the CVX code set. Short names do not matter for interoperability: IIS ignore the text label sent in HL7 messages and process only the code. The ACIP abbreviation list exists so readers can understand ACIP recommendations. It is not a standard for clinical settings or for how EHR systems must be configured, although adopting it might help correlate clinical practice with ACIP. There are no national requirements for IIS short name conventions.'
