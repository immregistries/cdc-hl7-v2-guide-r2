  - id: ta-q12-005
    group: CPT-to-CVX Mapping
    question: New CPT codes distinguish COVID booster/third doses for reimbursement. Could HL7 messages use these codes so that IIS can track third doses and boosters without relying on internal evaluation logic?
    answer: It is not as simple as it appears. The CPT vaccine product code stays the same (e.g., 91300 for Pfizer). Only the administration code differs (e.g., 0001A, 0002A, 0003A), and IIS are not known to collect administration codes, nor EHRs to submit them. The immunocompromised additional dose is the same formulation, so there will be no new NDC or CVX codes. Those code systems describe the formulation of the product, not the intent of administration or the condition of the patient. If booster formulations differ (e.g., a half-dose formulation), new NDC/CVX codes would follow.
    status: answered
    asked: 1
    messages: VXU
    related:
