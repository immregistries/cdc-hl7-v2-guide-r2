  - id: ta-q32-007
    group: NDC Codes
    question: Is there any national activity to create an NDC list/crosswalk for non-vaccine CVX codes (e.g., immune globulins) like the one maintained for vaccines?
    answer: 'There is currently no such list. CDC has discussed adding NDCs and crosswalks for non-vaccine immune products such as immune globulins and has done a feasibility analysis. The barrier is interpretive, not technical. Treating these products like vaccines could imply that they are immunizations or confer immunity, which may be misleading: IGs are not always antigen- or disease-specific and may not provide durable immunity. CDC keeps this on its agenda. CDC does not maintain the older non-vaccine CVX codes, many of which are not retired and are still used by some jurisdictions. CDC is interested in learning which jurisdictions report non-vaccine administrations and why.'
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-5
    years:
      - 2024
  - id: ta-q30-003
    group: Demographic Vocabulary, Character Sets and HL7 Tables
    question: Is there a standard list of acceptable special characters (e.g., accented characters in non-English names) that AIRA plans to use as the basis for guidance and AART testing? The only sources found so far are the ISO reference behind the MSH character set field and the Unicode/MES-2 lists.
    answer: AIRA expects that its future guidance on special characters will probably be limited to Latin-1 upper- and lower-case letters, because most systems operate in English and other characters are rarely used. It also plans to include guidance on representing names as accurately as possible when their special characters fall outside the supported set.
