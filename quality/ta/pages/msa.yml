    question: Should an IIS leave MSA-3 empty in its ACK to resolve a conformance finding?
    answer: AIRA's M&I testing ignores MSA-3 being populated, because some IIS send it and some receiving systems depend on finding it there. AIRA would not recommend removing MSA-3 from a production system without first talking with downstream systems (trading partners) to make sure they are not relying on it.
