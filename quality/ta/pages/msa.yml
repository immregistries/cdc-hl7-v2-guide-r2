  - id: ta-q18-022
    group: MSA-1 Acknowledgment Code
    fields:
      - MSA-1
    question: Can an ACK use MSA-1 = AA together with an ERR of severity I (e.g., `ERR|||0^Message Accepted^HL70357|I||||Incoming immunization already exists...`)? How should an IIS decide between E, W and I in ERR-4 when some conditions currently returned as AE with a warning are not really errors?
    answer: 'Follow AIRA''s Guidance for HL7 Acknowledgement Messages to Support Interoperability (https://repository.immregistries.org/resource/guidance-for-hl7-acknowledgement-messages-to-support-interoperability/). MSA-1 should be AA if there are no ERR segments or all ERR segments are severity I; if at least one ERR is W or E then MSA-1 should be AE (or AR in a few corner cases). The proposed AA with an informational ERR for a duplicate immunization is good, since resubmitting a vaccination is not a problem. IIS decide what are true errors but must flag them consistently: E means the issue must be fixed and resubmitted, W means the data needs fixing but need not be resubmitted, and I conveys information without requesting action. There is no firm national stance on which specific issues are E, W or I; it rests on IIS policy. Nationally the priority is that E is used correctly and not for issues that do not need fixing or resubmission. W can drive data quality, including for issues that may be correct as reported (e.g., an unexpected dose amount), as long as the message says something like "The dose amount may be incorrect, please verify."'
    status: answered
    asked: 1
    messages: ACK
    related:
      - ERR-4
