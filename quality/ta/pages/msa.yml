      - 2022
  - id: ta-q02-007
    group: MSA-1 Acknowledgment Code
    fields:
      - MSA-1
    question: An IIS returns MSA-1 = AA for every message, including submissions containing errors that it reports in ERR segments. Is that appropriate, and how do other IIS handle ACKs?
    answer: No. Provider organizations will likely read AA as "accepted without error" and will not review or aggregate the ERR segments. The IIS should return AE in MSA-1, which means the message was processed and errors are being reported. Send AE whenever the IIS detects an error more severe than informational (warnings and errors), from data ignored because it is not wanted up to rejection of the whole message. See AIRA's "Guidance for HL7 Acknowledgement Messages to Support Interoperability" for MSA-1 values (2024). In an earlier case (2016), after discussing how other IIS handle acknowledgements, the IIS agreed to update its ACKs to be more meaningful (reflecting actual processing results and errors) for providers submitting via the CDC WSDL rather than always returning AA.
    status: answered
