    question: An IIS business rule prevents deleting an immunization linked to an inventory lot. When a well-formed delete is not processed for this reason, should MSA-1 be AE or AR?
    answer: 'It should be AE, not AR; AR is not appropriate since the message was processed. The more important question is ERR-4: severity E means the sender is expected to correct the information and resend, which is probably the best code here, assuming the IIS wants the sender to take further steps (fix data on their side and/or contact the IIS to fix the record). Consider stating those next steps in the error text, e.g., adding "Please contact the IIS help desk to resolve this issue."'
