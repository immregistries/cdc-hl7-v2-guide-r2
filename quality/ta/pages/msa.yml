  - id: ta-q06-006
    group: MSA-1 Acknowledgment Code
    fields:
      - MSA-1
    question: What MSA-1 should be returned when the message is accepted but has only warnings or only informational issues (e.g., the IIS accepts the message even though RXA is missing fields it deems necessary)?
    answer: 'If you are satisfied enough with the message that you would not expect the provider or EHR to take action and resubmit, the ACK should be AA with no ERR segments, AA with only I-severity ERR segments, or AE with W-severity ERR segments, with no E-severity ERR segments. Messages with only I-severity issues return AA, provided there are no W or E severity errors. Confirmed again in 2023: if the only ERR segments are informational, MSA-1 should be AA (consistent with the AIRA ACK guidance). A 2023 question asking whether an ACK with MSA-1 = AE and only informational errors is acceptable has no separate answer recorded; the guidance above indicates AA.'
    status: answered
