    question: In the AART Submission/Acknowledgement assessment, several test cases fail with "IIS did not accept message," but the IIS actually processed those messages. What is expected, and how can these test cases pass?
    answer: 'For the failed test cases AART is submitting VXUs that are conformant to the standard, but the IIS acknowledgements indicate the system does not like what was submitted: they return an "E" (error), indicating something needs to be corrected. Since the VXUs are conformant, it is the acknowledgements that need to be corrected so they do not report errors for valid content. Other users of the same IIS product have faced similar issues and may be able to share the ACK updates they made to pass.'
