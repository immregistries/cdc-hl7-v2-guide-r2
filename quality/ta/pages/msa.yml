id: msa
kind: segment
title: MSA Message Acknowledgment
overview: 'Nearly all MSA questions concern MSA-1 (Acknowledgment Code): when to return AA, AE or AR, and how MSA-1 must agree with the severities in ERR-4. The dominant theme is that AR is reserved by the base HL7 v2 standard for a small set of message-level conditions, so content rejections are signaled with AE plus an ERR-4 = E, while AA is used only when there are no ERR segments or only informational ones. Later questions (2024-2026) track draft guidance expanding the use of AR and concern about EHR interfaces that shut down when they receive AR. A few questions address MSA-3 and MSA-6.'
suggested:
  - State explicitly that receiving AR must not cause a sender to shut down its interface; clarify sender reactions to AR vs CR.
  - Publish the MSA-1 / ERR-4 combination table (AIRA ACK guidance Table 5) as normative guidance.
  - Document the planned expansion of AR use and its relationship to the base-standard AR conditions.
