  - id: ta-q06-005
    group: MSA-1 Acknowledgment Code
    fields:
      - MSA-1
    question: When an IIS rejects a VXU (does not store it), for example because patient first name, last name or DOB is missing or invalid, should it return MSA-1 = AR? Some EHR interfaces treat AE as "processed with errors" and act only on AR.
    answer: 'No. These should be AE with ERR severity E. The base HL7 v2 standard is very specific that AR can only be used in very limited situations (four specific situations, which are rare in practice). If the IIS must reject for other reasons (for example, a future-dated administration or a missing address when required), it cannot use AR; it must return AE in MSA-1 with ERR-4 = E. Senders therefore need to look at ERR-4: AE with an E-severity ERR indicates rejection. The table of MSA and ERR-4 combinations and their expected meaning in AIRA''s "Guidance for HL7 Acknowledgement Messages to Support Interoperability" (Table 5) is the best description.'
