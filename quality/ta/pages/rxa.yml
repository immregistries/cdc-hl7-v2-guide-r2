    question: Should an IIS that does not track dose amount begin storing RXA-6 and returning it in the RSP (e.g., to distinguish Moderna third doses from boosters)?
    answer: 'Yes: start collecting dose volume when sent and return it when captured. It will not be perfect, but it is better than nothing. Administered amount is required for administered doses and certified EHRs should have been tested to send it, so AIRA asked which EHRs or provider types are not sending it. The field generally must be taken at face value: trust that submitted data reflects what clinically occurred unless there is evidence otherwise (e.g., a provider with an improbable share of unusual volumes). ACIP says a dose smaller than recommended should be considered invalid and repeated, but CDSi intentionally does not invalidate these doses; it detects them and warns that less than the appropriate volume was recorded, because volume data has historically been rarely reported and of poor quality.'
