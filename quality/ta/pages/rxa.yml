    question: For a multicomponent vaccine kit such as Penbraya (MenACWY vial NDC 00069-0271-01 and MenB syringe NDC 00069-0332-01), which NDC should the EHR report?
    answer: EHRs are required to use NDC when reporting administered immunizations under the ONC certified health IT program. A vaccine can have a unit-of-sale (UoS) and a unit-of-use (UoU) NDC; UoU is preferred, but IIS should be able to receive either. Multicomponent vaccines have multiple UoU NDCs associated with one UoS NDC, one product and one CVX. EHRs may send any of the valid UoU NDCs but should verify with the IIS which are supported, and IIS SHALL be able to accept any valid UoU NDC for a multicomponent vaccine. See CDC's 2021 guidance on documenting NDCs. Penbraya reverses which component is lyophilized compared with other component vaccines, but the same guidance holds because the NDC tables IIS use list both UoU NDCs for mapping.
