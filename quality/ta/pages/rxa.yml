  - id: ta-q03-035
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: How should an IIS handle Add, Update and Delete in RXA-21? Should an Update from the same provider be treated as a full replace (e.g., to correct a lot number or expiration date) instead of requiring a delete followed by an add, given that many administration systems cannot send deletes?
    answer: |-
      Most IIS ignore the difference between an Add and an Update in RXA-21 (2018). They use vaccination matching and business rules to decide whether the incoming record is new or updates an existing one. Deletes are honored.

      The 2022 answer elaborated:

      - **Why codes cannot be trusted alone:** This area needs standardization across IIS and administration systems. It is not as simple as Add/Update/Delete, because an IIS can receive the same vaccination event from more than one provider. An IIS cannot blindly trust an Add without checking for existing records, and the same is true for an Update.
      - **MIROW guidance:** Two chapters are relevant: vaccination matching and deduplication, and record consolidation when a match is found (selectively consolidating two records into one). Most IIS use the Add/Update codes loosely, mainly to know the message is not a delete. They apply MIROW-style logic to improve the details of the vaccination event rather than replacing or duplicating it wholesale.
      - **Full replace:** If Update were to mean full replace, the IIS would have to consider when a full replace is allowed. Many systems, including IIS, have difficulty updating records when key fields such as CVX or vaccination date change. Standard practice is to send a delete and then an add, and many IIS ask partners to do this, which explains the Add-Delete-Add pattern. For IIS that support deletes, Delete then Add is a functional way to achieve a full replace, but not all administration systems support deletes.
      - **No defined rules:** The IG and national guidance provide no business rules that differentiate Add (A) from Update (U). The current HL7 standard gives a submitter no way to indicate a full vs. partial replace.
    status: answered
    asked: 2
    messages: VXU
    related:
      - Patient Matching & Deduplication
    years:
      - 2018
      - 2022
  - id: ta-q32-015
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: For DQI Measure 27 (the IIS returns a consolidated history after updates and deletes), is the IIS expected to return the updated vaccination data even though no delete was sent? The IIS assumed it could only update a vaccination by deleting and re-adding it.
    answer: |-
      Yes. The measure uses two queries:

      1. The first confirms that the IIS returns the updated HepB vaccination CVX code.
      2. The second confirms that the IIS did not create a duplicate, by checking that the original CVX is no longer returned.

      This measure is less about HL7 and more about the data quality behavior described in the MIROW guides. The IIS should match the second VXU's vaccination event to the first (same date, same vaccine family), per MIROW Vaccine Level Deduplication. It should then decide which record, or which pieces, to keep using the MIROW guide on Consolidating Demographic Records and Vaccination Event Records. That guide recommends keeping the specific formulation CVX (from the second VXU) over the unspecified HepB CVX. A delete followed by an add is not required.

      The IG itself says most IIS do not rely directly on RXA-21, and that the action is commonly sent as Add even for previously reported vaccinations.
    status: answered
    asked: 1
    messages: VXU, QBP, RSP
    related:
      - RXA-5; Patient Matching & Deduplication
    years:
      - 2024
  - id: ta-q31-019
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: An EHR sent one nirsevimab administration of 200 mg when it should have sent two separate 100 mg administrations. How should the previously submitted data be corrected?
    answer: |-
      Per AIRA's TAB Scenarios for Updates and Queries (https://repository.immregistries.org/resource/tab-resources/), the submitter would:

      1. Update the existing record so the dose amount reflects a single administration, and send it as an update (RXA-21 = U).
      2. Create a new immunization record for the same date with the correct dose amount for the second administration, and send it as an add (RXA-21 = A).

      However, many IIS have already been correcting nirsevimab data themselves, so the submitter must coordinate with each IIS before correcting anything. The IIS may need no action, or may give other instructions.
