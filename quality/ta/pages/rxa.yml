  - id: ta-q09-019
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: If a vaccine was reported as administered and the EHR later records it as not administered (physician stated or patient refused), should the EHR send RXA-20 NA or RE with RXA-21 = U?
    answer: Not-administered vaccinations should not be reported unless the patient (or guardian) refused. If a vaccination was reported as administered and later amended to not administered, a delete (RXA-21 = D) should be sent. Not all IIS honor deletes, and even IIS that generally honor them may not in specific cases, because consolidating information from multiple sources makes delete logic complicated. EHRs should send information only after the event is completed and verified. IIS do not expect pre-notification of vaccinations yet to be given (e.g., sending intended vaccinations and deleting them when the patient doesn't show).
