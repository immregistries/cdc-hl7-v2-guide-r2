  - id: ta-q32-008
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: Should an IIS store incoming records where RXA-20 = RE (refused) or NA (not administered), whether or not RXA-18 (refusal reason) is valued?
    answer: |-
      The HL7 IG addresses data on the wire and does not prescribe storage; those requirements come from elsewhere.

      - **RE:** RXA-20 = RE indicates a refusal, and the standard requires RXA-18 to be populated with the reason. Refusals should be stored: they are among the CDC Endorsed Data Elements supporting IIS functional standards, and certified EHRs must support sending them. If RXA-18 is missing, the IIS still knows which vaccine was refused and when, just not why. Whether to keep such a record is an IIS business decision.
      - **NA:** RXA-20 = NA should be paired with CVX 998 and indicates an adverse event, contraindication or evidence of immunity. These records should also be stored, because they are core data elements that affect CDS forecasting. If some required elements are missing, the IIS must decide whether to keep the partial data.

      The question covered both new and existing patients.
    status: answered
    asked: 1
