  - id: ta-q13-014
    group: RXA-6 Administered Amount
    fields:
      - RXA-6
    question: How should a half-dose Moderna COVID-19 booster be reported? Should RXA-6 be adjusted, should RXA-20 be CP or PA, and has guidance been given to EHRs about sending dose volume?
    answer: |-
      Report the amount of product actually given in RXA-6 (with units in RXA-7, e.g., mL). Partially administered (PA) in RXA-20 applies only to doses not considered valid because not enough was given; a properly administered half-dose booster is still messaged as complete (CP). ACIP booster guidance should be followed by the administrator.

      IIS should ask for the volume administered, not the fraction of a whole dose. One IIS was found to accept only 1.0 or 0.5 to mean whole or half dose; this is off-standard. It may be represented that way internally, but externally the field must be accepted and represented as a volume (mL). EHRs can indicate dose amount, but workflow support varies. Dose volume (administered amount) is a required element, so certified EHRs should be sending it; IIS should report EHRs not sending it so AIRA can encourage them (AIRA raises this with the EHR Association).
    status: answered
