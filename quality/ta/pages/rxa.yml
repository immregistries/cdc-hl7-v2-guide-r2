  - id: ta-q42-001
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: When a contraindication is submitted (OBX 30945-0, RXA-20 = NA), should RXA-5 be 998 or the CVX of the contraindicated vaccine (e.g., 140, or 01 for the DTP group)?
    answer: |-
      Either is allowed. AIRA guidance (Message Structure Guidance v1.1, https://repository.immregistries.org/files/resources/5938386822754/message_structure_guidance_document_v1_1__formatted.pdf) permits a vaccine-specific CVX in RXA-5 for a contraindication as well as CVX 998.

      The word "contraindication" has two distinct meanings that the current guide conflates: (1) a patient-level observation, where the patient has a condition (e.g., Patient Currently Pregnant) that is a contraindication and/or indication for certain vaccinations; and (2) dose-level non-administration, where a specific vaccination was not given because of a contraindication. For a patient-level observation, send RXA-5 = `998^No Vaccine Administered^CVX`, RXA-6 = 999, RXA-20 = NA, ORC-3 = 9999, with OBX-3 = 30945-0 (Vaccination contraindication) and a SNOMED code in OBX-5, plus OBX 30946-8 for the effective date; this is not associated with any specific vaccination event. AIRA testing has no cases for a specific vaccination not given due to a contraindication.

      The guide allows submission under a specific vaccination but does not define what that means; although it implies the dose was not given because of the contraindication, the guide does not say so. Therefore: accept contraindications equally with or without an associated immunization; do not infer meaning or store the not-administered vaccination; and store the contraindication generally for the patient, since it likely applies to other vaccinations too. (One 2025 answer noted that if the IIS stores non-administered vaccinations it could read the CVX from RXA-5, otherwise store the contraindication generally for the patient.)
    status: answered
