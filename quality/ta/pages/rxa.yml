    question: RabAvert (CVX 176) is listed in the CDC code set under GlaxoSmithKline (SKB), but Bavarian Nordic (BN) bought it and is named on the packaging. Which MVX should be used in RXA-17, and should IIS accept BN with CVX 176?
    answer: |-
      As of 2023, SKB was correct per the CDC CVX/MVX tables. AIRA noted that the product seems to have moved to Bavarian Nordic (a recent FDA approval letter lists BN) and that some products are relabeled by another company, and it referred the question to CDC's code table manager. The mapping may change later, but until CDC updates it, SKB is the expected MVX for CVX 176. About half of providers were sending BN and getting a warning that the MVX was wrong.

      A 2024 follow-up (no answer recorded) reported an IIS rejecting VXUs with MVX BN and CVX 176. That combination appears on the CDC 2D barcode shipping table but not on the CDC tradename (CVX/MVX) or NDC lists. The question asked why the CDC tables disagree and whether BN should be accepted.
