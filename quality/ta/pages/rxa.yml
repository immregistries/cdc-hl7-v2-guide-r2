  - id: ta-q44-004
    group: RXA-15 Substance Lot Number
    fields:
      - RXA-15
    question: How unique are lot numbers for inventory decrementing from VXUs? Can the lot number be relied on to identify inventory uniquely, beyond splitting lots into public and private stock?
    answer: |-
      Lot decrementing was added to VXUs as an add-on and has always been painful for IIS. Do not tie VXU acceptance to decrementing. Accept and save the VXU, then decrement, and have defined processes to resolve failures quickly, because they will happen often.

      HL7 has no stable identifier for the exact lot, so it must be assembled from what is present. Lot numbers are not guaranteed to be unique, but they are operationally unique when combined with manufacturer and product context. Make matching as flexible as possible, for example:

      - allow variance in vaccine codes
      - ignore extra characters on lot numbers
      - treat look-alike characters as equivalent (letter O vs. zero)
      - map RXA-11.4 to local values
      - make assumptions when a lot matches private stock instead of public

      Provide a de-linking process to fix mistakes. Conceptually, the lot to decrement has three keys:

      - product identity (CVX or NDC)
      - lot identity (lot number plus manufacturer and funding context)
      - administering facility (RXA-11.4)
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-17
      - RXA-5
      - OBX-5
      - RXA-11.4
    years:
      - 2026
  - id: ta-q04-006
    group: RXA-15 Substance Lot Number
    fields:
      - RXA-15
    question: When the lot number on the vial or syringe (Unit of Use, UoU) differs from the lot number on the carton (Unit of Sale, UoS), which should the EHR capture and send? Is AIRA's 2018 guidance still current, and is there an updated list of affected products?
    answer: |-
      The answers given over time:

      - **2019:** Bar code scanner training may tell clinicians to scan the vial, which would normally be appropriate. For inventory deduction of VFC stock, however, the lot number on the box is needed.
      - **2024:** AIRA's June 2018 guidance (Vaccine Lot Patterns by Unit of Use/Unit of Sale) is still accurate as far as AIRA knows.
        - In general, IIS decrement inventory using the UoS lot number, because that is the lot number seen in ordering. Some IIS can accept either.
        - Some IIS specifically ask for UoS, especially for inventory decrementing and VFC accountability. One IIS vendor said it does not matter to them, because they have already had to handle EHRs' different approaches.
        - Very few IIS, perhaps none, want both lot numbers. Ideally the EHR should be configurable to send either UoS or UoU per IIS request, and possibly per provider type (e.g., VFC vs. non-VFC). If it is unclear which lot number was documented, the EHR sends what it has.
      - **2026:** Besides the 2018 AIRA guidance, CDC published "Updated Guidance for Documenting Vaccine NDCs and Lot Numbers in IISs and EHRs" in 2021, linked from CDC's Vaccine 2D Barcode Scanning Implementation Toolkit.
        - That guidance notes that some manufacturers changed labeling so UoS and UoU lot numbers match for certain products, but differences remained for others. Among the VFC vaccines analyzed then, ActHIB, Menveo and Pentacel still had different UoS and UoU lot numbers.
        - CDC also indicated that mismatches occur particularly with multi-component vaccines.
        - AIRA is not aware of newer guidance or a comprehensive updated list.
        - Providers are encouraged to report the lot number associated with the NDC they submit, and IIS are encouraged to be prepared to accept either the UoS or the UoU lot number.

      The earlier answers emphasize the box (UoS) lot for VFC decrementing. The later guidance asks IIS to accept either lot number.
    status: answered
    asked: 3
    messages: VXU
    related:
      - RXA-5; VFC & Funding Eligibility; Data Quality & Validation
