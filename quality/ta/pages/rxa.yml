    question: Will each vaccine issued under an EUA get a distinct CVX, and will that CVX change if the vaccine is later fully licensed?
    answer: 'Yes, CDC will assign a distinct CVX code for each EUA vaccine, and is working with the AMA to do the same for CPT codes. Whether the same CVX is kept after FDA licensure was still undecided. The preference for simplicity is to keep the same CVX, but considerations include: (1) whether the licensed formulation and manufacturing process are the same as the EUA product (if not, a new CVX may be assigned); and (2) safety and traceability: if EUA product remains in inventories alongside licensed product there may be reasons to track which was administered. FDA agreed to assign NDC codes to unit of sale and unit of use for EUA vaccines; if FDA assigns a new NDC for the licensed product, that would allow differentiation in inventory, administration and reporting without changing the CVX.'
