    answer: Use the CDC IIS NDC dataset (www2a.cdc.gov/vaccines/iis/iisstandards/vaccines.asp?rpt=ndc) as the official source. The difficulty is likely that 00006-4095-01 is a unit-of-use NDC, which is not on the outside of the box; the FDA source may only include NDCs that can be ordered (sale units). In the CDC dataset, 00006-4095-01 is linked to the sale NDC 00006-4095-02.
