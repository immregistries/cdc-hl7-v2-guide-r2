  - id: ta-q16-008
    group: RXA-17 Substance Manufacturer Name
    fields:
      - RXA-17
    question: If a provider submits only a CVX that maps to a single product (e.g., CVX 207, Moderna COVID-19), may the IIS also record the product name and manufacturer, or should it record only the CVX?
    answer: |-
      Nothing prohibits it. HL7 does not require the IIS to return vaccination data exactly as submitted. The IIS's task is a complete and accurate history, which includes merging and correcting data; some IIS have corrected CVX codes they were confident were wrong. However, there is no requirement to fill in missing information such as the manufacturer. Considerations:

      - Identify the business need and the problem that filling in the MVX solves.
      - Limit such corrections to specific problems.
      - The IIS program must decide to do this intentionally and take responsibility as the author of that information.

      A known downside, which can happen anyway, is reconciliation confusion for the EHR or provider when the IIS returns a more specific product than was submitted (e.g., a specific formulation instead of DTaP unspecified).
