  - id: ta-q27-002
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: To pass AART Data Quality measure 21.4.1 (NDC and CVX conflict in RXA-5), what ERR is needed, and why might it still fail?
    answer: |-
      AART looks for an ERR segment at `RXA^1^5` in the ACK. Returning `ERR||RXA^1^5^1^1|999^Application Error^HL70357|W||||Vaccination CVX code and NDC code are inconsistent (not in same vaccine group)|` is sufficient: the IIS simply needs to acknowledge an issue with RXA-5. The test does not require severity E in ERR-4; a warning passes. However, returning an error would also be reasonable, since the message is clearly conflicted about which vaccination was given.

      In one case the measure still failed after the IIS changed its configuration because the IIS had a separate import profile for AIRA/AART testing whose "CVX and NDC codes are inconsistent" (RXA-5.1, RXA-5.4) setting was still "accept"; once that profile was changed to warning, the ACK returned the ERR above and the test was satisfied. When an IIS uses per-sender profiles, configuration changes must be applied to the profile used by the tester.
    status: answered
    asked: 2
    messages: VXU/ACK
