  - id: ta-q40-015
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: Should an IIS accept VXU deletes for administered doses, given concerns that deleting doses drawn from inventory affects inventory and wastage reporting? Is there MIROW or other guidance?
    answer: |-
      Deletes are supported and defined in the national IG, and they are considered best practice in specific correction scenarios.

      - Each IIS may decide whether to honor a delete, particularly for administered doses tied to inventory or other accountability processes.
      - The TAB: Scenarios for Updates and Queries sets expectations for when submitters should send updates vs. deletes.
      - To maintain data integrity, IIS should be able to process updates and deletes where appropriate, even if operational policy limits certain cases (e.g., not letting a provider delete another facility's administered dose).

      Per the 2.5.1 Release 1.5 addendum, when a record should never have been entered, the submitter sends a second VXU^V04 with all data, including ORC and RXA. It is the same as the most recent message for that administration, except that the action is set to D. Importantly, the filler order number in ORC-3 should be the same, because it may be crucial for identifying the correct administration to remove. Independent adds or refusals can then be sent to populate the correct data. An IIS can therefore require that the submitting facility owns the dose and that the delete matches the original record.
    flags:
      - The source says "RXA-20 = D". The delete action code is RXA-21 = D; D is not a valid RXA-20 completion status. Confirm the field number.
    status: answered
    asked: 1
    messages: VXU
    related:
      - ORC-3
      - RXA-21
    years:
      - 2025
  - id: ta-q14-018
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: If RXA-20 is blank, should the IIS default it to CP and accept the dose, or reject it? If RXA-20 is blank but RXA-18 has a refusal reason, can the IIS default RXA-20 to RE? How should warnings for a blank RXA-20 be explained to providers, and can they be turned off?
    answer: |-
      The answers given over time:

      - **2021:** For all intents and purposes, RXA-20 is required for administered and historical vaccinations, and a certified EHR would not pass certification without sending it. Blank values most likely come from uncertified or legacy systems built to older HL7 standards.
        - The IIS can accept good data from non-conformant messages. A warning is appropriate when the IIS treats a blank as complete: the IIS wants it fixed but still takes the data.
        - The warning could be turned off for selected sites when (1) it is confirmed the sending system cannot fix it, (2) the IIS wants to keep receiving that site's data, and (3) reducing warnings lets the site focus on the ones it can fix.
        - Some IIS start with a uniform set of errors and warnings and tailor them per site during onboarding, so every warning is actionable. This is acceptable and may become a best practice.
      - **2025:** The recommendation is similar to the one for an unrecognized value. Certified systems should be sending RXA-20, and when it is empty it is not safe to assume what the submitter intended. The IIS should indicate an error (E in ERR-4) and not accept the data, unless it knows for sure the data is good and the sender has no way to conform to the standard. If this is happening, the IIS should investigate why.

      The guidance differs: the 2021 answer treated a blank RXA-20 defaulted to CP as acceptable with a warning, while the 2025 answer recommends an error and not accepting the data except in confirmed cases.
    status: answered
    asked: 2
    messages: VXU, ACK
    related:
      - RXA-18
      - ERR-4; Acknowledgement & Error Handling
    years:
      - 2021
      - 2025
