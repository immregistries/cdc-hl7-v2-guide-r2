  - id: ta-q36-001
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: When a vaccine has multiple components with their own expiration dates (e.g., lyophilized powder plus diluent, or a kit with two active components such as Penbraya), how should expiration dates be reported? The IG shows multiple lot numbers sent as repetitions but does not address multiple expiration dates.
    answer: |-
      It depends on the product:

      - **Products that require reconstitution:** Report the NDC, lot number and expiration date of the lyophilized powder (the active product), not the diluent.
      - **Products with multiple active components (e.g., Penbraya):** IIS should be prepared to receive any NDC associated with the product, per CDC guidance on documenting NDCs. That includes the unit-of-sale kit or carton NDC, or a unit-of-use NDC for either active component. The provider reports the lot number and expiration date associated with whichever NDC is reported, in one RXA. IIS use the CDC NDC tables to map among these NDCs to identify the product. Which component is reported is left to the provider or vendor, based on clinical workflow.

      There is no need to report multiple expiration dates to the IIS. For Penbraya specifically, Pfizer reports that the vial, syringe and carton each have expiration dates that may differ. The earlier of the vial and syringe dates is applied to the outer carton, and the carton date should be used as the kit's expiration date.
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-15
      - RXA-5
    years:
      - 2025
  - id: ta-q36-002
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: For a multicomponent vaccine where one component is expired and the other is not, should the expired component or its expiration date be reported separately to the IIS?
    answer: At this time there is no recommendation to report the expired component separately, or to report a component-specific expiration date to an IIS. Determining whether a dose is invalid because of an expired component, and any follow-up, is up to the provider rather than the IIS. Best practice remains to report the NDC, lot number and expiration date of the active product used, with the choice of component left to the provider or vendor based on clinical workflow. IIS are not designed to serve as full medical records.
