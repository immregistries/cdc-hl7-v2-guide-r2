  - id: ta-q07-005
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: What placeholder expiration date (RXA-16) should be used for COVID-19 vaccine, and is there a lookup table that matches lot numbers to actual expiration dates?
    answer: |-
      The October 29 version of the CDC COVID-19 Vaccination Program Interim Playbook lists the placeholder expiration date as 12/31/2069. The placeholder was added to the 2D barcodes and VTrckS because the real expiration date was not known when labels were printed; stability studies were not yet available.

      - BARDA required all manufacturers to put a QR code on the label that takes providers to the manufacturer's site for real-time information, including expiration dates and EUA fact sheet updates.
      - Pfizer was the only manufacturer with enough information to print an expiration date. Moderna had no printed expiration date; the actual date was available only on the manufacturer's website.
      - No central lot-to-expiration lookup table was available at the time. CDC was checking with BARDA about other ways to look up dates quickly, and actual expiration dates were expected to be published.
    status: answered
