    question: Which HL7 field carries the administering provider's professional suffix or credential (MD, RN, LPN, PA, NP, Other), as required by the COVID-19 vaccine administration data elements? Does it use User-defined Table 0360 or free text?
    answer: The administering provider is sent in RXA-10 (Administering Provider), which has the XCN data type. RXA-10 is RE (required but may be empty) for completed and partially administered doses that are not historical. The professional suffix can go in XCN-21 Professional Suffix, which is an optional string field. Because the component is optional, EHR systems were not certified on it, and it is doubtful that many EHRs (if any) currently populate it.
