  - id: ta-q08-008
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: In query responses (Z32/Z42), how should patient-level observations such as contraindications or varicella history be sent, given OBX must be within an ORDER group with an RXA?
    answer: Send a "dummy" ORC/RXA group with CVX 998 (no vaccine administered) in RXA-5, which the receiver will not interpret as a real vaccination, and place all patient-level OBX segments under it, the same place CDS recommendations (forecast OBX segments) are sent. A contraindication doesn't need its own ORC/RXA; it can sit with the other patient-level observations. When CVX 998 is used, the ORC/RXA carries no meaning except to show that the following OBX segments apply at the patient level, not to a specific vaccination event. Returning contraindications in a query response is the IIS's choice. NIST's IZ-QR-2.2_Response_K11_Z42 example (Evaluated History and Forecast) shows this, e.g. `ORC|RE||9999^NIST-AA-IZ-2||||||||||||||NISTEHRFAC^NISTEHRFacility^HL70362` and `RXA|0|1|20151029||998^no vaccine admin^CVX|999||||||||||||||NA`. See the SISC Message Structure Guidance document (https://repository.immregistries.org/files/resources/5938386822754/message_structure_guidance_document_v1_1__formatted.pdf).
