  - id: ta-q45-002
    group: RXA-10 Administering Provider
    fields:
      - RXA-10
    question: How should the Administering Provider ID in RXA-10 be populated when the administering person has no NPI (e.g., a pharmacy technician who administers vaccines under state law), and what will IIS accept?
    answer: |-
      AIRA is not aware of any IIS that rejects a message when RXA-10 is empty on an administered dose. However, RXA-10 is RE, so every effort should be made to populate it when the administering person is known.

      - **Option 1 (preferred):** Populate an identifier together with its assigning authority and identifier type code. The identifier does not have to be an NPI. In AIRA testing, a fabricated identifier is sent in RXA-10.1 with 'AIRA' as the assigning authority in RXA-10.9 and 'PRN' as the identifier type in RXA-10.13. These components are linked in the conformance requirements. When the field holds a clearly non-NPI identifier, some IIS return warnings, but none reject the message.
      - **Option 2:** Send the person's name without an identifier, leaving RXA-10.1, RXA-10.9 and RXA-10.13 empty (e.g., `|^Lastname^Firstname^Middle^^^^^^L|`). This is valid HL7. No IIS rejects it, though some issue warnings.
      - **Option 3 (last resort):** Leave RXA-10 entirely empty. Again, no IIS rejects it and some issue warnings. This option is less useful for IIS that want the data, and it does not meet the intent of RE usage if the administering provider is known.
    status: answered
    asked: 1
    messages: VXU
    related:
