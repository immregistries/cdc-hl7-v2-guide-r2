    question: How will the IIS distinguish an immunocompromised "additional dose" from a later booster when an EHR sends COVID doses with the same CVX, and will new codes be created?
    answer: CVX and NDC codes reflect product formulation, so no new CVX is needed when the formulation is the same; this applies to the BLA-licensed Comirnaty product, which has the same formula as the EUA product. A new "ready to use" formulation (no diluent) will have new NDCs, a new CVX and new CPT codes, which CDC is developing with the AMA and drug compendia and will publish in advance of possible authorization. Implementers should not try to prepare before the new codes are released. The record does not describe any message element to distinguish additional doses from boosters.
