  - id: ta-q45-003
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: When moving from a v2 VXU to a FHIR Immunization interface, should RXA-21 and RXA-20 be crosswalked to Immunization.status and statusReason instead of a custom ActionCode extension?
    answer: |-
      FHIR does not define an equivalent of the HL7 v2 Action Code field (RXA-21). Instead, FHIR models the resulting state of the Immunization resource through Immunization.status and statusReason, so standard elements are preferred over a custom ActionCode extension. The proposed mappings for RXA-20 and RXA-21 appear reasonable:

      | v2 value | FHIR Immunization |
      |---|---|
      | RXA-21 A or U | status = completed |
      | RXA-21 D | status = entered-in-error |
      | RXA-20 CP | status = completed |
      | RXA-20 RE | status = not-done, with statusReason |
      | RXA-20 NA | status = not-done |
      | RXA-20 PA | status = completed, flagged subpotent |

      Regarding RXA-20 = NA: in the v2 IG, NA is mostly used as a placeholder that allows an ORC/RXA to be sent so patient-level OBX segments can flow underneath it. FHIR does not need that mechanism, because patient-level observations can be sent directly with the patient rather than under an immunization.
