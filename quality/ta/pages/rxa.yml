    question: When sending a delete (RXA-21 = D), should RXA-20 be NA or CP? An IIS accepts NA in RXA-20 only when RXA-5 is 998, while the NIST delete example uses CP.
    answer: |-
      There is no requirement that RXA-5 be 998 when RXA-20 is NA, and the NIST tool does not flag it, so sending NA on a delete is logical and not strictly incorrect. However, the IG examples show NA only with RXA-5 = 998, so some implementers assumed that rule.

      Existing guidance on deletes says a delete should include all the same information as the previous add or update, with the action code set to D. In AIRA validation testing, deletes are sent with `|CP|D|`. In summary, it is best to use NA only when RXA-5 is 998, and to send the original completion status (CP) on deletes. An IIS could choose to accept either NA or CP in this situation. A future guide needs clearer guidance.
