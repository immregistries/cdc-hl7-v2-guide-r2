  - id: ta-q32-002
    group: RXA-15 Substance Lot Number
    fields:
      - RXA-15
    question: Can an IIS add backend checks for invalid lot numbers (an invalid suffix or invalid characters) and return warnings to providers, and which ERR-4 severity should it use?
    answer: |-
      Yes. Checking the quality of incoming data is a high priority, and the sooner a problem is recognized and the submitter alerted, the better. Data quality issues are signaled in the ACK with the ERR segment, where ERR-4 gives the severity:

      - **E:** The problem must be corrected and the message resubmitted. Otherwise important information (about the patient or the vaccination) will be missing from the IIS.
      - **W:** The problem should be corrected, but the important information has been accepted. Resubmission is fine but not required.
      - **I:** There is no problem to fix. This is just information about how the data was processed.

      A lot number with an invalid suffix or invalid characters is a problem the submitter should fix. Depending on IIS policy it would be E or W, and W is probably the most appropriate. Flagging it in ACKs and in data quality reviews with submitters should lead them to fix these issues over time, which improves AART Data at Rest results. The IIS asking scores poorly on lot numbers in that assessment; it rejects messages with no lot number but has no validity checks.
    status: answered
    asked: 1
    messages: VXU, ACK
    related:
      - ERR-4; Data Quality & Validation; Acknowledgement & Error Handling
    years:
      - 2024
  - id: ta-q22-005
    group: RXA-15 Substance Lot Number
