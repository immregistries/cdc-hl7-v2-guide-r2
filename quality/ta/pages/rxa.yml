    question: An IIS rejects VXUs where a valid non-vaccine CVX (e.g., CVX 30 HBIG) is sent with a real but unrecognized NDC (e.g., 13533-636-01). Should it store based on the CVX, and is storing the unrecognized NDC a concern?
    answer: 'AIRA''s initial view: if the IIS has no way to validate whether the NDC is valid, rejecting on the basis of an invalid pair is unfair, so storing based on the CVX is not a big concern. Storing the unrecognized NDC is also not a concern, but guardrails are recommended: non-vaccine events should be in a separate table, flagged as non-vaccine, or identifiable by CVX, so they can be explicitly filtered in data quality reports and HL7 exchanges. Collecting NDCs may help the IIS build its own CVX-to-NDC mapping (consistently reported NDCs from different providers likely represent a valid mapping), but the IIS should be cautious about using such NDCs in reports or external exchanges until the match is confirmed. A clearer error message listing both the CVX and NDC would also help submitters.'
