  - id: ta-q29-020
    group: RXA-7 Administered Units
    fields:
      - RXA-7
    question: Which units should be used and accepted in RXA-7? Why do IIS prefer mL over mcg, is there a list of UCUM units for immunizations, and should an IIS accept, warn or reject other UCUM units (e.g., MEQ)?
    answer: |-
      RXA-6 is "Administered Amount", meaning how much of the vaccine was given. For a liquid that is a volume, and IIS expect volumes reported in mL in RXA-7. IG Release 1.5 says "The preferred units of measure for this is mL." Almost all vaccines are measured by volume and all routinely given vaccines have a volume, so mL works. Some systems record the amount of active ingredient (e.g., mcg), which is different from volume and belongs in RXA-13 (Administered Strength) if the IIS collected it; the submitter should convert to volume before sending RXA-6. Some travel vaccines are given as tablets: do not report a volume; put 999 in RXA-6 and leave RXA-7 empty.

      RXA-7 is meant to express a simple unit reflecting the actual quantity administered. Although UCUM allows many units, not all fit; MEQ is a measure of concentration rather than volume, does not align with RXA-7's intended use, and NIST certification testing tools do not recognize it as valid. For incoming VXUs with an inappropriate unit like MEQ, the IIS should aim to accept the data, removing the invalid unit before saving rather than rejecting the immunization. If the IIS can accept the immunization without a volume, store it as though no volume was provided and return an ERR with ERR-4 = "W". If the IIS requires a volume, it should not accept it and return ERR-4 = "E" indicating the amount must be in a valid unit such as mL. AIRA is open to discussing use cases needing alternative units.
    status: answered
    asked: 3
