  - id: ta-q01-047
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: How can both NDC and CVX be sent in RXA-5 when it has a cardinality of 1..1? Is [1..2] or a repetition (~) acceptable, and why are two codes allowed if the field cannot repeat?
    answer: 'No repetition is allowed. Only a single repetition of RXA-5 is allowed [1..1] per the base HL7 standard and the IG. To send both an NDC and a CVX for a dose, use the identifier and alternate identifier triplets built into the CE data type: CE.1-CE.3 carry the first code (identifier, text, coding system) and CE.4-CE.6 carry the alternate code (alternate identifier, alternate text, alternate coding system). Example: `49281-0560-05^Pentacel^NDC^120^DTaP-Hib-IPV^CVX`. A repeating form such as `20^DTaP^CVX^90700^DTaP, unspecified formulation^CPT~<NDC>^INFANRIX^NDC` is not allowed. The likely reason for constraining RXA-5 to one CE (primary plus alternate code) is to prevent a list of vaccines given at one visit from being reported in a single RXA. (The 2016 and 2024 askings of this question have no separate recorded answer.)'
    status: answered
    asked: 4
    messages: VXU
