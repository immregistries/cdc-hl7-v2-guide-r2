    question: An EHR sends RXA-5 with an empty NDC and a CVX as the alternate (`|^^NDC^31^^CVX|`), and the IIS warns ("NDC is invalid, CVX was used") but does not warn for `|31^^CVX^^^NDC|`. Should senders include the NDC coding system when not sending an NDC, and should the IIS warn in both cases?
