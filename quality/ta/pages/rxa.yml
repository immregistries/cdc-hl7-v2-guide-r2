  - id: ta-q24-004
    group: RXA-18 Substance/Treatment Refusal Reason
    fields:
      - RXA-18
    question: An IIS maps any unsupported refusal reason to "02^Other", but AART DQI test 18.1.2 ("Query for invalid exemption/refusal reason code") appears to expect an empty RXA-18 in the query response. How can the two be reconciled?
    answer: |-
      There are two ways to pass most Data Quality Incoming/Ongoing checks.

      1. **Flag it in the ACK (easiest).** Notice the problem in the incoming update and return an ERR segment pointing to where the problem is. For PID-8 gender, for example, returning an ERR pointing to PID-8 when the code is missing or unrecognized passes the whole measure. The ERR severity does not have to be E; it can be W or I, and the IIS can still process and map the data however it chooses.
      2. **Return corrected data in the query response.** AART checks the query response only when the ACK did not flag the problem. In that case it looks for evidence the data was handled properly, and expects the value to come back corrected. For the refusal date: returning a refusal RXA without RXA-3 would violate HL7, but if the IIS accepted the data without complaint, AART has to assume the refusal was stored without a date and should be returned that way.

      The recommendation is to flag the issue in the ACK with a warning or informational ERR pointing to the field, which is the most straightforward approach. Change query behavior only if desired. These problems are probably rare, so the extra warnings should have little effect on live interfaces.
    flags:
      - The answer discusses a missing refusal date (RXA-3), while the question concerns an invalid refusal reason code (RXA-18). Confirm which test case the answer refers to.
    status: answered
    asked: 1
    messages: VXU, ACK, RSP
    related:
