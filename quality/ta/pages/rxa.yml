  - id: ta-q41-012
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: What should an IIS do if RXA-20 contains a value other than CP, RE, NA or PA? Should the vaccination be accepted, or accepted with an informational error?
    answer: |-
      RXA-20 uses a closed, fixed value set defined by HL7 (CP, RE, NA, PA) that cannot be extended locally, so an informational error is not appropriate. At minimum it is a warning (W), and escalating to an error (E) is reasonable if it affects data integrity.

      - **Recommended:** If RXA-20 contains a non-standard value, the IIS SHOULD return an error (E) and ask that the message be fixed and resubmitted, because the meaning of the entire RXA is undefined.
      - **Exception:** The IIS MAY accept the data only if it can clearly determine the intended meaning and has investigated why non-standard values are being used. Any acceptance should come with outreach to the sender, since no conforming EHR should send these values.
      - **Separately:** IIS must correctly recognize NA, so that not-administered records are not added as doses.
    status: answered
