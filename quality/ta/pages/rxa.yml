    question: Could hospitals report Hepatitis B immune globulin (HBIG) to the IIS via VXU so infants can be identified within their post-exposure window?
    answer: 'It is technically possible with existing standards. CVX 30 (HBIG) can be used. CDC''s vocabulary team is no longer planning to add immune globulins to CVX (they are out of scope), so if CVX 30 accurately reflects HBIG products in use it is the code to use, and requests for new HBIG codes would likely be denied. Whether hospitals send it depends on EHR workflow: if HBIG is documented in the vaccination event workflow, submission may just be suppressed and easier to enable; if documented through a different workflow (e.g., medication administration), it may never trigger a VXU. Consider also whether HBsAg+ maternal status would be needed, and how the Perinatal Hep B program would use the data (e.g., querying the IIS).'
