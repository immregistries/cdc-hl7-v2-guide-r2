    question: An EHR blocks editing of the expiration date and flags doses given after expiration as not counting for forecasting, but COVID-19 expiration dates have since been extended. Will IIS accept vaccinations given after the expiration date (RXA-16), do they ignore expiration in forecasting, and should practices re-enter lots with updated dates and resend them?
    answer: IIS are supposed to receive and record any vaccination that was administered, even one given after the expiration date, because the IIS must record what actually happened even when it was not what was supposed to happen. Whether expired doses count toward series completion is a clinical decision support (CDSi) question, and it was referred to a CDSi subject matter expert. The record does not address editing expiration dates or resending lots.
