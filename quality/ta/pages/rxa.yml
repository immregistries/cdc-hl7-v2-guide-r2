id: rxa
kind: segment
title: RXA Pharmacy/Treatment Administration
overview: |-
  Most questions in this part concern RXA-5 (Administered Code): how to send CVX and NDC together in a field that cannot repeat, which NDC (unit of use vs. unit of sale, 10 vs. 11 digits) to send and accept, how to handle CVX/NDC conflicts, how to code foreign, unspecified, inactive and COVID-19 products, and how CVX 998 is used to carry patient-level observations such as contraindications. Other recurring themes are partial or unknown administration dates (RXA-3), dose amount and units for non-volume or self-administered products such as oral typhoid (RXA-6/RXA-7), and the meaning and use of the information source codes in RXA-9 (administered vs. historical), including in query responses, IIS-to-IIS exchange and FHIR mapping.

  Questions about the second half of the RXA segment cover who gave the dose (RXA-10) and where (RXA-11), lot numbers and expiration dates (RXA-15/16), manufacturers (RXA-17), refusal reasons (RXA-18), completion status (RXA-20), and the action code for add/update/delete (RXA-21). Recurring themes include how inventory decrementing depends on RXA-11.4 and lot numbers even though the VXU was not designed for it; accepting and flagging, rather than rejecting, doses given after the lot expired; how strictly to validate RXA-20 and RXA-17; and the lack of defined business rules for updates, deletes, and refusal records. Several questions come from newer scenarios, such as self-administered FluMist at Home, pharmacy technicians who have no NPI, and FHIR crosswalks.
suggested:
  - Explain that the CE/CWE alternate triplet (components 4-6) is the same concept in a second coding system, not a repetition; state that NDC/CVX order is not significant.
  - Provide guidance for NDCs that map to multiple CVX codes (default CVX or volume qualifier) and for IIS validation of CVX/NDC pairs.
  - Define how to express RXA-6/RXA-7 for oral capsule/pill and self-administered (dispensed) vaccines, and whether a multi-dose dispensed regimen is one or several events; give explicit RXA-7 guidance for non-volume products.
  - Provide guidance on multiple same-day nirsevimab injections and related deduplication exceptions.
  - State what RXA-3 contains when the RXA is a placeholder for an exemption/refusal/evidence observation; consider a way to flag estimated administration dates.
  - Distinguish patient-level contraindication observations from dose-level non-administration due to a contraindication, and define the meaning of a contraindication OBX under a specific non-998 CVX.
  - Clarify CVX use for foreign-administered vaccines (including products with US equivalents) and define "historical" consistently (per MIROW), noting unspecified/inactive CVX are acceptable for historical doses.
  - Define RXA-9 values to return in RSP and IIS-to-IIS exchange; review the pediatric-oriented NIP001 code set (adult sources, 01 as catch-all vs. "reliable source"); use "NIP001" consistently; give NIP001-to-FHIR informationSource mapping guidance.
  - Clarify expectations for R fields when forwarding records received from others (source 05), and that priority groups belong in OBX, not RXA-9.
  - Define how to convey the administering provider's credential or suffix (XCN-21 vs. XCN-6) and whether a value set applies. Add guidance for self-administered and caregiver-administered vaccinations in RXA-10.
  - Move RXA-11 from RE to R (proposed in the new IG). Consider NPI as an identifier in RXA-11 for facility identification across IIS. Document RXA-11.4.2 as the location for a VTrckS PIN.
  - 'Address inventory decrementing: there is no designed mechanism for lot identity, source or parent facility, or which location field drives deduction.'
  - State that a single RXA-16 expiration date is reported for the active component or NDC reported in multicomponent products. Specify how a month-only (YYYYMM) RXA-16 is interpreted (last day of the month) and whether it is stored or returned as received.
  - Note that there is no mechanism for data quality feedback on an RSP (unlike an ACK on a VXU).
  - Add guidance on validating inactive MVX and CVX codes against the administration date, on handling inconsistent CVX/MVX combinations, and on whether an RSP should echo invalid or non-standard stored codes. CDC tables need timely MVX updates when manufacturers change.
  - Resolve the inconsistency between the RXA-18 definition (refusal) and Appendix B (exempt or refuses). Define how medical exemptions are communicated. Deprecate NIP002 code 02 "Other". Advise W or I severity for unsupported refusal reasons.
  - Provide a way, or explicitly decline to provide one, to message the indication or intent of a dose (RXA-19 is unused).
  - Clarify that RXA-20 = NA covers multiple patient-level observations (contraindication, immunity, adverse event) distinguished by the OBX LOINC, and include a contraindication example. Clarify the RXA-20 value on deletes and whether NA requires RXA-5 = 998.
  - Define processing differences between RXA-21 A and U, a way to signal full vs. partial replace, message sequencing expectations for closely spaced add/delete messages, and IIS handling of deletes for inventory-linked administered doses.
  - State that RSPs should not include deleted immunizations (RXA-21 = D).
  - Clarify that an RXA-21 delete does not apply to refusals, how refusal records with ORC-3 = 9999 are updated or deleted, and how records move between administered and refused.
  - Define RXA-22 as the date and time the immunization was last entered or updated in the submitting system.
