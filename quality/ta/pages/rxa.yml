  - id: ta-q05-008
    group: RXA-10 Administering Provider
    fields:
      - RXA-10
    question: The RSP returns the administering clinician's full name as one string in the family name component instead of splitting it into family and given name. Should this be fixed, and would AART testing flag it?
    answer: |-
      RXA-10 is RE, and many IIS do not ask for it to be filled out. If you have it, you are free to send it back, but receiving EHRs are unlikely to save it, because they would not update their clinician data from the IIS. Technically the first name belongs in the given name component, but this is not a big issue. It is better to return the information and let the receiver deal with it.

      AART checks returned data at two levels. Certain key fields, such as immunization date and CVX code, must come back as they were sent. Some checks also cover CDC core data elements, though these are limited because not everything that is sent is necessarily expected back. The clinician name in RXA-10 is on neither list, so AART does not evaluate what is returned there.
    status: answered
