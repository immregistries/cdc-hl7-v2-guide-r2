  - id: ta-q36-007
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: Why are EHRs required to use the CDC NDC Linker for ONC certification when FHIR US Core only requires CVX? If an EHR always sends CVX, can it map CVX to NDC?
    answer: US Core is FHIR-based and focused on making immunization data available for access, requiring CVX with NDC as a SHOULD translation. ONC certification requirements for IIS reporting are based on HL7 v2, under which newly administered immunizations must be reported using NDC codes; the HL7 v2.5.1 IG also says support for CVX is strongly preferred, and some IIS constrain this to require CVX along with NDC for administered doses. The CDC NDC Linker table translates an NDC (e.g., scanned from packaging) to its CVX. Always sending CVX to IIS is a good strategy. The linker can technically be used in reverse, but it is generally used from the more specific NDC to the less specific CVX; one CVX (e.g., 03 MMR) maps to several NDCs, so CVX-to-NDC is not a unique mapping.
    status: answered
