    question: Is there a way to communicate religious and medical exemptions in a query response (e.g., for a consumer portal or patient vaccine card)?
    answer: |-
      The standard does not directly support exemptions, and few IIS ask about them.

      - RXA-18 is defined as the reason the patient refused the substance, and its value set does not appear to include medical exemptions.
      - Appendix B (p. 4), however, describes the refusal reason as indicating why the patient is either exempt from or refuses the immunization, with no further guidance.
      - The guide's authors mostly considered refusals for personal or religious reasons. Religious exemptions could be sent as refusals.

      There is no direct support for messaging that a vaccine was not given because of a medical exemption. Contraindications can be messaged and may explain why a vaccine was not given, but a contraindication is not the same as an exemption. A 2020 information request from one state on IIS exemptions (in the AIRA repository) shows what some IIS do.
    status: answered
