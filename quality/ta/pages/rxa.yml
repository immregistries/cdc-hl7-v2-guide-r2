    question: How will self-administered (at-home) FluMist doses be reported to IIS via HL7, and is the prior year's guidance still current?
    answer: |-
      2025: The manufacturer is using an online pharmacy that handles screening (including querying the IIS based on the patient-provided address), ordering, shipping and verification of administration. About 250,000 doses were expected in the first year in 30 of the 48 contiguous states, not part of the VFC program. Once the pharmacy confirms administration it sends the report to an IIS vendor intermediary (ImmsLink), which sends VXU messages to the IIS determined by the shipping address and will reach out to IIS for onboarding. Most of the HL7 VXU (and QBP) will be the same as IIS consume today, with a few unique areas (including expectations on the pharmacy collecting data needed by IIS) described in a draft document with CDC. The package (Unit of Sale) NDC is expected to be unique for FluMist at Home, but the Unit of Use NDC will be the same as provider-administered FluMist. A new CVX code had been discussed but not confirmed.

      2026: The intermediary that produces the HL7 confirmed that nothing on the HL7 wire will change for the 2026-2027 season; even the CVX and NDC codes remain the same, so the prior Technical Advisory Bulletin still applies.
