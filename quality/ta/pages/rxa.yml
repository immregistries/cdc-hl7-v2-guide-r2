  - id: ta-q39-012
    group: RXA-11 Administered-at Location
    fields:
      - RXA-11
    question: How should an IIS decide which facility to deduct inventory from when a clinic administers doses drawn from a parent facility's inventory (e.g., a hospital pharmacy)? How are MSH-4, MSH-22 and RXA-11 defined, and could RXA-11.4 or ORC-17 identify the inventory owner?
    answer: |-
      HL7 v2 VXU was not designed for real-time inventory deduction; deduction was added later. The organizational identifier fields identify the organizations that took part in the administration. They do not say where the inventory came from.

      - RXA-11 should be the facility where the dose was administered, which may or may not be where the inventory was drawn from.
      - Even in the normal "I administer from my own inventory" case, HL7 says nothing about inventory. The IIS assumes it and deducts if inventory tracking is turned on.

      The scenarios behind this question:

      - In one case, the VXU identifies the parent in MSH-4 and the clinic in MSH-22.
      - In another, a legacy IIS used the site ID in RXA-11 to "draw from inventory" at a primary site, while the new IIS checks inventory at the MSH-22 facility and defaults to MSH-4.

      The recommended approach is to keep site metadata in the IIS rather than overload message fields. Beyond parent-child relationships, define a "draws inventory from" relationship (e.g., CLINIC_123 draws inventory from BIGORG). Then add business rules that deduct from BIGORG when CLINIC_123 is in RXA-11, or when it is the administering or owning facility.

      Expecting EHRs to vary RXA-11 values by inventory source would be hard, given how RXA-11 is populated nationally. There is no standard for inventory deduction yet. AIRA has discussed a new process for inventory management, but lot decrementing is a large subject.
    status: answered
    asked: 2
    messages: VXU
    related:
      - MSH-4
      - MSH-22
