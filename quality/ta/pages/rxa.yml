    question: How should an IIS handle an NDC that maps to multiple CVX codes (e.g., Engerix-B 58160-0821-52 mapped to both CVX 43 and CVX 44), when its validation assumes a 1:1 NDC-to-CVX mapping and it rejects `|44^Hep B, dialysis (3 dose schedule)^CVX^58160-0821-52^...^NDC|`? Are there other such NDCs?
    answer: This is a known, complex problem raised by implementers before. CDC's crosswalk contains a few NDCs mapped to more than one CVX, so IIS validation should not assume a strict 1:1 NDC-to-CVX relationship. AIRA analyzed the mappings and found three situations with 1:2 mappings; at least one appears to genuinely need it, but two others could probably be cleaned up to 1:1. For Engerix-B, the single-dose prefilled syringes (58160-0821-52, 58160-0821-43, and inactive 58160-0821-34/-05) are fixed 1 mL doses, so a dialysis dose would be two administrations and these could map only to CVX 43; the single-dose vials (58160-0821-11, -01) can be drawn as 1 mL (CVX 43) or two vials combined into a single 2 mL injection (CVX 44), so the NDC alone cannot determine the CVX (and the right CVX cannot be picked when only the NDC is sent). AIRA raised this with the CDC vocabulary/code set team, suggesting cleanup of the mappings, adding a dose volume modifier to the NDC-to-CVX tables, or designating a national "default" CVX for ambiguous NDCs. CDC confirmed it is a complex case and is looking into it; no final guidance was given.
    status: partial
