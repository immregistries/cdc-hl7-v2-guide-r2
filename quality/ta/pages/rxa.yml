    answer: For an invalid MVX code like this, AIRA recommends not returning it. The system that sent it may understand it, but many other receivers may not, and that can have unintended consequences. This approach would likely work for many fields but not necessarily all of them, especially more critical fields, where dropping a value could change the meaning of the data.
