  - id: ta-q30-019
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: Could an IIS normalize all incoming CVX/CPT/NDC codes to NDC (which carries more detail), store them, and return NDC in query responses? Is CVX as the common denominator a compliance requirement?
    answer: 'CVX is the common denominator because everything can be mapped to CVX, while not everything can be mapped to a specific NDC, even though some specificity is lost. For example, IPV is CVX 10, but a reported CVX 10 cannot be mapped to one NDC because it could be either of two NDCs. Some CVX codes have no NDC at all, notably the "unspecified" codes and the non-US codes. So normalizing everything to NDC does not work. Never throw away what was originally submitted: if NDC 50090-1693-09 (IPV) is received, do not store only CVX 10 and lose the NDC. When both are known, send both in RXA-5, e.g., `|10^IPV^CVX^50090-1693-09^IPOL^NDC|`.'
