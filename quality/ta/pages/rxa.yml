    answer: Yes. For self-administration, the identifier in RXA-10 is the same identifier found in PID-3. For caregiver administration, RXA-10 contains the MRN of the person who administered the dose (e.g., a parent or guardian). In that case the identifiers in RXA-10 and PID-3 differ, but both are MRNs within the ASPN pharmacy system.
