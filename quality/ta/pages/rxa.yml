  - id: ta-q07-006
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: Can a refusal (RXA-20 = RE) be deleted via HL7 (RXA-21 = D), and what should the IIS expect? For example, if three clinics each sent a refusal, should an EHR delete send one deletion or three? Should an IIS support deleting refusals at all?
    answer: |-
      The 2020 answer said:

      - There is no national data on how many IIS store refusals, and no IIS is known to have published guidance on deleting them. There are few nationally documented business rules for deletes in general.
      - Refusals usually aren't reported back out of the IIS, aren't part of the patient's official record, and don't affect which immunizations are recommended. IIS that use them most likely use them for location-level reports on how often refusals happen.
      - Probably no IIS merges duplicate refusals, and most probably don't support deleting them, since there is no reliable way to make sure a delete refers to the same refusal report.
      - A site that reported a refusal and wants to reverse it should contact the IIS directly to find out what, if anything, needs to be done.

      The 2025 answer covered an IIS that stores refusals separately (as notes) rather than as immunizations, so a VXU with the same CVX (e.g., influenza CVX 168) and RXA-21 = D finds no match. That behavior is consistent with the national IG: there is no defined HL7 operation for deleting refusals. The RXA-21 add/update/delete action code applies to vaccination events, and refusals are not vaccination events. A UI for removing refusals goes beyond what IIS are currently required to do, and is a good practice for other IIS. Reasons no HL7 delete is defined:

      - Much data sent in a VXU cannot be deleted via HL7 (addresses, phone numbers, guardians, contraindications, precautions, demographics), so there is no expectation that every concept sent via HL7 can be deleted via HL7.
      - Refusals are not part of the patient's official immunization history and are not expected to be passed on to other systems; they are used mainly for analysis and trending.
      - Interest in tracking refusals has been low, and a delete mechanism would require defining how to identify and match refusal reports, which currently have no matchable identity.

      IIS that track refusals carefully are expected to have their own review and correction processes. Support could be added in the future if a need emerges.
    status: answered
    asked: 2
    messages: VXU
