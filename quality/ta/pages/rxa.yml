  - id: ta-q08-001
    group: RXA-18 Substance/Treatment Refusal Reason
    fields:
      - RXA-18
    question: 'Table NIP002 defines four RXA-18 values: 00 Parental decision, 01 Religious exemption, 02 Other, and 03 Patient decision. Must an IIS accept and store every refusal reason, or can it reject reasons its jurisdiction does not allow (e.g., allowing only 00 and 01)?'
    answer: |-
      Code 02 "Other" can be ignored. SISC discussed it years ago and recommended against using it, because the way it was designed effectively breaks vocabulary standards.

      Code 03 (Patient decision) is different. The IIS is not required to support it, but with COVID-19 vaccines and adult populations the data may become useful. If the IIS chooses not to store it, the error should be a warning or informational, not severity E. An E tells the EHR to fix something and resubmit, but if it really was the patient's decision, the EHR cannot change anything to make the IIS accept it.
    status: answered
