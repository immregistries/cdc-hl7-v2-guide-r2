    question: For weight-based nirsevimab dosing, should providers report dose volume in RXA-6/RXA-7, and how can two same-day injections be recorded when the IIS rejects the second RXA as a duplicate?
    answer: 'Interim guidance, pending final CDC guidance: reporting the dose volume in RXA-6 and units in RXA-7 is correct, and EHRs should report it that way. Two same-day injections are given at different anatomical sites and billed as two administrations, so the EHR should report them as two separate events, e.g., two RXAs each with 100 mg. Asking EHRs to merge them is not workable, since the message should reflect what actually happened. IIS should accept two same-day doses reported separately and adjust their vaccination matching and deduplication logic so these doses are not merged.'
