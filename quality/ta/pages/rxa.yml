    question: An EHR sends delete requests (RXA-21 = D) without the vaccination date, arguing that deletes should process when the control ID matches (citing ORC-3). Should an IIS process deletes based on a control ID when RXA-3 is missing?
    answer: No. The Addendum to the IG (July 2015, bottom of page 3) was created after the IG and is part of the Meaningful Use requirements for certified EHRs. It clarifies that all information sent in the original add or update must also be included in the delete, so a delete missing the administration date (RXA-3) is non-conformant. ORC-3 is the EHR's unique identifier for the immunization. It can help find the record in the IIS, but it has not been shown to be completely reliable, and other fields should still be checked to find the matching immunization. (The IIS in question uses MSH-10 as its control ID.)
