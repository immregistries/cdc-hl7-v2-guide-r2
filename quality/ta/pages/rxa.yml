    question: Do IIS still need CPT codes in RXA-5.1? Can an EHR remove its CPT-only option for RXA-5?
    answer: CPT is not required or even recommended for immunization messaging to IIS. National guidance strongly prefers CVX, and ONC (now ASTP) certification regulations require support for NDC for administered vaccinations. Most, if not all, IIS support both CVX and NDC, and that is what AIRA tests for. While many IIS may still accept CPT, it is not specific enough in some cases, so IIS prefer CVX and/or NDC. No IIS currently requires CPT. Sending CPT-only is not recommended, so it should be safe to remove or disable the CPT-only option.
