  - id: ta-q26-019
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: Should an IIS include deleted immunizations (RXA-21 = D) in RSP messages (Z32/Z42 responses to Z34/Z44 queries)?
    answer: |-
      No. Deleted immunizations should be suppressed from RSP messages; only 2 of more than 50 IIS tested returned them. Provider systems may not expect deleted records in an RSP and could add them as real vaccinations, which gives an inaccurate history and wrong evaluation and forecasting.

      In some IIS platforms this is a configuration setting. In the recorded cases, one IIS suppressed deletes for its AART profile and confirmed that its production profiles normally do not return them. Another changed its configuration so its RSP interface no longer sends deleted immunizations.
    status: answered
