    answer: Yes. The expectation is that the IIS accepts, stores and returns RXA-20 Completion Status for partially administered vaccinations; this is critical for understanding the vaccination event. The test submits a VXU with a vaccination where RXA-20 = PA, then queries and expects the same immunization back with RXA-20 = PA.
