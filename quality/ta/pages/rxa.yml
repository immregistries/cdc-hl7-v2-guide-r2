  - id: ta-q09-016
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: The IG says ORC-3 (filler order number) shall be 9999 for an RXA that conveys an immunization that was not given. Since some IIS match records on order numbers, how should updates and deletes of not-given vaccinations be sent, and how should a record change between administered and not given?
    answer: |-
      - **Not-administered records:** Do not report "not administered" vaccinations in general. RXA-20 NA is for specific situations, not for documenting every vaccine a patient did not receive, and most IIS will return an error for them or ignore them. Vaccines that were not given and have no recorded refusal should never be reported.
      - **Refusals:** Refusals can be submitted. IIS accept them, though some may not store them; the IIS priority is administered doses.
      - **Refusal sent in error:** You can attempt to delete it, but there is no data on whether IIS honor this. There is little guidance on how IIS use refusals, so refusal records in IIS have received little scrutiny.
      - **Refused, then actually given:** Submit it as a new vaccination event.
      - **Reported as completed, but actually refused:** The vaccination must be deleted from the IIS (the IIS may or may not honor the delete, depending on its business rules and the original reporter). The refusal may then be reported as a new event.
    status: answered
    asked: 1
    messages: VXU
    related:
      - ORC-3
      - RXA-21; Immunization Evidence (refusals
      - immunity
      - contraindications)
    years:
      - 2021
  - id: ta-q42-002
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: If a VXU has RXA-20 = NA but other RXA fields do not follow the not-administered pattern (e.g., RXA-5 is a real CVX, RXA-6 is 0.5 mL, or RXA-9 is 00), should the IIS reject the message, or should NA take precedence?
    answer: RXA-20 = NA takes precedence. Once the IIS sees NA in RXA-20, it should not try to validate anything more in the ORC/RXA, because there is no administered or historical vaccination. RXA-9 should be ignored completely, since nothing was given. If the IIS stores non-administered vaccinations, it can look at RXA-5 for the CVX and, if it is valid, store a non-administered event. The overall rule is to validate only what you are going to save or act on. After RXA-20 = NA, stop verifying RXA fields.
