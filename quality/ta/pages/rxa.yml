  - id: ta-q09-022
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: Can RXA-16 contain a partial date with only month and year (e.g., 202505 or 202006)? Should IIS reject it, or should they default it to the last day of the month for storage and query responses?
    answer: |-
      Sending YYYYMM is correct (2021 guidance). Some expiration dates do not include a day, and the IG defines RXA-16 with the TS_M data type, which allows YYYYMM precision. Partial dates are therefore valid, and receivers should accept them rather than restrict RXA-16 to YYYYMMDD.

      On storage (2025 guidance), an IIS must be prepared to receive an expiration date in YYYYMM format without a day component. When the day is missing, it is reasonable to assume the last day of the month. This is well documented in the clinical community; for example, Immunize.org's Ask the Experts says that when an expiration date shows only month and year, the vaccine expires on the last day of the month. There is no published guidance on the "correct" storage behavior, and either approach is defensible:

      1. Default to the end of the month on receipt (convert 202505 to 20250531).
      2. Store the date as reported, and apply business logic that assumes the last day of the month wherever the expiration date is used (e.g., when checking dose validity).
    status: answered
    asked: 2
    messages: VXU, RSP
    related:
