  - id: ta-q03-117
    group: RXA-5 Administered Code
    fields:
      - RXA-5
    question: How should an IIS process NDC and CVX when one or both are present or when they disagree (e.g., same vaccine group vs. different vaccine groups)? Should it process silently, return an I/W/E, or reject?
    answer: |-
      2019: the response referenced two AIRA guides and gave direction on approach; details not recorded.

      2024: The purist view is to reject when they disagree, but IIS that AIRA has spoken with make the same vaccine-group-based decisions (reject when in different vaccine groups, accept when in the same group); changing all provider/EHR behavior would be an endless effort, with concern over lost records that might never be resubmitted. Still, IIS should do something about this data quality error. Rejecting is the last option, if the IIS is confident in its selection logic when the codes disagree within the same vaccine group. Returning an ACK message would likely be a W (warning), asking the sender to correct future submissions. For a field as critical as vaccine type, consider doing both after-the-fact DQ reporting and the ACK warning, since resolution workflows vary and surfacing the issue in more than one place helps. (The asker noted AART test 21.4.1 expects an error for conflicts, while NIST does not check CVX/NDC consistency.)
    status: answered
