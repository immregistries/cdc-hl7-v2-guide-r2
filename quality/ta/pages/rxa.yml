    question: How should an IIS tie a VXU administration to a specific facility for inventory decrementing, when the VXU seems to identify only the organization? Should organization and facility be treated differently (for example, would EHRs change MSH values per facility)?
    answer: Use RXA-11.4 (administered-at location). MSH-4 could serve as a default, but the better practice is to require RXA-11.4 for decrementing. RXA-11.4 is an RE field and is well supported by EHRs. IIS usually assign the facility IDs, but they can also map whatever is sent to their internal IDs.
