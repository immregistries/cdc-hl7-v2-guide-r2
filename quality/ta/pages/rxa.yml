  - id: ta-q43-012
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: RXA-16 has usage C(RE/O), and the predicate is met for a new administration. Does that mean the expiration date must be sent if known and may be empty if not, or that it is required without exception?
    answer: |-
      It means required but may be empty. For a new administration (RXA-9.1 = 00 and RXA-20 = CP), the predicate is met and the usage resolves to RE. Under HL7 v2 conformance, RE means:

      - the sender SHALL send the field if the value is known
      - the receiver SHALL process it if it is sent
      - the field may be omitted when the value is not known

      It does not mean "required without exception"; that concept does not exist in the conformance methodology the guide uses. The sending system (EHR) must support the field and cannot be certified without demonstrating that support, but if the value is not known it should be left blank.
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-9
      - RXA-20; Version & IG Interpretation
    years:
      - 2026
  - id: ta-q40-012
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: EHRs receiving historical immunizations in RSP messages sometimes get clearly wrong lot expiration dates (e.g., 1/1/1900 for COVID-19 vaccines), so doses are evaluated as given after expiration and forecast as still due. What validation should the receiving EHR apply?
    answer: |-
      Disregard expiration dates on historical immunizations, or apply validation logic that identifies and excludes clearly invalid ones. For historical doses, expiration dates are often unavailable or unreliable. A clearly implausible date (far before the vaccine's introduction or the administration date) should be treated as a data quality anomaly rather than an expired dose. Excluding it lets the dose be evaluated properly. Suggested safeguards:

      - Flag or exclude default or placeholder dates such as 1/1/1900 (or 1/1/1970).
      - Flag or exclude expiration dates much earlier than the administration date (e.g., more than a year before). Such dates are unlikely, given that inventory is reconciled at least annually.
      - Optionally, compare against the introduction dates of the CVX or tradename.
      - Consider trusting expiration dates only for doses administered and entered by the receiving organization.

      IIS generally accept apparently invalid expiration dates on intake and rely on follow-up outside the interface. HL7 has no mechanism to send feedback about an RSP the way an ACK does for a VXU, so feedback to the responding system must happen outside the interface.
    status: answered
    asked: 1
    messages: RSP
    related:
      - RXA-9; Data Quality & Validation
    years:
