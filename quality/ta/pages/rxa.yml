  - id: ta-q24-018
    group: RXA-16 Substance Expiration Date
    fields:
      - RXA-16
    question: How should an IIS handle a VXU where the lot expiration date (RXA-16) is before the administration date (an expired dose)? Should it reject, validate or flag the dose, and how is this communicated so that others know it may be an ineffective dose?
    answer: |-
      Accept, store, flag, and return. A vaccination can be given after the lot expiration date. It is usually incorrect practice, but it happens clinically, and the IIS must record what actually happened. Accept and process the immunization rather than rejecting it.

      **Flag it in the ACK:**
      - Use an ERR whose severity is not E. Use W (warning) or I (informational) for a possible data quality issue, such as a wrong expiration date. A non-E severity tells the sender the data was accepted and stored.
      - For this condition, AIRA suggests ERR-5 code 2001 (conflicting data) rather than 4 (invalid value), per the Error Code Guidance.
      - Example: `ERR||RXA^1^16|207^Application internal error^HL70357|I|...|||Incoming Immunization vaccine lot has expired`.

      **Store it:**
      - AART DQI Assessment 26.1 expects the IIS to accept a VXU with an expired-lot vaccination and return it, with the expiration date, in the query response. Expiration date is recognized as a critical field to return in RSP immunization history, so others can see both dates, and AIRA is working to ensure IIS return it consistently.
      - The IIS can store the lot expiration date on the vaccine lot (inventory) record and on the vaccination record. There is little guidance on how the two relate.

      **Validate:**
      - There is no national dataset of lot numbers and expiration dates, apart from COVID-19, which may not be maintained or extended to other vaccines.
      - Beyond warning when the administration date is after the expiration date, little can be determined with confidence from one message. Trend analysis across many records (data at rest) may catch invalid expiration dates.
      - Review data at rest for expiration dates that precede administration dates, and follow up with submitters. The goal is to tell a data entry error from a truly expired dose, and then help update the record or recall the patient to repeat the dose.

      **Clinical decision support:** The CDSi Logic Specification (p. 26) says sub-standard doses (expired, sub-potent, recalled) should not count toward series completion.
    flags:
      - The ERR example puts 207 in ERR-3 and does not show ERR-5 = 2001, although the text recommends ERR-5 code 2001. Confirm which codes are intended.
    status: answered
    asked: 3
    messages: VXU, ACK, RSP
    related:
      - RXA-15
