    question: How should vaccinations given outside the US (e.g., foreign COVID-19 vaccines such as Sinovac or COVISHIELD) be coded and recorded, and is there guidance on validating foreign vaccination documents?
    answer: |-
      IIS are intended to include the entire vaccination history, including doses given outside the US, recorded as historical doses with the vaccine code that best represents what was received.

      Early 2021: use CVX 213 (COVID-19 vaccine, unspecified formulation) for a foreign product not on the FDA EUA list or with unknown manufacturer (e.g., Sinovac given in Chile). CVX 213 is discouraged for US administered doses, which should all have specific codes, but is appropriate here. The same issue exists for other foreign vaccines: CVX doesn't cover every foreign formulation, but nearly all vaccine concepts have an NOS/unspecified code. If the foreign vaccine matches a product with a specific CVX (e.g., AstraZeneca, Pfizer or Moderna on a non-US card), the initial thinking was to use the specific CVX even if the non-US product differs slightly. CDC might consider a separate "non-US COVID-19 unspecified" code if needed.

      Mid 2021: COVISHIELD is the brand name of the AstraZeneca product, so the working approach was to code it as AstraZeneca, though CDC's code set team was finalizing decisions. CDC planned to follow ACIP guidance that WHO-approved COVID-19 vaccines confer immunity and should get CVX codes as US-authorized vaccines do; related MVX handling was still being worked out. Non-US vaccines not approved by WHO would be treated as "unspecified" with no individual CVX codes and should not count toward immunity, possibly with a separate vaccine group. Most IIS accept out-of-country vaccines only to the extent a CVX covers them; historically non-US CVX codes were created on request.

      September 2021: CDC updated the COVID-19 code set (7/30/2021) to support non-US COVID-19 vaccines; jurisdictions are entering the recognized CVX codes as historical doses. ACIP guidance specifies which foreign vaccines count toward US vaccination, and also addresses clinical trial vaccines; these rules are reflected in CDSi. No guidance was identified on validating that a foreign document is authentic.
    status: answered
    asked: 3
    messages: VXU
    related:
