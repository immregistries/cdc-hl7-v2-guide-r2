    question: How should CVX 304 (RSV, unspecified) be used? Can it be forecast for infants 0-8 months, and should it be disallowed for an RSV vaccine given to a 60-year-old?
    answer: 'Forecasting: forecasting 304 is fine. It means "this patient needs RSV," and the clinician picks the monoclonal antibody instead of the vaccine. The new "RSV MAB, unspecified" code could be used instead. Check how EHRs display forecasts (vaccine group vs. specific CVX). Event recording: 304 is allowable at any age. ACIP recommendations target clearly different ages, so 304 for adults 60+ can be assumed to be vaccine and 304 for infants under 8 months to be mAb. The new codes don''t change 304, but they must be used correctly: "RSV MAB unspecified" for a 60-year-old should be invalid, and vice versa.'
