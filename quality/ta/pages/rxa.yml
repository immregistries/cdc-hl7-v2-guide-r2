  - id: ta-q33-018
    group: RXA-10 Administering Provider
    fields:
      - RXA-10
    question: To reduce duplicate clinician records, can an IIS require RXA-10.1, RXA-10.2 and RXA-10.3 (administering provider ID, family name, given name) and return an ERR when they are missing? Would that deviate from HL7 or cause AART measurement failures?
    answer: |-
      Yes, an IIS can make all three components required (R). They are already RE in the IG, and tightening RE to R is a permitted local constraint that does not contradict the standard. IIS should be cautious, though:

      - If the vaccination event is rejected because the administering person is not identified, the IIS can lose immunization data.
      - Requiring string fields often leads submitters to send filler data rather than good data.

      AIRA recommends enforcing the existing RE requirement (send if known) through data quality interventions instead. A provider that consistently omits values it knows is out of compliance with the guide, and the IIS can require the provider to fix it. A good matching algorithm tuned for clinician data should also be able to merge records when full names are sent.

      The IIS clarified that it would still accept immunizations with only one of the components, and would require all three only to create a new clinician record. That approach avoids the data loss concern.
    status: answered
    asked: 1
    messages: VXU, ACK
    related:
      - Local Profiles & Jurisdictional Constraints; ERR-4
    years:
      - 2024
  - id: ta-q42-003
    group: RXA-11 Administered-at Location
    fields:
      - RXA-11
    question: Test messages put the clinic name in RXA-11.4 and the clinic code in ORC-17, and IIS processing for inventory deduction fails. Is there guidance that ORC-17, when provided, should be used for inventory deduction instead of RXA-11.4?
    answer: |-
      There is no explicit national guidance on matching ORC-17 to RXA-11.4, or on using one over the other for inventory deduction. Many IIS treat RXA-11 as the authoritative location for administration and inventory deduction, because it is where the immunization was administered. ORC-17 is the organization responsible for the order (the entering organization), and it is not typically used alone to decrement inventory. If RXA-11 is missing, many IIS use MSH-22 or MSH-4 instead.

      Many IIS require RXA-11, and the new IG proposes moving RXA-11 from RE to R. Some IIS have their own business rules for what is needed for inventory deduction. AIRA updated its test transforms to populate RXA-11.4 with the code value.
