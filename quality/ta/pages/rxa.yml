  - id: ta-q39-008
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: When a historical vaccination is resubmitted with changes, should the IIS treat it as an update to the existing record if the CVX changes within the same vaccine group (e.g., 45 to 08), the CVX changes to a different vaccine, or the date changes by one day?
    answer: |-
      AIRA's Technical Advisory Bulletin: Scenarios for Updates and Queries (January 2024) says that if any identifying field of the vaccination record changes, the submitter must send a delete followed by an add, so the IIS can reconcile the record properly. The identifying fields are:

      - RXA-3 (date of administration)
      - RXA-5 (CVX)
      - RXA-9 (administered or historical indicator)
      - RXA-11.4 (administered-at location)

      So a CVX change (within the same vaccine group or to a different vaccine) or a date change (even by one day) should be sent as delete plus add. A simple update is appropriate only for non-identifying fields, such as lot number, manufacturer or route. There is no guarantee all submitters will follow this: EHR certification does not require it, and some IIS may allow updates even when identifying fields change. The guidance is meant to give the best chance of avoiding duplicates.
    status: answered
    asked: 1
    messages: VXU
