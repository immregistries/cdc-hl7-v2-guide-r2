    question: Should an IIS accept an inactive unspecified-formulation CVX (e.g., CVX 188) for a historical immunization whose administration date is after the code became inactive?
    answer: An inactive CVX status does not mean the code cannot or should not be used to exchange immunization data. Inactive codes document historical administration of vaccines no longer available but found in historical records. Unspecified CVX codes always carry an inactive status and should not be used to document new/current administrations, but they can be used for a historical record where the exact formulation is unknown. An IIS should accept inactive CVX codes for unspecified-formulation vaccines from a facility reporting historical immunization information where the dose administration date is in the past and does not represent a new administration record, or where the sending facility did not administer the dose and is only reporting it. Additional business rules should require confirmation of the date as well as the CVX code. For the definition of "historical" (administered in the past vs. not administered by the reporting provider), the MIROW guide (consolidating demographic records, around p. 105) is the best reference.
