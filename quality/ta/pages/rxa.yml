    question: An Epic partner cannot process RXA segments in an RSP where RXA-20 is empty. Should the IIS change its interface to default a value?
    answer: Epic confirmed that logging an error for a blank RXA-20 is the standard Epic configuration but can be changed. Starting with the November 2018 version, Epic can be configured to default a blank RXA-20 to CP, or to RE if RXA-18 has a refusal reason. However, defaulting causes those events to be treated as historical administrations in Epic. If the IIS also sends contraindications in RSPs with a blank RXA-20, they would be misinterpreted as historical administrations. The IIS and the Epic site must work together to decide which kinds of records the IIS can send, and make sure the implications are understood before enabling the setting.
