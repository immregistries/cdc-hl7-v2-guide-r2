    question: Patients are accumulating many historical COVID-19 doses reported by other providers or IIS, inflating dose counts. How do IIS identify duplicates so reporting does not overcount?
    answer: 'An HL7 Immunization User Group community discussion covered historical COVID vaccinations with a panel of five jurisdictions (recording at https://vimeo.com/711228119 from minute 19). The IIS Data Quality Practices document offers strategies for identifying potentially fake data and links to vaccination-level deduplication guidance (Appendix C). Some IIS have asked providers to withhold COVID historical doses; this may work if the IIS has near-complete live interface coverage, but if only a portion of providers are onboarded, historical reports fill gaps and reveal residents vaccinated outside the jurisdiction. Not all providers can withhold historicals, and EHRs may not be able to withhold only COVID historicals, so the IIS must still deduplicate. The MIROW best practice guide on vaccination-level deduplication (vaccine matching and record consolidation) is still very relevant: https://repository.immregistries.org/resource/vaccination-level-deduplication-in-immunization-information-systems-1/.'
