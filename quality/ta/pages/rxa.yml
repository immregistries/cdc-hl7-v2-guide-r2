    question: How should RXA-9 information source (00-08) be represented in FHIR, where Immunization.primarySource is boolean?
    answer: 'primarySource does not completely replace RXA-9; FHIR intentionally uses a simplified model. Set primarySource = true for administered doses (RXA-9 = 00) and false for any other value (01-08). Carry the original v2 value in Immunization.informationSource. FHIR''s example codes do not cover all v2 concepts, and since the binding is only an example, stay with the original v2 value set (NIP001, system urn:oid:2.16.840.1.114222.4.5.293). Example for 05: `"primarySource": false, "informationSource": {"concept": {"coding": [{"system": "urn:oid:2.16.840.1.114222.4.5.293", "code": "05", "display": "Historical information - from other registry"}]}}`. AIRA had not seen much use of values beyond 00/01 nationally, so the IIS''s usage data (substantial volumes of 02-08) is useful information.'
