    question: What RXA-9 value should an IIS return in an RSP (or IIS-to-IIS exchange) for doses originally submitted as administered (00)? Is returning the stored value as submitted best practice, and how should RXA-6 be handled?
    answer: |-
      2017: This varies by IIS and there is no standard; expected to change with the upcoming Functional Guide.

      2020: There is no known requirement that an IIS report 00 administered doses as administered in a response. RXA-9 is primarily used for EHR reporting to the IIS, to identify doses that may need inventory decrementing and that represent a primary source record. Many IIS return the information source as sent in, but this is changing; for IIS-to-IIS exchange the recommendation is to report and receive all vaccinations as historical. An IIS may represent administered doses as either administered or historical; there is no general guidance requiring one or the other. An IIS should send all it knows (unless prevented by policy or law), so sending the administered amount when known makes sense; anything sent with an administered dose can also be sent with a historical one. Reporting a different source code such as 08 is possible but no one has been seen doing it and it would likely cause confusion. Always reporting vaccinations as historical is a very practical policy unless partners need the distinction.
