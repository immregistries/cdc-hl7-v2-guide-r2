    question: Some records have MVX codes that are now inactive. Should the IIS update them to the new manufacturer code in query responses, or keep returning the code that was correct at the time of administration?
    answer: Manufacturers change from time to time, so keeping the code list current is good. But older vaccinations should be reported with the manufacturer that was correct at the time of administration, even if that information is now dated. Receiving systems should rely primarily on the CVX code, and use the MVX only rarely, to tell exactly which product was given.
