  - id: ta-q12-007
    group: RXA-19 Indication
    fields:
      - RXA-19
    question: An EHR sends COVID-19 doses with the same CVX and only a new administration date. How would an IIS tell an additional dose for an immunocompromised patient from a later booster, when nothing in the message marks the intent?
    answer: |-
      The indication or intent for giving a vaccine has never been exchanged, even though similar scenarios exist for other vaccines (extra pneumococcal doses for immunocompromised patients; Hib given as a 3+1 series with a booster). The patient's condition can be messaged, but it may accompany every dose, not specific doses. If capturing intent were truly needed for COVID-19, options would have to be developed, such as a new OBX or the currently unused RXA-19 (indication).

      CDC indicated there is no expectation to collect or report the indication or intent for additional doses in immunocompromised individuals. Nothing in the data will distinguish them, and once boosters are approved the two will blend together.
    status: answered
