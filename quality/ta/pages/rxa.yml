    question: An IIS rejects administered and historical vaccinations whose administration date is after the vaccine's end date (an IIS-maintained date). Would accepting them with a warning deviate from national standards?
    answer: 'Clarify what "end date" means, as each has different implications: CVX codes have an active/inactive status, but inactive CVX codes are often valid for historical records and CDC expects them to remain usable for that purpose; NDCs have marketing end dates, but administration may legally occur after that date while inventory is still in use, and there is no federal guidance requiring rejection of post-end-date NDCs. There is no national standard prohibiting IIS from accepting vaccinations with inactive CVX or expired NDC codes; IIS make their own policy choices. Accepting these doses with a warning would not violate any known HL7 or CDC IIS guidance; it is a policy decision balancing data integrity and completeness. Rejection keeps invalid data out; acceptance with a warning allows analysis and provider follow-up. For an IIS-defined end date, at minimum the IIS should (1) indicate in the ACK that the vaccination is past the end date (as an error or warning) and (2) have data quality processes that detect and report sites sending vaccinations past the end date and follow up to correct the vaccine codes being used.'
