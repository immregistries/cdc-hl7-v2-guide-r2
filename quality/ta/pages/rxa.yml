  - id: ta-q28-001
    group: RXA-21 Action Code
    fields:
      - RXA-21
    question: Is using RXA-22 (System Entry Date/Time) to decide whether an Update (RXA-21 = U) came before or after the original Add AIRA guidance? When RXA-22 has only a date, the time defaults to midnight, so a U received 45 minutes after the A is treated as older and ignored.
    answer: |-
      There is limited guidance on processing update VXUs.

      - **RXA-22:** RXA-22 is an optional field with no definition in the national IG. Submitters MAY send it and IIS MAY process it. Its TS data type requires year, month and day; hours, minutes and seconds are optional. AIRA is working with CDC to define RXA-22, for administered or historical immunizations, as the most recent date and time the immunization information was entered or updated in the submitting system.
      - **MIROW:** The MIROW guide on Consolidating Demographic Records and Vaccination Event Records (p. 92) says all IIS should accept the add and update action codes. Standards for action codes are limited, though, and some EHRs cannot send correct ones, so IIS should apply additional validation before assuming the codes are correct. Every vaccination event should go through deduplication (same CVX and same vaccination date), and matches should proceed through record consolidation. An update code should be treated the same as a matched record with no code.

      In this case, the system appears not to be reading or comparing RXA-3 properly when capturing and consolidating the newly submitted VFC information. AIRA does not recommend depending solely on RXA-21 (or RXA-22) to decide.
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXA-22
