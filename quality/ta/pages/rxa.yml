  - id: ta-q02-018
    group: RXA-6 Administered Amount
    fields:
      - RXA-6
    question: How should amount and units (RXA-6/RXA-7) be reported for oral vaccines dispensed as capsules or pills (e.g., oral typhoid/Vivotif, CVX 25), and should the dispensed regimen be reported as dose 1 or dose 4?
    answer: |-
      2017: AIRA responded with what the IG says; the IG has no explicit answer for RXA-7 (or OBX-6) for oral products such as OPV.

      2018: No volume appears on any label for the capsule, so send 999 (amount unknown) in RXA-6.

      2022: There is no explicit standardized way to represent this, especially since the national IG restricts RXA-7 to a UCUM unit, and Vivotif is not described in milligrams for the capsule (general discussion: https://nhsconnect.github.io/Dose-Syntax-Implementation/dosage-unitsofmeasure.html). Whether the regimen (four capsules over several days, usually picked up at a pharmacy) should be one event of 4 capsules or four events is open. Testing confirmed the ERR returned for `4|^^^cap^Capsules` was only a warning, so the dose still loads. The issue was added to the IG gaps document.

      2023-2025: The current standard doesn't say how to message vaccines dispensed for self-administration over several days. RXA-6/RXA-7 are meant to give the amount administered at the time of vaccination, not the amount dispensed for later. Recommendation: report just the first dose using the date dispensed, with 999 in RXA-6 and RXA-7 left blank; if possible the submitter should leave out the dosage rather than send e.g. RXA-6 = 4 and RXA-7 = `^capsules`. The IIS should process the message and accept the immunization even if the dosage isn't understood, since what matters is that the IIS gets the vaccination. If the pharmacy has ongoing contact with the patient to confirm subsequent doses, those could also be reported. "Pill" is not a UCUM unit, so for pills likewise use 999 in RXA-6 and leave RXA-7 blank. A prior state information request received no responses, and the topic was added to a SISC call; community discussion of self-administered vaccinations may change this guidance.
    status: answered
    asked: 6
