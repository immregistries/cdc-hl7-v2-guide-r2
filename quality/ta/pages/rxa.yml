  - id: ta-q35-009
    group: RXA-20 Completion Status
    fields:
      - RXA-20
    question: How is a contraindication messaged in a VXU? Is it RXA-20 = NA with the contraindicated vaccine in RXA-5 plus observations? Is NA used only for contraindications, and if not, how are other reasons distinguished? Is there an example?
    answer: |-
      AIRA's testing program messages a contraindication with an RXA where RXA-5 = 998^No Vaccine Administered^CVX, RXA-6 = 999 and RXA-20 = NA, followed by OBX segments:

      - OBX-3 = 30945-0^Vaccination contraindication^LN, with a SNOMED code in OBX-5 (e.g., 77386006^Patient Currently Pregnant^SCT)
      - OBX-3 = 30946-8^Vaccination contraindication effective date^LN, with a DT value

      The meaning comes from the OBX observation, not from RXA-20. Example:

      ```
      RXA|0|1|20250114||998^No Vaccine Administered^CVX|999||||||||||||||NA|A
      OBX|1|CE|30945-0^Vaccination contraindication^LN|1|77386006^Patient Currently Pregnant^SCT||||||F|||20250114
      OBX|2|DT|30946-8^Vaccination contraindication effective date^LN|1|20250114||||||F|||20250114
      ```

      The SISC Message Structure Guidance document describes another option for when the specific contraindicated vaccine is known. RXA-20 = NA is also used for other non-administration observations, such as adverse events and serology or immunity, with the OBX identifying which. Whether EHRs are expected to support sending these was an open question.
    status: answered
    asked: 1
