    question: Should an IIS recode or convert stored inactive CVX codes to the current code (e.g., between Hep A CVX 31 and CVX 85), including in query responses?
    answer: |-
      Earlier guidance (2020): IIS are responsible for storing and reporting vaccinations under the CVX code that best represents the concept. If CVX 85 should be replaced with CVX 31 and the IIS believes that best represents what happened, it is correct to update the codes in its database.

      Later guidance (2024), for a provider system that errors on CVX 31 (hepatitis A, unspecified formulation, marked "DO NOT use this code; if formulation unknown, use CVX 85") in an RSP: the note means CVX 31 should no longer be used to record a historical unspecified hepatitis A; CVX 85 should be used for new reports. An IIS is expected to have historical CVX 31 records. AIRA recommends continuing to store these as CVX 31 without mapping or translating them, and returning them as reported; the provider and their EHR should be prepared to handle CVX 31 when it appears in a patient's history, either by displaying it or mapping it to CVX 85. CVX 31 still counts toward the CDSi Hep A series.

      The two answers differ: the 2020 answer permits recoding to the best-representing code; the 2024 answer recommends storing and returning historical CVX 31 as reported.
    status: answered
