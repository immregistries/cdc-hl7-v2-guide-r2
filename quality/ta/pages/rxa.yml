    question: What should an IIS do when the CVX (RXA-5) and MVX (RXA-17) conflict, for example on historical vaccinations or on data received from another IIS? Can it simply discard the MVX?
    answer: |-
      The answers given over time:

      - **2020:** Details from the Data Quality Phase II document were shared, along with possible approaches, such as not accepting MVX information from the sending IIS.
      - **2021:** AIRA found no specific guidance beyond general statements. Recommendation: indicate the issue in the ACK and in any data quality reports as something that needs fixing. If the vaccination is saved, keep both the CVX and the MVX, rather than discarding the MVX, to signal that a problem needs to be fixed.

      The two answers lean differently: the 2020 answer allowed dropping the MVX from a particular source, while the 2021 answer recommends keeping both and flagging the conflict.
