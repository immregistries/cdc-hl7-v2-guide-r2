    question: Is a lot number (RXA-15) required for refusals (RXA-20 = RE)?
    answer: No. The national IG does not require a lot number for refusals, and an IIS should not require one. In AART testing, an IIS rejected a refusal that had no lot number and accepted it once one was added, so that IIS's configuration should change to stop requiring RXA-15 on refusals. For most systems on the same platform, a missing lot number returns ERR-4 severity W rather than E. Note that the error comes from RXA-15 (lot number), not RXA-18 (refusal reason).
