  - id: ta-q08-025
    group: 'Choosing an Approach: HL7 v2 Query vs CCD and Other Options'
    question: Should an IIS return immunization data to practices using CCDs (pushed to sites, or returned from a query) instead of implementing true HL7 v2 QBP/RSP bidirectional exchange?
    answer: |-
      AIRA recommends going directly to a true bidirectional, immediate-response HL7 v2 QBP/RSP interface, the current national guide. EHRs have been certified to do this, so they should be able to use it immediately. AIRA was not aware of any IIS sending back CCDs and had not seen questions or experience with them. AIRA can help with documentation on the standards, testing tools, a reference implementation, example code and measurement reports.

      Technically an IIS could create a CCD containing immunization information and send it to an EHR. However, this is not a typical way to share immunization data across the community, and it would mean onboarding with a new, atypical standard. Questions to answer first:
      - Can the EHRs actually accept and use a CCD? Their ability to read and use CCD content is limited, and often they only display it.
      - How standardized does the CCD need to be?
      - How would it be transported, for example through an existing HIE conduit?
      - What would trigger sending one?

      The HL7 v2 query model is a "pull": any authorized EHR can query any patient. A CCD is a "push", so the IIS would have to decide which EHR gets each update (probably only those that submitted a vaccination) or build a request mechanism. CCD is an HL7 v3 standard. v3 interfaces typically take about three times longer to implement than v2, and the community has largely moved away from it. Implementing the HL7 v2 query interface would probably be faster. Even a query interface that only supports querying by MRN would be quick to set up and very valuable to providers. Sending flat files back to clinics is another, simpler option.
    status: answered
    asked: 2
    messages: QBP/RSP
    related:
      - Query & Response Behavior
    years:
      - 2021
  - id: ta-q09-011
    group: 'Choosing an Approach: HL7 v2 Query vs CCD and Other Options'
    question: 'An IIS has two HIEs (a statewide HIE and an in-house HIE created for COVID). Where should bidirectional query capability be implemented: in either one, or both?'
    answer: From the outside, either would work, as long as the one used provides a real-time view of the patient's immunization record and evaluation/forecast. Nearly all IIS have implemented query directly, but at least one uses its HIE to handle query requests.
