  - id: ta-q36-011
    group: VXU Triggers and Scope of Submitted Content
    question: Can an EHR submit its own dose validity flag for a dose in a VXU, or is dose validity determined only by the IIS?
    answer: Dose validity is not part of the standard HL7 VXU submission from an EHR to an IIS. The IIS returns evaluation and forecasting information in response to a query, typically in a Z42 and sometimes in a Z32 RSP. This information is produced by the IIS's immunization clinical decision support engine, based on the patient's history and current ACIP recommendations. AIRA is also working with its Standards and Interoperability Steering Committee on specifications to further standardize how IIS message this information.
    status: answered
