  - id: ta-q10-001
    group: 'HL7 Versions: Older Versions and Future Direction'
    question: Is there a plan or recommendation for IIS to move to an HL7 version newer than v2.5.1, and why is HL7 v3 not being followed (e.g., by a non-US jurisdiction)?
    answer: Nothing is official yet, but given the overall US trend, any move will likely be to FHIR rather than HL7 v3. It is not yet known when or which interoperability functions will move to FHIR, or how long that will take. FHIR also opens possibilities beyond today's v2 exchange (e.g., querying for an official school report, inventory management/decrementing, bulk queries). For non-US jurisdictions, HL7 v3 is a dead end for new installations and is not recommended. FHIR was created partly to address difficulties implementing v3 in Canada and the UK, is much simpler than v3, and is better suited to international use.
    status: answered
    asked: 1
