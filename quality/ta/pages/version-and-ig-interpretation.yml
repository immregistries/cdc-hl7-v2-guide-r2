  - id: ta-q07-003
    group: Reading and Applying the IG
    question: Is the CDC Immunization IG (Release 1.5) the right reference for the data types an IIS should accept and send, given that the IIS still accepts older data types such as CE where the guide specifies CWE?
    answer: Yes, the CDC IG is the right document. Technically CE and CWE are very similar, especially in Release 1.5, and some providers will probably still submit CE. It can be hard to tell CE from CWE even when a message declares one or the other, because the last three components of CWE are optional. The IIS should build in flexibility to accept both.
