  - id: ta-q02-034
    group: Reading and Applying the IG
    question: Which fields and related functionality is an IIS required to implement? (A client believed the standard required certain functionality supporting an HL7 field; the vendor thought otherwise.)
    answer: 'The IG defines the conformance of messages, but it does not define exactly how the receiving system supports the data in a given field. That would belong in a functional guide, which did not exist. The question was therefore a grey area: the functionality could be described neither as absolutely required nor as clearly optional. AIRA then reviewed current test results and pointed out areas that should be improved under current standards.'
