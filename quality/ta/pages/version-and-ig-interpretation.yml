  - id: ta-q44-017
    group: Supplemental Guidance (SISC TABs) and Emerging Data Elements
    question: Where can a list of the most recent AIRA Technical Advisory Bulletins (TABs) be found?
    answer: All final TABs are posted on the AIRA Repository at https://repository.immregistries.org/resource/tab-resources/ (also linked from the SISC webpage under "Technical Advisory Bulletin (TAB) Resources"), in publication order. The Acknowledgement TAB is the latest; SISC approved it in June 2026. TAB work is expected to slow as the latest guidance, including TAB content, is folded into the next version of the HL7 IG.
