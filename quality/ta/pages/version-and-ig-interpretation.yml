  - id: ta-q18-011
    group: Reading and Applying the IG
    question: Does an IIS need to make its interface stricter (reject more messages, including over non-critical fields such as NK1-1) to be "in compliance with HL7" for connections such as the VA and the IZ Gateway?
    answer: AIRA reviewed the IIS's spreadsheet of proposed changes, met with the IIS, and talked it out of several of the stricter rejection changes. Being "HL7 compliant" does not require rejecting messages over non-critical fields.
