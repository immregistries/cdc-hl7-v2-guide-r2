  - id: ta-q11-019
    group: VXU Triggers and Scope of Submitted Content
    question: What events should trigger an EHR to send a VXU, and how can an IIS make sure vendors send demographic updates only for patients previously reported (rather than for every patient regardless of immunization status)?
    answer: 'The IG leaves triggers broad: "The sender sends an immunization record in a VXU message. The trigger may be an update or new record in the sending system records or may be triggered by some other event" (p. 67), and "Some event triggers the sending system to create and send a VXU" (p. 68). For the Z22 profile (Appendix B, p. 43), the goal is to send up-to-date information about a vaccination event and the patient. A conformant message may contain the entire vaccination history known to the sender but is not required to, and may contain only the vaccination events added, updated or deleted as part of the triggering event. For certification, EHRs must show they send a VXU when an administered vaccination is given, a historical vaccination is recorded, a vaccination is deleted, and a vaccination is updated. Beyond this, there are no national standards for additional triggers that require a submitter to send, and no guidance on when a submitter must not send. An IIS can add such requirements to its local guide as long as they do not contradict the national guidance. (The part of the question about limiting demographic updates to previously reported patients is not directly answered.)'
    status: partial
    asked: 2
