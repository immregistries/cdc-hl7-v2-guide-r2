  - id: ta-q24-020
    group: 'HL7 Versions: Older Versions and Future Direction'
    question: Will FHIR replace HL7 v2 VXU and QBP messaging for IIS, and how should an interoperability team prepare for FHIR?
    answer: HL7 v2 is not going away soon. A revised HL7 v2 guide was being written to fix documentation problems in the current one, and v2 is expected to be supported for years and likely decades. FHIR is being used for problems VXU and QBP cannot handle, such as FHIR Bulk Query for standardized bulk extraction from an IIS. It complements HL7 v2 rather than replacing it, which is why there is no roadmap away from v2. To prepare, software developers on new interoperability projects should know FHIR or related technologies (JSON, REST). For interoperability staff generally, look for interest in new technologies including FHIR, and consider "interest or experience in working with FHIR" as a hiring qualification.
    status: answered
    asked: 1
