  - id: ta-q41-007
    group: Regulatory and Certification Context
    question: What do the ONC HTI-1 regulations for 2026 change for immunization reporting to IIS, and what resources should a provider organization consult?
    answer: 'For immunization reporting to IIS under certification criterion 170.315(f)(1) (Transmission to immunization registries), there are no notable changes for 2026. Provider systems can keep exchanging with IIS as they always have, in line with certification/re-certification requirements. There is a Standards Version Advancement Process (SVAP) option for immunization exchange, but it is not required, and no IIS is known to require it or plan to. Separately, 2026 introduces Insights Condition requirements related to immunizations: data collection begins in 2026 and reporting happens later (no later than July 2027). ASTP has issued several enforcement discretion notices that affect these timelines. Resources: the ONC SVAP standards document, Insights Condition measure education materials (including the Immunization Administered measure), and the ASTP enforcement discretion page.'
    status: answered
