  - id: ta-q06-024
    group: Reading and Applying the IG
    question: How do you use the CDC IG to find the requirements for a specific component of a field, such as ORC-3.2 or NK1-5.2?
    answer: Each HL7 field has a defined data type, shown in the segment table in the IG. Data types are reusable and are defined in detail in the data types chapter (Chapter 4). The "dot" parts are formally called components, and their requirements come from the data type definition. ORC-3 is an EI (Entity Identifier), so its components are described under EI. NK1-5 (phone number) is an XTN, so its components are described under XTN.
