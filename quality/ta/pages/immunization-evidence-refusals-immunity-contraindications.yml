id: immunization-evidence-refusals-immunity-contraindications
kind: topic
title: Immunization Evidence (Refusals, Immunity, Contraindications)
overview: |-
  This section collects questions about messaging information that supplements or substitutes for an administered dose. That includes vaccine refusals, deferrals and exemptions, contraindications/precautions ("patient conditions"), evidence of immunity (history of disease, serology), and adverse events. It also covers how booster/additional doses are identified. Recurring themes:
  - There is no standard way to message deferrals or exemptions. - IIS support for storing and returning refusals and contraindications is inconsistent, and some IIS reject refusals they do not support. - Confusion between refusals, deferrals, contraindications and immunity. - Message structure questions, such as how to send an OBX when no vaccination was given.
suggested:
  - Define how, or explicitly whether, to message deferrals and exemptions. The next IG draft defines conditions, refusals, deferrals and documented immunity, and states that deferrals are not reportable and must not be sent as refusals.
  - State that receivers not supporting refusals should acknowledge them with an informational (ERR-4 = I) error instead of rejecting them, and that administration-only elements (lot, VIS) are not required for refusals.
  - Describe contraindication observations as "patient conditions" not tied to a specific vaccine.
  - Address contraindication effective/expiration dates (no CDC data element exists today) and correcting or deleting erroneously sent observations (e.g., RXA-21 use).
  - Give clearer guidance and examples for refusals of combination vaccines, varicella history encoding (OBX-14 versus onset date), returning refusals/contraindications/immunity in RSP, and serology.
  - Provide stable value sets for contraindications, reactions, history of disease and serological evidence, and confirm their completeness.
questions:
  - id: ta-q09-025
    group: Refusals
    question: 'What counts as a vaccine refusal to document and report? For example: the patient refused the type of vaccine available, could not make an appointment, was unable to attend a mass vaccination event, or does not wish to attend mass vaccination.'
    answer: None of those examples should be considered a refusal. Record a refusal only when the patient (or parent) actively refuses to receive a vaccination they were due for, typically in a face-to-face encounter with a provider. CDC originally had a separate "missed appointment" concept, but it ended up not being reported. In the message there is effectively no detailed reason for refusal. It is essentially a yes/no indication that there is evidence of a refused vaccine.
