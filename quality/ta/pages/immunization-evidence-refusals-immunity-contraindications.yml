  - id: ta-q29-002
    group: Evidence of Immunity (History of Disease, Serology)
    question: Is "degree of protection" against a disease the same concept as "immunization"? How does the US immunization messaging standard represent a patient's level of protection, given that protection may come from vaccination, from having had the disease, or from lab (titer) evidence?
    answer: |-
      The US uses three concepts:
      1. **Completed vaccination series.** A patient is assumed protected after completing a valid vaccination series (often through one of several valid paths). This is the normal route.
      2. **History of Disease.** The patient, parent or clinician reports that the patient had the disease. In the US this is used mostly for varicella. A history of varicella disease removes the need for varicella vaccine but signals a future need for zoster vaccination.
      3. **Serological Evidence of Immunity.** This records lab evidence. It is the most certain form, but vaccination systems rarely support recording it, and it is done only in specific cases, partly because lab tests can cost more than completing the series.

      The national HL7 v2.5.1 immunization IG (the consolidated guide on the CDC IIS HL7 page) has value sets for History of Disease (printed page 361) and Serological Evidence of Immunity (printed page 362). These sets may not be complete, and not all IIS support them.
    status: answered
