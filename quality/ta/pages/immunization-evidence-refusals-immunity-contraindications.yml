  - id: ta-q10-015
    group: Contraindications, Precautions and Patient Conditions
    question: What is AIRA's position on sending effective and expiration dates for contraindications ("not given") in HL7 messages to IIS, given that IIS appear not to consume them and the intent is undefined?
    answer: IIS do not receive "not given" vaccinations as such. They can receive temporary contraindications, but whether and how they record them varies. There are no CDC data elements for contraindication effective/expiration dates, so IIS generally do not receive or store them. An IIS may accept them, but EHRs are not certified for this, so implementation depends on the IIS. The HIMSS Immunization Integration Program test scripts include a test for a deferral due to fever with an expiration date.
