    question: Is there a list of which IIS can consume and/or send contraindications/precautions and reactions via HL7?
    answer: AIRA measures part of this in the Submission and Acknowledgement Validation area of Measurement and Improvement. Measure 9 checks that the IIS processes an observation about a patient that specifies a contraindication or immunity to a vaccine-preventable disease. The published "Submission and Acknowledgement Validation - Complete Level" report shows which IIS were validated as accepting such a message. The testing only checks that the IIS did not return an error. It does not confirm that the data was saved. This area is on the list for improvement in future versions of the standards, and AIRA asked for input on what support EHRs expect from IIS.
