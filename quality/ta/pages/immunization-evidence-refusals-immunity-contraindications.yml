  - id: ta-q15-008
    group: Refusals
    question: Some IIS return fatal errors, or block onboarding/production, when an EHR sends vaccine refusals/deferrals (RXA-20 = RE). Is the EHR doing anything wrong in sending refusals, and how should IIS handle refusals they do not support?
    answer: |-
      AIRA concluded that the EHR is not doing anything wrong in sending refusals, and IIS need to process them accordingly. As a matter of policy, an IIS may choose not to store some or all refusals, but it does not need to reject them. It can return an informational error (ERR-4 = "I") stating that refusals are not stored.

      AIRA tested about 60 IIS: 49 accepted refusals, 6 did not, and 5 were not connected at test time. Rejection reasons included:
      - Missing vaccination event elements, for example lot number and VIS data being required even for a refusal.
      - Refusals not being supported. This was usually stated clearly in the ACK, but not always.

      Some IIS that accepted refusals required the patient to already exist in the registry. At that time, two of the state IIS in question did not reject refusals in their test environments.
    status: answered
