  - id: ta-q03-071
    group: Deferrals and Exemptions
    question: Is there a standard way to message vaccine deferrals or exemptions in HL7 v2? For example, an EHR sends a deferral as a contraindication (RXA-20 = NA with OBX 30945-0) and sends refusals with RXA-18 "Parental Decision". Is that correct, and is there a code for deferral?
    answer: |-
      There is no standardized way to message exemptions or deferrals.
      - 2019: Deferrals are not normally messaged. They are not necessarily the same as contraindications or precautions, and there is no established way to message them. (One IIS that asked decided to drop the idea.)
      - 2020: The topic was discussed at an SISC meeting but never pushed forward. If there is interest, the community should define a standardized approach.
      - 2026: The current guide mentions deferrals but confuses them with contraindications. It provides no way to indicate that a patient was deferred from vaccination. It only supports reporting the contraindication that may support a deferral decision. Treating a contraindication as implying a deferral is not a terrible assumption, but it may or may not be true.

      Draft language for the next IG distinguishes the following concepts:
      - **Conditions:** the collective term for contraindications and precautions. These are statements about the patient's state that may also be indications (e.g., pregnancy) and do not by themselves imply refusal, postponement or exemption.
      - **Refusals:** a recommended vaccine was offered and intentionally declined. This does not include postponement for illness, scheduling or practical reasons.
      - **Deferrals:** postponements where vaccination is expected later. These are useful locally but are not defined for reporting and should not be reported as refusals.
      - **Documented immunity:** prior disease or positive serology.
      - **Operational non-receipt**, such as vaccine out of stock: out of scope.

      Implementers should check which elements their IIS accepts and make sure the reported concept matches the event.
