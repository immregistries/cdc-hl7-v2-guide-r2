  - id: ta-q30-008
    group: Contraindications, Precautions and Patient Conditions
    question: When a VXU reports a contraindication or adverse reaction, how does the IIS know which vaccine (CVX) it applies to?
    answer: Contraindications and adverse events do not have to be tied to a specific vaccination. In the test case, the observation was that the person is pregnant. The term "contraindication" is somewhat misleading. "Patient condition" would be more accurate, since pregnancy is both an indication and a contraindication for specific vaccines. For adverse events, it is common to have one and not know which vaccination caused it.
