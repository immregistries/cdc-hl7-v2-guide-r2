  - id: ta-q37-008
    group: 'VXU Content: Demographic-Only Updates and Number of Vaccinations'
    question: An IIS rejects or times out on VXUs for patients with more than about 70 immunizations (ORC/RXA groups). Is there a standard maximum number of ORC groups in a VXU, or should the sender split such messages?
    answer: No general limit is defined, but a VXU with 70+ vaccinations is unusual, and it is probably sensible for an IIS not to accept it. In day-to-day transactions a VXU is expected to contain only the vaccinations given in a single visit, usually 1 to 5, never 70. Such large messages could legitimately occur only during an initial historical load. Rather than splitting messages or retrying indefinitely (which backs up the queue), the sender could catch the failure and move on to the next message, since the situation is rare and should be reviewed by a person anyway. Sites should send only new immunizations, not the patient's entire history.
    flags:
      - This answer (sites should send only new immunizations; 70+ groups are unusual) and the ONC certification expectation in the previous entry (combine a patient's multiple immunizations into one message) are compatible but should be presented together, so the FAQ does not appear to give conflicting advice on historical loads.
    status: answered
