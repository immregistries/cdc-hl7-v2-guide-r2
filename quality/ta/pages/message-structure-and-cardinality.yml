  - id: ta-q13-026
    group: ORC/RXA Group Integrity
    question: An IIS made ORC/RXA optional to allow demographic-only VXUs. When a message has an ORC without an RXA (or the reverse), it returns AA but loses the shot data. Should this be AR or AE, and should rules say "ORC is required if RXA is present" and vice versa?
    answer: 'An IIS never has to accept a message with an ORC but no RXA, or the reverse. This is a major issue: return an ERR segment with ERR-4 = E, meaning the problem must be fixed and the message resubmitted, which makes the acknowledgement AE. AR is reserved for a narrow set of circumstances and does not apply here. The IIS should probably not process any of the message data; it should just return the error and stop processing. In practice, no certified EHR would have passed certification sending messages like this, so it is unlikely to be seen in production, and such a system should be fixed before its data is accepted.'
    status: answered
