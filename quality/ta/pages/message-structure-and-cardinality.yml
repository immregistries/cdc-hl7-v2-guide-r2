  - id: ta-q36-014
    group: RSP Order Group Structure (Z32/Z42)
    question: In a Z42 RSP, should patient-level observations (contraindications, precautions, immunity) be in an order group separate from the forecast order group, or can they be combined with the forecast OBXs in one "No vaccine administered" order group?
    answer: 'For consistency and readability, the latest guidance recommends this order: (1) vaccination history order groups (with evaluations), (2) other order groups (contraindications, history of disease, immunity, etc.), (3) the forecast order group (with forecasts). Observations SHOULD be in an order group separate from the forecast, but this is not absolutely required, and receiving systems should be able to process either structure. Both the two-group and single-group examples pass the NIST validator. The latest guidance prefers separate groups.'
