  - id: ta-q45-013
    group: 'VXU Content: Demographic-Only Updates and Number of Vaccinations'
    question: An EHR sends each historical immunization for a patient as a separate VXU, milliseconds apart, instead of one VXU with multiple ORC/RXA groups, which causes the IIS matching process to create many duplicate patients (up to 19). Is one VXU per patient with all the historical doses expected, and can this be fixed with the EHR?
    answer: ONC certification requirements (f)(1) (transmission to immunization registries) include test cases 1 and 2, which expect an EHR to combine multiple immunizations for a patient into a single HL7 message. No exception lets an EHR pass by sending multiple messages. NIST confirmed this interpretation, citing the ONC test method (https://healthit.gov/test-method/transmission-immunization-registries). AIRA contacted the EHR vendor's interface development team, which said the product has appropriate controls and recommended opening a support ticket so the local install could be configured properly.
