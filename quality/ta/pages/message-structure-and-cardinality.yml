  - id: ta-q36-013
    group: RSP Order Group Structure (Z32/Z42)
    question: In a Z32 RSP, should patient-level observations such as contraindications, precautions or presumed immunity follow the immunization history in an order group whose RXA is "No vaccine administered"?
    answer: Yes. Patient-level observations (OBX) not directly tied to a vaccination should be sent in a VXU or RSP under an ORC/RXA with RXA-5 = 998^No vaccine administered^CVX and RXA-20 = NA (not administered). The OBX segments (e.g., 59784-9 Disease with presumed immunity, 30945-0 Vaccination contraindication/precaution) follow that RXA.
