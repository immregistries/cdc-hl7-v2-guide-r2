  - id: ta-q09-018
    group: 'VXU Content: Demographic-Only Updates and Number of Vaccinations'
    question: When non-vaccine patient information changes (name, address, deceased status, consent/publicity, active/inactive status), should the EHR send a VXU^V04 without RXA/RXR segments, or is a different message type expected?
    answer: There is no national guidance on the full list of situations that must trigger an update to the IIS. The IIS should be updated with any change to the immunization record and could be updated when the patient record changes, but no standards say which demographic updates IIS want. Some IIS would want some of these updates, and others would rather not receive a large, constant flow of them. The ideal solution is to make these triggers configurable on/off according to each IIS's policy.
