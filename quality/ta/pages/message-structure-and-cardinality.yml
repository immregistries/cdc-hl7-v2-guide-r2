  - id: ta-q43-019
    group: 'Encoding Rules: Segment Terminators, Escape Sequences, Length, and Order'
    question: Providers send email addresses that contain a tilde (e.g., john~smith@gmail.com), and the IIS reads the tilde as a repetition separator. Testing with john\T\smith@gmail.com produced an invalid email warning. How should a tilde in an email address be sent?
    answer: A tilde cannot be sent unescaped, because the receiver must read it as the repetition separator defined in MSH-2. It must be sent with the \R\ escape sequence. \T\ is the subcomponent separator escape and decodes to john&smith@gmail.com, which explains the result. Per HL7 v2.5.1 section 2.7, the escape sequences are \H\ (start highlighting), \N\ (normal text), \F\ (field separator), \S\ (component separator), \T\ (subcomponent separator), \R\ (repetition separator), \E\ (escape character), \Xdddd...\ (hex data), and \Zdddd...\ (locally defined). The separator and escape sequences are also valid in ST fields, and escape sequences cannot be nested. Both john~smith and john&smith are technically valid email formats, but they are unusual, and the receiving system may still reject them on email validation even when they are decoded correctly. Senders must properly escape all user-entered values, and receivers must decode escape sequences.
    status: answered
    asked: 1
    messages: VXU
