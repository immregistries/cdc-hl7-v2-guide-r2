  - id: ta-q23-013
    group: Constraining National IG Usage Locally (R, RE, O, X)
    question: An IIS accepts VXU messages with an empty patient phone number (PID-13) and an empty dose amount (RXA-6). Staff listed these as gaps against national standards. Should the IIS start rejecting messages missing these values to align with national standards?
    answer: AART Assessment and Validation does not ask for this change. Accepting messages without the patient phone number or dose amount is not a deviation the national standard requires the IIS to fix. If the IIS makes these fields mandatory anyway, it adds local requirements beyond the national standard, and those must be documented for trading partners.
