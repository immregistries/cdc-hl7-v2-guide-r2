  - id: ta-q08-017
    group: Constraining National IG Usage Locally (R, RE, O, X)
    question: Can an IIS local implementation guide mark most national IG optional (O) fields as X (Not Supported) to tell providers it won't use them? Is there any expectation that an IIS accepts and stores optional fields?
    answer: 'Yes, that is acceptable, and IIS are not expected to accept or store optional fields. What matters is how the interface behaves when a submitter populates one of these fields. It should be forgiving, not strict: a field that is X in one IIS may be RE in another, and EHRs struggle when both IIS are extremely strict.'
