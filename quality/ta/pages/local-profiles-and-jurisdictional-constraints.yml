  - id: ta-q05-019
    group: State Law, Policy & Multi-Jurisdiction Reporting
    question: Why does one state IIS have unique registry consent requirements that EHRs must build specifically, and how have others handled them? This seems to be a barrier to bidirectional functionality across states.
    answer: |-
      Some IIS variation exists because state laws and regulations require things the national standard does not support. This state requires more consent detail than yes/no; AIRA worked with the IIS to put this in the message in a way consistent with the standard, but it still requires EHR changes, and changing it would likely require legislative action.

      An additional hurdle: the IIS lacks an effective process for handling withdrawn patients. Withdrawal removes the person entirely from the database, so resubmitting the patient with a positive consent, even old information, would re-consent them. To prevent this, the IIS's policy is that submitters may not use the real-time bidirectional interface unless they can send consent once for a patient and never again. This is very difficult to implement and technically breaks the national standard, which expects this information to be sent whenever the patient record is updated. The IIS is aware and looking for workarounds that would allow EHRs to report consent whenever they like, but until then its policy is to submit consent using its state-specific codes and only once.
    status: answered
    asked: 1
    messages: VXU
    related:
      - Bidirectional Exchange
      - PD1 (registry status/consent)
    years:
      - 2020
  - id: ta-q33-003
    group: State Law, Policy & Multi-Jurisdiction Reporting
    question: Are other jurisdictions requiring sexual orientation and gender identity (SOGI) data in HL7 submissions, and is there data on how many IIS collect it even if not required?
    answer: 'AIRA does not have firm numbers on SOGI requirements or collection across IIS and suggested an AIRA Information Request to the community. AIRA has received SOGI questions from several jurisdictions about supporting it in HL7 processing; one state has legislation (HB22-1157) with additional data collection requirements. AIRA is not aware of any IIS requiring SOGI and sees no evidence of it in Measurement & Improvement submission assessment. Testing for SOGI support is limited: a VXU with SOGI data can be submitted and the patient queried, but at best this shows whether the IIS rejects the data; acceptance does not show it was stored, and IIS are unlikely to return SOGI in an RSP.'
