  - id: ta-q45-008
    group: State Law, Policy & Multi-Jurisdiction Reporting
    question: A health system sold a practice that continues to use the health system's hosted EHR, so the health system will keep submitting that practice's immunizations to the IIS. After separating the site, its data was rejected. The interface team proposed a configurable interface-engine lookup to populate the IIS organization identifiers (MSH-4) for the new owner, but the IIS is considering requiring separate credentials or a separate interface. Is there a best practice for this arrangement?
    answer: AIRA has no published guidance on this; it is primarily a policy question for the IIS. The upcoming IG is adding guidance on how a system submits on behalf of another organization, so this kind of arrangement is known and technically supported. At a technical level, using a configurable lookup to populate the new owner's IIS organization identifiers looks sensible, and there is no national-level reason not to solve it this way. The question could also be submitted to the AIRA weekly update to gather experiences from other jurisdictions.
