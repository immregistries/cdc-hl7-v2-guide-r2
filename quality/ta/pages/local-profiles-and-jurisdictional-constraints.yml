  - id: ta-q16-009
    group: Constraining National IG Usage Locally (R, RE, O, X)
    question: Does a state's local implementation guide take precedence over the national CDC IG? A provider's vendor refuses to change race/ethnicity handling to meet the state's requirements, citing the CDC guide.
    answer: It is more complicated. A jurisdiction can set additional expectations locally, such as making RE/O fields required or adding values to code sets, but it must communicate and negotiate with its community during implementation. A certified system cannot be expected to meet arbitrary state requirements without modification and cost; seemingly simple changes can be expensive and complicate the EHR's deployments in other states. AIRA hopes CDC will add race/ethnicity codes for unknown values nationally, which would let EHRs build one solution for all IIS. Meanwhile, the IIS should accommodate EHR partners that meet the national standard but cannot yet meet local requirements.
    status: answered
