  - id: ta-q06-027
    group: COVID-19 Reporting Requirements
    question: Is there a plan to define a minimum data set that EHRs should support for COVID vaccine reporting to IIS, and is anyone tracking state-specific COVID requirements?
    answer: No national plan to define a minimum data set for EHR reporting was known. Some IIS were defining requirements for EHRs, e.g., asking for priority group or encouraging currently optional fields such as multiple race codes. There is no formal process requiring IIS to clear such requirements with CDC or another national body; AIRA can coordinate through SISC when IIS ask.
