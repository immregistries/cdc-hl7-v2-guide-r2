  - id: ta-q40-011
    group: Constraining National IG Usage Locally (R, RE, O, X)
    question: The IG says local implementers may further constrain the guide (e.g., make optional fields required). Is that license to impose any local rule, such as requiring ZIP code on every patient, and how should a multi-state vendor handle such requirements without maintaining many HL7 variants?
    answer: |-
      Adding a local requirement is technically legal under the IG, but that does not mean it solves problems, and it can create others. IIS must retain some flexibility for inherently local values (e.g., MSH-4, RXA-11.4) and jurisdictional policy choices. AIRA's Measurement & Improvement (M&I) process distinguishes expected from unexpected local differences: IIS that add requirements like patient address can still be validated, but only as "Complete Minor Difference".

      Talking points:
      - Most policy requirements should be RE (required if known) rather than R, allowing legitimate unknowns.
      - Staying close to the national standard lowers integration and maintenance burden.
      - "Always required" policies do not produce better data; they convert missing data into bad placeholder data that is harder to detect.
      - The HL7 interface is an automated data feed, not a data-entry screen; rejecting messages for missing data rarely leads to correction and loses vaccination data.
      - Manage completeness through data quality monitoring and outreach (e.g., one missing ZIP in 150,000 records is noise; 95% missing from one provider indicates a process problem).
      - Vendors should implement configurable validation severity (error/warning/informational per jurisdiction) in a single interface rather than multiple message variants.
      - The IIS may already have the ZIP for the patient or could derive it via address services, so rejecting for a missing ZIP should be revisited.
    status: answered
    asked: 1
    messages: VXU/ACK
