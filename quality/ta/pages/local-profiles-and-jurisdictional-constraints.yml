  - id: ta-q06-010
    group: COVID-19 Reporting Requirements
    question: The CDC COVID playbook lists data elements such as administered-at location type, dose number, vaccination series complete, comorbidity status (Y/N) and recipient missed vaccination appointment (Y/N). Are EHRs expected to send these to the IIS, and where in the VXU?
    answer: |-
      Most do not need to be submitted by EHRs.
      - Administered-at location type should be metadata the IIS captures during onboarding; there is no need to send it with each VXU, and the IIS reports it to CDC.
      - Dose number and series complete are calculated by the IIS with its CDS engine when reporting to CDC.
      - Missed vaccination appointment was removed as a CDC requirement.
      - Comorbidity status was still under discussion; as defined by CDC, most IIS could not accept it and there is no standardized way to send it in HL7 Z22.

      (The same answer was given both times the question was asked.)
