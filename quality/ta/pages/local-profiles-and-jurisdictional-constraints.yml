  - id: ta-q09-006
    group: Local Implementation Guides & Documentation
    question: An IIS is updating its local HL7 implementation guide. Are there resources or supporting documents to help?
    answer: AIRA shared an example local guide showing how an IIS might document only its differences from the national guide. Since submitters generally do not read full guides, AIRA encourages states to publish short, easy-to-navigate guides that highlight important local requirements rather than restating the national IG. AIRA also pointed to national projects using the NIST IGAMT tool to document IIS requirements as conformance profiles, which is another avenue for documenting local requirements that AIRA can help with.
    status: answered
    asked: 1
    messages: general
