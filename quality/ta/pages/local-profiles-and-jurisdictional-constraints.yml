  - id: ta-q07-001
    group: COVID-19 Reporting Requirements
    question: An IIS publishes a table of "required" COVID-19 data elements for HL7 connections. Is there anything in the table that should be changed?
    answer: 'The requirements outlined looked good overall. The main concern is the use of the word "required". It needs to be clear whether "required" means a message will be rejected if any of those fields are missing. The table itself only nominally distinguished a few optional fields, a couple of RE fields and a few conditionally required fields. Setting the bar that high risks getting bad data: if submitters read "required" as meaning they must put something in the field or nothing will be accepted, they may fill the fields with junk values just to get the message accepted.'
