  - id: ta-q12-014
    group: QAK-3 Message Query Name
    fields:
      - QAK-3
    question: When returning a Z31 to a Z34 or Z44 query, should QAK-3 echo the query name from the request (e.g., `Z34^Request Complete Immunization History^CDCPHINVS`) or represent the response profile?
    answer: QAK-3 should echo what was in the query that was sent (the QPD-1 message query name). The response profile is identified in MSH-21 (e.g., `Z31^CDCPHINVS`). NIST's example shows MSH-21 = `Z31^CDCPHINVS` with `QAK|37374859|OK|Z34^Request Immunization History^CDCPHINVS` and QPD-1 = `Z34^Request Immunization History^CDCPHINVS`.
    status: answered
