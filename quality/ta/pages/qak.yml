overview: 'QAK questions center on QAK-2 (Query Response Status) and how it combines with the RSP response profile (Z31, Z32, Z33, Z42) for each query outcome: errors, not found, a single match, a list of candidates, and too many matches. Several questions come from AART query assessment results. One question addresses QAK-3 and whether it echoes the query name or names the response profile.'
