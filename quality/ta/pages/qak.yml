    question: For a Z34 query with only patient sex (missing name and birth date), the IIS returned a Z33 with MSA-1 = AE and an ERR, but either omitted QAK/QPD or returned QAK-2 = AR. What response is expected?
    answer: The expected response is a Z33 RSP that includes QAK and QPD, with QAK-2 (Query Response Status) = AE (application error). An earlier response missing QAK/QPD did not meet; after the IIS's fixes, one-off retesting showed a Z33 with MSA-1 AE, an ERR for the missing date of birth, and QAK/QPD present, which is close to passing, but QAK-2 was AR rather than the expected AE. Results also depend on when the IIS deployed fixes relative to when the assessment was generated.
