    question: The IG says to use NCIt codes for route in RXR-1, but many vendors use HL7 Table 0162 codes (IM, ID, etc.). Is it acceptable for an IIS to send NCIt route codes in RSP messages?
    answer: Yes. NCIt route codes are in the national guide, so EHRs should understand them and the IIS is fine to continue sending them. The history of why the route table uses NCIt while others do not is unclear; IIS pay little attention to it but EHRs ask about it often.
