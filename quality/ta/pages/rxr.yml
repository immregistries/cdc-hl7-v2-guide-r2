  - id: ta-q08-007
    group: RXR-1 Route
    fields:
      - RXR-1
    question: An EHR lets providers record "Sublingual" and "Intranasal" routes, which are not in the CDC IG route value set. Can intranasal be mapped to nasal and sublingual to oral or other?
    answer: The CDC IG route list reflects how immunizations are actually administered in the US. A much larger set exists for other medications, but the guide doesn't support those values because IIS never expect to receive them. Intranasal means the same as nasal, so code it as nasal. Sublingual means dissolved under the tongue, and no vaccine is indicated for that route. The best fix is to remove or adjust these options in the product so users can't pick values that could be confused with the correct ones. For data already recorded, intranasal can safely be recoded as nasal for vaccines normally given in the nose, and sublingual can safely be recoded as oral for vaccines normally given by mouth. Otherwise, don't report the route if the data looks wrong. Route isn't critical to a complete immunization history, and leaving it out is better than sending bad data.
    status: answered
    asked: 1
    messages: VXU
    related:
