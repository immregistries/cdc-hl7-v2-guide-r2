  - id: ta-q34-007
    group: RXR Segment (general)
    question: An IIS's RSP started failing NIST conformance (Query Measure 3) after it began returning RXR segments. What is wrong?
    answer: Returning no RXR segment was fine, but once RXR is returned it must be populated per the HL7 specification. In this test case the VXU sent to the IIS had no route/site data, so the IIS had no RXR data to return and the RXR segment should not be present at all rather than being sent empty or improperly populated.
