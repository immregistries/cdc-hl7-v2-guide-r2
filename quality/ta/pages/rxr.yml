  - id: ta-q09-028
    group: RXR-2 Administration Site
    fields:
      - RXR-2
    question: Could an "Oral" concept be added to HL7 Table 0163 (administration site) since some vaccines are given by mouth?
    answer: 'Even if added to PHIN VADS it would not be in the IZ guide: when the route (RXR-1) is oral, the site (RXR-2) is to be left empty. A certified EHR should follow the guide; it can record both route and site internally, but when the route is oral it should report only the route, which may require custom programming. Adding the value nationally is unlikely because the install base is large and it would not improve data quality; it would only be worth it with evidence that many systems would benefit.'
