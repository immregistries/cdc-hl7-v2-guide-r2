  - id: ta-q22-001
    group: RXR-1 Route
    fields:
      - RXR-1
    question: An EHR has a route of "Intrauterine" and a site of "Intrauterine". Should the route be mapped to something other than OTH, and how should the site be sent when Table 0163 has no "other" value?
    answer: |-
      The IG purposefully constrains route of administration to values expected for vaccinations; many other medication routes exist but are not expected for immunizations, and new vaccination routes are added nationally when needed. Given current US vaccine products, intrauterine is not a valid route or site for vaccination, so this is most likely bad data (e.g., a wrong pick from an overly long list) rather than a mapping gap.

      Options for the IIS include: (1) reject the message, at the risk of losing the vaccination event; (2) accept the vaccination but not store the route and return a warning about the invalid route; (3) accept the vaccination, drop the route, and not issue a warning; or (4) accept all data including the illogical route and address it through data quality processes outside HL7 (e.g., provider data quality reports). In any case the value is not valid for vaccination events.
    status: answered
    asked: 1
    messages: VXU
    related:
      - RXR-2
    years:
      - 2022
  - id: ta-q46-006
    group: RXR-1 Route
    fields:
      - RXR-1
    question: Is G-tube (gastrostomy tube) a valid route of administration for immunizations, and is there an updated route code list?
    answer: 'G-tube is an acceptable route for select vaccines in limited circumstances, notably rotavirus (per Immunize.org Ask the Experts). An IIS could add support for the code representing this route: in HL70162 it is "GTT" (Gastrostomy Tube), and the NCIt code appears to be C65040, though that should be confirmed. Because actual use should be very low, it may not be worth the effort; assess how often it may be reported and whether the data is needed. If the IIS does not add support, the provider could send GTT/C65040 and the IIS could disregard it in processing (perhaps returning an informational error that the route is not supported), or the provider could send "OTH" (other).'
    flags:
      - Confirm the NCIt code for gastrostomy tube route (C65040 was stated as "appears to be"). Also note the suggestion to send "OTH" may conflict with the RXR-1 "Other" entry, which says only NCIt values may be sent and NCIt has no "Other" code.
