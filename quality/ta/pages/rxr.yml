  - id: ta-q24-015
    group: RXR-1 Route
    fields:
      - RXR-1
    question: When the route is "OTH" (Other), what should RXR-1 contain in an RSP? NIST expects an NCIt code, NCIt has no code for "Other", sending `OTH^Other^HL70162` fails, and RXR-1 is R.
    answer: The guide lists HL7 0162 values as a crosswalk for systems moving from the old values to the new ones. Only NCIt values may now be sent. Systems can keep accepting and processing HL7 0162 values, but should send only NCIt. The guide does not say so clearly, but if no NCIt value exists there is no route to send. RXR-1 is required, but the RXR segment is not. When RXR-1 cannot be valued, leave the RXR segment out.
