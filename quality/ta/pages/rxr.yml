  - id: ta-q17-007
    group: RXR-2 Administration Site
    fields:
      - RXR-2
    question: Where can one find which combinations of body site (RXR-2) and route (RXR-1) are valid, per data quality rule AIRA-DV-BR-119 (site and route cannot contradict)?
    answer: The Immunization Action Coalition chart of vaccine administration route and site (https://www.immunize.org/catg.d/p3085.pdf) covers the majority of use cases. The caveat is that a clinician may intentionally deviate from it on a case-by-case basis (for example, chronic bleeding disorders as mentioned in the ACIP General Best Practice Guidelines). A provider consistently reporting doses out of alignment with the chart could indicate reporting errors or incorrect clinical practice.
