    question: Does NS (nasal) replace IN (intranasal) in RXR-1, and can an IIS convert IN codes to NS?
    answer: Per CDC feedback, NS and IN are equivalent route codes; they represent the same concept. The IIS can update its database so the same code represents both the old and new concepts.
