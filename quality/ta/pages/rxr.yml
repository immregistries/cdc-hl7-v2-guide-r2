  - id: ta-q22-017
    group: RXR-2 Administration Site
    fields:
      - RXR-2
    question: Rabies immune globulin is infiltrated around the bite wound with any remainder given IM at a distant site. How should two administration sites be documented, and should IIS support two sites for one administration? (A sender tried "wound", which is not valid.)
    answer: There has been little community discussion on this. The IIS will never record 100% of what happens around a vaccination event; that is the role of the medical record. The IIS is designed for long-term storage of the essential vaccination history and a community-wide view of protection. Adding this level of detail would require a specific workflow and use case showing who would use the information and why, and would require both EHRs (which may not be able to send multiple sites) and IIS to change. The interim approach is to support a single administration site and work with senders accordingly; an IIS could add a local workaround value in its validation tables if needed. If a concrete use case emerges, it can be brought to the community.
    status: answered
    asked: 1
    messages: VXU
