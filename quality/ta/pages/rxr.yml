  - id: ta-q39-017
    group: RXR-2 Administration Site
    fields:
      - RXR-2
    question: Nirsevimab (Beyfortus) may be given as two injections, creating apparent duplicate administrations. Could Table 0163 add a "both" site value (e.g., both thighs) so the dose can be recorded once?
    answer: Early on it was understood that the two injections would be in two distinct body sites (e.g., left and right thigh), but this is not an absolute requirement. The injections must be at two different injection sites, which could be the same body site separated by at least one inch. So they may, but need not, be in different body sites, and a "both" body site value would not accurately cover all cases.
    status: partial
