  - id: ta-q32-001
    group: RXR-2 Administration Site
    fields:
      - RXR-2
    question: Is RXR-2 (administration site) required? The CDC IG appears to list it as "Required", while AIRA data validation guidance says required but may be empty. Should an IIS require it for new administrations and make it optional for historical?
    answer: RXR-2 has usage RE (Required, but may be empty) in the segment usage table of the HL7 2.5.1 Release 1.5 IG (page 129). Making it required would be a local requirement beyond the national IG, which may not be desirable for this element. The "Required" value seen elsewhere in the IG is from a different table whose column is "Support Status"; its footnote says support status indicates whether the field must be supported by the information system and messaged if known, not whether every message must contain it, which is indicated by the usage column. In short, support status is about whether the IIS should have a place to store the data; usage is about whether the sender must populate it or may leave it empty.
    status: answered
    asked: 1
    messages: VXU
