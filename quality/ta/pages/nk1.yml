  - id: ta-q29-003
    group: NK1-3 Relationship
    fields:
      - NK1-3
    question: Is there a relationship code for a foster parent in NK1? Providers cannot find an appropriate option for a child in foster care (a ward of the state).
    answer: |-
      A foster parent is usually not considered a guardian but a caregiver, so code the relationship in NK1-3 as CGV (Caregiver).

      Also, the current IG supports sending Next-of-Kin (usually the mother or father) but does not require that the NK1 is the guardian or that the submitter say whether the person is the guardian. IIS sometimes assume the mother is the guardian for patients under 18, but that is not always true (some mothers lack parental rights, and some care for disabled adult children). If an IIS needs to determine the actual guardian, AIRA can provide further guidance. This area is planned for more formal guidance.
    status: answered
    asked: 1
    messages: VXU
    related:
      - NK1
    years:
      - 2024
  - id: ta-q27-004
    group: NK1-3 Relationship
    fields:
      - NK1-3
    question: An EHR is sending the value "27" in NK1-3 instead of a valid code from HL7 Table 0063, causing errors. How should this be resolved?
    answer: NK1-3 is the next-of-kin relationship. The site appears to be sending its internal relationship codes rather than the standard HL7 values (from Table 0063, such as MTH, FTH, GRD). AIRA had not heard of this specific issue with this vendor. The resolution is to tell the site that it needs to configure its system to send the correct standard relationship codes. How to do this varies by vendor and the site may need to contact its vendor, but because the vendor had to demonstrate this capability to certify its system, the local site should be able to make the change using the software it already has.
    status: answered
    asked: 1
    messages: VXU
    related:
