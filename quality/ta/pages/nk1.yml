  - id: ta-q01-095
    group: NK1-4 Address
    fields:
      - NK1-4
    question: How is the "primary" address defined for NK1 (and other repeating address fields)? Does the first occurrence equate to the mailing address?
    answer: '"Primary" is not well defined. A SISC survey of IIS found inconsistent definitions; in some cases primary equates to mailing, but that is not guaranteed. The survey is partly to see whether the next IG version can remove text assigning meaning to a particular occurrence of a repeating field, which would require systems to use the type code that is part of the address, telecommunication number, name, etc. For now, a sending system should determine what it considers its "primary" address, and a receiving system should not assume anything about the first occurrence other than that it is what the sender considers primary. Sending and receiving systems should discuss and agree on what data is sent and where during integration.'
    status: answered
    asked: 1
    messages: VXU
    related:
      - PID-11; Version & IG Interpretation
    years:
      - 2016
  - id: ta-q31-023
    group: NK1-4 Address
    fields:
      - NK1-4
    question: 'What address type should be used in NK1-4 (address type component) when returning NK1 in an RSP: P, L, M or H? State IGs vary.'
    answer: Ideally the system knows what type the address actually is and codes it accordingly, but few systems capture this and end users may not document it correctly, so a default value is often used. Conformance testing will not fail any legal value from the table, since it cannot know whether the value is correct (there is no context-based test comparing what was sent with what was returned). If the type is unknown, "P" is as good as any other value. The current standard says the mailing address must be sent first, but the next guide is expected to remove that requirement. When sending, code the address type as best you know; when receiving, accept what is sent.
    status: answered
    asked: 1
    messages: RSP/VXU
    related:
      - PID-11; Conformance Testing & Validation Tools
    years:
      - 2024
  - id: ta-q14-001
    group: NK1-5 Phone Number
    fields:
      - NK1-5
    question: An IIS warns that it does not recognize a phone number unless NK1-5.1 (the deprecated telephone number component) is populated, even though area code and local number components are sent. Should it issue this warning?
    answer: XTN component 1 is deprecated by the standard, so its absence should not cause an error. AIRA would not issue a warning for this; it is likely a configurable item in the IIS that can be turned off.
