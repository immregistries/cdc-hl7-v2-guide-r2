  - id: ta-q31-012
    group: NK1-3 Relationship
    fields:
      - NK1-3
    question: Is there an expected set of NK1-3 relationship values an IIS must accept and store, or must it accept all CDC values (e.g., PHIN VADS relationship value set 2.16.840.1.114222.4.11.3365)?
    answer: In the current IG the relationship values are "suggested values", and there is no requirement that any specific values on the list be accepted or stored. The PHIN VADS value set contains the same values as the guide. An IIS may choose to accept any or all of them, but AIRA encourages accepting all the values defined in the guide since that gives the most information about the patient. AIRA is updating guidance for these values and welcomes feedback on values IIS see and do not want to accept.
    status: answered
