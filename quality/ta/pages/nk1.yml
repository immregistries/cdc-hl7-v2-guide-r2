id: nk1
kind: segment
title: NK1 Next of Kin / Associated Parties
overview: Questions about NK1 cover who belongs in the segment (responsible party, guardian, emergency contact, foster parent), relationship coding in NK1-3 (Table 0063), address and phone component handling (NK1-4, NK1-5), and whether NK1 may or should be returned in query responses. Recurring themes are the IG's loose "suggested values" for relationships, the lack of a way to flag a legal guardian, and IIS validation that is stricter than the standard (e.g., warnings on deprecated XTN components).
suggested:
  - Define how to indicate that an NK1 person is the patient's legal guardian (future guidance planned).
  - Remove meaning assigned to the first occurrence of repeating fields (e.g., "primary"/mailing address first) and rely on type codes.
  - Allow NK1 in the Z42 response profile (now in AIRA TAB).
  - Clarify the NK1-35 race coding system (CDCREC vs HL70005) to match PID-10.
