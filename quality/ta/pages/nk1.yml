  - id: ta-q43-005
    group: NK1 Segment (general)
    question: An IIS is coding vaccine exemptions into its query response. Should the RSP include NK1 and NTE segments?
    answer: NK1 may be sent in any query response; it is not required, but the information can help the querying system confirm the patient match. NTE is optional, and AIRA would not send it unless there is a particular reason to do so.
