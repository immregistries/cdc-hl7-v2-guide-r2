  - id: ta-q29-007
    group: Testing and Improving Patient Matching
    question: What resources or guidance are available on patient deduplication for an IIS?
    answer: AIRA's resource repository has deduplication material, including presentations from IIS that ran patient-matching improvement projects (repository.immregistries.org, search "deduplication"), and the 2013 IIS Patient-Level De-duplication Best Practices, which is a good starting point. AIRA's Measurement and Improvement initiative also has an HL7 Patient Matching content area that tests whether an IIS can match records across different HL7 messages. Participating IIS can view detailed results in AART. AIRA can also run an "AART clinic" to go through those reports and provide technical assistance.
