  - id: ta-q26-017
    group: Same-Day Multiple Doses (Nirsevimab)
    question: 'How reliable are these indicators for telling a true same-day second nirsevimab dose from an update to an existing dose: different body site (RXR-2), different filler order number (ORC-3), and age at administration of 8 to <24 months? Should an incoming dose be added as new when a 50 mg/0.5 mL dose already exists that day, or when two 307 doses already exist that day?'
    answer: None of these indicators is guaranteed. Body site should differ but may be wrong or missing. Some EHRs report that the filler order number is less unique or reliable than hoped, so it helps but isn't definitive. Age 8 to <24 months is useful, and some suggest allowing slightly below 8 months or slightly above 24 months. If a 50 mg/0.5 mL dose already exists that day, a second dose is unlikely to be new, though not impossible. Three or more 307 doses on one day is very unlikely, so an incoming dose in that case is most likely an update to an existing record. AIRA and IIS were still reviewing HL7 fields for good indicators.
    status: partial
