  - id: ta-q29-018
    group: Testing and Improving Patient Matching
    question: Most failures on the AART query measure for multiple possible patients occur because the IIS test region has only one record for the queried patient, so it cannot return a Z31 or Z33. Did the test add the patient twice, and could the IIS be auto-deduplicating it?
    answer: The measure sends prep VXU messages that create two unique but very similar patients (for example the same name, birth date, mother's maiden name, and address, but a different middle name, MRN, and multiple-birth order). The query then targets them. In this case the IIS matched the second prep patient to the first and updated it instead of creating a second patient, so the query found only one record. After the missing patient was added manually and the assessment re-run, the correct response profile was returned (with remaining NIST conformance findings in the RSP). AIRA is revising the Measure 5 test cases.
    status: answered
