  - id: ta-q10-009
    group: Patient Record Consolidation and Demographics
    question: When multiple or low-threshold matches stem from outdated demographics in the IIS, do IIS let patients or providers correct demographics, and what does the correction/merge process typically look like?
    answer: 'Generally yes: IIS update patient demographics from the information in VXU messages. But this is governed by IIS data processing rules rather than HL7 requirements: records seeded from vital birth records may have locked fields; consent issues may prevent updates; IIS may choose not to accept demographic updates from less trusted submitters (e.g., temporary flu clinics); and address standardization tools may alter addresses. A personal observation: IIS are often the last to learn about name/address changes and receive only the new data, not the old, which makes matching harder; an explicit change-of-demographics message carrying both old and new values could help.'
