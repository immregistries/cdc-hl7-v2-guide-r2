id: patient-matching-and-deduplication
kind: topic
title: Patient Matching & Deduplication
overview: Questions in this section cover how IIS match and consolidate patient records (from incoming VXUs and at query time) and how they deduplicate vaccination events. Recurring themes are which demographics to keep when merging, false-positive and overly loose query matches, the lack of a national matching standard, how to test matching changes, and the special same-day multiple-dose case for nirsevimab (CVX 307). Several answers point to MIROW best-practice guides and AIRA's AART HL7 Patient Matching tests.
suggested:
  - Define deduplication rules and reliable HL7 indicators (e.g., RXR-2 site, ORC-3 filler order number, age) for multi-injection or same-day multiple doses such as nirsevimab.
  - Explicitly bridge submitter-side TAB guidance (delete+add on identifying field changes) with IIS-side MIROW consolidation expectations.
  - Consider guidance on messaging patient names (name types, aliases, hyphenated names) to support matching. AIRA was developing this.
questions:
  - id: ta-q34-022
    group: Patient Record Consolidation and Demographics
    question: When merging duplicate patients, an IIS's SOP uses the vital records name, but providers often use a different name (e.g., a shorter last name), causing new duplicates with each VXU. Is there a best practice, and would prioritizing the most recent name cause problems?
    answer: This aligns with Scenario S108 in AIRA's Consolidating Records guide, where the vital statistics last name differs from the provider-submitted last name and the more recent provider name is retained in the consolidated record. Vital statistics data is generally given priority but not necessarily for patient name. Selecting the more recent name may help reduce new duplicates, but consider jurisdictional policies on retaining vital records names (e.g., whether choosing the provider name removes the vital records name). To support matching, retain all names the patient has been known by, as alias names, since they support automated matching, deduplication and unmerging; which name is displayed is a program preference. Also educate providers to use official patient names (DQA guide). AIRA was developing guidance on messaging patient names in HL7, including name types and hyphenated names.
    status: answered
