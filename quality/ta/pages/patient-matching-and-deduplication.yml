  - id: ta-q33-017
    group: Matching at Query Time
    question: A query for a newborn to one IIS returned the mother's immunizations and forecast as if they were the infant's. Where can a trading partner get documentation of an IIS's QBP matching logic, and is there a national standard?
    answer: 'Documentation of a specific IIS''s matching criteria must come from the IIS vendor. National guidance (the IIS functional guide / query guidance) specifies the responsibilities of the querying system and the IIS but not how the IIS performs matching. Diagnosing why another IIS returned the mother''s record would require a detailed inspection, and problems in data previously submitted to that IIS could also be a factor; matching in a different IIS is completely different, so a problem in one would not necessarily occur in another. When requesting documentation, distinguish two matching points: matching performed when a VXU is received (to consolidate records) and matching performed when a query is received (to identify which record to return). Vendors may use the same or different logic for each.'
