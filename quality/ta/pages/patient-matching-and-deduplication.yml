  - id: ta-q16-014
    group: Matching at Query Time
    question: During testing, a Z44 query for a specific first name, last name, sex F and DOB returned five patients with the same first name but different last names and non-matching DOBs; the submitter also appeared to swap first and last names. Why would an IIS return such candidates, and can it match on first name with differing last names?
    answer: This behavior has been seen before and likely relates to the IIS product's patient matching / query match settings, which control how strict a match must be before records are returned. The IIS should work with its vendor to tune these settings; AIRA offered to help test further if needed. (Separately, the swapped first/last name in the sender's message should be corrected so the query is built correctly.)
