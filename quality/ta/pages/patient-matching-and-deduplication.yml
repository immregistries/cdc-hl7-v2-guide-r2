  - id: ta-q39-009
    group: Vaccination Event Deduplication
    question: If an IIS implements the TAB guidance that a CVX change requires delete + add, will that conflict with the DQI Measure 27 expectation that an update changing CVX (e.g., 45 to 08, same group and date) consolidates with the existing dose without a duplicate warning?
    answer: 'The TAB: Scenarios for Updates and Queries is submitter-side guidance (EHRs should send delete+add when identifying fields change). DQI Measure 27 is based on MIROW (2017) Consolidating Demographic and Vaccination Event Records, which is IIS-side guidance: the IIS should be capable of matching and consolidating obvious updates even when identifiers change (e.g., unspecified CVX to specific) and return the consolidated history. The IIS should not back out an enhancement that lets same-date, same-vaccine-group CVX changes update the existing event; that aligns with MIROW and supports Measure 27. Implementing the TAB behavior for submitters does not change the expected ACK behavior for Measure 27. Expectations are dual: submitters send delete+add; IIS remain robust at consolidation. AIRA is drafting bridging language to make this explicit.'
    status: answered
    asked: 1
    messages: VXU/ACK
