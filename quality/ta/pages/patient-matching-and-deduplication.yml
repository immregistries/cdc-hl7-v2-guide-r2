  - id: ta-q26-015
    group: Same-Day Multiple Doses (Nirsevimab)
    question: What should an IIS do when an incoming CVX 307 nirsevimab dose is two days after an existing 307 dose? Is it a correction or a separate dose?
    answer: There is no definitive answer yet; it is a local IIS decision until EHR data trends are visible. Choose whichever is easier to fix later (merge or keep separate), and add daily or nightly checks to detect patterns. Licensure and ACIP allow only one "double dose" in a lifetime, so repeated double-307 events on different dates (e.g., Oct 1 and Nov 1) mean something is wrong.
