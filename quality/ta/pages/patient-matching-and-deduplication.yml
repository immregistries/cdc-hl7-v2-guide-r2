  - id: ta-q08-004
    group: Matching at Query Time
    question: A state is building a COVID-19 vaccination registration app that would query the IIS to see whether a registrant already has a COVID dose and, if so, remove them from the clinic list. Have others done this, and what should they watch for?
    answer: 'AIRA hadn''t heard of other IIS doing this, and calling the new system a "registry" is likely to cause confusion. Patient matching would presumably happen through the HL7 query: registrant demographics go to the IIS, and if there''s a match the history is checked for COVID doses. But matching isn''t 100% accurate, and there can be legitimate reasons to book even when a dose is on record. If the volume is low, manually reviewing flagged appointments may be more efficient. If appointments are blocked automatically, there needs to be an appeal process with human review. It''s better to keep registration simple, with fewer things that can go wrong, and only block in targeted cases such as people actively seeking extra doses.'
    status: answered
