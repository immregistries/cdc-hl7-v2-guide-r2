  - id: ta-q13-016
    group: Vaccination Event Deduplication
    question: Is there guidance on deduplicating COVID-19 vaccination records submitted in close succession, similar to the interval (e.g., 10 days) commonly used for routine childhood vaccines?
    answer: There is nothing COVID-specific, but the MIROW best practice guide "Vaccination Level Deduplication in Immunization Information Systems" remains a solid resource. Be aware that its "24 day window" does not apply to vaccines with shorter dosing intervals; the guide mentions rabies, and Pfizer COVID-19 vaccine also falls into that category.
