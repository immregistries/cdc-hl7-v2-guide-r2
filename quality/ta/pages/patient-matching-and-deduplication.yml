  - id: ta-q26-014
    group: Same-Day Multiple Doses (Nirsevimab)
    question: When allowing multiple same-day nirsevimab doses during VXU deduplication, is it safe to allow this only for CVX 307 (100 mg), or should other codes (e.g., 306 or unspecified) also be allowed?
    answer: 'Limiting it to CVX 307 is reasonable. Same-day multiples of other codes can''t be ruled out but should be very unlikely: 306 reportedly costs about the same as 307, and insurers are unlikely to pay for two or four 306 doses to reach 100 mg or 200 mg.'
