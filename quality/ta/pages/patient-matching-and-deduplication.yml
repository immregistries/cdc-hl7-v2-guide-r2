  - id: ta-q26-016
    group: Same-Day Multiple Doses (Nirsevimab)
    question: How likely is it that IIS will receive two same-day nirsevimab doses this season? Will these come in as CVX 307, or are they only trial doses?
    answer: It is a real possibility. These products are fully licensed and ACIP recommended, not trial doses, so they will arrive as CVX 307. Volume should be small (reportedly under 2%), but American Indian/Alaska Native children are among the recommended groups, so some jurisdictions may see much more. Other groups are medical (chronic lung disease, cystic fibrosis, severe immunocompromise).
