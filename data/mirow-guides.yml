    summary: >-
      Best practices for assuring the quality of data sent to and held in an IIS, across onboarding, incoming data, and
      data at rest, with the principles and business rules that support them.
    source_note: >-
      Version 2.0. Merges and replaces three earlier MIROW guides: Data Quality Assurance in IIS: Incoming Data (2008),
      Data Quality Assurance in IIS: Selected Aspects (2013), and the micro-guide Lot Number Validation Best Practices
      (2014). The comparison document maps the earlier best practices to this guide.
    cards:
