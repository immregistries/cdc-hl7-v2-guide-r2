# MIROW best practice guides, and related best practice guidance, to compare with the guide.
#
# AIRA's Modeling of Immunization Registry Operations Workgroup (MIROW) published operational best practice guides for IIS
# from 2005 to 2022; the workgroup is no longer meeting, so this set is complete. The guides do not specify messages, but
# much of what they recommend (deduplication, record consolidation, patient status, inventory decrementing, data quality)
# depends on what arrives in VXU and QBP messages and what is returned in ACK and RSP messages. This guide should agree
# with them, use the same terms, and point to them where they apply. Published copies are kept in mirow/ (with extracted
# text in mirow/text/), and the comparison of each one with the guide is recorded in quality/mirow/<id>.yml. The site
# shows them under "MIROW Documents".
#
# Found by a scan of the AIRA repository (docs/aira-repository-scan.md). Only the current full guide on each topic is
# kept: mini-guides, Spanish and French versions, slides, and guides that a later guide replaced are left out.
#
# Fields:
#   id           stable ID; never reuse
#   title        title as published
#   short        shorter title for the contents menu (optional)
#   date         publication date on the document (YYYY-MM)
#   page         the resource page on the AIRA repository
#   url          the published copy (omit if it is no longer online)
#   file         the copy in mirow/
#   also         other files that belong with it (optional)
#   kind         mirow (default) | related (not a MIROW guide)
#   publisher    if not MIROW (optional)
#   summary      one or two sentences
#   source_note  anything a reviewer should know about versions (optional)
#   cards        guide sections the document affects (filled in when it is compared)

page: https://repository.immregistries.org/resources/search/mirow/

documents:
  - id: data-quality-assurance
    title: Data Quality Assurance in Immunization Information Systems
    short: Data Quality Assurance
    date: 2022-08
    page: https://repository.immregistries.org/resource/data-quality-assurance-in-immunization-information-systems/
    url: https://repository.immregistries.org/files/resources/62fbd92c465fe/data_quality_assurance_8_2022.pdf
