# Generated by tools/import_err5.py from AIRA's National Set of ERR-5 Application Error Codes (xlsx, kept local).
# Do not edit; re-run the import when AIRA updates the set.
title: National Set of ERR-5 Application Error Codes for Immunization ACK Messaging
maintainer: AIRA
version: '2026-07-06'
status: Not yet published. AIRA is preparing this version for posting on the AIRA repository.
contact: info@immregistries.org
ranges:
  - range: 1–7
    description: Original (legacy) HL7 codes
    example: Invalid Value; Required Data Missing
  - range: 2000–2099
    description: Conflicting Data – fields that contradict each other
    example: Conflicting Start and End Date of Administration
  - range: 2100–2199
    description: Inappropriate Data – data present but inappropriate
    example: Future Date
  - range: 2200–2299
    description: Invalid Data – syntactically or semantically wrong
    example: Invalid Coding System
  - range: 2300–2399
    description: Lookup Failures – values could not be matched
    example: No Matching Dose Found
  - range: 2400–2499
    description: Message Construction – structural or message format issues
    example: Eligibility in PV1
  - range: 2500–2599
    description: Missing Data – required or expected data was not included
    example: Missing Eligibility Information
  - range: 2600–2699
    description: Processing Errors – system-level or runtime issues
    example: Data truncated
  - range: 2700–2799
    description: Data Sharing or Consent – patient record restricted by policy
    example: Protected Patient Found
  - range: 3001–3499
    description: Missing Endorsed Data Elements – one code for each core data element
    example: Ethnicity is missing
  - range: 3501–3999
    description: Invalid Endorsed Data Elements – present but incorrect, for each data element
    example: Ethnicity is invalid
  - range: 5000–5999
    description: Processing Results
    example: Contraindication/precaution not saved, this contraindication/precaution is not supported
codes:
  - code: '1'
    class: Original
    concept: Illogical date error
    description: Date conflicts with another date in the message.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply.
    published: '2014-11-05'
  - code: '2'
    class: Original
    concept: Invalid date
    description: Date is not valid or lacks required precision.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply. Applies to DT and DTM data types, including formatting issues (not enough digit, etc.), bad characters and invalid values (e.g. 20161342) but not conflicting dates (future dates, etc.) which will have more granular errors.
    published: '2014-11-05'
  - code: '3'
    class: Original
    concept: Illogical value error
    description: The value conflicts with other data in the message
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply.
    published: '2014-11-05'
  - code: '4'
    class: Original
    concept: Invalid Value
    description: The value is not valid. This applies for fields that are not associated with a table of values.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply. Applies to number and text type data types
    published: '2014-11-05'
  - code: '5'
    class: Original
    concept: Table value not found
    description: Indicates that the coded value is not found in the associated table.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply. Applies to CE, CNE, CWE, IS, ID and PT data types, this is a code mapping error.
    published: '2014-11-05'
  - code: '6'
    class: Original
    concept: Required observation missing
    description: A required observation, such as VFC eligibility status, is missing.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply.
    published: '2014-11-05'
  - code: '7'
    class: Original
    concept: Required Data Missing
    description: This error would be applied at the application level and may be used when data is sent but could not be interpreted.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply. Applies to any critical field
    published: '2014-11-05'
  - code: '2000'
    class: Conflicting Data
    concept: Conflicting Start and End Date of Administration
    description: Indicates that the dates in RXA-3 and RXA-4 are not identical.
    priority: Low
    status: Active
    notes: Applies to RXA-3; RXA-4
    published: '2017-10-23'
  - code: '2001'
    class: Conflicting Data
    concept: Conflicting Administration Date and Expiration Date
    description: Indicates a conflict between the administration date in RXA-3 and the expiration date in RXA-16. In other words it indicates that an expired vaccine was administered.
    priority: Medium
    status: Active
    notes: Applies to RXA-3; RXA-16
    sources: BR 118
    published: '2017-10-23'
  - code: '2002'
    class: Conflicting Data
    concept: Conflicting Date of Birth and Date of Death
    description: Indicates that the date of birth messaged in PID-7 is after the date of death messaged in PID-29.
    priority: High
    status: Active
    notes: Applies to PID-7; PID-29
    published: '2017-10-23'
  - code: '2003'
    class: Conflicting Data
    concept: Conflicting Codes in a Field
    description: Indicates that if an ID and an alternate ID are messaged in the same field, that the receiving system has mapped those two codes to different, non-homologous concepts.
    priority: Low
    status: Not Specific
    notes: Only use if a more specific code does not apply. Applies to any coded element where an alternate ID can be sent
    published: '2017-10-23'
  - code: '2004'
    class: Conflicting Data
    concept: Conflicting Query Identifiers
    description: Indicates that the profile in MSH-21 does not match the query in QPD-1.
    priority: Low
    status: Active
    notes: Applies to MSH-21 and QPD-1
    published: '2017-10-23'
  - code: '2005'
    class: Conflicting Data
    concept: Conflicting Facilities
    description: Indicates that the facilities in MSH-4, MSH-11, ORC-17 and/or RXA-11 do not match
