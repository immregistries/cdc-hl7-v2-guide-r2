    status: Active
    notes: Applies to PID-3
    published: '2017-10-23'
  - code: '2007'
    class: Conflicting Data
    concept: Conflicting Patient Status and Patient Death Information
    description: Indicates a conflict between PID-29 and PID-30 or between PD1-16 and either PID field. In other words, one element indicates the patient is deceased and another element indicates the patient is not deceased.
