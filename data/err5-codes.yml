    status: Active
    notes: Applies to PD1-16, PID-29 and PID-30
    published: '2017-10-23'
  - code: '2008'
    class: Conflicting Data
    concept: Conflicting Completion Status and Refusal Reason
    description: Indicates that either a refusal reason was messaged in RXA-18 when the completion status in RXA-20 was not RE or a valid refusal reason was not messaged when the completion status was RE.
    priority: High
    status: Active
    notes: Applies to RXA-18;RXA-20
    published: '2017-10-23'
  - code: '2009'
    class: Conflicting Data
    concept: Conflicting Lot Number and Funding Source
    description: Indicates that the lot number messaged in RXA-15 conflicts with the funding source messaged in an OBX segment. In other words, the lot number is associated with a funding source (public, private, etc.) but a different funding source is reported in an OBX segment.
