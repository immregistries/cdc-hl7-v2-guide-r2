    status: Active
    notes: Applies to MSH-4, MSH-22, ORC-17 and RXA-11
    published: '2017-10-23'
  - code: '2006'
    class: Conflicting Data
    concept: Conflicting Patient IDs
    description: Used when multiple IDs are messaged in PID-3 to indicate that the individual IDs are associated with different patient records in the IIS.
