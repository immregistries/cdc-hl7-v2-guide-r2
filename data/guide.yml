intro: |
  This is a working draft of the next national HL7 Version 2.5.1 implementation
  guide for immunization messaging. It is organized as short sections, each
  focused on one topic, with its conformance statements listed separately from
  the explanatory text. Every section has a permanent link.

  Quality review findings are shown alongside the text. They come from
  automated checks and editorial review, and they are there for the authors and
  reviewers to consider; they are not part of the guide. Use **Hide findings**
  to read without them.
