  - id: serial-numbers-in-2d-barcodes
    title: "AIRA/CDC Notice to the IIS Community: Serial Numbers in Unit of Sale 2D Barcodes"
    short: Serial Numbers in 2D Barcodes
    date: 2017-02
    url: https://repository.immregistries.org/files/resources/590b77c9117ae/notice_-_serial_numbers_in_barcodes-20170227_new_logo.pdf
    file: sisc/2017-02-serial-numbers-in-2d-barcodes.pdf
    summary: >-
      Notice that, under the Drug Supply Chain Security Act, unit-of-sale 2D barcodes now carry a serial number as well as
      the GTIN (with the NDC), expiration date, and lot number, so barcode-reading software must handle it; there is not
      yet a strong use case for collecting it.

