# Generated by tools/convert_narrative.py from the narrative draft. Do not edit before cutover.
intro: This appendix provides an alphabetical reference to the abbreviations and terms used throughout this Implementation Guide. Many terms used in immunization messaging have a specific, foundational meaning in this guide; where a term is fully defined in Key Terms or in a narrative section, this appendix gives a brief gloss and points to that section rather than restating the definition.
groups:
  - name: Abbreviations
    entries:
      - term: AA
        definition: Application Accept. An MSA-1 value indicating that a VXU was accepted with no issues requiring correction or resubmission. See Acknowledgement (ACK) Message Profile.
      - term: ACK
        definition: Acknowledgement. An HL7 v2 message type used to communicate the outcome of processing a submitted message. See Acknowledgement Processing Overview and Acknowledgement (ACK) Message Profile.
      - term: ADT
        definition: Admission, Discharge, Transfer. An HL7 v2 message type outside the scope of this guide.
      - term: AHIMA
        definition: American Health Information Management Association.
      - term: AIRA
        definition: American Immunization Registry Association.
      - term: AMA
        definition: American Medical Association.
      - term: AR
        definition: Application Reject. An MSA-1 value indicating that a VXU was rejected because core intent was not fulfilled. See Acknowledgement (ACK) Message Profile.
      - term: CDC
        definition: Centers for Disease Control and Prevention.
      - term: CDCREC
        definition: CDC Race and Ethnicity Code Set. See Race and Ethnicity.
      - term: CDE
        definition: Core Data Elements. See CDC Core Data Elements for Functional Standards.
      - term: CDS
        definition: Clinical Decision Support. See Clinical Decision Support.
      - term: CDSi
        definition: Clinical Decision Support for Immunization. See Role of ACIP and CDSi.
      - term: CE
        definition: Coded Element. A composite HL7 v2 data type. See Data Types and Value Sets.
      - term: CP
        definition: Cellular Phone. An HL7 v2 telecommunication equipment type code. See Telecommunication Equipment Type Codes (HL70202).
      - term: CPT
        definition: Current Procedural Terminology. See Vaccine Product and Administration Codes.
      - term: CQ
        definition: Composite Quantity with Units. A composite HL7 v2 data type.
      - term: CVX
        definition: Vaccines Administered Code. The CDC-maintained vaccine code system. See CVX - Vaccines Administered Code.
      - term: CWE
        definition: Coded With Exceptions. A composite HL7 v2 data type.
      - term: CX
        definition: Extended Composite ID with Check Digit. A composite HL7 v2 data type used to represent identifiers.
      - term: DT
        definition: Date. A primitive HL7 v2 data type.
      - term: EHR
        definition: Electronic Health Record.
      - term: EI
        definition: Entity Identifier. A composite HL7 v2 data type.
      - term: ERL
        definition: 'Error Location. A composite HL7 v2 data type used in ERR-2. See ERR-2: Error Location.'
      - term: ERR
        definition: Error. The HL7 v2 segment used to report discrete issues in an ACK message. See Issue-Level Reporting Using ERR Segments.
      - term: FDA
        definition: Food and Drug Administration.
      - term: FHIR
        definition: Fast Healthcare Interoperability Resources.
      - term: FN
        definition: Family Name. A component data type within XPN.
      - term: GVT
        definition: General Validation Tool. See Appendix C.
      - term: HD
        definition: Hierarchic Designator. A composite HL7 v2 data type used to represent system, facility, or namespace identifiers. See Organization Identifier Data Types.
      - term: HIE
        definition: Health Information Exchange.
      - term: HL7
        definition: Health Level Seven International.
      - term: HTI-1 / HTI-2
        definition: Health Data, Technology, and Interoperability. ONC rulemakings referenced in National Compliance and ONC Regulations.
      - term: IG
        definition: Implementation Guide.
      - term: IGAMT
        definition: Immunization Guide Authoring Management Tool. See Appendix C.
      - term: IIS
        definition: Immunization Information System. See Key Terms.
      - term: IN1
        definition: Insurance. An HL7 v2 segment.
      - term: IX
        definition: Ignored. A locally defined usage designation. See Usage Designations and Operational Interpretation.
      - term: IZ Gateway
        definition: Immunization Gateway. National exchange infrastructure outside the scope of this guide. See Purpose and Scope.
      - term: LOINC
        definition: Logical Observation Identifiers Names and Codes. See LOINC in Observation Segments.
      - term: LR
        definition: Local Registry Identifier. See IIS Registry Identifier.
      - term: M&I
        definition: Measurement and Improvement project.
      - term: MENA
        definition: Middle Eastern or North African. See Race and Ethnicity.
      - term: MIROW
        definition: Modeling of Immunization Registry Operations Workgroup. See Appendix C.
      - term: MR
        definition: Medical Record (identifier type). See Primary Patient Identifier for Exchange.
      - term: MRN
        definition: Medical Record Number.
      - term: MSA
        definition: 'Message Acknowledgment. The HL7 v2 segment conveying message-level disposition. See MSA-1: Derivation of Message-Level Disposition.'
      - term: MSH
        definition: Message Header. The HL7 v2 segment identifying message metadata.
      - term: MVX
        definition: Manufacturer of Vaccines. A CDC-maintained code system.
      - term: NCIT
        definition: NCI Thesaurus. Referenced as an alternate vocabulary alongside HL70163 for route of administration.
      - term: NCVIA
        definition: National Childhood Vaccine Injury Act. See Vaccine Information Statements.
      - term: NDC
        definition: National Drug Code. See NDC - National Drug Code.
      - term: NF
        definition: Not Found. A QAK-2 value indicating that no candidate match was identified.
      - term: NIST
        definition: National Institute of Standards and Technology.
      - term: NK1
        definition: Next of Kin. The HL7 v2 segment used for responsible-person and guardian information.
      - term: NPI
        definition: National Provider Identifier. See Administering Organization (RXA-11).
      - term: NTE
        definition: Notes and Comments. An HL7 v2 segment.
      - term: OBX
        definition: Observation/Result. The HL7 v2 segment used to convey supplemental immunization data. See LOINC in Observation Segments.
      - term: OMB
        definition: Office of Management and Budget. See OMB 2024 Directive and Forward Compatibility.
      - term: ONC
        definition: Office of the National Coordinator for Health Information Technology. See National Compliance and ONC Regulations.
      - term: ORC
        definition: Common Order. The HL7 v2 segment anchoring an Order Segment Group.
      - term: PD1
        definition: Patient Additional Demographic. An HL7 v2 segment.
      - term: PI
        definition: Patient Identifier. An identifier type used for the primary exchange identifier. See Primary Patient Identifier for Exchange.
      - term: PID
        definition: Patient Identification. The HL7 v2 segment carrying core patient demographic data.
      - term: PL
        definition: Person Location. A composite HL7 v2 data type.
      - term: PRN
        definition: Primary Residence Number. An HL7 v2 telecommunication use code. See Telecommunication Use Codes (HL70201).
      - term: PV1
        definition: Patient Visit. An HL7 v2 segment.
      - term: QAK
        definition: Query Acknowledgment. An HL7 v2 segment.
      - term: QBP
        definition: Query By Parameter. The HL7 v2 message type used for immunization queries. See Query by Parameter (QBP) Message Profiles.
      - term: RCP
        definition: Response Control Parameter. An HL7 v2 segment. See RCP-2 definition in Z31 - Return a List of Candidates.
      - term: RE
        definition: Required, but may be Empty. A usage designation. See Usage Designations and Operational Interpretation.
      - term: RSP
        definition: Response. The HL7 v2 message type returned in answer to a QBP query. See Response (RSP) Profiles.
      - term: RXA
        definition: Pharmacy/Treatment Administration. The HL7 v2 segment carrying vaccination event details.
      - term: RXR
        definition: Pharmacy/Treatment Route. The HL7 v2 segment carrying route and site information.
      - term: SISC
        definition: Standards and Interoperability Steering Committee. See Technical Advisory Bulletins.
      - term: SITT
        definition: Standards and Interoperability Testing Tools. See Appendix C.
      - term: SNOMED CT
        definition: Systematized Nomenclature of Medicine, Clinical Terms.
      - term: SOAP
        definition: Simple Object Access Protocol. See Transport Layer Requirements and CDC WSDL Integration.
      - term: SPD-15
        definition: Statistical Policy Directive No. 15. See OMB 2024 Directive and Forward Compatibility.
      - term: SR
        definition: State Registry Identifier. See IIS Registry Identifier.
      - term: SVAP
        definition: Standards Version Advancement Process. See Roadmap for Future Versions.
      - term: TAB
        definition: Technical Advisory Bulletin. See Technical Advisory Bulletins.
      - term: TCAMT
        definition: Test Case and Authoring Management Tool. See Appendix C.
      - term: TEFCA
        definition: Trusted Exchange Framework and Common Agreement.
      - term: TS
        definition: Time Stamp. A primitive HL7 v2 data type.
      - term: UoS
        definition: Unit of Sale. An NDC packaging designation. See Unit-of-Use and Unit-of-Sale NDCs.
      - term: UoU
        definition: Unit of Use. An NDC packaging designation. See Unit-of-Use and Unit-of-Sale NDCs.
      - term: USCDI
        definition: United States Core Data for Interoperability.
      - term: VAERS
        definition: Vaccine Adverse Event Reporting System. See Adverse Event.
      - term: VFC
        definition: Vaccines for Children. A federally funded vaccine purchase program. See Vaccine Funding Source and Stock Models.
      - term: VICP
        definition: National Vaccine Injury Compensation Program. See Vaccine Information Statements.
      - term: VID
        definition: Version Identifier. A composite HL7 v2 data type.
      - term: VIS
        definition: Vaccine Information Statement. See Vaccine Information Statements.
      - term: VXU
        definition: Unsolicited Vaccination Record Update. The HL7 v2 message type used to submit immunization events. See Vaccination Record Update (VXU) Message Profile.
      - term: WSDL
        definition: Web Services Description Language. See Transport Layer Requirements and CDC WSDL Integration.
      - term: XAD
        definition: Extended Address. A composite HL7 v2 data type.
      - term: XCN
        definition: Extended Composite ID Number and Name for Persons. A composite HL7 v2 data type.
      - term: XON
        definition: Extended Composite Name and Identification Number for Organizations. A composite HL7 v2 data type.
      - term: XPN
        definition: Extended Person Name. A composite HL7 v2 data type. See Patient and Other Names.
      - term: XTN
        definition: Extended Telecommunication Number. A composite HL7 v2 data type. See Phone and Email.
  - name: Glossary
    entries:
      - term: Administered Vaccination
        definition: See Key Terms.
      - term: Assigning Authority
        definition: See Key Terms.
      - term: Constraint
        definition: See Key Terms.
      - term: Contradiction
        definition: See Key Terms.
      - term: Core Intent
        definition: See Key Terms.
      - term: Critical Data
        definition: See Key Terms.
      - term: Data Type Flavor
        definition: A local constraint on a base HL7 v2 data type, identified by an underscore followed by a unique identifier, that further restricts formatting or content requirements without changing the underlying HL7 data type. See Data Types and Value Sets.
      - term: Dynamic Code Set
        definition: A code set whose contents are expected to change regularly and that requires active monitoring and versioning. See Dynamic and Fixed Code Sets.
      - term: Evaluated Group
        definition: See Key Terms.
      - term: Fixed Code Set
        definition: A code set whose values are intentionally stable and tightly coupled to message structure or processing semantics. See Dynamic and Fixed Code Sets.
      - term: Forecast Group
        definition: See Key Terms.
      - term: Guardian
        definition: See Data Model, Guardian (Entity).
      - term: Historical Vaccination
        definition: See Key Terms; see also Administered versus Historical Vaccinations for how this distinction applies to inbound reporting versus outbound query responses.
      - term: Jurisdiction
        definition: See Key Terms.
      - term: Not Found (NF)
        definition: A QAK-2 value indicating that no candidate patient match was identified for a query.
      - term: Order Segment Group
        definition: See Key Terms.
      - term: Organization
        definition: See Key Terms.
      - term: Patient
        definition: See Key Terms.
      - term: Querying System
        definition: See Key Terms.
      - term: Record
        definition: See Key Terms.
      - term: Rechart
        definition: A delete-and-add correction pattern in which a submitting system sends a VXU delete for an existing vaccination record followed by a VXU add containing the corrected information, used when an identifying vaccination field changes. See Identifying vs. Non-Identifying Vaccination Fields and Updates and Deletes.
      - term: Rejection
        definition: See Key Terms.
      - term: Responsible Person
        definition: See Key Terms.
      - term: Submitting System
        definition: See Key Terms.
      - term: System
        definition: See Key Terms.
      - term: Too Many (TM)
        definition: A QAK-2 value indicating that the number of possible candidate matches exceeded the applicable limit, signaling that the query should be refined rather than resolved through manual review. See Z31 - Return a List of Candidates.
      - term: Usage Designation
        definition: One of R, RE, O, C, X, or IX, describing whether and how data is expected to be populated and processed. See Usage Designations and Operational Interpretation.
      - term: Vaccination / Immunization
        definition: See Key Terms.
      - term: Z22
        definition: The VXU message structure identifier for Vaccination Record Update (Unsolicited Immunization Update). See Vaccination Record Update (VXU) Message Profile.
      - term: Z23
        definition: The response structure returned when a QBP message cannot be processed due to a structural or application-level problem. See Z23 - Return an Acknowledgement.
      - term: Z31
        definition: The RSP response structure used to return a list of candidate patient matches. See Z31 - Return a List of Candidates.
      - term: Z32
        definition: The RSP response structure used to return a complete immunization history for a Z34 query. See Z32 - Return Complete Immunization History.
      - term: Z33
        definition: The RSP response structure indicating that no person-level record can be returned. See Z33 - Return a Response with No Person Records.
      - term: Z34
        definition: The QBP query profile used to request a complete immunization history. See Query by Parameter (QBP) Message Profiles.
      - term: Z42
        definition: The RSP response structure used to return an evaluated immunization history and forecast for a Z44 query. See Z42 - Return Evaluated Immunization History and Forecast.
      - term: Z44
        definition: The QBP query profile used to request an evaluated immunization history and forecast. See Query by Parameter (QBP) Message Profiles.
