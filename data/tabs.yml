  - id: scenarios-for-updates-and-queries
    title: Scenarios for Updates and Queries
    date: 2024-01
    url: https://repository.immregistries.org/files/resources/6644ed1c1e7bc/tab_scenarios_for_updates_and_queries__1_.pdf
    file: tabs/2024-01-scenarios-for-updates-and-queries.pdf
    summary: Conformance expectations for systems that exchange VXU and QBP messages with an IIS, by scenario.
