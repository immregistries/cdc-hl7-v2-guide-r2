  - id: system-entry-date-time-rxa-22
    title: System Entry Date/Time (RXA-22) Definition
    date: 2024-01
    url: https://repository.immregistries.org/files/resources/6644ed1c1e7bc/tab_system_entry_date_time__rxa-22_.pdf
    file: tabs/2024-01-system-entry-date-time-rxa-22.pdf
    summary: >-
