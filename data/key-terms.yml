card: key-terms
title: Key Terms
groups:
  - name: Actors and Systems
    terms:
      - term: Immunization Information System (IIS)
        definition: An IIS, also called an immunization registry or simply registry, is a population-based information system that records all vaccination doses administered by participating providers within a jurisdiction. IIS data support clinical care, public health surveillance, and program management by maintaining consolidated immunization histories for individuals and populations.
      - term: System
        definition: A set of interconnected components, such as hardware, software, processes, and people, that work together to collect, process, store, and disseminate information. Systems may be custom-built or commercially available and may include subsystems that perform specific functions. Examples include Electronic Health Record (EHR) systems, hospital information systems, pharmacy applications, and school-based health systems.
      - term: Submitting System
        definition: A system external to the IIS that transmits vaccination information to help build a complete patient history. Examples include Electronic Health Record (EHR) systems, hospital information systems, pharmacy applications, and school-based health systems. Any system performing this function is considered a submitting system.
      - term: Querying System
        definition: A system that retrieves immunization histories or forecasts from an IIS. Most clinical systems, such as EHRs, act as both submitting and querying systems.
      - term: Organization
        definition: Any entity that administers, records, or manages vaccination services, including clinics, hospitals, pharmacies, mobile units, and schools. The IG uses "organization" to encompass these roles consistently.
      - term: Clinician
        definition: Any person involved in administering or recording a vaccination, such as a doctor, nurse, medical assistant, or pharmacist. The term implies a functional role, not a specific credential.
      - term: Patient
        definition: The individual whose immunization record is maintained in the IIS. Patients include children, adolescents, and adults across in-patient and out-patient settings. All persons within a jurisdiction's catchment area are potential patients.
      - term: Responsible Person
        definition: An individual who supports or assists in the care of a patient, such as a parent, legal guardian, custodian, or grandparent. A responsible person is not necessarily the individual with legal authority to make healthcare decisions, view or disclose health information, or bear financial responsibility for the patient; IIS are not expected to track or determine who holds such authority. The role of a responsible person is primarily to support patient matching and to identify individuals involved in ensuring the patient receives appropriate care.
  - name: Vaccination Concepts
    terms:
      - term: Vaccination and Immunization
        definition: These terms are used interchangeably to describe the administration of a vaccine and the resulting immunologic protection.
      - term: Administered Vaccination
        definition: A dose reported by the system that directly recorded the vaccination event and knows its details (date, product, lot, clinician, etc.).
      - term: Historical Vaccination
        definition: A dose reported from another source or record (paper or electronic) to document prior vaccination history.
      - term: Evaluation and Recommendation
        definition: Clinical Decision Support (CDS) systems, often called forecasters, evaluate each recorded dose for validity and generate recommendations (or forecasts) for future doses, based on published schedules such as ACIP guidelines.
      - term: Inventory
        definition: An optional IIS function that tracks vaccine stock levels for organizations. When a dose is reported as administered, the IIS may automatically decrement the reporting organization's inventory.
  - name: Message Structure
    terms:
      - term: Message
        definition: An HL7 Version 2 electronic transmission between systems (e.g., VXU, QBP, RSP, ACK) used to exchange immunization information between a submitting or querying system and the IIS.
      - term: Record
        definition: A unit of information within an IIS, representing a patient, vaccination event, or related entity that is stored and maintained for clinical and public health use.
      - term: Order Segment Group
        definition: A coordinated set of HL7 v2 segments, ORC, RXA, optional RXR, and one or more OBX segments, that together convey a coherent unit of meaning within a VXU or RSP message.
      - term: Evaluated Group
        definition: The set of OBX observations that together express the evaluation of a single antigen or series component within an Order Segment Group. A single RXA may contain multiple evaluated groups when a dose is assessed for multiple antigens (e.g., a combination vaccine).
      - term: Forecast Group
        definition: The set of OBX observations that together express the forecast for a single antigen within the Forecast Order Segment Group.
      - term: Assigning Authority
        definition: The organization or system that issued a given identifier (e.g., an MRN), distinguishing identifiers that may otherwise appear identical.
  - name: Processing Outcomes
    terms:
      - term: Critical Data
        definition: The minimum information necessary for an IIS to safely incorporate a submitted VXU into a patient's immunization history. Whether all submitted Critical Data was successfully processed and stored determines a message's core intent and, in turn, its acceptance or rejection; storage or rejection of non-Critical Data does not independently determine this outcome. IIS may expand the definition of Critical Data through jurisdictional policy, provided such expansion is documented in local messaging specifications
      - term: Core Intent
        definition: Whether a submitted VXU's patient and vaccine history (if submitted) could be associated with and recorded in the IIS, as determined by whether the message's Critical Data was successfully processed and stored.
      - term: Rejection
        definition: A determination that one or more submitted Critical Data elements could not be processed or stored, requiring correction and resubmission. Rejection does not necessarily mean that non-Critical Data went unstored; an IIS may retain non-Critical Data even while signaling the loss of Critical Data.
      - term: Data Quality
        definition: The degree to which IIS data are accurate, complete, and timely. Data quality activities include validation, deduplication, and routine measurement against community standards.
  - name: Jurisdictional and Governance Concepts
    terms:
      - term: Jurisdiction
        definition: |-
          The geopolitical area responsible for operating an IIS (e.g., state, territory, city). Jurisdictions define participating providers, reporting requirements, and data-sharing policies.

          **Constraint** and **Contradiction**
          - *Constraint*: A jurisdictional refinement that narrows, clarifies, or mandates specific uses of fields or value sets without forcing behavior incompatible with National-IG-compliant senders.
          - *Contradiction*: A local rule that requires senders to behave differently than the National IG specifies, creating incompatible expectations.
      - term: Avoiding Ambiguity
        definition: |-
          Two terms used in this guide require special attention: Provider and Site. Both are common in clinical and HL7 v2 contexts but are inherently ambiguous.

          **Provider** can refer to either an individual clinician or an organization that delivers vaccination services (e.g., "Dr. Smith" vs. "Dr. Smith's Clinic"). This guide generally avoids the term and instead uses clinician for a person and organization for an entity.

          **Site** can mean either the physical location where vaccination occurred or the anatomical location on the patient's body. To reduce confusion, this guide will use *organization location* for facilities and *body site* for anatomic locations.

          In some cases, these terms appear when referencing specific HL7 field names that cannot be renamed. Readers should take care to interpret those cases precisely in the technical context intended.
